    <style>
      /* Until the stylesheet loads: the canvas colour of the theme (styles/tokens.css). */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; background: var(--k-surface-canvas, #F2F4F3); color: var(--k-ink, #18211E); }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: var(--k-surface-canvas, #0F1513); color: var(--k-ink, #E3EAE6); } }
      [data-theme="dark"] body { background: var(--k-surface-canvas, #0F1513); color: var(--k-ink, #E3EAE6); }
    </style>
  </head>

    <div id="root"></div>
