---
# Example PromotionTemplate — reusable step sequence for all standard pipelines.
# NOT USED YET: spec.environments[].promotionTemplate is not implemented, and a
# Pipeline that sets it is rejected (see docs/pipeline-reference.md#promotion-steps). Applying this
# object is harmless; no environment can reference it.
apiVersion: kardinal.io/v1alpha1
kind: PromotionTemplate
metadata:
  name: standard
  namespace: kardinal-system
spec:
  description: "Standard promotion: clone → kustomize → commit → PR → merge → healthcheck"
  steps:
    - uses: git-clone
    - uses: kustomize-set-image
    - uses: git-commit
    - uses: open-pr
    - uses: wait-for-merge
    - uses: health-check
