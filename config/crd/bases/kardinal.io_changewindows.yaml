---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: changewindows.kardinal.io
spec:
  group: kardinal.io
  names:
    kind: ChangeWindow
    listKind: ChangeWindowList
    plural: changewindows
    shortNames:
    - cw
    singular: changewindow
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.active
      name: Active
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Valid")].status
      name: Valid
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChangeWindow defines a cluster-scoped time window during which promotions are
          blocked (K-04). A ChangeWindow blocks nothing by itself: a PolicyGate blocks
          while a window it references is active, for example
          !changewindow.isBlocked("holiday-freeze") or changewindow.isAllowed("business-hours").
          A gate that names a ChangeWindow that does not exist blocks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChangeWindowSpec defines the desired state of a ChangeWindow.
            properties:
              end:
                description: 'End is when a blackout window ends (required for type:
                  blackout).'
                format: date-time
                type: string
              reason:
                description: Reason is a human-readable explanation for this window.
                type: string
              schedule:
                description: 'Schedule configures a recurring allowed-hours window
                  (for type: recurring).'
                properties:
                  allowedDays:
                    description: |-
                      AllowedDays lists the days of the week when promotions are allowed.
                      Valid values: Mon, Tue, Wed, Thu, Fri, Sat, Sun (full names such as Monday
                      are accepted too). Empty means every day.
                    items:
                      type: string
                    type: array
                  allowedHours:
                    description: |-
                      AllowedHours is a time range in "HH:MM-HH:MM" format (24h, in Timezone).
                      The start is inclusive and the end exclusive; "24:00" is allowed as the end.
                      An end before the start is an overnight range that belongs to the start day
                      (for example "22:00-02:00" on Fri allows Friday 22:00 to Saturday 02:00).
                      Empty means the whole day.
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]-(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
                    type: string
                  timezone:
                    description: |-
                      Timezone is the IANA timezone name (e.g. "America/Los_Angeles"). Default: UTC.
                      "Local" is rejected: it would be the controller's own timezone. An unknown
                      name makes the window invalid: status condition Valid is False with the
                      error, and the window is active (blocking).
                    type: string
                type: object
              start:
                description: 'Start is when a blackout window begins (required for
                  type: blackout).'
                format: date-time
                type: string
              type:
                description: |-
                  Type is the ChangeWindow type.
                  "blackout": the window is active (blocking) from Start (inclusive) to End (exclusive).
                  "recurring": Schedule describes when promotions are allowed; the window is
                  active (blocking) at every other time.
                  An invalid spec (for example End not after Start, an unknown timezone or a
                  malformed allowedHours) makes the window active, so gates that reference it block.
                enum:
                - blackout
                - recurring
                type: string
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: a blackout ChangeWindow requires start and end
              rule: self.type != 'blackout' || (has(self.start) && has(self.end))
            - message: a recurring ChangeWindow requires schedule
              rule: self.type != 'recurring' || has(self.schedule)
          status:
            description: ChangeWindowStatus defines the observed state of a ChangeWindow.
            properties:
              active:
                description: |-
                  Active is true when the ChangeWindow is currently blocking promotions.
                  Written by the ChangeWindow reconciler, which requeues at the next window
                  boundary. PolicyGates evaluate the spec at their own evaluation time with
                  the same logic, so they never depend on this field being fresh.
                type: boolean
              conditions:
                description: |-
                  Conditions holds status conditions. Valid is True when the spec can be
                  evaluated. It is False (reason InvalidSpec, the error in the message) when
                  it cannot, for example for an unknown timezone; the window is then active,
                  so every gate that references it blocks until the spec is fixed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              reason:
                description: Reason explains the current active/inactive state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
