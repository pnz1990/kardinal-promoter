---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: promotionsteps.kardinal.io
spec:
  group: kardinal.io
  names:
    kind: PromotionStep
    listKind: PromotionStepList
    plural: promotionsteps
    shortNames:
    - ps
    singular: promotionstep
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pipelineName
      name: Pipeline
      type: string
    - jsonPath: .spec.environment
      name: Env
      type: string
    - jsonPath: .spec.bundleName
      name: Bundle
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionStep is a controller-internal CRD representing one step in a
          promotion sequence. Created by the Graph controller; reconciled by the
          PromotionStep reconciler.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PromotionStepSpec defines the desired state of a PromotionStep.
              PromotionStep objects are created by the Graph controller — not by users.
            properties:
              analyses:
                description: |-
                  Analyses names the AnalysisTemplates of the environment's
                  verification. A step with analyses goes from HealthChecking to
                  Verifying and is Verified only when, for every template, the newest
                  AnalysisRun in spec.live.analyses is Successful: a run that a later
                  translation replaced (the template changed) is not waited for, and the
                  timeout keeps counting from status.verificationStartedAt.
                items:
                  type: string
                type: array
              analysisPolicy:
                description: |-
                  AnalysisPolicy is the verification's verdict policy, copied from the
                  Pipeline when the Graph was built, so a Pipeline edit does not change
                  the verdict of a step in flight.
                properties:
                  inconclusive:
                    description: Inconclusive is "fail" (default) or "pass".
                    type: string
                  timeout:
                    description: Timeout is the verification timeout (default 30m).
                    type: string
                type: object
              bundleName:
                description: BundleName is the Bundle being promoted.
                minLength: 1
                type: string
              environment:
                description: Environment is the environment this step promotes into.
                minLength: 1
                type: string
              imageVerification:
                description: |-
                  ImageVerification names the Bundle's ImageVerification when this step
                  must wait for it: a step with no upstream in the Graph stays Pending
                  until spec.live.imageVerification.phase is Verified, and fails when it
                  is Failed.
                type: string
              live:
                description: |-
                  Live holds results the Graph mirrors onto the step while it runs, each
                  part with its own patch node (its own field manager), not the step's
                  template, so they keep updating after the step's own template stopped
                  resolving: the environment's hook and analysis runs, the current
                  results of its gates, and the Bundle's image verification. The
                  reconciler reads only this copy, never the source objects; while the
                  step's PR waits for its merge it mirrors the gates to the PR's head
                  commit as the kardinal/gates commit status. Do not set it.
                properties:
                  analyses:
                    description: Analyses are the environment's AnalysisRuns for this
                      Bundle.
                    items:
                      description: LiveAnalysisRun is the result of one Argo Rollouts
                        AnalysisRun.
                      properties:
                        created:
                          description: |-
                            Created is the AnalysisRun's creationTimestamp (RFC 3339). The newest
                            run of a template is the one the step waits for.
                          type: string
                        message:
                          description: Message is the AnalysisRun's status.message.
                          type: string
                        name:
                          description: Name is the AnalysisRun name.
                          type: string
                        phase:
                          description: |-
                            Phase is the AnalysisRun's status.phase (Pending when it has none
                            yet): Pending, Running, Successful, Failed, Error or Inconclusive.
                          type: string
                        template:
                          description: Template is the AnalysisTemplate or ClusterAnalysisTemplate
                            it runs.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  gates:
                    description: |-
                      Gates are the gate instances of the step's environment for its Bundle,
                      with their current result.
                    items:
                      description: LiveGate is one gate instance's current result.
                      properties:
                        name:
                          description: Name is the gate instance name.
                          type: string
                        ready:
                          description: Ready is the instance's status.ready.
                          type: boolean
                        reason:
                          description: Reason is the instance's status.reason.
                          type: string
                      required:
                      - name
                      - ready
                      type: object
                    type: array
                  hooks:
                    description: Hooks are the environment's HookRuns for this Bundle.
                    items:
                      description: LiveHookRun is the result of one HookRun.
                      properties:
                        hook:
                          description: Hook is the hook's name in the Pipeline.
                          type: string
                        message:
                          description: Message is the HookRun's status.message.
                          type: string
                        name:
                          description: Name is the HookRun name.
                          type: string
                        phase:
                          description: 'Phase is the hook phase: pre or post.'
                          type: string
                        result:
                          description: Result is the HookRun's status.phase (Pending
                            when it has none yet).
                          type: string
                        specHash:
                          description: 'SpecHash is the HookRun''s status.specHash:
                            which job and timeout ran.'
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  imageVerification:
                    description: ImageVerification is the Bundle's ImageVerification
                      result.
                    properties:
                      images:
                        description: |-
                          Images are the images it verifies, "repository@digest" (repository
                          normalized). The step refuses to promote a Bundle whose images differ.
                        items:
                          type: string
                        type: array
                      message:
                        description: Message is its status.message.
                        type: string
                      name:
                        description: Name is the ImageVerification's name.
                        type: string
                      phase:
                        description: Phase is its status.phase (Pending when it has
                          none yet).
                        type: string
                    type: object
                  renders:
                    description: |-
                      Renders is the environment's RenderRun for this Bundle (layout:
                      branch), at most one.
                    items:
                      description: |-
                        LiveRenderRun is the result of the RenderRun of a layout: branch
                        environment.
                      properties:
                        knownMarkerDigests:
                          description: |-
                            KnownMarkerDigests is the RenderRun's status.knownMarkerDigests: a
                            result that pushed nothing (noChanges) must name one of them.
                          items:
                            type: string
                          type: array
                        message:
                          description: Message is the RenderRun's status.message.
                          type: string
                        name:
                          description: Name is the RenderRun name.
                          type: string
                        phase:
                          description: Phase is the RenderRun's status.phase (Pending
                            when it has none yet).
                          type: string
                        result:
                          description: Result is the RenderRun's status.result.
                          properties:
                            branch:
                              description: Branch is the branch it was pushed to.
                              type: string
                            commitSHA:
                              description: CommitSHA is the rendered commit pushed
                                (empty when nothing changed).
                              type: string
                            driftOverwritten:
                              description: |-
                                DriftOverwritten lists the changes made outside kardinal that this
                                render overwrote (render.onDrift: overwrite).
                              type: string
                            dryCommit:
                              description: DryCommit is the DRY commit that was rendered.
                              type: string
                            markerDigest:
                              description: |-
                                MarkerDigest is the sha256 of the render marker
                                (.kardinal/rendered.yaml) this render wrote: the list of files and
                                their sha256. The next render of the environment accepts the rendered
                                branch only when its marker has the digest of a render kardinal made.
                              type: string
                            noChanges:
                              description: |-
                                NoChanges is true when the render matched the rendered branch and
                                nothing was pushed.
                              type: boolean
                            objects:
                              description: Objects is how many objects were rendered.
                              type: integer
                            renderer:
                              description: Renderer is kustomize or helm.
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                type: object
              pipelineName:
                description: PipelineName is the Pipeline this step belongs to.
                minLength: 1
                type: string
              postHooks:
                description: |-
                  PostHooks names the HookRuns of the environment's post-deploy hooks, in
                  order. A step with post hooks goes from HealthChecking to Verifying,
                  and is Verified only when every one of them Succeeded in
                  spec.live.hooks; a Failed one applies onHealthFailure.
                items:
                  type: string
                type: array
              prStatusRef:
                description: |-
                  PRStatusRef is the name of the companion PRStatus CRD in the same namespace.
                  Set by the Graph controller from the PRStatus Watch node's metadata.name CEL reference.
                  The PromotionStep reconciler reads the PRStatus CRD instead of polling GitHub
                  directly, eliminating the PS-4 / SCM-2 external API call on the reconcile hot path.
                type: string
              preHooks:
                description: |-
                  PreHooks names the HookRuns of the environment's pre-deploy hooks, in
                  order. The step stays Pending until every one of them Succeeded in
                  spec.live.hooks, and fails when one Failed. Set by the Graph: the first
                  entry references the first HookRun node, so the step is created only
                  after it.
                items:
                  type: string
                type: array
              region:
                description: |-
                  Region was set on the per-region PromotionSteps of a Pipeline
                  environment with two or more spec.regions. The Graph builder no longer
                  sets it; the reconciler fails a step that still has one (created by a
                  Graph built before the upgrade) with "regions is not supported".

                  Deprecated: declare one environment per region (prod-us, prod-eu) and
                  use wave.
                type: string
              requiredGates:
                description: |-
                  RequiredGates holds the names of PolicyGate instances that must be ready
                  before this PromotionStep can be promoted. Set by the Graph controller via CEL.
                items:
                  type: string
                type: array
              scmProvider:
                description: |-
                  ScmProvider is the provider of the Pipeline's spec.git.providerRef,
                  as the translator resolved it when it built the Graph. Unset uses the
                  controller's --scm-provider.
                properties:
                  kind:
                    description: Kind is ScmProvider or ClusterScmProvider.
                    enum:
                    - ScmProvider
                    - ClusterScmProvider
                    type: string
                  name:
                    description: Name is the provider's name; a ScmProvider is in
                      the step's namespace.
                    type: string
                  uid:
                    description: UID is the provider's metadata.uid when the Graph
                      was built.
                    type: string
                required:
                - kind
                - name
                - uid
                type: object
              stepType:
                description: |-
                  StepType identifies the built-in step to execute.
                  Examples: git-clone, kustomize-set-image, git-commit, open-pr,
                            wait-for-merge, health-check.
                minLength: 1
                type: string
              upstreamStates:
                description: |-
                  UpstreamStates holds the resolved state of all upstream PromotionSteps.
                  Each entry is a string like "Verified", set by the kro Graph controller via CEL
                  expression substitution. Replaces the N-field upstreamVerified/upstreamVerified2
                  pattern (issue 625) -- a single list scales to any number of upstream environments.
                  kro scans list items for CEL references, so each entry creates a DAG edge.
                items:
                  type: string
                type: array
            required:
            - bundleName
            - environment
            - pipelineName
            - stepType
            type: object
          status:
            description: PromotionStepStatus defines the observed state of a PromotionStep.
            properties:
              bakeElapsedMinutes:
                description: |-
                  BakeElapsedMinutes is the number of contiguous healthy minutes accumulated
                  so far in the current bake window (K-01). Resets to 0 on health failure
                  when policy=reset-on-alarm. When this reaches env.bake.minutes, the step
                  transitions to Verified.
                format: int64
                type: integer
              bakeFirstStartedAt:
                description: |-
                  BakeFirstStartedAt is when the first bake window of this step began:
                  the first healthy check with env.bake configured. It is never reset.
                  With bake.policy reset-on-alarm, the step must complete one full
                  window by BakeFirstStartedAt + bake.minutes + health.timeout, so a
                  release that keeps flapping ends (#1423).
                format: date-time
                type: string
              bakeResets:
                description: |-
                  BakeResets is the number of times the bake timer was reset due to a
                  health alarm during the current bake window (K-01).
                type: integer
              bakeStartedAt:
                description: |-
                  BakeStartedAt is when the contiguous-healthy soak window began (K-01).
                  Set on the first successful health check when env.bake is configured.
                  Reset when BakeElapsedMinutes resets (health failure with reset-on-alarm).
                format: date-time
                type: string
              conditions:
                description: Conditions holds status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveHealthFailures:
                description: |-
                  ConsecutiveHealthFailures tracks the number of consecutive health-check
                  failures for this step. Reset to 0 on a successful health check.
                  Used by the auto-rollback policy in the pipeline environment spec.
                type: integer
              contendedRetries:
                description: |-
                  ContendedRetries is the number of consecutive retries of a git-push that
                  lost to other writers of the base branch every time within one reconcile
                  (the base branch kept moving). They have no limit, since contention is
                  not a fault of the step, and do not use up the retries of retryCount;
                  they only back off. Reset with retryCount.
                type: integer
              currentStepIndex:
                description: |-
                  CurrentStepIndex is the index into the step sequence that the reconciler
                  is currently executing. Persisted to etcd for idempotent crash recovery
                  (spec 003 FR-002).
                type: integer
              gitCredentialRetries:
                description: |-
                  GitCredentialRetries is the number of consecutive retries of a git-clone
                  or git-push that the remote refused while git had no credentials because
                  spec.git.secretRef is not set, or names a Secret that does not exist or
                  has no token key (condition GitCredentialMissing). These retries have no
                  limit, so creating the Secret is enough for the step to continue, and
                  they do not use up the retries of retryCount. Reset with retryCount, and
                  when git has a token.
                type: integer
              healthCheckExpiry:
                description: |-
                  HealthCheckExpiry is the deadline for a healthy check: health.timeout
                  after the health check began, moved to health.timeout after the moment
                  a bake window stops. It does not apply while a bake window runs.
                  A Graph CEL expression can observe this field to detect a stale health check.
                  Graph-purity: replaces the time.Since() call (PS-5 in 11-graph-purity-tech-debt.md).
                format: date-time
                type: string
              hookRecords:
                description: HookRecords records each hook that ran for this step
                  (HookRecord).
                items:
                  description: |-
                    HookRecord is the step's own record that a hook ran for it: once a
                    HookRun's Job started, the step keeps its result here, so a HookRun
                    recreated for the same hook (deleted and applied again by the Graph) does
                    not run the Job a second time and takes the recorded result instead.
                  properties:
                    hook:
                      description: Hook is the hook's name in the Pipeline.
                      type: string
                    message:
                      description: Message is the HookRun's last message.
                      type: string
                    phase:
                      description: Phase is pre or post.
                      type: string
                    result:
                      description: Result is Running, Succeeded or Failed. Succeeded
                        and Failed are final.
                      type: string
                    specHash:
                      description: SpecHash is the HookRun's spec hash (job and timeout)
                        that ran.
                      type: string
                  type: object
                maxItems: 40
                type: array
              lastHealthCheckAt:
                description: |-
                  LastHealthCheckAt records when the health adapter was last called. Used to
                  space health checks at the health-check interval regardless of how often
                  the step is reconciled.
                format: date-time
                type: string
              message:
                description: Message provides human-readable detail about the current
                  state.
                type: string
              nextRetryAt:
                description: |-
                  NextRetryAt is when a step that failed with a retryable error runs
                  again, or when a superseded step whose PR close failed retries the close
                  (condition SupersededCloseFailed). A reconcile before then waits for it,
                  so the retry backoff holds however often the step is reconciled (a gate
                  re-evaluation, a PRStatus change, a controller restart). Cleared when the
                  step runs again.
                format: date-time
                type: string
              outputs:
                additionalProperties:
                  type: string
                description: |-
                  Outputs accumulates key/value results from completed steps in the
                  sequence (e.g. prURL from the open-pr step).
                type: object
              pendingAuditEvents:
                description: |-
                  PendingAuditEvents are AuditEvents for this step's transitions that are
                  not yet written (the audit outbox, #1552). Each entry is stored in the
                  same status patch as its transition and removed once the AuditEvent
                  exists, so an API error or a controller restart between the two cannot
                  lose the record. Normally empty.
                items:
                  description: |-
                    PendingAuditEvent is an AuditEvent that a reconciler has decided to write
                    but has not yet seen created. The reconciler stores it in its own status in
                    the same patch as the transition it records. It creates the AuditEvent on
                    that reconcile or a later one, then removes the entry. The name is fixed
                    when the entry is stored, so a retried create that the API server already
                    applied returns AlreadyExists, which counts as written (#1552).
                  properties:
                    createdAt:
                      description: |-
                        CreatedAt is the transition time in RFC 3339 with nanoseconds, written
                        to the AuditEvent's kardinal.io/created-at annotation: spec.timestamp
                        has one-second resolution.
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels are the AuditEvent's labels.
                      type: object
                    name:
                      description: Name is the AuditEvent's name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    spec:
                      description: |-
                        Spec is the AuditEvent's spec, timestamp included: the record carries
                        the time of the transition, not the time it was written.
                      properties:
                        action:
                          description: |-
                            Action is a short verb describing what happened.
                            Valid values: "PromotionStarted", "PromotionSucceeded", "PromotionFailed",
                                          "PromotionSuperseded", "PromotionRejected", "RollbackStarted", "RollbackSucceeded",
                                          "HealthCheckFailed", "GateBlocked", "GateEvaluated", "GateOverridden",
                                          "ApprovalRecorded", "ApprovalRevoked", "HoldCreated", "HoldReleased".
                            ApprovalRecorded and ApprovalRevoked are written by an approval gate
                            when a decision (kardinal approve) appears in or leaves its
                            spec.approvals.
                            GateOverridden is written once per spec.overrides entry of a gate
                            instance, naming who created it (kardinal override or the UI).
                            HealthCheckFailed and GateBlocked are accepted but never written: a
                            failed health check records PromotionFailed (RollbackStarted when
                            onHealthFailure is rollback), and a blocked gate records GateEvaluated
                            with outcome Failure.
                          enum:
                          - PromotionStarted
                          - PromotionSucceeded
                          - PromotionFailed
                          - PromotionSuperseded
                          - PromotionRejected
                          - RollbackStarted
                          - RollbackSucceeded
                          - HealthCheckFailed
                          - GateBlocked
                          - GateEvaluated
                          - GateOverridden
                          - ApprovalRecorded
                          - ApprovalRevoked
                          - HoldCreated
                          - HoldReleased
                          type: string
                        bundleName:
                          description: BundleName is the name of the Bundle being
                            promoted.
                          minLength: 1
                          type: string
                        environment:
                          description: Environment is the environment name where the
                            event occurred.
                          minLength: 1
                          type: string
                        message:
                          description: Message is a human-readable description of
                            the event.
                          type: string
                        outcome:
                          description: |-
                            Outcome describes the result of the action.
                            Valid values: "Success", "Failure", "Pending".
                          enum:
                          - Success
                          - Failure
                          - Pending
                          type: string
                        pipelineName:
                          description: PipelineName is the name of the Pipeline the
                            Bundle is promoting through.
                          minLength: 1
                          type: string
                        timestamp:
                          description: Timestamp is when the event occurred (RFC 3339
                            format).
                          format: date-time
                          type: string
                      required:
                      - action
                      - bundleName
                      - environment
                      - outcome
                      - pipelineName
                      - timestamp
                      type: object
                  required:
                  - name
                  - spec
                  type: object
                maxItems: 32
                type: array
              prURL:
                description: |-
                  PRURL is the GitHub pull request URL opened for this promotion.
                  Set when the step enters WaitingForMerge state.
                type: string
              renderRequestedAt:
                description: |-
                  RenderRequestedAt is when the step reached its render step (layout:
                  branch). Set once; the Graph creates the environment's RenderRun once
                  it is set.
                format: date-time
                type: string
              retryCount:
                description: |-
                  RetryCount is the number of consecutive step-engine errors retried in the
                  current state. Reset when a step makes progress. When it reaches the retry
                  limit the PromotionStep fails. Retries counted in gitCredentialRetries
                  are not counted here.
                type: integer
              scmWaitSince:
                description: |-
                  SCMWaitSince is when the step started waiting for an open SCM circuit
                  (condition SCMUnavailable): its SCM host failed, so the step makes no
                  call and waits without spending retryCount. The wait ends when the
                  SCM answers, or fails the step after the environment's
                  stepTimeoutSeconds, else the controller's --scm-wait-timeout (30m).
                format: date-time
                type: string
              state:
                description: |-
                  State is the step execution state.
                  The Graph controller uses readyWhen expressions of the form
                  ${step.status.state == "Verified"} to advance the promotion DAG.
                  Verifying: the health check passed and the post-deploy hooks and
                  analyses run.
                enum:
                - Pending
                - Promoting
                - WaitingForMerge
                - HealthChecking
                - Verifying
                - Verified
                - Failed
                - AbortedByAlarm
                - RollingBack
                type: string
              steps:
                description: |-
                  Steps is the per-step execution history for this PromotionStep.
                  Populated by the reconciler as each step in the sequence starts, completes, or fails.
                  Provides fine-grained visibility into which sub-step is running without reading
                  controller logs. Initialized when the step sequence starts (state → Promoting).
                items:
                  description: StepStatus captures the observable state of one step
                    in the promotion sequence.
                  properties:
                    completedAt:
                      description: CompletedAt is when the step finished (success
                        or failure).
                      format: date-time
                      type: string
                    durationMs:
                      description: |-
                        DurationMs is the wall-clock duration in milliseconds from startedAt to completedAt.
                        Zero when the step has not completed.
                      format: int64
                      type: integer
                    message:
                      description: Message provides human-readable detail for Failed
                        steps.
                      type: string
                    name:
                      description: Name is the step type identifier (e.g. "git-clone",
                        "open-pr").
                      type: string
                    startedAt:
                      description: StartedAt is when the step began executing.
                      format: date-time
                      type: string
                    state:
                      allOf:
                      - enum:
                        - Pending
                        - InProgress
                        - Completed
                        - Failed
                      - enum:
                        - Pending
                        - InProgress
                        - Completed
                        - Failed
                      description: State is the execution state of this step.
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              targetUpdatedAt:
                description: |-
                  TargetUpdatedAt is when a health check of this step first found the
                  workload's target running the Bundle images (health.type resource: the
                  Deployment's pod template; flagger: the Canary's target Deployment).
                  Set once. The flagger check counts a Failed phase, and the resource
                  check a ProgressDeadlineExceeded when it cannot read the ReplicaSet the
                  condition names, only when set after this time: the earlier rollout's
                  condition or phase can outlast the Bundle's update.
                format: date-time
                type: string
              verificationStartedAt:
                description: |-
                  VerificationStartedAt is when the step entered Verifying (its health
                  check passed and its post-deploy hooks may start). Set once; the
                  Graph creates the post-deploy HookRuns once it is set.
                format: date-time
                type: string
              waitForMergeExpiry:
                description: |-
                  WaitForMergeExpiry is the deadline for the PR merge, computed as
                  (time step entered WaitingForMerge) + env.waitForMergeTimeout. Set once on
                  the first reconcile in WaitingForMerge state when the environment configures
                  a non-zero waitForMergeTimeout. Nil when no timeout is configured.
                  Graph-purity: same pattern as HealthCheckExpiry — time.Now() called only when
                  writing to CRD status.
                format: date-time
                type: string
              workDir:
                description: |-
                  WorkDir is the working directory on the controller node used for git operations
                  (clone, commit, push) and kustomize builds. Persisted to etcd so that a restarted
                  controller can re-use the same directory and resume in-flight git work.
                  ST-7/ST-8/ST-9 short-term mitigation: the workdir path is made observable via
                  CRD status, enabling crash-recovery without re-cloning.
                  Long-term: git operations become Kubernetes Jobs (owned nodes in the Graph).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
