---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: agentidentities.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal
    - kardinal-all
    kind: AgentIdentity
    listKind: AgentIdentityList
    plural: agentidentities
    shortNames:
    - agentid
    singular: agentidentity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sponsor.user
      name: Sponsor
      type: string
    - jsonPath: .spec.autonomy
      name: Autonomy
      type: string
    - jsonPath: .spec.suspended
      name: Suspended
      type: boolean
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentIdentity registers an AI agent: the principals that are the agent,
          the person who answers for it, where it may act and how far on its own.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentIdentitySpec registers an agent (docs/actors.md).
            properties:
              autonomy:
                default: approve
                description: |-
                  Autonomy is the agent's ceiling: auto, approve (a person approves its
                  promotions) or deny. A Pipeline environment can only tighten it.
                enum:
                - auto
                - approve
                - deny
                type: string
              budgetExemptions:
                description: |-
                  BudgetExemptions are break-glass exceptions to the budgets, added by
                  someone the cluster lets exempt the agent (the exempt verb), never of
                  the agent's own party. One made by an agent, or without an actor
                  stamp, never counts. Planned: kardinal override --budget (W7, #2438).
                items:
                  description: |-
                    AgentBudgetExemption is a break-glass exception to an agent's budgets: one
                    Pipeline environment, optionally one version, until it expires. The chart's
                    <release>-agent-budgets admission policy verifies createdBy and the actor
                    stamp, that its maker may exempt the agent and is not of the agent's
                    party, and that an existing exemption never changes
                    (docs/design/24-agent-budgets.md section 12).
                  properties:
                    actor:
                      description: |-
                        Actor is who made the exception, stamped as on freeze exemptions. An
                        exemption whose actor is an agent, or that has none, is never
                        honoured: break-glass is for people (docs/design/24-agent-budgets.md
                        section 11.3). The chart's actor admission policies verify it from the
                        requester's username and groups, and the controller counts a stamped
                        exemption only while that check is installed
                        (--agent-budget-exemption-policy).
                      properties:
                        agent:
                          description: Agent is the AgentIdentity name, when kind
                            is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        asserted:
                          description: |-
                            Asserted holds what the client says about itself. It is recorded as
                            written and never used for a security decision.
                          properties:
                            client:
                              description: Client is the tool that wrote the record
                                (for example kardinal/0.12.0).
                              maxLength: 128
                              type: string
                            model:
                              description: Model is the AI model the client says it
                                runs.
                              maxLength: 128
                              type: string
                            session:
                              description: Session is the client's session or run
                                identifier.
                              maxLength: 128
                              type: string
                          type: object
                        kind:
                          description: Kind is human, agent, bot or controller (docs/actors.md).
                          enum:
                          - human
                          - agent
                          - bot
                          - controller
                          maxLength: 16
                          type: string
                        principal:
                          description: Principal is the username the API server authenticated.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sponsor:
                          description: |-
                            Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                            the record was written, when kind is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        via:
                          description: |-
                            Via says how the controller came to write the record: ui and api for a
                            caller it authenticated, subscription and auto-rollback for its own
                            Bundles. Only the controller may set it.
                          enum:
                          - ui
                          - api
                          - subscription
                          - auto-rollback
                          maxLength: 16
                          type: string
                      required:
                      - kind
                      - principal
                      type: object
                      x-kubernetes-validations:
                      - message: actor.agent and actor.sponsor are set exactly when
                          actor.kind is agent
                        rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                          : (!has(self.agent) && !has(self.sponsor))'
                      - message: a controller actor says why it acted (actor.via)
                        rule: self.kind != 'controller' || has(self.via)
                    bundle:
                      description: Bundle, when set, limits the exemption to that
                        version.
                      maxLength: 253
                      type: string
                    createdBy:
                      description: |-
                        CreatedBy is who made the exception: admission verifies it is the
                        requester's username.
                      maxLength: 253
                      minLength: 1
                      type: string
                    environment:
                      description: Environment is the environment, or the fleet environment,
                        let through.
                      maxLength: 63
                      minLength: 1
                      type: string
                    expiresAt:
                      description: |-
                        ExpiresAt ends the exemption. The controller also ends it 24 hours
                        after it first sees it.
                      format: date-time
                      type: string
                    name:
                      description: Name identifies the exemption (a DNS label), unique
                        in the list.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespace:
                      description: Namespace and Pipeline are the Pipeline let through.
                      maxLength: 63
                      minLength: 1
                      type: string
                    pipeline:
                      maxLength: 253
                      minLength: 1
                      type: string
                    reason:
                      description: Reason says why (recorded in the BudgetExempted
                        audit record).
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - createdBy
                  - environment
                  - expiresAt
                  - name
                  - namespace
                  - pipeline
                  - reason
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              budgets:
                description: |-
                  Budgets limit how much the agent promotes before a person looks:
                  versions a day, promotions at once, fleet targets an hour, failures
                  left in place, and a share of a fleet. Every rule that matches a step
                  applies. The four counted limits of all rules sum to at most 1,500,
                  which bounds the ledger in status.usage. Where the controller runs
                  with --agent-budgets, it counts and grants each agent's promotions in
                  status.usage, and a step beyond a limit waits in Pending rather than
                  fails: the chart's actors.budgets.enabled, off by default. See
                  docs/design/24-agent-budgets.md.
                items:
                  description: |-
                    AgentBudgetRule limits an agent's promotions into the environments it
                    matches. Every rule that matches a step applies. A limit that is not set
                    does not apply; a rule sets at least one.
                  properties:
                    environments:
                      description: |-
                        Environments the rule applies to: exact names, or a prefix ending in
                        "*". A fleet target matches through its own name or its fleet's.
                      items:
                        maxLength: 63
                        minLength: 1
                        pattern: ^[^*]*\*?$
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                    fleetShare:
                      description: |-
                        FleetShare (L5) is the share of one fleet's targets one version of the
                        agent may have under way or failed at once, "1%" to "100%", rounded up
                        and at least one target. It applies to fleet targets only.
                      maxLength: 4
                      pattern: ^([1-9][0-9]?|100)%$
                      type: string
                    fleetTargetsPerHour:
                      description: |-
                        FleetTargetsPerHour (L3) is how many fleet targets the agent may start
                        promoting in any hour. Plain environments do not count.
                      format: int32
                      maximum: 1000
                      minimum: 1
                      type: integer
                    maxConcurrent:
                      description: |-
                        MaxConcurrent (L2) is how many of the agent's promotions into these
                        environments may be under way at once.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    maxUnavailable:
                      description: |-
                        MaxUnavailable (L4) is how many of the agent's promotions may have
                        failed while their environment still runs the failed version.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    name:
                      description: Name identifies the rule (a DNS label), unique
                        in the list.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    namespaces:
                      default:
                      - '*'
                      description: |-
                        Namespaces the rule applies to, in the same form. Default: every
                        namespace.
                      items:
                        maxLength: 64
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9*])?$|^\*$
                        type: string
                      maxItems: 64
                      minItems: 1
                      type: array
                    versionsPerDay:
                      description: |-
                        VersionsPerDay (L1) is how many versions the agent may start into
                        these environments in any 24 hours. A version counts once per
                        environment; a fleet's targets are one environment.
                      format: int32
                      maximum: 500
                      minimum: 1
                      type: integer
                  required:
                  - environments
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: 'a budget rule sets at least one limit: versionsPerDay,
                      maxConcurrent, fleetTargetsPerHour, maxUnavailable or fleetShare'
                    rule: has(self.versionsPerDay) || has(self.maxConcurrent) || has(self.fleetTargetsPerHour)
                      || has(self.maxUnavailable) || has(self.fleetShare)
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: the budgets' versionsPerDay, maxConcurrent, fleetTargetsPerHour
                    and maxUnavailable sum to at most 1500 over all rules
                  rule: 'self.map(r, (has(r.versionsPerDay) ? r.versionsPerDay : 0)
                    + (has(r.maxConcurrent) ? r.maxConcurrent : 0) + (has(r.fleetTargetsPerHour)
                    ? r.fleetTargetsPerHour : 0) + (has(r.maxUnavailable) ? r.maxUnavailable
                    : 0)).sum() <= 1500'
              description:
                description: Description says what the agent does.
                maxLength: 1024
                type: string
              scope:
                description: Scope is where the agent may act.
                properties:
                  environments:
                    default:
                    - '*'
                    description: 'Environments the agent may approve or override in.
                      Default: all.'
                    items:
                      maxLength: 63
                      pattern: ^[^*]*\*?$
                      type: string
                    maxItems: 64
                    type: array
                  namespaces:
                    description: 'Namespaces the agent may write in. Empty: nowhere.'
                    items:
                      maxLength: 64
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9*])?$|^\*$
                      type: string
                    maxItems: 64
                    type: array
                  pipelines:
                    default:
                    - '*'
                    description: 'Pipelines the agent may create Bundles for. Default:
                      all.'
                    items:
                      maxLength: 253
                      pattern: ^[^*]*\*?$
                      type: string
                    maxItems: 64
                    type: array
                type: object
              signingIdentities:
                description: |-
                  SigningIdentities are the Sigstore (Fulcio) certificate identities of
                  the agent's workload. A config commit or an attestation whose
                  verified signer matches exactly one ready, unsuspended AgentIdentity
                  records that agent (commit.agent, attestations.<name>.agent), so a
                  gate can require that the agent that created a version also signed
                  it. See docs/actors.md#signing-identities.
                items:
                  description: |-
                    AgentSigningIdentity is a Fulcio certificate identity: the OIDC issuer,
                    and the subject (SAN) or a regular expression the whole subject matches.
                  properties:
                    issuer:
                      description: |-
                        Issuer is the OIDC issuer, for example
                        https://token.actions.githubusercontent.com.
                      maxLength: 512
                      minLength: 1
                      type: string
                    subject:
                      description: Subject is the certificate's subject (SAN).
                      maxLength: 1024
                      type: string
                    subjectRegExp:
                      description: SubjectRegExp is a regular expression the whole
                        subject must match.
                      maxLength: 1024
                      type: string
                  required:
                  - issuer
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of subject and subjectRegExp
                    rule: has(self.subject) != has(self.subjectRegExp)
                maxItems: 8
                type: array
              sponsor:
                description: Sponsor is the person accountable for the agent.
                properties:
                  team:
                    description: 'Team is the sponsor''s team: shown and exported,
                      not used by policy.'
                    maxLength: 253
                    type: string
                  user:
                    description: User is the sponsor's Kubernetes username.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - user
                type: object
                x-kubernetes-validations:
                - message: 'the sponsor is a person: a ServiceAccount or built-in
                    identity cannot sponsor an agent'
                  rule: '!self.user.startsWith(''system:'')'
              subjects:
                description: Subjects are the principals that are this agent.
                items:
                  description: |-
                    AgentSubject is one principal that is the agent. (CEL escapes the
                    keyword namespace as __namespace__ in rules.)
                  properties:
                    kind:
                      description: |-
                        Kind is ServiceAccount, User (a username exactly as the API server
                        authenticates it, for example an OIDC user) or Group.
                      enum:
                      - ServiceAccount
                      - User
                      - Group
                      maxLength: 16
                      type: string
                    name:
                      description: Name is the ServiceAccount, user or group name.
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the ServiceAccount's namespace.
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: a ServiceAccount subject needs a namespace; User and
                      Group subjects have none
                    rule: 'self.kind == ''ServiceAccount'' ? has(self.__namespace__)
                      : !has(self.__namespace__)'
                  - message: 'this group holds most of the cluster: it cannot be an
                      agent'
                    rule: self.kind != 'Group' || !(self.name in ['system:authenticated',
                      'system:unauthenticated', 'system:serviceaccounts', 'system:masters'])
                maxItems: 16
                minItems: 1
                type: array
              suspended:
                description: |-
                  Suspended denies every write by the agent's subjects. An AgentIdentity
                  can be deleted only once it is suspended.
                type: boolean
            required:
            - scope
            - sponsor
            - subjects
            type: object
            x-kubernetes-validations:
            - message: 'an agent cannot sponsor itself: the sponsor is one of its
                User subjects'
              rule: '!self.subjects.exists(s, s.kind == ''User'' && s.name == self.sponsor.user)'
          status:
            description: AgentIdentityStatus is the reconciler's verdict on the registration.
            properties:
              conditions:
                description: |-
                  Conditions: Ready, with reasons Valid, SubjectConflict, InvalidSponsor
                  and IndexFull.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              ready:
                description: Ready is true when the registration is valid and takes
                  effect.
                type: boolean
              reason:
                description: Reason says why the AgentIdentity is not ready.
                type: string
              usage:
                additionalProperties:
                  description: |-
                    AgentUsage is one ledger: an installation's count of an agent's
                    promotions against its budgets, written by that installation's budget
                    reconciler only.
                  properties:
                    conditions:
                      description: |-
                        Conditions of the ledger: Current, LedgerFull. Budget conditions are
                        kept here, never in the AgentIdentity's status.conditions.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      maxItems: 8
                      type: array
                      x-kubernetes-list-map-keys:
                      - type
                      x-kubernetes-list-type: map
                    evaluatedAt:
                      description: EvaluatedAt is the writer's clock when it wrote
                        the entry.
                      format: date-time
                      type: string
                    exemptions:
                      description: |-
                        Exemptions are the spec's exemptions as the writer saw them: the ones
                        in effect, the expired ones and the ignored ones.
                      items:
                        description: |-
                          AgentBudgetExemptionState is one spec.budgetExemptions entry as the
                          ledger's writer saw it: when it first saw it, and until when it counts. It
                          stays listed after it expires, until it is removed from the spec, so the
                          24-hour cap cannot be restarted.
                        properties:
                          expiresAt:
                            description: |-
                              ExpiresAt is when it stops counting: its expiresAt, or earlier with
                              the controller's 24-hour cap. An ignored exemption never counts; its
                              expiresAt is its firstSeenAt.
                            format: date-time
                            type: string
                          firstSeenAt:
                            description: FirstSeenAt is when the controller first
                              saw it.
                            format: date-time
                            type: string
                          ignored:
                            description: |-
                              Ignored, when set, says why the exemption never counts: MadeByAgent
                              (its actor stamp is an agent's) or Unverified (it has no stamp).
                            enum:
                            - MadeByAgent
                            - Unverified
                            type: string
                          name:
                            description: Name is the exemption's name.
                            maxLength: 63
                            type: string
                        required:
                        - expiresAt
                        - firstSeenAt
                        - name
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    grants:
                      description: |-
                        Grants are the ledger: the promotions some window or state still
                        counts, at most 2,000.
                      items:
                        description: |-
                          AgentBudgetGrant is one promotion the ledger let through: a version into
                          an environment. It names the Bundle by UID only, not its namespace,
                          Pipeline or name (docs/design/24-agent-budgets.md section 15.1).
                        properties:
                          bundleUID:
                            description: BundleUID is the Bundle's UID.
                            maxLength: 64
                            type: string
                          environment:
                            description: Environment is the step's environment (a
                              fleet target's own name).
                            maxLength: 63
                            type: string
                          exemption:
                            description: Exemption is the exemption the grant used,
                              if any.
                            maxLength: 63
                            type: string
                          fleet:
                            description: Fleet is the fleet environment of a fleet
                              target.
                            maxLength: 63
                            type: string
                          grantedAt:
                            description: GrantedAt is when the ledger granted it.
                            format: date-time
                            type: string
                          rules:
                            description: Rules are the rules the grant counts against.
                            items:
                              maxLength: 63
                              type: string
                            maxItems: 16
                            type: array
                          seeded:
                            description: |-
                              Seeded is true for a grant recorded from a promotion that started
                              before the ledger did.
                            type: boolean
                          settled:
                            description: Settled is true once the promotion no longer
                              counts as under way.
                            type: boolean
                          unavailable:
                            description: Unavailable is true while it counts in maxUnavailable.
                            type: boolean
                          version:
                            description: |-
                              Version is true when the grant counts in versionsPerDay: the first of
                              its Bundle into its environment (a fleet's targets are one).
                            type: boolean
                        required:
                        - bundleUID
                        - environment
                        - grantedAt
                        type: object
                      maxItems: 2000
                      type: array
                    nextEvaluationAt:
                      description: |-
                        NextEvaluationAt is when the writer evaluates the entry again: when a
                        count next drops.
                      format: date-time
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the spec generation this
                        entry was computed for.
                      format: int64
                      type: integer
                    rules:
                      description: Rules are the usage of each budget rule.
                      items:
                        description: |-
                          AgentBudgetRuleUsage is one rule's usage, with the rule's matching copied
                          from the spec so a reader needs only the status. A count is absent when
                          its limit is not set.
                        properties:
                          concurrent:
                            description: Concurrent counts maxConcurrent.
                            properties:
                              freesAt:
                                description: FreesAt is when Used next drops (rate
                                  limits only).
                                format: date-time
                                type: string
                              limit:
                                description: Limit is the spec's limit.
                                format: int32
                                type: integer
                              used:
                                description: Used is what counts against it now.
                                format: int32
                                type: integer
                              windowStart:
                                description: WindowStart is the start of the rolling
                                  window (rate limits only).
                                format: date-time
                                type: string
