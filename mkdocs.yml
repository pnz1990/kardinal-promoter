site_name: kardinal-promoter
site_description: Kubernetes-native promotion controller — GitOps pipelines with visible policy gates and PR evidence
site_url: https://pnz1990.github.io/kardinal-promoter/
repo_url: https://github.com/pnz1990/kardinal-promoter
repo_name: pnz1990/kardinal-promoter
edit_uri: edit/main/docs/

# docs/aide/ holds the contributor vision and journey definition of done; they are not user documentation.
exclude_docs: |
  aide/
  requirements.txt

# Every page must be in the nav: strict mode fails on an omitted page.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

theme:
  name: material
  # Colours and fonts are the kardinal design tokens (docs/stylesheets/tokens.css, generated
  # from web/tokens/tokens.json, and kardinal.css). The fonts are self-hosted: no font CDN.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow the system theme
  font: false
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - toc.follow

extra_css:
  - stylesheets/tokens.css
  - stylesheets/kardinal.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        multi-cluster.md: health-adapters.md#remote-clusters

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

