# Sample Bundle for manual creation.
# In practice, your CI pipeline creates this via the /api/v1/bundles webhook
# or via: kardinal create bundle kardinal-test-app --image ghcr.io/pnz1990/kardinal-test-app:sha-<7 chars>
# sha-9349a3f is the tag the kardinal-demo overlays start from; use a newer
# tag from `gh api repos/pnz1990/kardinal-test-app/commits/main --jq '.sha[:7]'`
# to see a real promotion.
apiVersion: kardinal.io/v1alpha1
kind: Bundle
metadata:
  name: kardinal-test-app-sha-9349a3f
  namespace: default
  labels:
    kardinal.io/pipeline: kardinal-test-app
spec:
  type: image
  pipeline: kardinal-test-app
  images:
    - repository: ghcr.io/pnz1990/kardinal-test-app
      tag: sha-9349a3f
  provenance:
    commitSHA: "9349a3f"
    author: "your-username"
  intent:
    targetEnvironment: prod
