apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: kardinal-test-app
  namespace: default
spec:
  git:
    # Replace with your fork: fork pnz1990/kardinal-demo and put
    # https://github.com/<you>/kardinal-demo here and in argocd-applications.yaml.
    url: https://github.com/pnz1990/kardinal-demo
    secretRef:
      name: github-token
  # Defaults: each environment follows the one before it, lives at
  # environments/<name> on main, and is updated with kustomize; approval is
  # auto. Health is the Argo CD Application kardinal-test-app-<name>.
  environments:
    - name: test
      health: { type: argocd }
    - name: uat
      health: { type: argocd }
    - name: prod
      approval: pr-review
      health:
        type: argocd
        timeout: 15m
