# subscription-git.yaml — Git repository subscription example.
# Watches the main branch of kardinal-demo for new commits.
# The first poll records the current commit; each later commit creates a config Bundle.
# pathGlob (path filtering) is not implemented and must be left unset.
#
# Usage:
#   kubectl apply -f subscription-git.yaml
#   kubectl get subscriptions
apiVersion: kardinal.io/v1alpha1
kind: Subscription
metadata:
  name: kardinal-demo-git
  namespace: default
spec:
  type: git
  pipeline: kardinal-test-app
  git:
    repoURL: https://github.com/pnz1990/kardinal-demo
    branch: main
    interval: 5m
