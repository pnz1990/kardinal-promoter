# subscription-git.yaml — Git repository subscription example.
# Watches the main branch of a config source repo for new commits and creates
# a config Bundle for the platform-config Pipeline
# (examples/config-promotion/pipeline.yaml) for each one. The first poll
# records the current commit; each later commit creates a Bundle.
#
# myorg/platform-config-source is a placeholder; change it to your config
# source repo. It uses the Pipeline's layout (environments/<name>), and
# config-merge copies each environment's path from the new commit.
# Watch a repo or branch the Pipeline does not write to, or set
# spec.git.pathGlob to paths kardinal does not write: a Subscription on
# myorg/platform-config main without it would create a Bundle for every
# promotion commit. A private repo needs spec.git.secretRef (docs/subscription.md).
#
# Usage:
#   kubectl apply -f subscription-git.yaml
#   kubectl get subscriptions
apiVersion: kardinal.io/v1alpha1
kind: Subscription
metadata:
  name: platform-config-git
  namespace: default
spec:
  type: git
  pipeline: platform-config
  git:
    repoURL: https://github.com/myorg/platform-config-source
    branch: main
    interval: 5m
