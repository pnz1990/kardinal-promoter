# subscription-image.yaml — OCI image subscription example.
# Watches the moving "main" tag of ghcr.io/pnz1990/kardinal-test-app.
# The first poll records the current digest; each later push of "main" creates a
# Bundle pinned to the new digest. sha-<commit> tags are not ordered, so a
# "^sha-" filter only works while at most 50 tags match (see docs/subscription.md).
#
# Usage:
#   kubectl apply -f subscription-image.yaml
#   kubectl get subscriptions
apiVersion: kardinal.io/v1alpha1
kind: Subscription
metadata:
  name: kardinal-test-app-image
  namespace: default
spec:
  type: image
  pipeline: kardinal-test-app
  image:
    registry: ghcr.io/pnz1990/kardinal-test-app
    tagFilter: "^main$"
    interval: 5m
