apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: github-demo
  namespace: default
spec:
  # GitHub SCM provider — uses the full GitHub feature set:
  # - PR review gate (prod requires human approval)
  # - Structured PR evidence body (image provenance, gate results, upstream verification)
  # - Emergency override (kardinal override; the PR body shows it as the gate's reason)
  # - Rollback PR (kardinal/rollback label, a note naming the replaced and restored Bundles)
  git:
    url: https://github.com/pnz1990/kardinal-demo
    branch: main
    layout: directory
    secretRef:
      name: github-token

  # The Argo CD Applications are the quickstart's (examples/quickstart/
  # argocd-applications.yaml): kardinal-test-app-<env> in argocd, which sync
  # the kardinal-demo paths this Pipeline promotes into. health.argocd.name
  # points at them; the default would be <pipeline>-<env> (github-demo-test).
  environments:
    - name: test
      path: environments/test
      update:
        strategy: kustomize
      approval: auto
      health:
        type: argocd
        argocd:
          name: kardinal-test-app-test

    - name: uat
      path: environments/uat
      update:
        strategy: kustomize
      approval: auto
      bake:
        minutes: 30
        policy: fail-on-alarm
      health:
        type: argocd
        argocd:
          name: kardinal-test-app-uat

    # prod: full GitHub feature exercise
    # - PR opened with structured evidence body
    # - Requires at least 1 approving review (pr-review)
    # - PolicyGate no-weekend: blocks Saturday/Sunday
    # - 60-minute contiguous healthy bake after merge
    # - Emergency override available via: kardinal override github-demo --stage prod --gate no-weekend-deploys --reason "hotfix"
    # - Rollback opens a new PR with kardinal/rollback label
    - name: prod
      path: environments/prod
      update:
        strategy: kustomize
      approval: pr-review
      bake:
        minutes: 60
        policy: fail-on-alarm
      onHealthFailure: rollback
      health:
        type: argocd
        argocd:
          name: kardinal-test-app-prod
        timeout: 15m

  historyLimit: 20
---
# PolicyGate: no deployments on weekends (schedule.isWeekend check)
apiVersion: kardinal.io/v1alpha1
kind: PolicyGate
metadata:
  name: no-weekend-deploys
  namespace: default
  labels:
    kardinal.io/scope: team
    kardinal.io/applies-to: prod
    kardinal.io/type: gate
spec:
  expression: "!schedule.isWeekend"
  message: "Block deployments on Saturday and Sunday UTC"
---
# PolicyGate: require upstream UAT soak of 30 minutes
apiVersion: kardinal.io/v1alpha1
kind: PolicyGate
metadata:
  name: uat-soak-gate
  namespace: default
  labels:
    kardinal.io/scope: team
    kardinal.io/applies-to: prod
    kardinal.io/type: gate
spec:
  expression: "upstream.uat.soakMinutes >= 30"
  message: "UAT must have been healthy for at least 30 contiguous minutes"
---
# PolicyGate: block deployments by dependabot (bundle metadata check)
apiVersion: kardinal.io/v1alpha1
kind: PolicyGate
metadata:
  name: no-bot-deploys
  namespace: default
  labels:
    kardinal.io/scope: team
    kardinal.io/applies-to: prod
    kardinal.io/type: gate
spec:
  expression: 'bundle.provenance.author != "dependabot[bot]"'
  message: "Do not auto-deploy dependabot bundles to production"
