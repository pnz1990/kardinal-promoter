# The Kustomization names are <pipeline>-<env> (flux-demo-test, ...): that is the
# Kustomization the flux health check looks up in flux-system. Each one
# deploys the Deployment kardinal-test-app into kardinal-test-app-<env>.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-demo-test
  namespace: flux-system
spec:
  interval: 1m
  path: ./environments/test
  # The kardinal-demo overlays set namespace "default"; move each copy into
  # its own namespace so the three environments do not overwrite each other.
  targetNamespace: kardinal-test-app-test
  prune: true
  sourceRef:
    kind: GitRepository
    name: kardinal-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kardinal-test-app
      namespace: kardinal-test-app-test
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-demo-uat
  namespace: flux-system
spec:
  interval: 1m
  path: ./environments/uat
  # The kardinal-demo overlays set namespace "default"; move each copy into
  # its own namespace so the three environments do not overwrite each other.
  targetNamespace: kardinal-test-app-uat
  prune: true
  sourceRef:
    kind: GitRepository
    name: kardinal-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kardinal-test-app
      namespace: kardinal-test-app-uat
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-demo-prod
  namespace: flux-system
spec:
  interval: 1m
  path: ./environments/prod
  # The kardinal-demo overlays set namespace "default"; move each copy into
  # its own namespace so the three environments do not overwrite each other.
  targetNamespace: kardinal-test-app-prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: kardinal-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kardinal-test-app
      namespace: kardinal-test-app-prod
  timeout: 10m
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kardinal-demo
  namespace: flux-system
spec:
  interval: 1m
  # Your fork of kardinal-demo: the same repo as spec.git.url in pipeline.yaml.
  url: https://github.com/pnz1990/kardinal-demo
  ref:
    branch: main
  # kardinal-demo is public, so Flux needs no credentials. For a private repo,
  # add a secretRef to a Secret with "username" and "password" keys (HTTPS
  # basic auth, e.g. username=git and password=<PAT>). Flux does not read a
  # "token" key.
