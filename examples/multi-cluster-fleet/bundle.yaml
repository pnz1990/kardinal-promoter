# A sample Bundle for manual creation. In CI, use `kardinal create bundle`
# or the create-bundle action instead (see docs/ci-integration.md).
apiVersion: kardinal.io/v1alpha1
kind: Bundle
metadata:
  name: rollouts-demo-v2-0-0
  namespace: default
  labels:
    kardinal.io/pipeline: rollouts-demo
spec:
  type: image
  pipeline: rollouts-demo
  images:
    - repository: ghcr.io/myorg/rollouts-demo
      tag: v2.0.0
  provenance:
    commitSHA: "def456abc789"
    ciRunURL: "https://github.com/myorg/rollouts-demo/actions/runs/67890"
    author: "engineer-name"
  # targetEnvironment promotes only up to prod-us (test, pre-prod, prod-us):
  # prod-eu is not on its path, so this Bundle skips it. Remove intent to
  # promote to both regions, as `kardinal create bundle` does.
  intent:
    targetEnvironment: prod-us
