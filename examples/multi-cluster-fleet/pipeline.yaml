apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: rollouts-demo
  namespace: default
spec:
  git:
    url: https://github.com/myorg/rollouts-demo-deploy
    branch: main
    layout: directory
    provider: github
    secretRef:
      name: github-token

  environments:
    # Test: auto-promote, instant deploy
    - name: test
      path: env/test
      update:
        strategy: kustomize
      approval: auto
      health:
        type: argocd   # Application name defaults to rollouts-demo-test in namespace argocd

    # Pre-prod: PR approval, instant deploy
    - name: pre-prod
      path: env/pre-prod
      update:
        strategy: kustomize
      approval: pr-review
      health:
        type: argocd   # Application name defaults to rollouts-demo-pre-prod in namespace argocd

    # Prod EU: PR approval, Argo Rollouts canary in the prod-eu cluster, parallel
    # with prod-us. The Rollout runs in the spoke, so kardinal checks the hub's
    # Argo CD Application for it (rollouts-demo-prod-eu), not the Rollout.
    - name: prod-eu
      dependsOn: [pre-prod]
      path: env/prod-eu
      update:
        strategy: kustomize
      approval: pr-review
      health:
        type: argocd
        timeout: 30m

    # Prod US: PR approval, Argo Rollouts canary in the prod-us cluster, parallel
    # with prod-eu. The Rollout runs in the spoke, so kardinal checks the hub's
    # Argo CD Application for it (rollouts-demo-prod-us), not the Rollout.
    - name: prod-us
      dependsOn: [pre-prod]
      path: env/prod-us
      update:
        strategy: kustomize
      approval: pr-review
      health:
        type: argocd
        timeout: 30m

  historyLimit: 20
