# root-appset.yaml — Root ApplicationSet for multi-tenant Pipeline provisioning.
#
# Platform team applies this once. For every folder under
# examples/multi-tenant/teams/ that holds a pipeline-values.yaml, this
# ApplicationSet:
#   1. Creates a Namespace named after the folder
#   2. Renders the team-pipeline Helm chart (chart/ in this directory) with the
#      team's pipeline-values.yaml, which creates the team's kardinal Pipeline
#
# The chart and the team folders both live in this repository, so the
# Application uses two sources: the chart, and this repository again as
# `$values` for the team's values file (Argo CD 2.6 or later). In your own
# setup, point both repoURLs at the repository that holds your chart and team
# folders.
#
# Usage:
#   kubectl apply -f root-appset.yaml
#   # Then add a team folder and push it:
#   mkdir examples/multi-tenant/teams/my-service
#   cat > examples/multi-tenant/teams/my-service/pipeline-values.yaml << EOF
#   appName: my-service
#   gitRepo: https://github.com/pnz1990/kardinal-demo
#   environments:
#     - name: test
#     - name: uat
#     - name: prod
#       approval: pr-review
#   EOF
#   git add . && git commit -m "feat: add my-service" && git push
#   # Give the team's Pipeline a token for gitRepo (the chart's gitSecretName),
#   # in the namespace the ApplicationSet created:
#   kubectl -n my-service create secret generic github-token --from-literal=token=<token>
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: team-pipelines
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/pnz1990/kardinal-promoter
        revision: main
        directories:
          - path: examples/multi-tenant/teams/*
  template:
    metadata:
      name: "{{path.basename}}-pipeline"
      labels:
        kardinal.io/managed-by: team-pipelines
    spec:
      project: default
      sources:
        - repoURL: https://github.com/pnz1990/kardinal-promoter
          targetRevision: main
          path: examples/multi-tenant/chart
          helm:
            releaseName: "{{path.basename}}"
            valueFiles:
              - "$values/examples/multi-tenant/teams/{{path.basename}}/pipeline-values.yaml"
        - repoURL: https://github.com/pnz1990/kardinal-promoter
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        - group: kardinal.io
          kind: Pipeline
          jsonPointers:
            - /status
