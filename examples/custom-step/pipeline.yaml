# Pipeline with custom step: version-gate
#
# NOT RUNNABLE YET: spec.environments[].steps is not implemented. The controller
# always runs the default step sequence and rejects a Pipeline that sets steps
# (kardinal validate reports it; its Bundles fail). The steps block below is
# commented out so this Pipeline applies and promotes with the default steps.
# It shows how the version gate will be wired in once steps ships; see
# docs/custom-steps.md.
#
# The custom step would run before git-clone so it can reject pre-release
# images early. server.go is the example webhook server.
apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: nginx-demo-with-version-gate
  namespace: default
spec:
  appName: nginx-demo
  git:
    url: https://github.com/myorg/gitops-repo
    secretRef:
      name: github-token
  environments:
    - name: test
      approval: auto
      update:
        strategy: kustomize
    - name: uat
      approval: auto
      update:
        strategy: kustomize
    - name: prod
      approval: pr-review
      update:
        strategy: kustomize
      # --- not implemented yet (see the header) ---
