apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: payment-service
  namespace: default
spec:
  git:
    url: https://github.com/pnz1990/kardinal-demo
    branch: main
    layout: directory
    provider: github
    secretRef:
      name: github-token

  environments:
    - name: test
      path: environments/test
      update:
        strategy: kustomize
      approval: auto
      health:
        type: resource
      # Integration tests after deployment to test are NOT RUNNABLE YET:
      # spec.environments[].steps is not implemented, and the controller
      # rejects a Pipeline that sets it (see docs/custom-steps.md). Once it
      # ships, the test environment will list its steps like this:
      # steps:
      #   - uses: git-clone
      #   - uses: kustomize-set-image
      #   - uses: git-commit
      #   - uses: git-push
      #   - uses: health-check
      #   - uses: integration-test   # runs the test Job against the deployed environment

    - name: uat
      path: environments/uat
      update:
        strategy: kustomize
      approval: auto
      health:
        type: resource

    - name: prod
      path: environments/prod
      update:
        strategy: kustomize
      approval: pr-review
      health:
        type: argocd
        timeout: 15m
