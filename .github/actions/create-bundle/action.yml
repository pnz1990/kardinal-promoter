name: 'Create Kardinal Bundle'
description: 'Creates a kardinal-promoter Bundle from a CI pipeline to trigger promotion.'
author: 'kardinal-promoter'

inputs:
  pipeline:
    description: 'Name of the kardinal Pipeline to promote'
    required: true
  type:
    description: 'Bundle type: image, config, or mixed'
    required: false
    default: 'image'
  image:
    description: 'Single image reference (repository:tag or repository@sha256:digest). Use this for the common single-image case. Takes precedence over images when both are set.'
    required: false
  digest:
    description: 'Image digest (sha256:...) to associate with the image input. Only used when image is set.'
    required: false
  images:
    description: 'Newline-separated list of image references (repository:tag or repository@digest). Use this for multi-image bundles.'
    required: false
  namespace:
    description: 'Kubernetes namespace of the Pipeline'
    required: false
    default: 'default'
  kardinal-url:
    description: 'Base URL of the kardinal-promoter Bundle API (the webhook listener, port 8083 by default; e.g. https://kardinal.example.com)'
    required: true
  ui-url:
    description: 'Base URL of the kardinal UI (port 8082 by default). Used for bundle-status-url; leave empty to skip the link.'
    required: false
    default: ''
  config-commit:
    description: 'Commit SHA of the configuration change (configRef.commitSHA). Required for type config and mixed.'
    required: false
    default: ''
  config-repo:
    description: 'Git repository URL of config-commit (configRef.gitRepo). Defaults to the Pipeline repository.'
    required: false
    default: ''

outputs:
  bundle-name:
    description: 'Name of the created Bundle CRD'
    value: ${{ steps.create.outputs.bundle-name }}
  bundle-namespace:
    description: 'Namespace of the created Bundle CRD'
    value: ${{ steps.create.outputs.bundle-namespace }}
  bundle-status-url:
    description: 'URL of the pipeline view in the kardinal UI (empty when ui-url is not set)'
    value: ${{ steps.create.outputs.bundle-status-url }}

runs:
  using: 'composite'
  steps:
    - name: Create Bundle
      id: create
      shell: bash
      # Inputs are passed as environment variables, never interpolated into
      # the script, so untrusted values (branch names, tags) cannot inject code.
      env:
        KARDINAL_TOKEN: ${{ env.KARDINAL_TOKEN }}
        INPUT_PIPELINE: ${{ inputs.pipeline }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_DIGEST: ${{ inputs.digest }}
        INPUT_IMAGES: ${{ inputs.images }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_KARDINAL_URL: ${{ inputs.kardinal-url }}
        INPUT_UI_URL: ${{ inputs.ui-url }}
        INPUT_CONFIG_COMMIT: ${{ inputs.config-commit }}
        INPUT_CONFIG_REPO: ${{ inputs.config-repo }}
      run: bash "$GITHUB_ACTION_PATH/create-bundle.sh"
