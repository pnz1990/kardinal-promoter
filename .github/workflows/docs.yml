name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "api/v1alpha1/**"
      - "cmd/kardinal/**"
      - "hack/gen-cli-docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "api/v1alpha1/**"
      - "cmd/kardinal/**"
      - "hack/gen-cli-docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"

# Read-only by default; only the deploy job (main pushes) writes gh-pages.
permissions:
  contents: read

# Serialise gh-pages deploys — never cancel an in-flight deploy (would corrupt
# the gh-pages branch); queue the next one instead (cancel-in-progress: false).
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Step 1: Generate CLI reference from Cobra ──────────────────────────────
  generate-cli-docs:
    name: Generate CLI docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate CLI reference pages
        run: go run ./hack/gen-cli-docs/main.go --output docs/reference/cli/ --quickref docs/cli-reference.md

      - name: Upload generated CLI docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-cli-docs
          path: docs/reference/cli/
          retention-days: 1

  # ── Step 3: Build and validate ─────────────────────────────────────────────
  build:
    name: Build docs
    runs-on: ubuntu-latest
    needs: [generate-cli-docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download generated CLI docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: generated-cli-docs
          path: docs/reference/cli/


      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and plugins
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict --verbose
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-site
          path: site/
          retention-days: 1

  # ── Step 4: Verify CLI docs are in sync (CI enforcement) ──────────────────
  verify-cli-docs-sync:
    name: Verify CLI docs in sync
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check CLI detail pages and quick-reference are up to date
        run: |
          go run ./hack/gen-cli-docs/main.go --output /tmp/cli-docs/ --quickref /tmp/cli-reference-gen.md
          FAIL=0
          # Check per-command detail pages
          if ! diff -r /tmp/cli-docs/ docs/reference/cli/; then
            echo "::error::CLI detail docs are stale. Run: go run ./hack/gen-cli-docs/main.go"
            FAIL=1
          fi
          # Check the consolidated quick-reference (docs/cli-reference.md)
          if ! diff /tmp/cli-reference-gen.md docs/cli-reference.md; then
            echo "::error::docs/cli-reference.md is stale. Run: go run ./hack/gen-cli-docs/main.go"
            FAIL=1
          fi
          if [ $FAIL -eq 0 ]; then
            echo "::notice::CLI docs are in sync"
          fi
          exit $FAIL

  # ── Step 5: Deploy to GitHub Pages (main only) ────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # mkdocs gh-deploy pushes the gh-pages branch.
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://pnz1990.github.io/kardinal-promoter/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download generated CLI docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: generated-cli-docs
          path: docs/reference/cli/


      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs and plugins
        run: pip install -r docs/requirements.txt

      - name: Configure Git for deploy
        run: |
          git config user.name "kardinal-bot"
          git config user.email "kardinal-bot@users.noreply.github.com"

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force --clean --verbose
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}
