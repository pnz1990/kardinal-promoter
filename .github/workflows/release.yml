name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # A dry run: everything a release builds (the tests, the binaries and CLI,
  # both multi-arch images, the chart, the release body), from a branch, with
  # a made-up prerelease version, and nothing published: no image or chart
  # push, no signature or attestation, no GitHub release. What it built is
  # uploaded as the dry-run artifact. gh workflow run release.yml --ref <branch>
  # -f version=v0.12.0-dryrun.1
  workflow_dispatch:
    inputs:
      version:
        description: 'a prerelease version with "dryrun" in it, e.g. v0.12.0-dryrun.1'
        required: true

permissions:
  contents: read

# Two releases never run at once, so they cannot race the latest image tags
# and the latest GitHub release. GitHub keeps at most one run pending per
# group: a third run arriving cancels the pending one (cancel-in-progress
# only spares the running one). So push one release tag at a time, and
# re-run a release shown as cancelled; its tag is still there
# (CONTRIBUTING.md, Patch releases). A dry run publishes nothing and queues
# only behind another dry run of the same ref.
concurrency:
  group: ${{ github.event_name == 'push' && 'release-publish' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

env:
  # "true" on a dispatch: every step that publishes is skipped.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

# The run scripts rely on -e and -o pipefail, and test/hack/release_test.go
# runs them the same way.
defaults:
  run:
    shell: bash

jobs:
  # Every check that can stop a release runs here, before the tests and with
  # a read-only token, so a bad tag fails before anything is pushed.
  # test/hack/release_test.go runs these scripts.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      chart-version: ${{ steps.version.outputs.chart-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make-latest: ${{ steps.version.outputs.make-latest }}
      image-tags: ${{ steps.version.outputs.image-tags }}
      render-image-tags: ${{ steps.version.outputs.render-image-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # v0.6.0 and v0.8.1 were tagged on merge commits outside main. A release
      # is built from a commit on main, or, for a patch (vX.Y.Z, Z > 0), from
      # its maintenance branch release/vX.Y when that branch descends from
      # vX.Y.0: a fix for a released minor ships without main's next-minor
      # work. A .0 always comes from main. A dry run from release/vX.Y checks
      # the same ancestry and that its version is in that line.
      - name: Check that the tagged commit is on main or its maintenance branch
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${DRY_RUN:-false}" = true ]; then
            case "$GITHUB_REF_NAME" in
              release/v*) VERSION="${DISPATCH_VERSION:-}" ;;
              *) echo "dry run of ${GITHUB_REF_NAME}: the tag check runs at the real release"; exit 0 ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-.*)?$ ]]; then
            echo "::error::${VERSION} is not a vX.Y.Z version"
            exit 1
          fi
          MINOR="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          BRANCH="release/${MINOR}"
          # A patch of vX.Y never contains a release of a later line (vX.Y+1.0,
          # v(X+1).0.0, or one of their prereleases): that is main merged
          # into the maintenance branch, or an old line's patch tagged on
          # main. It would ship the later line's work as a patch. Every tag
          # is fetched, and the decision is made from the local tags, so a
          # failed fetch cannot skip it.
          if [ "$PATCH" != 0 ]; then
            X="${BASH_REMATCH[1]}" Y="${BASH_REMATCH[2]}"
            git fetch --no-tags origin '+refs/tags/v*:refs/tags/v*' 2>/dev/null || true
            while read -r t; do
              [[ "$t" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-.*)?$ ]] || continue
              [[ "$t" == *dryrun* ]] && continue
              if (( BASH_REMATCH[1] > X || (BASH_REMATCH[1] == X && BASH_REMATCH[2] > Y) )); then
                echo "::error::${VERSION} (${GITHUB_SHA}) contains ${t}: a ${MINOR} patch must not carry a later line's work. Tag it on ${BRANCH}, made from ${MINOR}.0, with only cherry-picked fixes."
                exit 1
              fi
            done < <(git tag --merged "$GITHUB_SHA" -l 'v*' 2>/dev/null)
          fi
          if [ "${DRY_RUN:-false}" != true ]; then
            # Fetch main explicitly, so the check does not depend on which refs
            # actions/checkout fetched for the tag.
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is on main"
              exit 0
            fi
          elif [ "$GITHUB_REF_NAME" != "$BRANCH" ]; then
            echo "::error::a dry run of ${VERSION} runs from ${BRANCH} (or from main), not from ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$PATCH" = 0 ]; then
            echo "::error::tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main. A .0 release is tagged on main."
            exit 1
          fi
          if ! git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${BRANCH}"; then
            echo "::error::tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not on main, nor on its maintenance branch ${BRANCH}. Tag a commit on main or on ${BRANCH}."
            exit 1
          fi
          if ! git fetch --no-tags origin "+refs/tags/${MINOR}.0:refs/tags/${MINOR}.0" 2>/dev/null ||
             ! git merge-base --is-ancestor "${MINOR}.0" "$GITHUB_SHA"; then
            echo "::error::${GITHUB_SHA} on ${BRANCH} does not descend from ${MINOR}.0: a maintenance branch starts at its minor's release (git branch ${BRANCH} ${MINOR}.0), and its fixes are cherry-picked onto it."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is on the maintenance branch ${BRANCH}, which descends from ${MINOR}.0"

      # A version with a "-" (v0.9.0-rc.1) is a prerelease: the image gets no
      # latest tag, and the GitHub release is marked prerelease and not latest.
      # The chart has no floating tag; helm skips a prerelease chart unless
      # given --version or --devel.
      # The tag must be strict SemVer 2.0 without build metadata. helm package
      # rejects anything else, but only after the image is pushed and signed.
      - name: Set version and release channel from tag
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${DRY_RUN:-false}" != true ] && [[ "$VERSION" == *dryrun* ]]; then
            echo "::error::tag ${VERSION} says dryrun: a dry run is a dispatch of this workflow, never a tag"
            exit 1
          fi
          if [ "${DRY_RUN:-false}" = true ]; then
            VERSION="${DISPATCH_VERSION:-}"
            # A dry run's version is a prerelease that says what it is, so
            # nothing it builds can pass for a release.
            if ! [[ "$VERSION" == *-*dryrun* ]]; then
              echo "::error::a dry run's version must be a prerelease with dryrun in it (v0.12.0-dryrun.1), not ${VERSION}"
              exit 1
            fi
          fi
          NUM='(0|[1-9][0-9]*)'
          IDENT='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="^v${NUM}\.${NUM}\.${NUM}(-${IDENT}(\.${IDENT})*)?$"
          if ! [[ "$VERSION" =~ $SEMVER ]]; then
            echo "::error::tag ${VERSION} is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE (SemVer 2.0, no leading zeros, no build metadata)"
            exit 1
          fi
          IMAGE=ghcr.io/pnz1990/kardinal-promoter/controller
          RENDER=ghcr.io/pnz1990/kardinal-promoter/render
          # Only the highest final release is latest: a patch of an older
          # minor (v0.12.1 after v0.13.0) gets neither the latest image tags
          # nor the latest GitHub release.
          NEWER=$( { git tag -l 'v*.*.*' 2>/dev/null || true; } | { grep -vE -- '-|dryrun' || true; } |
            { cat; echo "$VERSION"; } | sort -V | tail -n 1)
          LATEST=true
          if [[ "$VERSION" == *-* ]] || [ "$NEWER" != "$VERSION" ]; then
            LATEST=false
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          TAGS="${IMAGE}:${VERSION}"
          RENDER_TAGS="${RENDER}:${VERSION}"
          if [ "$LATEST" = true ]; then
            TAGS+=$'\n'"${IMAGE}:latest"
            RENDER_TAGS+=$'\n'"${RENDER}:latest"
          fi
          {
            echo "version=${VERSION}"
            echo "chart-version=${VERSION#v}"
            echo "prerelease=${PRERELEASE}"
            echo "make-latest=${LATEST}"
            echo "image-tags<<IMAGE_TAGS_EOF"
            echo "$TAGS"
            echo "IMAGE_TAGS_EOF"
            echo "render-image-tags<<RENDER_TAGS_EOF"
            echo "$RENDER_TAGS"
            echo "RENDER_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "${VERSION}: prerelease=${PRERELEASE}, latest=${LATEST} (highest release ${NEWER}), image tags:"
          echo "$TAGS"

      # The release notes are the "## [<version>]" section of
      # docs/changelog.md. Write that section before tagging (make
      # changelog-release VERSION=<version> writes the docs/changelog.d
      # entries in, then edit the highlights): without it the release fails
      # here. The notes never come from the commit history.
      # They go to the release job as a file (the release-notes artifact),
      # not as a job output: v0.10.0's notes, about 99 KB, did not arrive
      # through the output, and the release was created without them.
      # A tag whose docs/changelog.d still holds entries was not prepared
      # with make changelog-release: its notes would leave them out, and the
      # site would keep listing them under [Unreleased].
      - name: No unreleased changelog fragments
        # A dry run's notes are the fragments themselves.
        if: env.DRY_RUN != 'true'
        run: |
          left=
          if [ -d docs/changelog.d ]; then
            left=$(find docs/changelog.d -maxdepth 1 -name '*.md' ! -name README.md | sort)
          fi
          if [ -n "$left" ]; then
            echo "::error::docs/changelog.d still has entries; run make changelog-release VERSION=<version> before tagging:"
            echo "$left"
            exit 1
          fi
      - name: Release notes from docs/changelog.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section runs from its heading to the next "## " heading or
          # "---" rule. Headings are "## [v1.2.3] — date" or "## v1.2.3".
          # Inside a ``` or ~~~ code block, "## " and "---" are content.
          NOTES=$(awk -v v="$VERSION" '
            {
              line = $0
              sub(/^[[:space:]]+/, "", line)
              mark = substr(line, 1, 3)
            }
            fence == "" && (mark == "```" || mark == "~~~") { fence = mark; if (found) print; next }
            fence != "" { if (mark == fence) fence = ""; if (found) print; next }
            /^## / { if (found) exit; found = ($2 == "[" v "]" || $2 == v); next }
            /^---[[:space:]]*$/ { if (found) exit }
            found { print }
          ' docs/changelog.md | sed -e '/./,$!d')
          if [ -z "${NOTES//[[:space:]]/}" ] && [ "${DRY_RUN:-false}" = true ]; then
            # A dry run's made-up version has no section: the notes are what
            # the next release would say, [Unreleased] and the
            # docs/changelog.d entries (their bodies, after the front matter).
            NOTES=$(awk -v v=Unreleased '
              /^## / { if (found) exit; found = ($2 == "[" v "]"); next }
              /^---[[:space:]]*$/ { if (found) exit }
              found && !/^<!-- changelog.d/ { print }
            ' docs/changelog.md | sed -e '/./,$!d')
            for f in docs/changelog.d/*.md; do
              [ -e "$f" ] && [ "$(basename "$f")" != README.md ] || continue
              NOTES+=$'\n'"$(awk 'n >= 2 { print } /^---$/ { n++ }' "$f")"
            done
            NOTES="(dry run ${VERSION}: the unreleased entries)"$'\n\n'"${NOTES}"
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::docs/changelog.md has no \"## [${VERSION}]\" section, or it is empty. Add it before tagging."
            exit 1
          fi
          # The notes are docs/changelog.md's text, so their links are
          # relative to that page: pr-evidence.md#x, guides/security.md,
          # #from-v0100. On the GitHub release page they go nowhere (#1829).
          # Each becomes the docs site's URL for it, in mkdocs' directory
          # form (guides/security.md#a is <site>guides/security/#a, #a is
          # <site>changelog/#a, reference/openapi.json stays a file).
          # Links with a scheme stay as they are, and code is left alone. A
          # link outside the docs (/x, ../x) fails the release.
          LINKS_PY=$(cat <<'LINKS_EOF'
          import posixpath, re, sys
          SITE = "https://pnz1990.github.io/kardinal-promoter/"
          PAGE = "changelog/"
          bad = []
          def absolute(url):
              if re.match(r"[A-Za-z][A-Za-z0-9+.-]*:", url) or url.startswith("//"):
                  return url
              target, mark, anchor = url.partition("#")
              if not target:
                  return SITE + PAGE + mark + anchor
              path = posixpath.normpath(target)
              if target.startswith("/") or path == ".." or path.startswith("../"):
                  bad.append(url)
                  return url
              if path.endswith(".md"):
                  folder, name = posixpath.split(path[:-3])
                  if name in ("index", "README"):
                      path = folder + "/" if folder else ""
                  else:
                      path = path[:-3] + "/"
              return SITE + path + mark + anchor
          def link(m):
              url = m.group(2)
              if url.startswith("<") and url.endswith(">"):
                  return m.group(1) + "<" + absolute(url[1:-1]) + ">" + m.group(3)
              return m.group(1) + absolute(url) + m.group(3)
          INLINE = re.compile(r'(\]\()(<[^>\n]*>|[^)\s]+)((?:\s+"[^"\n]*")?\))')
          REFDEF = re.compile(r"^( {0,3}\[[^\]\n]+\]:[ \t]+)(<[^>\n]*>|\S+)()")
          out, fence = [], ""
          for line in sys.stdin.read().split("\n"):
              mark = line.strip()[:3]
              if fence == "" and mark in ("```", "~~~"):
                  fence = mark
              elif fence:
                  if mark == fence:
                      fence = ""
              else:
                  parts = re.split(r"(`[^`]*`)", line)
                  for i in range(0, len(parts), 2):
                      parts[i] = INLINE.sub(link, parts[i])
                  parts[0] = REFDEF.sub(link, parts[0])
                  line = "".join(parts)
              out.append(line)
          if bad:
              for url in bad:
                  print("::error::the release notes link outside the docs: " + url, file=sys.stderr)
              sys.exit(1)
          sys.stdout.write("\n".join(out))
          LINKS_EOF
          )
          NOTES=$(printf '%s' "$NOTES" | python3 -I -c "$LINKS_PY")
          mkdir -p release-notes
          printf '%s\n' "$NOTES" > release-notes/notes.md
          echo "notes=release-notes/notes.md" >> "$GITHUB_OUTPUT"
          # The notes are the log's too. They come from pull requests, and a
          # line of theirs starting with :: would be a workflow command
          # (::set-output, ::add-mask, ::error), so commands are stopped
          # while they print, with a token no fragment can guess.
          STOP=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::$STOP"
          printf '%s\n' "$NOTES"
          echo "::$STOP::"

      # docs/upgrade.md describes the upgrade to the next release before it
      # exists with a --version <version> placeholder and a "not released
      # yet" note (the upgrade suites fill the placeholder with the checkout's
      # chart). A final release replaces both, and updates the suite's
      # guideChart constant, before it is tagged.
      - name: The upgrade guide names a released version
        if: steps.version.outputs.prerelease == 'false'
        run: |
          if grep -n -e '--version <version>' -e 'is not released yet' docs/upgrade.md; then
            echo "::error::docs/upgrade.md still has a --version <version> placeholder or a \"not released yet\" note (above). Replace them with ${GITHUB_REF_NAME#v} before tagging."
            exit 1
          fi

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes/notes.md
          if-no-files-found: error
          retention-days: 7

  # The tests run in their own job so that test code never runs with the
  # release job's write token.
  test:
    name: test
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A tag starts on a cold build cache. Compile first, as ci.yml's go vet
      # does, so a test that builds a binary (gen-reference-docs runs the
      # controller's -help) does not spend its timeout compiling, and give
      # each package the time a cold runner needs: the tests already passed
      # on main for this commit.
      - name: go vet
        run: go vet ./...

      # test/helm's PromQL tests need promtool, and fail without it in CI
      # (hack/tool-versions.env PROMTOOL_VERSION).
      - name: Install promtool
        run: bash hack/ci/install-promtool.sh

      - name: Run tests
        run: go test ./... -race -count=1 -timeout 300s

  # A dispatch is a dry run (DRY_RUN): it builds what a release builds
  # (both multi-arch images, the binaries and CLI, the chart, the release body)
  # with a read-only token and no publishing step at all, and uploads the
  # result. Its steps are the release job's, compared by test/hack
  # TestReleaseDryRun, so the dry run proves the steps the tag runs.
  dry-run:
    name: dry run
    needs: [preflight, test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build CLI and controller binaries
        run: |
          mkdir -p dist
          # test/helm/image_test.go checks that every -X below names a
          # variable that exists.
          CONTROLLER_LDFLAGS="-X main.ControllerVersion=${VERSION}"
          CLI_LDFLAGS="-X github.com/kardinal-promoter/kardinal-promoter/cmd/kardinal/cmd.CLIVersion=${VERSION}"
          # Controller (linux only). The image builds its own copy from the
          # Dockerfile with the same VERSION.
          GOOS=linux GOARCH=amd64 go build -ldflags="${CONTROLLER_LDFLAGS}" -o dist/kardinal-controller-linux-amd64 ./cmd/kardinal-controller/
          GOOS=linux GOARCH=arm64 go build -ldflags="${CONTROLLER_LDFLAGS}" -o dist/kardinal-controller-linux-arm64 ./cmd/kardinal-controller/
          # CLI (multi-platform)
          GOOS=linux   GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-linux-amd64   ./cmd/kardinal/
          GOOS=linux   GOARCH=arm64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-linux-arm64   ./cmd/kardinal/
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-darwin-amd64  ./cmd/kardinal/
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-darwin-arm64  ./cmd/kardinal/
          GOOS=windows GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-windows-amd64.exe ./cmd/kardinal/

      # ── Build kardinal-promoter controller image ───────────────────────────
      - name: Build kardinal-promoter controller image (multi-arch)
        id: build-controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ needs.preflight.outputs.image-tags }}
          labels: |
            org.opencontainers.image.title=kardinal-promoter-controller
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Build kardinal-render image (the render Jobs of layout: branch) ────
      - name: Build kardinal-render image (multi-arch)
        id: build-render
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: render.Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.preflight.outputs.render-image-tags }}
          labels: |
            org.opencontainers.image.title=kardinal-promoter-render
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update chart version
        run: |
          sed -i "s|^appVersion:.*|appVersion: \"${VERSION}\"|" chart/kardinal-promoter/Chart.yaml
          sed -i "s|^version:.*|version: ${CHART_VERSION}|" chart/kardinal-promoter/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package chart/kardinal-promoter \
            --version "${CHART_VERSION}" \
            --app-version "${VERSION}" \
            --destination dist/

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: release-notes/

      # The body is a file the GitHub release step reads (body_path): the
      # notes from preflight, then how to install this version. The release
      # fails here when the notes in the finished body are empty.
      # test/hack/release_test.go runs this script.
      - name: Release body
        id: body
        run: |
          NOTES_FILE=release-notes/notes.md
          if [ ! -s "$NOTES_FILE" ] || [ -z "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            echo "::error::the release notes from preflight ($NOTES_FILE) are missing or empty"
            exit 1
          fi
          cat > release-body.template.md <<'BODY_EOF'
          ## kardinal-promoter @VERSION@

          @NOTES@

          ### Install

          kardinal-promoter runs on the upstream [kro](https://github.com/kubernetes-sigs/kro)
          Graph controller (kro v0.10.0-rc.0 or later with the `GraphKind` feature gate). Install kro first:

          ```bash
          helm install kro oci://registry.k8s.io/kro/charts/kro \
            --namespace kro-system --create-namespace \
            --version 0.10.0-rc.0 \
            --set config.featureGates.GraphKind=true \
            --set rbac.mode=aggregation
          ```

          Then install kardinal-promoter:

          ```bash
          helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter \
            --namespace kardinal-system --create-namespace \
            --version @CHART_VERSION@ \
            --set scm.secretRef.name=github-token
          ```

          The chart installs the kardinal CRDs on first install. `helm upgrade` does not
          update CRDs, so apply them before upgrading:

          ```bash
          helm show crds oci://ghcr.io/pnz1990/charts/kardinal-promoter --version @CHART_VERSION@ \
            | kubectl apply --server-side --force-conflicts -f -
          ```

          ### CLI

          ```bash
          # macOS (Apple Silicon)
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-darwin-arm64
          chmod +x kardinal-darwin-arm64 && sudo mv kardinal-darwin-arm64 /usr/local/bin/kardinal

          # macOS (Intel)
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-darwin-amd64
          chmod +x kardinal-darwin-amd64 && sudo mv kardinal-darwin-amd64 /usr/local/bin/kardinal

          # Linux
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-linux-amd64
          chmod +x kardinal-linux-amd64 && sudo mv kardinal-linux-amd64 /usr/local/bin/kardinal
          ```

          ### Container images

          | Image | Tag | Platform |
          |---|---|---|
          | `ghcr.io/pnz1990/kardinal-promoter/controller` | `@VERSION@` | linux/amd64, linux/arm64 |
          | `ghcr.io/pnz1990/kardinal-promoter/render` | `@VERSION@` | linux/amd64, linux/arm64 |
          BODY_EOF
          # The placeholders are filled in the template only; the notes go in
          # between unchanged.
          fill() { sed -e "s|@VERSION@|${VERSION}|g" -e "s|@CHART_VERSION@|${CHART_VERSION}|g"; }
          {
            sed -n '1,/^@NOTES@$/p' release-body.template.md | sed '$d' | fill
            cat "$NOTES_FILE"
            sed -n '/^@NOTES@$/,$p' release-body.template.md | sed '1d' | fill
          } > release-body.md
          # The notes between the title and the install section must not be
          # empty in the finished body.
          NOTES_IN_BODY=$(awk '/^## kardinal-promoter /{f=1; next} /^### Install$/{exit} f' release-body.md)
          if [ -z "${NOTES_IN_BODY//[[:space:]]/}" ]; then
            echo "::error::the release body has no notes"
            exit 1
          fi
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"
          echo "release body: $(wc -c < release-body.md) bytes"

      - name: Upload what the dry run built
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dry-run
          path: |
            dist/
            release-body.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [preflight, test]
    # Only a tag publishes; a dispatch is the dry-run job's.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      CHART_VERSION: ${{ needs.preflight.outputs.chart-version }}
    permissions:
      contents: write
      packages: write
      id-token: write       # required for OIDC-based cosign keyless signing
      attestations: write   # required for actions/attest-build-provenance (SLSA)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI and controller binaries
        run: |
          mkdir -p dist
          # test/helm/image_test.go checks that every -X below names a
          # variable that exists.
          CONTROLLER_LDFLAGS="-X main.ControllerVersion=${VERSION}"
          CLI_LDFLAGS="-X github.com/kardinal-promoter/kardinal-promoter/cmd/kardinal/cmd.CLIVersion=${VERSION}"
          # Controller (linux only). The image builds its own copy from the
          # Dockerfile with the same VERSION.
          GOOS=linux GOARCH=amd64 go build -ldflags="${CONTROLLER_LDFLAGS}" -o dist/kardinal-controller-linux-amd64 ./cmd/kardinal-controller/
          GOOS=linux GOARCH=arm64 go build -ldflags="${CONTROLLER_LDFLAGS}" -o dist/kardinal-controller-linux-arm64 ./cmd/kardinal-controller/
          # CLI (multi-platform)
          GOOS=linux   GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-linux-amd64   ./cmd/kardinal/
          GOOS=linux   GOARCH=arm64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-linux-arm64   ./cmd/kardinal/
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-darwin-amd64  ./cmd/kardinal/
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-darwin-arm64  ./cmd/kardinal/
          GOOS=windows GOARCH=amd64 go build -ldflags="${CLI_LDFLAGS}" -o dist/kardinal-windows-amd64.exe ./cmd/kardinal/

      # ── Build kardinal-promoter controller image ───────────────────────────
      - name: Build and push kardinal-promoter controller image (multi-arch)
        id: build-controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ needs.preflight.outputs.image-tags }}
          labels: |
            org.opencontainers.image.title=kardinal-promoter-controller
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── Build kardinal-render image (the render Jobs of layout: branch) ────
      - name: Build and push kardinal-render image (multi-arch)
        id: build-render
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: render.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.preflight.outputs.render-image-tags }}
          labels: |
            org.opencontainers.image.title=kardinal-promoter-render
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SLSA provenance attestation (render)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/pnz1990/kardinal-promoter/render
          subject-digest: ${{ steps.build-render.outputs.digest }}

      # ── SLSA Level 2 provenance ──────────────────────────────────────────────
      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/pnz1990/kardinal-promoter/controller
          subject-digest: ${{ steps.build-controller.outputs.digest }}

      # ── Cosign keyless image signing ──────────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Sign controller image with cosign (keyless — GitHub Actions OIDC)
        run: |
          cosign sign --yes \
            "ghcr.io/pnz1990/kardinal-promoter/controller:${VERSION}"
          cosign sign --yes \
            "ghcr.io/pnz1990/kardinal-promoter/render:${VERSION}"

      # ── SBOM generation ─────────────────────────────────────────────────────
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/pnz1990/kardinal-promoter/controller:${{ env.VERSION }}
          artifact-name: sbom-controller.spdx.json
          output-file: ./sbom-controller.spdx.json
          format: spdx-json

      - name: Attach SBOM as cosign attestation
        run: |
          cosign attest --yes \
            --predicate sbom-controller.spdx.json \
            --type spdxjson \
            "ghcr.io/pnz1990/kardinal-promoter/controller:${VERSION}"

      # ── Vulnerability scanning ──────────────────────────────────────────────
      # Scan and report CVEs in the SARIF format for GitHub Security tab.
      # exit-code: 0 — report findings but do NOT block the release.
      # Rationale: the image is already pushed to ghcr.io at this point.
      # Blocking here leaves a published image without a GitHub Release entry.
      # CVE remediation is tracked separately via Dependabot and the SARIF report.
      - name: Scan controller image for HIGH/CRITICAL CVEs (trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/pnz1990/kardinal-promoter/controller:${{ env.VERSION }}
          format: sarif
          output: trivy-controller-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload trivy SARIF report (controller)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        if: always()
        with:
          sarif_file: trivy-controller-results.sarif
          category: trivy-controller
        continue-on-error: true

      # ── Package and publish Helm chart ─────────────────────────────────────
      - name: Update chart version
        run: |
          sed -i "s|^appVersion:.*|appVersion: \"${VERSION}\"|" chart/kardinal-promoter/Chart.yaml
          sed -i "s|^version:.*|version: ${CHART_VERSION}|" chart/kardinal-promoter/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package chart/kardinal-promoter \
            --version "${CHART_VERSION}" \
            --app-version "${VERSION}" \
            --destination dist/

      - name: Push Helm chart to OCI registry
        run: |
          helm push dist/kardinal-promoter-*.tgz oci://ghcr.io/pnz1990/charts

      # ── GitHub release ─────────────────────────────────────────────────────
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: release-notes/

      # The body is a file the GitHub release step reads (body_path): the
      # notes from preflight, then how to install this version. The release
      # fails here when the notes in the finished body are empty.
      # test/hack/release_test.go runs this script.
      - name: Release body
        id: body
        run: |
          NOTES_FILE=release-notes/notes.md
          if [ ! -s "$NOTES_FILE" ] || [ -z "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            echo "::error::the release notes from preflight ($NOTES_FILE) are missing or empty"
            exit 1
          fi
          cat > release-body.template.md <<'BODY_EOF'
          ## kardinal-promoter @VERSION@

          @NOTES@

          ### Install

          kardinal-promoter runs on the upstream [kro](https://github.com/kubernetes-sigs/kro)
          Graph controller (kro v0.10.0-rc.0 or later with the `GraphKind` feature gate). Install kro first:

          ```bash
          helm install kro oci://registry.k8s.io/kro/charts/kro \
            --namespace kro-system --create-namespace \
            --version 0.10.0-rc.0 \
            --set config.featureGates.GraphKind=true \
            --set rbac.mode=aggregation
          ```

          Then install kardinal-promoter:

          ```bash
          helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter \
            --namespace kardinal-system --create-namespace \
            --version @CHART_VERSION@ \
            --set scm.secretRef.name=github-token
          ```

          The chart installs the kardinal CRDs on first install. `helm upgrade` does not
          update CRDs, so apply them before upgrading:

          ```bash
          helm show crds oci://ghcr.io/pnz1990/charts/kardinal-promoter --version @CHART_VERSION@ \
            | kubectl apply --server-side --force-conflicts -f -
          ```

          ### CLI

          ```bash
          # macOS (Apple Silicon)
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-darwin-arm64
          chmod +x kardinal-darwin-arm64 && sudo mv kardinal-darwin-arm64 /usr/local/bin/kardinal

          # macOS (Intel)
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-darwin-amd64
          chmod +x kardinal-darwin-amd64 && sudo mv kardinal-darwin-amd64 /usr/local/bin/kardinal

          # Linux
          curl -LO https://github.com/pnz1990/kardinal-promoter/releases/download/@VERSION@/kardinal-linux-amd64
          chmod +x kardinal-linux-amd64 && sudo mv kardinal-linux-amd64 /usr/local/bin/kardinal
          ```

          ### Container images

          | Image | Tag | Platform |
          |---|---|---|
          | `ghcr.io/pnz1990/kardinal-promoter/controller` | `@VERSION@` | linux/amd64, linux/arm64 |
          | `ghcr.io/pnz1990/kardinal-promoter/render` | `@VERSION@` | linux/amd64, linux/arm64 |
          BODY_EOF
          # The placeholders are filled in the template only; the notes go in
          # between unchanged.
          fill() { sed -e "s|@VERSION@|${VERSION}|g" -e "s|@CHART_VERSION@|${CHART_VERSION}|g"; }
          {
            sed -n '1,/^@NOTES@$/p' release-body.template.md | sed '$d' | fill
            cat "$NOTES_FILE"
            sed -n '/^@NOTES@$/,$p' release-body.template.md | sed '1d' | fill
          } > release-body.md
          # The notes between the title and the install section must not be
          # empty in the finished body.
          NOTES_IN_BODY=$(awk '/^## kardinal-promoter /{f=1; next} /^### Install$/{exit} f' release-body.md)
          if [ -z "${NOTES_IN_BODY//[[:space:]]/}" ]; then
            echo "::error::the release body has no notes"
            exit 1
          fi
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"
          echo "release body: $(wc -c < release-body.md) bytes"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ env.VERSION }}
          name: kardinal-promoter ${{ env.VERSION }}
          body_path: ${{ steps.body.outputs.path }}
          files: dist/*
          draft: false
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make-latest }}
