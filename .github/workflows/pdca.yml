name: PDCA Product Validation

# Runs the PDCA product validation scenarios on a live kind cluster with kro,
# Argo CD, the controller built from this checkout, and the real
# kardinal-test-app image. The scenario input selects one of the six scenarios
# in AGENTS.md §Product Validation Scenarios (with the checks that depend on
# it); "all" also runs the extra CLI and API checks and the UI journeys.
#
# Every check either passes or fails; there is no "note" outcome. The job fails
# when any check fails, when no check ran, or when a scenario step aborted, and
# the [PDCA AUTOMATED] comment on Issue #1 says which.

on:
  schedule:
    # Daily at 02:00 UTC — matches demo-validate cadence for continuous coverage
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'AGENTS.md scenario to run (1-6), or all'
        required: true
        default: 'all'
        type: choice
        options: ['all', '1', '2', '3', '4', '5', '6']

jobs:
  pdca:
    name: PDCA validation (${{ inputs.scenario || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCENARIO: ${{ inputs.scenario || 'all' }}
      RESULTS_FILE: /tmp/pdca-results.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/

      - name: Install kubectl
        run: |
          KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Create kind cluster
        run: |
          kind create cluster --name kardinal-e2e --config test/e2e/kind-config.yaml
          # Wait for the API server to be fully ready before proceeding
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      - name: Setup E2E environment (kind + kro + ArgoCD)
        env:
          GOTOOLCHAIN: auto
        run: |
          make setup-e2e-env
        timeout-minutes: 20

      - name: Build kardinal CLI and controller
        env:
          GOTOOLCHAIN: local
        run: |
          make build
          echo "$(pwd)/bin" >> "$GITHUB_PATH"
          # Pre-generate CRD manifests here (installs controller-gen ~2min) so
          # the controller install step only needs docker-build + kind load + helm.
          make manifests

      - name: Install kardinal-promoter controller
        env:
          GOTOOLCHAIN: local
        timeout-minutes: 10
        run: |
          # Build and load the controller image into kind
          make docker-build IMG=ghcr.io/pnz1990/kardinal-promoter:dev
          kind load docker-image ghcr.io/pnz1990/kardinal-promoter:dev --name kardinal-e2e
          # Apply CRDs (pre-generated above) and upgrade the existing Helm release.
          kubectl apply -f config/crd/bases/
          # IMPORTANT: use "kardinal-promoter" as the release name to match setup-e2e-env.sh.
          # setup-e2e-env.sh creates the ScheduleClock "kardinal-clock" with annotation
          # meta.helm.sh/release-name=kardinal-promoter. Using a different release name
          # ("kardinal") causes a Helm ownership conflict on the second upgrade.
          helm upgrade --install kardinal-promoter chart/kardinal-promoter \
            --namespace kardinal-system --create-namespace \
            --set image.repository=ghcr.io/pnz1990/kardinal-promoter \
            --set image.tag=dev \
            --set image.pullPolicy=Never \
            --wait --timeout 300s
          kubectl get pods -n kardinal-system

      - name: Get real test image SHA
        id: image
        run: |
          # No fallback: a made-up tag would make every promotion check fail
          # for a reason unrelated to kardinal.
          SHA=$(gh api repos/pnz1990/kardinal-test-app/commits/main --jq '.sha[:7]')
          echo "image=ghcr.io/pnz1990/kardinal-test-app:sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "Using image: ghcr.io/pnz1990/kardinal-test-app:sha-$SHA"

      - name: Apply Pipeline and PolicyGates
        env:
          KARDINAL_DEMO_PAT: ${{ secrets.KARDINAL_DEMO_PAT }}
        run: |
          # Create the platform-policies namespace required by the org-level PolicyGates
          kubectl create namespace platform-policies --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f examples/quickstart/pipeline.yaml
          kubectl apply -f examples/quickstart/policy-gates.yaml
          # KARDINAL_DEMO_PAT is required for the promotion checks, which push to
          # pnz1990/kardinal-demo. GITHUB_TOKEN cannot push there (#558), so
          # without the PAT those checks fail rather than pass.
          if [ -z "$KARDINAL_DEMO_PAT" ]; then
            echo "::warning::KARDINAL_DEMO_PAT is not set; promotion checks will fail"
          fi
          # The token goes through a private file, never a command line.
          TOKEN_FILE=$(mktemp)
          chmod 600 "$TOKEN_FILE"
          printf '%s' "${KARDINAL_DEMO_PAT:-$GITHUB_TOKEN}" > "$TOKEN_FILE"
          kubectl create secret generic github-token \
            --from-file=token="$TOKEN_FILE" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$TOKEN_FILE"
          # Give the controller a moment to process the new resources
          sleep 5
          kubectl get pipeline -A || true
          kubectl get policygate -A || true

      - name: Run PDCA scenarios
        id: scenarios
        env:
          TEST_IMAGE: ${{ steps.image.outputs.image }}
          GOTOOLCHAIN: local
        run: |
          # Each check records exactly one ✅ or ❌ line in $RESULTS_FILE; the
          # report step counts them. A command that errors fails its check.
          set +e
          : > "$RESULTS_FILE"
          NS=default
          PIPELINE=kardinal-test-app
          TEST_TAG="${TEST_IMAGE##*:}"
          LAST_STATE=""

          oneline() { local s="${1//$'\n'/ | }"; printf '%s' "${s:0:400}"; }
          pass() { echo "PASS: $1"; printf '✅ %s\n' "$1" >> "$RESULTS_FILE"; }
          fail() { echo "FAIL: $1"; printf '❌ %s\n' "$(oneline "$1")" >> "$RESULTS_FILE"; }
          # want N...: true when the selected scenario is "all" or one of N.
          want() {
            [ "$SCENARIO" = all ] && return 0
            local s
            for s in "$@"; do [ "$s" = "$SCENARIO" ] && return 0; done
            return 1
          }
          # newest_bundle PIPELINE TAG: the newest Bundle of PIPELINE with image TAG.
          newest_bundle() {
            kubectl get bundles -n "$NS" -o json | jq -r --arg p "$1" --arg t "$2" \
              '[.items[] | select(.spec.pipeline == $p and any(.spec.images[]?; .tag == $t))]
               | sort_by(.metadata.creationTimestamp) | last | .metadata.name // empty'
          }
          bundle_phase() { kubectl get bundle "$1" -n "$NS" -o jsonpath='{.status.phase}' 2>/dev/null; }
          # step_field BUNDLE ENV FIELD: a status field of the bundle's PromotionStep in ENV.
          step_field() {
            kubectl get promotionsteps -n "$NS" -l "kardinal.io/bundle=$1,kardinal.io/environment=$2" \
              -o jsonpath="{.items[0].status.$3}" 2>/dev/null
          }
          # wait_state BUNDLE ENV SECONDS STATE...: wait until the step is in one of STATE.
          wait_state() {
            local b=$1 e=$2 deadline=$((SECONDS + $3)) s
            shift 3
            while :; do
              LAST_STATE=$(step_field "$b" "$e" state)
              for s in "$@"; do [ "$LAST_STATE" = "$s" ] && return 0; done
              [ "$SECONDS" -ge "$deadline" ] && return 1
              sleep 10
            done
          }
          # wait_superseded SECONDS BUNDLE...: wait until every BUNDLE is Superseded.
          wait_superseded() {
            local deadline=$((SECONDS + $1)) b all
            shift
            while :; do
              all=true
              for b in "$@"; do [ -n "$b" ] && [ "$(bundle_phase "$b")" = Superseded ] || all=false; done
              [ "$all" = true ] && return 0
              [ "$SECONDS" -ge "$deadline" ] && return 1
              sleep 10
            done
          }
          diagnostics() {
            echo "--- controller logs (last 10m) ---"
            kubectl logs -n kardinal-system -l app.kubernetes.io/name=kardinal-promoter --since=10m 2>/dev/null
            echo "--- PromotionSteps ---"
            kubectl get promotionsteps -A -o wide 2>/dev/null
            kubectl get promotionsteps -A -o json 2>/dev/null \
              | jq -r '.items[] | "\(.metadata.name): \(.status.state // "-") \(.status.message // "")"'
          }

          # ── AGENTS.md scenario 1: happy path (S1, S8); also the setup for 4 and 5 ──
          S1_BUNDLE=""
          if want 1 4 5; then
            echo "=== S1: happy path ==="
            if OUT=$(kardinal create bundle "$PIPELINE" --image "$TEST_IMAGE" 2>&1); then
              S1_BUNDLE=$(newest_bundle "$PIPELINE" "$TEST_TAG")
              if [ -n "$S1_BUNDLE" ] && wait_state "$S1_BUNDLE" test 300 Promoting WaitingForMerge HealthChecking Verified; then
                pass "S1: happy path — bundle $S1_BUNDLE is promoting in test ($LAST_STATE)"
              else
                fail "S1: happy path — bundle '$S1_BUNDLE' test step is '$LAST_STATE' after 5m"
                diagnostics
              fi
            else
              fail "S1: happy path — create bundle failed: $OUT"
            fi
          fi
          if want 1; then
            echo "=== S8: test Verified, uat promoting ==="
            if [ -n "$S1_BUNDLE" ] && wait_state "$S1_BUNDLE" test 300 Verified \
              && wait_state "$S1_BUNDLE" uat 120 Promoting WaitingForMerge HealthChecking Verified; then
              pass "S8: multi-stage — test Verified and uat promoting ($LAST_STATE)"
            else
              fail "S8: multi-stage — test=$(step_field "$S1_BUNDLE" test state) uat=$(step_field "$S1_BUNDLE" uat state): $(step_field "$S1_BUNDLE" test message)"
            fi
          fi

          # ── AGENTS.md scenario 5: rollback ──
          if want 5; then
            echo "=== S5: rollback (test) ==="
            if [ -n "$S1_BUNDLE" ] && wait_state "$S1_BUNDLE" test 300 Verified; then
              if OUT=$(kardinal rollback "$PIPELINE" --env test 2>&1); then
                RB=$(kubectl get bundles -n "$NS" -l kardinal.io/rollback=true -o json \
                  | jq --arg p "$PIPELINE" '[.items[] | select(.spec.pipeline == $p and (.spec.provenance.rollbackOf // "") != "")] | length')
                if [ "${RB:-0}" -ge 1 ]; then
                  pass "S5: rollback — rollback Bundle created: $(oneline "$OUT")"
                else
                  fail "S5: rollback — the command succeeded but no rollback Bundle exists: $OUT"
                fi
              else
                fail "S5: rollback — $OUT"
              fi
            else
              fail "S5: rollback — test never reached Verified (state '$LAST_STATE'), so there is nothing to roll back to"
            fi
          fi

          # ── AGENTS.md scenario 2: pause and resume ──
          if want 2; then
            echo "=== S2: pause and resume ==="
            paused() { kubectl get pipeline "$PIPELINE" -n "$NS" -o jsonpath='{.spec.paused}'; }
            if OUT=$(kardinal pause "$PIPELINE" 2>&1) && [ "$(paused)" = true ]; then
              if OUT=$(kardinal resume "$PIPELINE" 2>&1) && [ "$(paused)" != true ]; then
                pass "S2: pause sets spec.paused and resume clears it"
              else
                fail "S2: resume — spec.paused=$(paused): $OUT"
              fi
            else
              fail "S2: pause — spec.paused=$(paused): $OUT"
            fi
          fi

          # ── AGENTS.md scenario 3: policy gates (S3, S3b, S13, S14) ──
          # simulate TIME SOAK_MINUTES: prints the CLI's output; the exit status is the CLI's.
          simulate() { kardinal policy simulate --pipeline "$PIPELINE" --env prod --time "$1" --soak-minutes "$2" 2>&1; }
          if want 3; then
            echo "=== S3: weekend gate ==="
            if OUT=$(simulate "Saturday 3pm" 60) && grep -q '^RESULT: BLOCKED' <<<"$OUT" \
              && grep -q 'Blocked by: no-weekend-deploys' <<<"$OUT" && ! grep -q 'Blocked by: require-uat-soak' <<<"$OUT"; then
              pass "S3: weekend gate — Saturday 3pm is BLOCKED by no-weekend-deploys"
            else
              fail "S3: weekend gate — expected BLOCKED by no-weekend-deploys only; got: $OUT"
            fi
            if OUT=$(simulate "Tuesday 10am" 60) && grep -q '^RESULT: PASS' <<<"$OUT"; then
              pass "S3b: weekend gate — Tuesday 10am with 60m soak passes"
            else
              fail "S3b: weekend gate — expected RESULT: PASS; got: $OUT"
            fi
            if OUT=$(simulate "Saturday 3pm" 0) && grep -q 'Blocked by: no-weekend-deploys' <<<"$OUT" \
              && grep -q 'Blocked by: require-uat-soak' <<<"$OUT"; then
              pass "S13: multiple gates — both org gates block prod on Saturday without soak"
            else
              fail "S13: multiple gates — expected both gates to block; got: $OUT"
            fi
            if OUT=$(simulate "Tuesday 10am" 0) && grep -q 'Blocked by: require-uat-soak' <<<"$OUT" \
              && ! grep -q 'Blocked by: no-weekend-deploys' <<<"$OUT"; then
              pass "S14: expression gate — require-uat-soak blocks Tuesday without soak"
            else
              fail "S14: expression gate — expected BLOCKED by require-uat-soak only; got: $OUT"
            fi
          fi

          # ── AGENTS.md scenario 4: explain shows gate details ──
          if want 4; then
            echo "=== S4: explain ==="
            for _ in $(seq 1 18); do
              OUT=$(kardinal explain "$PIPELINE" --env prod 2>&1) && grep -q 'no-weekend-deploys' <<<"$OUT" \
                && grep -qF '!schedule.isWeekend' <<<"$OUT" && break
              sleep 10
            done
            if OUT=$(kardinal explain "$PIPELINE" --env prod 2>&1) && grep -q 'no-weekend-deploys' <<<"$OUT" \
              && grep -qF '!schedule.isWeekend' <<<"$OUT"; then
              pass "S4: explain — shows the no-weekend-deploys gate and its expression"
            else
              fail "S4: explain — expected the no-weekend-deploys gate and !schedule.isWeekend; got: $OUT"
            fi
          fi

          # ── AGENTS.md scenario 6: supersession (S6, S19) ──
          if want 6; then
            echo "=== S6: concurrent bundles ==="
            if OUT=$(kardinal create bundle "$PIPELINE" --image ghcr.io/pnz1990/kardinal-test-app:sha-aaa0001 2>&1) \
              && sleep 3 && OUT=$(kardinal create bundle "$PIPELINE" --image "$TEST_IMAGE" 2>&1); then
              OLD=$(newest_bundle "$PIPELINE" sha-aaa0001)
              NEW=$(newest_bundle "$PIPELINE" "$TEST_TAG")
              if wait_superseded 90 "$OLD" && [ "$(bundle_phase "$NEW")" != Superseded ]; then
                pass "S6: concurrent bundles — $OLD Superseded, $NEW $(bundle_phase "$NEW")"
              else
                fail "S6: concurrent bundles — old '$OLD' is '$(bundle_phase "$OLD")', new '$NEW' is '$(bundle_phase "$NEW")'"
              fi
            else
              fail "S6: concurrent bundles — create bundle failed: $OUT"
            fi
            echo "=== S19: three concurrent bundles ==="
            S19_ERR=""
            for t in sha-s19a sha-s19b sha-s19c; do
              OUT=$(kardinal create bundle "$PIPELINE" --image "ghcr.io/pnz1990/kardinal-test-app:$t" 2>&1) \
                || S19_ERR="${S19_ERR}create bundle $t failed: $OUT; "
            done
            A=$(newest_bundle "$PIPELINE" sha-s19a)
            B=$(newest_bundle "$PIPELINE" sha-s19b)
            C=$(newest_bundle "$PIPELINE" sha-s19c)
            if [ -z "$S19_ERR" ] && wait_superseded 90 "$A" "$B" && [ "$(bundle_phase "$C")" != Superseded ]; then
              pass "S19: three concurrent bundles — the two older are Superseded, the newest is $(bundle_phase "$C")"
            else
              fail "S19: three concurrent bundles — ${S19_ERR}phases: a=$(bundle_phase "$A") b=$(bundle_phase "$B") c=$(bundle_phase "$C")"
            fi
          fi

          # ── Extra checks (scenario "all" only) ──
          if want extra; then
            echo "=== S7: config-only bundle ==="
            if OUT=$(kardinal create bundle "$PIPELINE" --type config 2>&1) \
              && [ "$(kubectl get bundles -n "$NS" -o json | jq --arg p "$PIPELINE" '[.items[] | select(.spec.pipeline == $p and .spec.type == "config")] | length')" -ge 1 ]; then
              pass "S7: config-only bundle — a type=config Bundle was created"
            else
              fail "S7: config-only bundle — $OUT"
            fi

            echo "=== S10: kardinal get bundles ==="
            if OUT=$(kardinal get bundles "$PIPELINE" 2>&1) && grep -q "$PIPELINE-" <<<"$OUT"; then
              pass "S10: get bundles — lists the pipeline's bundles"
            else
              fail "S10: get bundles — $OUT"
            fi

            echo "=== S11: kardinal delete bundle ==="
            if kardinal create bundle "$PIPELINE" --image ghcr.io/pnz1990/kardinal-test-app:sha-del1111 \
              && DEL=$(newest_bundle "$PIPELINE" sha-del1111) && [ -n "$DEL" ] \
              && OUT=$(kardinal delete bundle "$DEL" 2>&1) \
              && kubectl wait --for=delete "bundle/$DEL" -n "$NS" --timeout=30s; then
              pass "S11: delete bundle — $DEL is gone"
            else
              fail "S11: delete bundle — bundle '$DEL': $OUT"
            fi

            echo "=== S12: kardinal get steps ==="
            if OUT=$(kardinal get steps "$PIPELINE" 2>&1) && grep -qE '^test[[:space:]]' <<<"$OUT"; then
              pass "S12: get steps — lists the pipeline's test step"
            else
              fail "S12: get steps — $OUT"
            fi

            echo "=== S15: emergency gate override ==="
            if OUT=$(kardinal -n platform-policies override "$PIPELINE" --stage prod --gate no-weekend-deploys \
                --reason "S15 PDCA check" --expires-in 1m 2>&1) \
              && [ "$(kubectl get policygate no-weekend-deploys -n platform-policies -o json \
                | jq '[.spec.overrides[]? | select(.reason == "S15 PDCA check")] | length')" -ge 1 ]; then
              pass "S15: emergency override — override recorded on no-weekend-deploys"
            else
              fail "S15: emergency override — $OUT"
            fi

            echo "=== S16: Pipeline environments ==="
            ENVS=$(kubectl get pipeline "$PIPELINE" -n "$NS" -o jsonpath='{.spec.environments[*].name}' 2>&1)
            if [ "$ENVS" = "test uat prod" ]; then
              pass "S16: Pipeline environments — test uat prod, in order"
            else
              fail "S16: Pipeline environments — expected 'test uat prod'; got: $ENVS"
            fi

            echo "=== S17: MetricCheck CRD ==="
            if OUT=$(kubectl get crd metricchecks.kardinal.io -o name 2>&1); then
              pass "S17: MetricCheck CRD is installed"
            else
              fail "S17: MetricCheck CRD — $OUT"
            fi

            echo "=== S18: resource health check accepted by the API server ==="
            if OUT=$(kubectl apply --dry-run=server -f test/pdca/s9-health-pipeline.yaml 2>&1) \
              && grep -q '(server dry run)' <<<"$OUT"; then
              pass "S18: the installed Pipeline CRD accepts a resource health check (server dry run)"
            else
              fail "S18: server dry run — $OUT"
            fi

            echo "=== S9: health check failure blocks promotion ==="
            kubectl create namespace s9-health-test --dry-run=client -o yaml | kubectl apply -f -
            # Zero replicas: the Deployment never becomes available.
            kubectl create deployment s9-test-app --image="$TEST_IMAGE" --replicas=0 -n s9-health-test \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f test/pdca/s9-health-pipeline.yaml
            sleep 5
            S9=""
            if OUT=$(kardinal create bundle s9-health-test --image "$TEST_IMAGE" 2>&1); then
              S9_BUNDLE=$(newest_bundle s9-health-test "$TEST_TAG")
              for _ in $(seq 1 12); do
                sleep 10
                case "$(step_field "$S9_BUNDLE" test state)" in
                  Verified) S9=Verified; break ;;
                  HealthChecking) S9=HealthChecking ;;
                  Failed) S9="Failed: $(step_field "$S9_BUNDLE" test message)"; break ;;
                esac
              done
              if [ "$S9" = HealthChecking ] || { [[ "$S9" == Failed:* ]] && grep -qi health <<<"$S9"; }; then
                pass "S9: health check failure blocks — the step stopped at the health check ($S9)"
              else
                fail "S9: health check failure blocks — expected HealthChecking or a health failure; got '${S9:-$(step_field "$S9_BUNDLE" test state)}'"
              fi
            else
              fail "S9: create bundle failed: $OUT"
            fi
            kubectl delete pipeline s9-health-test -n "$NS" --ignore-not-found
            kubectl delete namespace s9-health-test --ignore-not-found --wait=false

            echo "=== S23: org gates are installed ==="
            if OUT=$(kubectl get policygate no-weekend-deploys require-uat-soak -n platform-policies -o name 2>&1); then
              pass "S23: platform engineer — both org PolicyGates exist in platform-policies"
            else
              fail "S23: org PolicyGates — $OUT"
            fi

            echo "=== S24: kardinal history ==="
            if OUT=$(kardinal history "$PIPELINE" 2>&1) && grep -q "$PIPELINE-" <<<"$OUT"; then
              pass "S24: history — lists the pipeline's bundles"
            else
              fail "S24: history — $OUT"
            fi
          fi

          echo "Scenario checks: $(grep -c '^✅' "$RESULTS_FILE") passed, $(grep -c '^❌' "$RESULTS_FILE") failed"

      # ── UI scenarios S25–S27: Playwright against mock server (no cluster required) ──
      # Design ref: docs/design/25-anchor-kardinal-promoter.md §Future →
      #   "Playwright integration in PDCA — first 3 UI scenarios"
      # These run against the mock server only (web/test/e2e/mock-server/server.mjs).
      # The cluster is already up but not used by these steps.
      - name: Setup Node.js for Playwright UI tests
        if: env.SCENARIO == 'all'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        if: env.SCENARIO == 'all'
        run: npm ci --prefix web

      - name: Build web UI (required by mock server to serve static assets)
        if: env.SCENARIO == 'all'
        run: npm run --prefix web build

      - name: Install Playwright browsers (chromium only)
        if: env.SCENARIO == 'all'
        run: npx --prefix web playwright install chromium --with-deps

      - name: Run PDCA UI scenarios S25–S27 (Playwright)
        id: ui_scenarios
        if: env.SCENARIO == 'all'
        env:
          CI: 'true'
          KARDINAL_E2E_PORT: '3099'
        run: |
          set +e
          ui() {
            local id=$1 spec=$2 what=$3
            echo "=== $id: $what ==="
            if npx --prefix web playwright test "web/test/e2e/journeys/$spec" \
                --config=web/playwright.config.ts --reporter=line --timeout=30000 2>&1; then
              printf '✅ %s: %s — %s passes\n' "$id" "$what" "$spec" >> "$RESULTS_FILE"
            else
              printf '❌ %s: %s — %s failed (see logs)\n' "$id" "$what" "$spec" >> "$RESULTS_FILE"
            fi
          }
          ui S25 "UI bundle status" 001-pipeline-list.spec.ts
          ui S26 "UI pipeline graph" 002-dag-node-click.spec.ts
          ui S27 "UI rollback button" 011-rollback-button.spec.ts

      - name: Post PDCA evidence to Issue #1
        if: always()
        env:
          TEST_IMAGE: ${{ steps.image.outputs.image }}
          SCENARIOS_OUTCOME: ${{ steps.scenarios.outcome }}
          UI_OUTCOME: ${{ steps.ui_scenarios.outcome }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          touch "$RESULTS_FILE"
          # grep -c prints 0 but exits 1 when nothing matches.
          PASS_COUNT=$(grep -c '^✅' "$RESULTS_FILE" || true)
          FAIL_COUNT=$(grep -c '^❌' "$RESULTS_FILE" || true)
          TOTAL=$((PASS_COUNT + FAIL_COUNT))
          # A step that did not finish means some checks never ran.
          INCOMPLETE=""
          [ "$SCENARIOS_OUTCOME" = success ] || INCOMPLETE="scenario step: ${SCENARIOS_OUTCOME:-not run}"
          case "$UI_OUTCOME" in
            success | skipped) ;;
            *) INCOMPLETE="${INCOMPLETE:+$INCOMPLETE; }UI step: ${UI_OUTCOME:-not run}" ;;
          esac
          if [ "$TOTAL" -eq 0 ]; then
            STATUS="NO CHECKS RAN"
          elif [ "$FAIL_COUNT" -gt 0 ]; then
            STATUS="${FAIL_COUNT} FAILED"
          elif [ -n "$INCOMPLETE" ]; then
            STATUS="INCOMPLETE"
          else
            STATUS="ALL PASS"
          fi
          PCT=0
          if [ "$TOTAL" -gt 0 ]; then PCT=$((PASS_COUNT * 100 / TOTAL)); fi
          DATE=$(date -u '+%Y-%m-%d')
          COMMENT_FILE=$(mktemp)
          {
            echo "PDCA AUTOMATED - Product Validation $DATE"
            echo ""
            echo "Status: $STATUS (PASS=$PASS_COUNT FAIL=$FAIL_COUNT, scenario=$SCENARIO)"
            if [ -n "$INCOMPLETE" ]; then echo "Did not finish: $INCOMPLETE"; fi
            echo "Image: $TEST_IMAGE"
            echo "CI Run: https://github.com/$GH_REPO/actions/runs/$RUN_ID"
            echo "Trigger: $TRIGGER"
            echo ""
            echo "Scenario Results:"
            cat "$RESULTS_FILE"
          } > "$COMMENT_FILE"
          cat "$COMMENT_FILE"
          gh issue comment 1 --repo "$GH_REPO" --body-file "$COMMENT_FILE"
          # Post structured anchor score line to Issue #1 for coverage tracking
          gh issue comment 1 --repo "$GH_REPO" \
            --body "[ANCHOR | kardinal-promoter | ${DATE}] coverage: ${PASS_COUNT}/${TOTAL} (${PCT}%) | PASS=${PASS_COUNT} FAIL=${FAIL_COUNT}"
          if [ "$STATUS" != "ALL PASS" ]; then
            echo "::error::PDCA validation: $STATUS"
            exit 1
          fi

      - name: Tear down cluster
        if: always()
        run: |
          kind delete cluster --name kardinal-e2e 2>/dev/null || true
