name: E2E Journey Tests

# Runs on push to main (to verify all journeys after merge), on-demand,
# and on a daily schedule (per issue #399 — automated evidence for TestJourney1Quickstart).
on:
  push:
    branches: [main]
  schedule:
    # Run daily at 02:00 UTC to produce automated CI evidence (issue #399).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      journey:
        description: 'Journey to run (1-7, or all)'
        required: true
        default: 'all'
        type: choice
        options: ['all', '1', '2', '3', '4', '5', '6', '7']

# Cancel in-progress runs on new main pushes; keep scheduled/manual runs independent.
permissions:
  contents: read

# bash (not the default `bash -e`) so every step runs with -eo pipefail:
# `go test ... | tee` must fail the step when go test fails.
defaults:
  run:
    shell: bash

concurrency:
  group: e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Cancel any in-progress e2e run when a new push to main supersedes it.
  # Scheduled and manual runs get unique groups so they are never cancelled.
  e2e:
    name: e2e journey ${{ github.event.inputs.journey || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      KIND_CLUSTER: kardinal-e2e
      KIND_CONTEXT: kind-kardinal-e2e
      KARDINAL_IMAGE: ghcr.io/pnz1990/kardinal-promoter:dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Versions and sha256 sums: hack/tool-versions.env.
      - name: Install kind
        run: |
          source hack/tool-versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/

      - name: Install kubectl
        run: |
          source hack/tool-versions.env
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # hack/e2e-setup.sh creates the kind cluster, installs kro, builds the
      # controller image from this commit, kind-loads it, installs the chart
      # with image.repository/tag/pullPolicy=Never pointing at that image, and
      # applies the quickstart Pipeline and PolicyGates the cluster tests use.
      - name: Set up kind, kro and kardinal-promoter built from this commit
        run: make e2e-setup KIND_CLUSTER="$KIND_CLUSTER"

      - name: Verify the controller runs the image built from this commit
        run: |
          kubectl --context "$KIND_CONTEXT" get pods -n kro-system
          kubectl --context "$KIND_CONTEXT" get pods -n kardinal-system
          kubectl --context "$KIND_CONTEXT" get crd graphs.kro.run
          running=$(kubectl --context "$KIND_CONTEXT" -n kardinal-system get deployment kardinal-promoter \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "controller image: $running"
          if [ "$running" != "$KARDINAL_IMAGE" ]; then
            echo "::error::controller runs $running, expected the locally built $KARDINAL_IMAGE"
            exit 1
          fi

      - name: Build kardinal CLI binary
        run: |
          # Build the CLI so TestJourney5CLI can find and run it
          make build-cli
          sudo cp bin/kardinal /usr/local/bin/kardinal
          kardinal --context "$KIND_CONTEXT" version

      - name: Run selected journeys (fake-client)
        env:
          JOURNEY: ${{ github.event.inputs.journey || 'all' }}
        run: |
          mkdir -p test/e2e/results
          if [ "$JOURNEY" = "all" ]; then
            go test ./test/e2e/... -count=1 -v -timeout 25m 2>&1 | tee test/e2e/results/e2e-output.txt
          else
            go test ./test/e2e/... -count=1 -run "TestJourney${JOURNEY}" -v -timeout 25m 2>&1 | tee test/e2e/results/e2e-output.txt
          fi

      - name: Run cluster tests against the kind cluster
        run: |
          make test-e2e-kind KIND_CLUSTER="$KIND_CLUSTER" 2>&1 | tee test/e2e/results/e2e-kind-output.txt
          # A cluster test that skips proves nothing; treat it as a failure.
          if grep -E -- '--- SKIP: Test(Kind|Infrastructure)' test/e2e/results/e2e-kind-output.txt; then
            echo "::error::cluster e2e tests skipped — the kind cluster or its fixtures are missing"
            exit 1
          fi
          grep -q -- '--- PASS: TestKind' test/e2e/results/e2e-kind-output.txt || {
            echo "::error::no TestKind* test ran"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-results-${{ github.run_id }}
          path: test/e2e/results/

      - name: Cleanup kind cluster
        if: always()
        run: kind delete cluster --name "$KIND_CLUSTER"
