name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Use module mode: vendor/ is not committed (only modules.txt was tracked
  # historically). GOFLAGS=-mod=mod ensures all go tools resolve deps from
  # the module cache rather than a partial vendor directory.
  GOFLAGS: -mod=mod

permissions:
  contents: read

# Concurrency: cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Docs and YAML lint (always runs) ─────────────────────────────────────────
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate YAML files
        run: |
          pip install pyyaml --quiet
          python3 - <<'PYEOF'
          import pathlib, sys
          import yaml
          # Skip on whole path components, so ".git" does not also skip ".github".
          skip_dirs = {'.git', 'node_modules', 'vendor', 'templates'}
          errors, checked = [], 0
          for pattern in ('*.yml', '*.yaml'):
              for f in pathlib.Path('.').rglob(pattern):
                  if skip_dirs & set(f.parts) or f.name == 'mkdocs.yml':
                      continue
                  checked += 1
                  try:
                      list(yaml.safe_load_all(f.read_text()))
                  except yaml.YAMLError as e:
                      errors.append(f'{f}: {e}')
          for e in errors:
              print(e)
          if errors:
              sys.exit(1)
          print(f'All {checked} YAML files valid')
          PYEOF
      - name: Validate workflow run blocks (bash -n)
        run: bash scripts/validate-workflow-bash-syntax.sh
      - name: Check required docs exist
        run: |
          required=(
            "docs/aide/vision.md"
            "docs/aide/roadmap.md"
            "docs/aide/progress.md"
            "docs/aide/definition-of-done.md"
            "docs/aide/team.yml"
            "AGENTS.md"
            ".specify/memory/constitution.md"
          )
          missing=()
          for f in "${required[@]}"; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required files:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required docs present"

  # ── Go build + test ──────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Helm
        # test/examples and test/helm render charts with helm template.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || \
            (echo "go.mod/go.sum not tidy — run 'go mod tidy'" && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race -count=1 -timeout 120s
      - name: go build
        run: go build ./...
      - name: Check Apache 2.0 headers
        run: |
          missing=$(grep -rL "Licensed under the Apache License" \
            --include="*.go" . \
            --exclude-dir=vendor --exclude-dir=.git 2>/dev/null || true)
          if [ -n "$missing" ]; then
            echo "Missing Apache 2.0 header:"
            echo "$missing"
            exit 1
          fi
      - name: Check banned filenames
        run: |
          banned=$(find . \( -name util.go -o -name helpers.go -o -name common.go \) \
            -not -path './vendor/*' -not -path './.git/*' -not -path '*/node_modules/*')
          if [ -n "$banned" ]; then
            echo "Banned filenames:"
            echo "$banned"
            exit 1
          fi
      - name: Verify CRD schemas are up to date
        run: |
          # Install controller-gen at the pinned version used by Makefile.
          CONTROLLER_GEN_VERSION=$(grep 'CONTROLLER_GEN_VERSION\s*?=' Makefile | awk '{print $NF}')
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@${CONTROLLER_GEN_VERSION}
          controller-gen crd:allowDangerousTypes=true paths="./api/..." \
            output:crd:artifacts:config=config/crd/bases
          controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."
          git diff --exit-code config/crd/bases/ api/v1alpha1/zz_generated.deepcopy.go || \
            (echo "CRD schemas are stale — run 'make manifests generate' and commit" && exit 1)
          diff -r --exclude=.gitkeep config/crd/bases/ chart/kardinal-promoter/crds/ || \
            (echo "chart/kardinal-promoter/crds is stale — run 'make manifests' and commit" && exit 1)

      - name: Validate demo and example manifests against the CRD schemas
        # Decodes every example and demo manifest strictly into the Go API
        # types and validates it against the generated CRD OpenAPI schemas
        # (pruning, enums, patterns, label values), and checks that every
        # git path the examples promote into exists in pnz1990/kardinal-demo.
        # The same test runs in "go test" above; this step shows its output.
        run: go test ./test/examples/... -count=1 -v

  # ── Integration tests: reconcilers via fake client (no cluster needed) ────────
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests
        run: go test ./test/integration/... -tags integration -race -count=1 -timeout 120s

  # ── golangci-lint ────────────────────────────────────────────────────────────
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  # ── Security scan ────────────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Scan with the toolchain pinned in go.mod so stdlib fixes stay in sync.
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ── go.sum integrity ─────────────────────────────────────────────────────────
  go-sum-integrity:
    name: go.sum integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.sum
        run: go mod verify

  # ── Trivy filesystem vulnerability scan ──────────────────────────────────────
  # Scans Go module dependencies for HIGH/CRITICAL CVEs and blocks CI on findings.
  # Uses filesystem scan (no Docker image build required) — complements the
  # release.yml image scan and govulncheck for defense-in-depth.
  # Design ref: docs/design/14-v060-roadmap.md §14.7
  trivy-fs:
    name: trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Scan filesystem for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

  # ── Journey tests (fake-client, no cluster required) ────────────────────────
  e2e-stubs:
    name: e2e stubs compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the CLI for TestJourney5
        run: make build-cli
      - name: Run journey tests (fake client, no cluster)
        # TestJourney*: real reconcilers against a fake Kubernetes client; they
        # do not go through the translator or the kro Graph.
        # TestJourney5 runs bin/kardinal, built above.
        # TestPromotionLoop_*: promotion loop unit tests.
        # Tests that need a kind cluster are behind the e2e build tag and run
        # in e2e.yml.
        run: go test ./test/e2e/... -race -count=1 -timeout 120s -v

  # ── create-bundle composite action tests ──────────────────────────────────
  action-tests:
    name: action-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test the create-bundle action
        run: bash .github/actions/create-bundle/test.sh

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: web
      - name: Type check
        run: bun run typecheck
        working-directory: web
      - name: Build
        run: bun run build
        working-directory: web
      - name: Unit tests
        run: bun run test
        working-directory: web
      - name: E2E tests (Playwright)
        # Playwright E2E tests now pass reliably (#632). Removing continue-on-error
        # so failures block CI and provide a real regression signal.
        run: |
          bunx playwright install chromium --with-deps
          bun run test:e2e
        working-directory: web
        env:
          CI: "true"

  # ── Helm chart lint (only when chart directory exists) ───────────────────────
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check if chart exists
        id: chart_check
        run: |
          echo "has_chart=$(test -d chart/kardinal-promoter && echo true || echo false)" >> $GITHUB_OUTPUT
      - name: Install Helm
        if: steps.chart_check.outputs.has_chart == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - name: Lint chart
        if: steps.chart_check.outputs.has_chart == 'true'
        run: helm lint chart/kardinal-promoter
      - name: Template chart
        if: steps.chart_check.outputs.has_chart == 'true'
        run: helm template kardinal-promoter chart/kardinal-promoter
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.chart_check.outputs.has_chart == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Chart render tests
        if: steps.chart_check.outputs.has_chart == 'true'
        env:
          KARDINAL_REQUIRE_HELM: "1"
        run: go test ./test/helm/... -count=1
