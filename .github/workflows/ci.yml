name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Use module mode: vendor/ is not committed (only modules.txt was tracked
  # historically). GOFLAGS=-mod=mod ensures all go tools resolve deps from
  # the module cache rather than a partial vendor directory.
  GOFLAGS: -mod=mod

permissions:
  contents: read

# Concurrency: a new push to a pull request cancels the PR's run in progress.
# Runs on main are never cancelled (#1836): each push to main gets its own
# group (its run id), so a merge does not cancel, or queue behind, the run of
# the merge before it, and every main commit gets a result: a release tags
# the last commit whose main run finished green, and the red-main workflow
# names the merge that broke main.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Docs and YAML lint (always runs) ─────────────────────────────────────────
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate YAML files
        run: |
          pip install pyyaml==6.0.3 --quiet
          python3 - <<'PYEOF'
          import pathlib, sys
          import yaml
          # Skip on whole path components, so ".git" does not also skip ".github".
          skip_dirs = {'.git', 'node_modules', 'vendor', 'templates'}
          errors, checked = [], 0
          for pattern in ('*.yml', '*.yaml'):
              for f in pathlib.Path('.').rglob(pattern):
                  if skip_dirs & set(f.parts) or f.name == 'mkdocs.yml':
                      continue
                  checked += 1
                  try:
                      list(yaml.safe_load_all(f.read_text()))
                  except yaml.YAMLError as e:
                      errors.append(f'{f}: {e}')
          for e in errors:
              print(e)
          if errors:
              sys.exit(1)
          print(f'All {checked} YAML files valid')
          PYEOF
      - name: Validate workflow run blocks (bash -n)
        run: bash scripts/validate-workflow-bash-syntax.sh
      - name: Check required docs exist
        run: |
          required=(
            "docs/aide/vision.md"
            "docs/aide/definition-of-done.md"
            "AGENTS.md"
          )
          missing=()
          for f in "${required[@]}"; do
            [ -f "$f" ] || missing+=("$f")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required files:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All required docs present"

  # ── Go build + test ──────────────────────────────────────────────────────────
  # The required check "build" is the last job: it passes when the build
  # checks and every go test shard pass. The shards split the packages by
  # hack/ci/test-durations.txt (hack/citool shard), so they finish together;
  # ci-health.yml keeps the durations current.
  checks:
    name: build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: Install Helm
        # test/examples and test/helm render charts with helm template.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || \
            (echo "go.mod/go.sum not tidy — run 'go mod tidy'" && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test (no race)
        # The race tests run in the test shards. These run without -race too:
        # sharedbranch runs 30 writers under -race (#1648) and all sixty here,
        # and asserts some lose a reconcile and retry it; pkg/scm's slow-push
        # test is !race (git_transport_norace_test.go).
        run: go test ./pkg/steps/steps/sharedbranch/ ./pkg/scm/ -count=1 -timeout 120s
      - name: go build
        run: go build ./...
      - name: Check Apache 2.0 headers
        run: bash hack/check-license-headers.sh '*.go' ':!:vendor/**'
      - name: Check banned filenames
        run: |
          banned=$(find . \( -name util.go -o -name helpers.go -o -name common.go \) \
            -not -path './vendor/*' -not -path './.git/*' -not -path '*/node_modules/*')
          if [ -n "$banned" ]; then
            echo "Banned filenames:"
            echo "$banned"
            exit 1
          fi
      - name: Verify CRD schemas are up to date
        run: |
          # Install controller-gen at the pinned version used by Makefile.
          CONTROLLER_GEN_VERSION=$(grep 'CONTROLLER_GEN_VERSION\s*?=' Makefile | awk '{print $NF}')
          go install "sigs.k8s.io/controller-tools/cmd/controller-gen@${CONTROLLER_GEN_VERSION}"
          controller-gen crd:allowDangerousTypes=true paths="./api/..." \
            output:crd:artifacts:config=config/crd/bases
          controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."
          git diff --exit-code config/crd/bases/ api/v1alpha1/zz_generated.deepcopy.go || \
            (echo "CRD schemas are stale — run 'make manifests generate' and commit" && exit 1)
          diff -r --exclude=.gitkeep config/crd/bases/ chart/kardinal-promoter/crds/ || \
            (echo "chart/kardinal-promoter/crds is stale — run 'make manifests' and commit" && exit 1)

      - name: Validate demo and example manifests against the CRD schemas
        # Decodes every example and demo manifest strictly into the Go API
        # types and validates it against the generated CRD OpenAPI schemas
        # (pruning, enums, patterns, label values), and checks that every
        # git path the examples promote into exists in pnz1990/kardinal-demo.
        # The same test runs in a test shard; this step shows its output.
        run: go test ./test/examples/... -count=1 -v

  test:
    name: go test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with SHARDS below (test/hack TestCITestShards).
        shard: [1, 2, 3, 4]
    env:
      SHARDS: "4"
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go race cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Install Helm
        # test/examples and test/helm render charts with helm template.
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - name: go test -race (this shard's packages)
        run: |
          go list ./... | go run ./hack/citool shard "$SHARD/$SHARDS" hack/ci/test-durations.txt > "$RUNNER_TEMP/packages"
          mapfile -t packages < "$RUNNER_TEMP/packages"
          echo "shard $SHARD/$SHARDS: ${#packages[@]} packages"
          go test -race -count=1 -timeout 120s "${packages[@]}"

  build:
    name: build
    needs: [checks, test]
    # Runs when a needed job failed too (and fails), not when the run was
    # cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the build checks and every test shard to pass
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "build checks: $CHECKS, go test shards: $TESTS"
          if [ "$CHECKS" != success ] || [ "$TESTS" != success ]; then
            echo "::error::build checks ($CHECKS) and every go test shard ($TESTS) must pass"
            exit 1
          fi

  # ── Go build cache: warmed on main, restored by every Go job ─────────────────
  # One cache with the race build of every test binary (the test shards,
  # integration, e2e stubs) and one with the plain build, vet and test build
  # (build checks, golangci-lint, helm lint). Only main saves them, a fresh one
  # a day or per go.sum, built from empty so they do not grow; pull requests
  # restore main's. Not needed by "build", so it never slows a run down.
  go-cache:
    name: go cache (${{ matrix.cache }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cache: [race, build]
    env:
      CACHE: ${{ matrix.cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache key
        id: key
        env:
          GO_SUM: ${{ hashFiles('go.sum') }}
        run: echo "key=go-$CACHE-$RUNNER_OS-$GO_SUM-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Look up today's cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - name: Compile everything the Go jobs compile
        if: steps.lookup.outputs.cache-hit != 'true'
        # -exec /bin/true links each test binary and does not run it.
        run: |
          if [ "$CACHE" = race ]; then
            go test -race -count=1 -exec /bin/true ./...
            go test -race -count=1 -exec /bin/true -tags integration ./test/integration/...
            go build ./...
          else
            go vet ./...
            go build ./...
            go test -count=1 -exec /bin/true ./...
            go install "sigs.k8s.io/controller-tools/cmd/controller-gen@$(grep 'CONTROLLER_GEN_VERSION\s*?=' Makefile | awk '{print $NF}')"
          fi
      - name: Save the cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.key.outputs.key }}

  # ── Integration tests: reconcilers via fake client (no cluster needed) ────────
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go race cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Run integration tests
        run: go test ./test/integration/... -tags integration -race -count=1 -timeout 120s

  # ── Fuzz targets: a short run of each on every PR (#1837) ───────────────────
  # The seed corpora (testdata/fuzz/) also run in "go test" above; this job
  # explores past them for 20s per target. A failure prints the input and
  # writes it under testdata/fuzz/<target>/: commit it with the fix.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: Fuzz
        run: |
          set -eo pipefail
          for target in ./pkg/graph:FuzzBuild ./pkg/reconciler/policygate:FuzzCELContext \
              ./pkg/steps/steps:FuzzYAMLUpdate ./pkg/steps/steps:FuzzKustomizeSetImage; do
            pkg=${target%%:*} name=${target##*:}
            echo "::group::$name"
            go test "$pkg" -run '^$' -fuzz "^${name}\$" -fuzztime 20s
            echo "::endgroup::"
          done

  # ── Enterprise scenario at full size ─────────────────────────────────────────
  # test/scenario/enterprise at its full size: 20 team namespaces, 200
  # Pipelines and 1,000 versions on one fake-client controller. go test ./...
  # in the build job runs it at a fifth of that (with -race); this job runs
  # the full size without -race, which would take it past ten minutes.
  scenario-enterprise:
    name: scenario enterprise (full size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: 200 Pipelines, 1,000 versions, 20 tenants
        env:
          KARDINAL_SCENARIO_ENTERPRISE: full
          KUBECONFIG: /dev/null
        run: go test ./test/scenario/enterprise/ -count=1 -timeout 15m -v -run 'TestEnterprise_'

  # ── golangci-lint ────────────────────────────────────────────────────────────
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11.4
          # The schema check downloads the JSON schema from golangci-lint.run;
          # its timeouts were 9 of the week's flaky CI jobs (#1836). The run
          # itself still rejects an invalid config.
          verify: false

  # ── Dead code and dead files (make hygiene) ──────────────────────────────────
  # Go functions no main or test reaches, docs pages and assets nothing links,
  # scripts nothing calls; exceptions in hack/hygiene/allow.txt. The web half
  # (knip) runs in the frontend job, which has node_modules.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: No dead code or dead files
        run: make hygiene-go

  # ── Security scan ────────────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Scan with the toolchain pinned in go.mod so stdlib fixes stay in sync.
          go-version-file: go.mod
          # setup-go's own cache is one key for every job (#1836); off.
          cache: false
      - name: Run govulncheck
        # make vuln installs govulncheck at the Makefile's GOVULNCHECK_VERSION.
        run: make vuln

  # ── go.sum integrity ─────────────────────────────────────────────────────────
  go-sum-integrity:
    name: go.sum integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify go.sum
        run: go mod verify

  # ── Trivy filesystem vulnerability scan ──────────────────────────────────────
  # Scans Go module dependencies for HIGH/CRITICAL CVEs and blocks CI on findings.
  # Uses filesystem scan (no Docker image build required) — complements the
  # release.yml image scan and govulncheck for defense-in-depth.
  trivy-fs:
    name: trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Scan filesystem for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table

  # ── Journey tests (fake-client, no cluster required) ────────────────────────
  e2e-stubs:
    name: e2e stubs compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go race cache
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-
      - name: Build the CLI for TestJourney5
        run: make build-cli
      - name: Run journey tests (fake client, no cluster)
        # TestJourney*: real reconcilers against a fake Kubernetes client; they
        # do not go through the translator or the kro Graph.
        # TestJourney5 runs bin/kardinal, built above.
        # TestPromotionLoop_*: promotion loop unit tests.
        # The live tests (test/e2e/live) are behind the e2e build tag and run
        # with make e2e-all (hack/e2e/all.sh) and in e2e-live.yml.
        run: go test ./test/e2e/... -race -count=1 -timeout 120s -v
      # Every tracked shell script, most of them the live e2e harness
      # (hack/e2e), which pull requests don't run. Version and sum:
      # hack/tool-versions.env.
      - name: shellcheck
        run: |
          source hack/tool-versions.env
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | sha256sum -c -
          tar -xJf "shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          git ls-files -z '*.sh' | xargs -0 ./shellcheck -x -P SCRIPTDIR

  # ── create-bundle composite action tests ──────────────────────────────────
  action-tests:
    name: action-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test the create-bundle action
        run: bash .github/actions/create-bundle/test.sh

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check Apache 2.0 headers (web sources)
        run: >-
          bash hack/check-license-headers.sh
          ':(glob)web/src/**/*.ts' ':(glob)web/src/**/*.tsx' ':(glob)web/src/**/*.mjs'
          ':(glob)web/test/**/*.ts' ':(glob)web/test/**/*.tsx' ':(glob)web/test/**/*.mjs'
          ':(glob)web/*.ts' ':(glob)web/scripts/*.mjs' 'scripts/gen-tokens.mjs'
          ':(glob)hack/record-demos/*.mjs' ':(glob)docs/javascripts/*.js'
      # npm and web/package-lock.json are the only package manager and lockfile:
      # the Dockerfile, `make ui` and dependabot use them too. Node matches the
      # Dockerfile's node image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Design tokens are generated from tokens.json
        run: npm run tokens:check
        working-directory: web
      - name: Type check
        # tsc -b checks src (tsconfig.app.json) and the Vite/Playwright configs
        # (tsconfig.node.json).
        run: npm run typecheck
        working-directory: web
      - name: No unused files, exports or dependencies (knip)
        run: npm run knip
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - name: Bundle size budget
        run: npm run size
        working-directory: web
      - name: Check web/dist is up to date
        # go:embed ships the committed web/dist, so it must match a fresh build.
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "web/dist differs from a fresh build. Run 'make ui' and commit web/dist:"
            git status --short -- web/dist
            exit 1
          fi
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: E2E tests (Playwright)
        # Playwright E2E tests now pass reliably (#632). Removing continue-on-error
        # so failures block CI and provide a real regression signal.
        run: |
          npx playwright install chromium --with-deps
          npm run test:e2e
        working-directory: web
        env:
          CI: "true"

  # ── Helm chart lint (only when chart directory exists) ───────────────────────
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check if chart exists
        id: chart_check
        run: |
          echo "has_chart=$(test -d chart/kardinal-promoter && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install Helm
        if: steps.chart_check.outputs.has_chart == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.22.0
      - name: Lint chart
        if: steps.chart_check.outputs.has_chart == 'true'
        run: helm lint chart/kardinal-promoter
      - name: Template chart
        if: steps.chart_check.outputs.has_chart == 'true'
        run: helm template kardinal-promoter chart/kardinal-promoter
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        if: steps.chart_check.outputs.has_chart == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore the Go build cache
        if: steps.chart_check.outputs.has_chart == 'true'
        # Saved by the go-cache job on main; see there.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-
      - name: Chart render tests
        if: steps.chart_check.outputs.has_chart == 'true'
        env:
          KARDINAL_REQUIRE_HELM: "1"
        run: go test ./test/helm/... -count=1
