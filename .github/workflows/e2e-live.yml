name: E2E live

# The live e2e suites (test/e2e/README.md). Each job in hack/e2e/matrix.txt
# gets its own kind cluster with a real git server and GitOps engine and the
# controller built from this commit; nothing is faked. The core suite runs on
# the three Kubernetes minors in hack/tool-versions.env, split across three
# jobs per minor (hack/e2e/run.sh SHARD), so each fits the 60-minute job
# limit on a runner (#1680); the upgrade suites on the oldest supported minor
# and the newest.
#
# Pull requests and pushes to main don't run it: twelve jobs of 10 to 45
# minutes on every push filled the runners and held up every PR's required
# checks. Before a merge, run the suites locally (make e2e-all,
# hack/e2e/all.sh, the same jobs). This workflow runs nightly on main, every
# suite once, so a regression in a suite that pull requests don't run is
# found the next morning (#1594-#1601 sat on main for days); weekly, repeating
# every test three times to find flakes (the upgrade test once: it upgrades
# its cluster); and on a manual dispatch (gh workflow run e2e-live.yml --ref
# <branch>). Only the github job gets a secret, DEMO_GITHUB_TOKEN, in its
# setup step.
#
# The "e2e live" job passes when every job passed and the coverage proof
# holds. Branch protection does not require it. After a scheduled run the
# "report" job writes a per-job summary and, when a job failed, opens an
# issue (or comments on the one already open); a passing run closes it.
# Each scheduled run adds the night's sample (hack/e2e/sample.sh); a failed
# sample job gets an issue of its own, which only that job passing again
# closes (hack/e2e/live-report.sh).
on:
  schedule:
    # Weekly: COUNT=3 (flakes). Nightly: COUNT=1 (regressions), every other day.
    - cron: '0 4 * * 1'
    - cron: '0 3 * * 0,2-6'
  workflow_dispatch:
    inputs:
      count:
        description: 'go test -count for every suite'
        required: true
        default: '1'
      suites:
        description: 'only these suites, space-separated (hack/e2e/all.sh SUITES); empty runs every suite'
        required: false
        default: ''
      minors:
        description: 'run every suite on these Kubernetes minors instead of matrix.txt''s, space-separated, a pinned suite on its own of them only (hack/e2e/all.sh MINORS; the release gate passes the floor and the newest)'
        required: false
        default: ''
      sample:
        description: 'a date (YYYY-MM-DD) or today: add that night''s sample jobs (hack/e2e/sample.sh); scheduled runs add today''s'
        required: false
        default: ''
      wave_envs:
        description: 'environments of the core suite TestHealth_ArgoCDWaveOnSharedBranch (argocd health, one shared branch); 150 is the #1575 acceptance case'
        required: false
        default: '30'

permissions:
  contents: read

# One scheduled run at a time: a nightly run that outlives its night is not
# overlapped by the next one. A dispatched run is one per branch: a newer
# dispatch on the same branch replaces the older one, so one branch never holds
# several matrices of runners.
concurrency:
  group: e2e-live-${{ github.event_name == 'schedule' && 'schedule' || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && github.ref_name != 'main' }}

# bash (not the default `bash -e`) so every step runs with -eo pipefail.
defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  KARDINAL_E2E_IMAGE: ghcr.io/pnz1990/kardinal-promoter/controller:e2e
  KARDINAL_E2E_RENDER_IMAGE: ghcr.io/pnz1990/kardinal-promoter/render:e2e

jobs:
  image:
    name: controller image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      sample: ${{ steps.matrix.outputs.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: List the jobs (hack/e2e/matrix.txt)
        id: matrix
        env:
          SUITES: ${{ inputs.suites }}
          MINORS: ${{ inputs.minors }}
          # Every scheduled run adds the night's sample (hack/e2e/sample.sh):
          # one suite on a minor matrix.txt does not run it on, and a ninth of
          # the core suite with each test three times.
          SAMPLE: ${{ github.event_name == 'schedule' && 'today' || inputs.sample }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          # A branch dispatch names its suites: the whole matrix runs on the
          # schedule, on main and in the release gate, not per branch.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != main ] && [ -z "$SUITES" ]; then
            echo "::error::a dispatch on a branch must name its suites (-f suites=\"core fleet\"); the whole matrix runs on main"
            exit 1
          fi
          # The date, resolved once: the report job names it in its issues.
          [ "$SAMPLE" != today ] || SAMPLE=$(date -u +%Y-%m-%d)
          echo "sample=$SAMPLE" >> "$GITHUB_OUTPUT"
          export SAMPLE
          m=$(bash hack/e2e/all.sh -matrix)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
      - name: Build the controller image from this commit
        run: |
          docker build -t "$KARDINAL_E2E_IMAGE" .
          docker build -t "$KARDINAL_E2E_RENDER_IMAGE" -f render.Dockerfile .
          docker save "$KARDINAL_E2E_IMAGE" "$KARDINAL_E2E_RENDER_IMAGE" | gzip > controller-image.tar.gz
      # The IDs of the images every suite job runs: the release gate's report
      # records them (hack/release-gate).
      - name: Record the image IDs
        run: |
          for i in "$KARDINAL_E2E_IMAGE" "$KARDINAL_E2E_RENDER_IMAGE"; do
            echo "$i $(docker image inspect -f '{{.Id}}' "$i")"
          done | tee images.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-images
          path: images.txt
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: controller-image
          path: controller-image.tar.gz
          retention-days: 1

  suite:
    # A sample job's name starts with its id (sample-...): the report job
    # keys its issue by it (hack/e2e/live-report.sh).
    name: "${{ startsWith(matrix.id, 'sample-') && format('{0}: ', matrix.id) || '' }}${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }} on Kubernetes ${{ matrix.k8s }}${{ matrix.count && format(' (COUNT={0})', matrix.count) || '' }}"
    needs: image
    runs-on: ubuntu-latest
    # The weekly run, and the sample's core slice (matrix.count), repeat
    # every test three times. The scale suite runs once (its ci profile
    # takes about an hour).
    timeout-minutes: ${{ matrix.suite == 'scale' && 120 || (matrix.count || github.event.schedule == '0 4 * * 1' || (inputs.count && inputs.count != '1')) && 180 || 60 }}
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once: a dispatched run on a branch takes at
      # most 4, so pull-request and main CI keep runners. A release branch's
      # dispatch is the release gate (hack/release-gate -live ci, about 38
      # jobs): it takes 16, as main does, while other live runs are frozen.
      max-parallel: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')) && 4 || 16 }}
      matrix: ${{ fromJSON(needs.image.outputs.matrix) }}
    env:
      SUITE: ${{ matrix.suite }}
      KIND_K8S: ${{ matrix.k8s }}
      KARDINAL_E2E_BUILD: none
      # hack/e2e/run.sh refuses COUNT above 1 for the upgrade suites; the
      # scale suite runs once too (hack/e2e/all.sh does the same).
      # A sample job's count (hack/e2e/sample.sh) wins over the run's.
      COUNT: ${{ (startsWith(matrix.suite, 'upgrade') || matrix.suite == 'scale') && '1' || matrix.count || github.event.schedule == '0 4 * * 1' && '3' || inputs.count || '1' }}
      SHARD: ${{ matrix.shard }}
      # The scheduled runs take the scale suite's nightly profile: ci with
      # TestScale_TenantFairnessManyRepos' backlog deep enough to judge the
      # fair queue (test/e2e/framework/scale, #2257); PRs and dispatches keep
      # ci, about 2 minutes shorter.
      KARDINAL_E2E_SCALE_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      # Opt-in: gh workflow run e2e-live.yml -f suites=core -f wave_envs=150
      KARDINAL_E2E_WAVE_ENVS: ${{ inputs.wave_envs || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The kind, kubectl and helm of hack/tool-versions.env, sha256-checked,
      # in bin/e2e, as local runs install them (hack/e2e/tools.sh). Every
      # suite installs the chart with helm, and the chart suite tests what
      # helm reports; the runner image's helm floats.
      #
      # One kubectl for every job. KUBECTL_VERSION is within kubectl's one
      # minor of skew of every minor the jobs run on (test/hack pins it to
      # the middle one).
      - name: Install kind, kubectl and helm
        run: |
          bash hack/e2e/tools.sh
          echo "$PWD/bin/e2e" >>"$GITHUB_PATH"
          bin/e2e/kind version && bin/e2e/kubectl version --client && bin/e2e/helm version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: controller-image
      - name: Load the controller image
        run: gunzip -c controller-image.tar.gz | docker load

      # TestCLI_Completion checks the zsh completion script with zsh -n.
      # apt can hang on a slow mirror (core 1.35 jobs of #1396 sat here for
      # the job's whole hour), so each call gets a timeout and three tries.
      - name: Install zsh
        if: matrix.suite == 'core'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq --no-install-recommends zsh; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          command -v zsh

      # The ui suite's browser tests run Playwright from web/ (components/ui.sh).
      - if: matrix.suite == 'ui'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright's Chromium
        if: matrix.suite == 'ui'
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # Only the github job's setup step sees the token; up.sh keeps it for
      # the test runner in the env file, which is never uploaded.
      - name: Set up the suite's kind cluster
        env:
          DEMO_GITHUB_TOKEN: ${{ matrix.suite == 'github' && secrets.DEMO_GITHUB_TOKEN || '' }}
        run: |
          if [ "$SUITE" = github ] && [ -z "$DEMO_GITHUB_TOKEN" ]; then
            echo "::error::the github suite needs the DEMO_GITHUB_TOKEN secret"
            exit 1
          fi
          make e2e-up SUITE="$SUITE" KIND_K8S="$KIND_K8S"

      # hack/e2e/run.sh fails when a test fails or skips, or when none ran,
      # and writes the per-test results to the job summary.
      - name: Run the suite
        run: make test-e2e-live SUITE="$SUITE" COUNT="$COUNT" SHARD="$SHARD"

      # Diagnostics (kardinal objects, events, pod and controller logs of
      # each failed test), the go test -json stream and the results summary
      # the "e2e live" job proves coverage from. Not the env file or the
      # generated credentials next to them. The name ends in the run attempt:
      # a re-run job can't replace its earlier attempt's artifact, so the
      # "e2e live" job keeps each job's latest attempt.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-live-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: |
            test/e2e/results/*/diagnostics/
            test/e2e/results/*/test.json
            test/e2e/results/*/summary.json
          if-no-files-found: ignore

      - name: Delete the kind cluster
        if: always()
        run: make e2e-down SUITE="$SUITE"

  e2e-live:
    name: e2e live
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    # proof asks the GitHub API whether each known bug's issue is open.
    permissions:
      contents: read
      issues: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: e2e-live-*
          path: results

      # Every test/e2e/coverage.tsv row a live test claims must have passed
      # in the suites that ran. The job summary lists every row's result.
      # A job that was re-run has one results/<job>-attempt-<n> directory per
      # attempt; only its latest counts.
      - name: Prove the coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          declare -A latest
          while read -r d; do latest[${d%-attempt-*}]=$d; done < \
            <(find results -mindepth 1 -maxdepth 1 -type d -name '*-attempt-*' | sort -V)
          if [ "${#latest[@]}" -gt 0 ]; then
            mapfile -t files < <(find "${latest[@]}" -name summary.json | sort)
          else
            # download-artifact puts a single matching artifact (a dispatch
            # of one suite) straight into results/, with no directory of its own.
            mapfile -t files < <(find results -name summary.json | sort)
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no suite uploaded results"; exit 1; }
          GITHUB_TOKEN="$GH_TOKEN" go run ./test/e2e/proof -out coverage-proof.json "${files[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-proof
          path: coverage-proof.json
          if-no-files-found: ignore

      - name: Require every job to pass
        if: always()
        env:
          RESULT: ${{ needs.suite.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::a live e2e job did not pass (result: $RESULT); see the suite jobs"
            exit 1
          fi

  # After a scheduled run: a summary of every job, and an issue when one
  # failed. It uses only the workflow's own token (issues: write); no other
  # secret.
  report:
    name: report
    needs: [image, suite, e2e-live]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The COUNT of the matrix.txt jobs; a sample job's own COUNT is in its
      # name, and its failures go to an issue of its own.
      KIND: ${{ github.event.schedule == '0 4 * * 1' && 'weekly (COUNT=3)' || 'nightly (COUNT=1)' }}
      SAMPLE: ${{ needs.image.outputs.sample }}
      SHA: ${{ github.sha }}
      E2E_LIVE: ${{ needs.e2e-live.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Summarize the jobs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "report") | [.name, (.conclusion // .status)] | @tsv' > jobs.tsv
          {
            echo "## e2e live, $KIND + the sample of $SAMPLE (its core slice COUNT=3), ${GITHUB_SHA::8}"
            echo
            echo "| job | result |"
            echo "|---|---|"
            awk -F'\t' '{print "| " $1 " | " $2 " |"}' jobs.tsv
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      # One issue for the matrix.txt jobs, and one per sample job, closed
      # only when that job passes again (hack/e2e/live-report.sh).
      - name: Open, update or close the failure issues
        run: bash hack/e2e/live-report.sh jobs.tsv
