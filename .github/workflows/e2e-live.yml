name: E2E live

# The live e2e suites (test/e2e/README.md). Each suite gets its own kind
# cluster with a real git server and GitOps engine and the controller built
# from this commit; nothing is faked. Every suite but github needs no
# secret, so pull requests from forks run them too. The core suite runs on
# the three Kubernetes minors in hack/tool-versions.env, split across two
# jobs per minor (hack/e2e/run.sh SHARD); the upgrade suite on Kubernetes
# 1.29 (UPG-OLDK8S-01) and the newest minor. The github suite works on
# github.com with the DEMO_GITHUB_TOKEN secret, so it runs only on pushes to
# main, the weekly run and manual dispatches, never on a pull request. The
# weekly run repeats every test three times to find flakes, except the
# upgrade test, which upgrades its cluster and so runs once.
#
# Branch protection requires only the "e2e live" job, which passes when
# every suite that ran passed; the matrix can change without touching it.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'go test -count for every suite'
        required: true
        default: '1'

permissions:
  contents: read

# bash (not the default `bash -e`) so every step runs with -eo pipefail.
defaults:
  run:
    shell: bash

concurrency:
  group: e2e-live-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  KARDINAL_E2E_IMAGE: ghcr.io/pnz1990/kardinal-promoter/controller:e2e

jobs:
  image:
    name: controller image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the controller image from this commit
        run: |
          docker build -t "$KARDINAL_E2E_IMAGE" .
          docker save "$KARDINAL_E2E_IMAGE" | gzip > controller-image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: controller-image
          path: controller-image.tar.gz
          retention-days: 1

  suite:
    name: ${{ matrix.suite }}${{ matrix.shard && format(' {0}/{1}', matrix.shard, matrix.of) || '' }} on Kubernetes ${{ matrix.k8s }}
    needs: image
    runs-on: ubuntu-latest
    # The weekly run repeats every test three times.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: core, k8s: '1.35', shard: 1, of: 2}
          - {suite: core, k8s: '1.35', shard: 2, of: 2}
          - {suite: core, k8s: '1.36', shard: 1, of: 2}
          - {suite: core, k8s: '1.36', shard: 2, of: 2}
          - {suite: core, k8s: '1.37', shard: 1, of: 2}
          - {suite: core, k8s: '1.37', shard: 2, of: 2}
          - {suite: gitea, k8s: '1.37'}
          - {suite: gitlab, k8s: '1.37'}
          - {suite: delivery, k8s: '1.37'}
          - {suite: ui, k8s: '1.37'}
          - {suite: flux, k8s: '1.37'}
          # Expected job times: chart ~20 min, multi-cluster ~15, upgrade ~10
          # (locally up + tests took 12, 9.5 and 6.5 min).
          - {suite: chart, k8s: '1.37'}
          # The spoke boots test/e2e/kind-config.yaml's node image; the hub
          # runs the same minor.
          - {suite: multi-cluster, k8s: '1.36'}
          # KIND_NODE_UPGRADE_1_29 in hack/tool-versions.env.
          - {suite: upgrade, k8s: '1.29'}
          - {suite: upgrade, k8s: '1.37'}
    env:
      SUITE: ${{ matrix.suite }}
      KIND_K8S: ${{ matrix.k8s }}
      KARDINAL_E2E_BUILD: none
      # hack/e2e/run.sh refuses COUNT above 1 for the upgrade suite.
      COUNT: ${{ matrix.suite == 'upgrade' && '1' || github.event_name == 'schedule' && '3' || inputs.count || '1' }}
      SHARD: ${{ matrix.shard && format('{0}/{1}', matrix.shard, matrix.of) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Versions and sha256 sums: hack/tool-versions.env.
      - name: Install kind
        run: |
          source hack/tool-versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/

      - name: Install kubectl
        run: |
          source hack/tool-versions.env
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # Every suite installs the chart with helm, and the chart suite tests
      # what helm reports; the runner image's helm floats.
      - name: Install helm
        run: |
          source hack/tool-versions.env
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz" --strip-components=1 linux-amd64/helm
          rm "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          sudo mv helm /usr/local/bin/ && helm version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: controller-image
      - name: Load the controller image
        run: gunzip -c controller-image.tar.gz | docker load

      # TestCLI_Completion checks the zsh completion script with zsh -n.
      # apt can hang on a slow mirror (core 1.35 jobs of #1396 sat here for
      # the job's whole hour), so each call gets a timeout and three tries.
      - name: Install zsh
        if: matrix.suite == 'core'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq --no-install-recommends zsh; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          command -v zsh

      # The ui suite's browser tests run Playwright from web/ (components/ui.sh).
      - if: matrix.suite == 'ui'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright's Chromium
        if: matrix.suite == 'ui'
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      - name: Set up the suite's kind cluster
        run: make e2e-up SUITE="$SUITE" KIND_K8S="$KIND_K8S"

      # hack/e2e/run.sh fails when a test fails or skips, or when none ran,
      # and writes the per-test results to the job summary.
      - name: Run the suite
        run: make test-e2e-live SUITE="$SUITE" COUNT="$COUNT" SHARD="$SHARD"

      # Diagnostics (kardinal objects, events, pod and controller logs of
      # each failed test), the go test -json stream and the results summary
      # the "e2e live" job proves coverage from. Not the env file or the
      # generated credentials next to them. The name ends in the run attempt:
      # a re-run job can't replace its earlier attempt's artifact, so the
      # "e2e live" job keeps each job's latest attempt.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-live-${{ matrix.suite }}-k8s-${{ matrix.k8s }}${{ matrix.shard && format('-{0}of{1}', matrix.shard, matrix.of) || '' }}-attempt-${{ github.run_attempt }}
          path: |
            test/e2e/results/*/diagnostics/
            test/e2e/results/*/test.json
            test/e2e/results/*/summary.json
          if-no-files-found: ignore

      - name: Delete the kind cluster
        if: always()
        run: make e2e-down SUITE="$SUITE"

  # The github suite: branches and PRs of pnz1990/kardinal-demo
  # (hack/e2e/components/github.sh), with a token that may push to it. A pull
  # request never gets the secret, so it never runs this job.
  github:
    name: github on Kubernetes 1.37
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 60 }}
    env:
      SUITE: github
      KIND_K8S: '1.37'
      KARDINAL_E2E_BUILD: none
      COUNT: ${{ github.event_name == 'schedule' && '3' || inputs.count || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          source hack/tool-versions.env
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/

      - name: Install kubectl
        run: |
          source hack/tool-versions.env
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: controller-image
      - name: Load the controller image
        run: gunzip -c controller-image.tar.gz | docker load

      # Only this step sees the token; up.sh keeps it for the test runner
      # in the env file, which is never uploaded.
      - name: Set up the suite's kind cluster
        env:
          DEMO_GITHUB_TOKEN: ${{ secrets.DEMO_GITHUB_TOKEN }}
        run: |
          if [ -z "$DEMO_GITHUB_TOKEN" ]; then
            echo "::error::the github suite needs the DEMO_GITHUB_TOKEN secret"
            exit 1
          fi
          make e2e-up SUITE="$SUITE" KIND_K8S="$KIND_K8S"

      - name: Run the suite
        run: make test-e2e-live SUITE="$SUITE" COUNT="$COUNT"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-live-github-k8s-1.37-attempt-${{ github.run_attempt }}
          path: |
            test/e2e/results/*/diagnostics/
            test/e2e/results/*/test.json
            test/e2e/results/*/summary.json
          if-no-files-found: ignore

      - name: Delete the kind cluster
        if: always()
        run: make e2e-down SUITE="$SUITE"

  e2e-live:
    name: e2e live
    needs: [suite, github]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: e2e-live-*
          path: results

      # Every test/e2e/coverage.tsv row a live test claims must have passed
      # in the suites that ran. The job summary lists every row's result.
      # A job that was re-run has one results/<job>-attempt-<n> directory per
      # attempt; only its latest counts.
      - name: Prove the coverage
        run: |
          declare -A latest
          while read -r d; do latest[${d%-attempt-*}]=$d; done < \
            <(find results -mindepth 1 -maxdepth 1 -type d -name '*-attempt-*' | sort -V)
          [ "${#latest[@]}" -gt 0 ] || { echo "::error::no suite uploaded results"; exit 1; }
          mapfile -t files < <(find "${latest[@]}" -name summary.json | sort)
          go run ./test/e2e/proof -out coverage-proof.json "${files[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-proof
          path: coverage-proof.json
          if-no-files-found: ignore

      # The github job is skipped on pull requests, and must pass otherwise.
      - name: Require every suite to pass
        if: always()
        env:
          RESULT: ${{ needs.suite.result }}
          GITHUB_RESULT: ${{ needs.github.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::a live e2e suite did not pass (result: $RESULT); see the suite jobs"
            exit 1
          fi
          if [ "$GITHUB_RESULT" != success ] && ! { [ "$EVENT" = pull_request ] && [ "$GITHUB_RESULT" = skipped ]; }; then
            echo "::error::the github suite did not pass (result: $GITHUB_RESULT); see its job"
            exit 1
          fi
