name: Shared-branch soak

# TestSharedBranch_SixtyWritersThroughTheEngine lost one writer's change once
# on CI (#2143) and never in 130 local runs, git 2.50 and 2.55 alike. This
# runs it 200 times a night under load (four processes of 50 runs at once on
# the runner's cores, as CI's go test runs packages side by side), so the
# rare case shows up with its dump: on a missing file the test logs main's
# history and the commit that dropped it (dumpLostWrite). On a failure the
# logs are uploaded. It runs nightly on main and on a manual dispatch
# (gh workflow run shared-branch-soak.yml --ref <branch>). Branch protection
# does not require it.
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-branch-soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: Shared-branch writers x200 under load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the test binary
        run: |
          git --version
          go test -c -o "$RUNNER_TEMP/sharedbranch.test" ./pkg/steps/steps/sharedbranch/
      - name: Run 4 x 50 at once
        env:
          KUBECONFIG: /dev/null
        run: |
          mkdir -p soak-logs
          for shard in 1 2 3 4; do
            "$RUNNER_TEMP/sharedbranch.test" -test.run '^TestSharedBranch_SixtyWritersThroughTheEngine$' \
              -test.count=50 -test.timeout=55m > "soak-logs/shard-$shard.log" 2>&1 &
          done
          failed=0
          for job in $(jobs -p); do
            wait "$job" || failed=1
          done
          grep -h -- '--- FAIL\|lost write' soak-logs/*.log || true
          exit "$failed"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shared-branch-soak-logs
          path: soak-logs/
          retention-days: 30
