version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    # k8s.io modules and controller-runtime only build at matching versions, so a
    # bump of one without the others fails. Keep them in one PR.
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/google/cel-go"
    # kustomize >= 0.21.3 needs k8s.io v0.38 and Go 1.27, which have no
    # controller-runtime release yet (#1819).
    ignore:
      - dependency-name: "sigs.k8s.io/kustomize/*"
        versions: [">= 0.21.3"]
  # The embedded UI (web/package.json).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
  # The docs' UI recorder (hack/record-demos/package.json): Playwright and sharp.
  - package-ecosystem: npm
    directory: /hack/record-demos
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
    groups:
      record-demos:
        patterns:
          - "*"
  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
