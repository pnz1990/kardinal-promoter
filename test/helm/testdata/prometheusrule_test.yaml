# promtool unit tests of the chart's alerts in a Prometheus that scrapes other
# controller-runtime operators (#2037). Run by TestChartPrometheusRuleAlertsOnlyOnKardinal
# when promtool is on PATH; series without a cluster label, as in one cluster.
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # Errors: kardinal's promotionstep reconciler fails at 1/s. Crossplane, and
  # another instance of the same job name without kardinal's metrics, fail
  # faster; neither alerts.
  - interval: 1m
    input_series:
      - series: 'kardinal_pr_duration_seconds_count{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '0x20'
      - series: 'controller_runtime_reconcile_errors_total{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="promotionstep"}'
        values: '0+60x20'
      - series: 'controller_runtime_reconcile_errors_total{job="crossplane",instance="10.0.0.9:8080",namespace="crossplane-system",controller="managed/bucket"}'
        values: '0+120x20'
      - series: 'controller_runtime_reconcile_errors_total{job="kp",instance="10.0.0.2:8080",namespace="other",controller="bundle"}'
        values: '0+120x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KardinalHighReconcileErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kardinal-system
              controller: promotionstep
            exp_annotations:
              summary: "kardinal promotionstep reconciler error rate is elevated"
              description: "The promotionstep reconciler is failing at 1 errors/s. Promotions may be stuck or failing silently."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#promotion-is-stuck"
  # Another operator's "bundle" controller is stalled with a backlog (Rancher
  # Fleet has one); kardinal's is healthy: nothing alerts.
  - interval: 1m
    input_series:
      - series: 'kardinal_pr_duration_seconds_count{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '0x30'
      - series: 'controller_runtime_reconcile_total{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="bundle"}'
        values: '0+600x30'
      - series: 'workqueue_depth{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",name="bundle"}'
        values: '5x30'
      - series: 'controller_runtime_reconcile_total{job="fleet",instance="10.0.0.9:8080",namespace="cattle-fleet-system",controller="bundle"}'
        values: '100x30'
      - series: 'workqueue_depth{job="fleet",instance="10.0.0.9:8080",namespace="cattle-fleet-system",name="bundle"}'
        values: '500x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KardinalBundleReconcilerStalled
        exp_alerts: []
      - eval_time: 25m
        alertname: KardinalWorkQueueBacklog
        exp_alerts: []
  # kardinal's own bundle reconciler is stalled with a backlog: both alert.
  - interval: 1m
    input_series:
      - series: 'kardinal_pr_duration_seconds_count{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '0x30'
      - series: 'controller_runtime_reconcile_total{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="bundle"}'
        values: '100x30'
      - series: 'workqueue_depth{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",name="bundle"}'
        values: '150x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KardinalBundleReconcilerStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kardinal-system
            exp_annotations:
              summary: "kardinal BundleReconciler has not run in 10 minutes"
              description: "Bundles are queued but none were reconciled in the last 10 minutes. The controller may be stuck or leader election may be broken."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#bundle-not-promoting"
      - eval_time: 25m
        alertname: KardinalWorkQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: kp
              instance: "10.0.0.1:8080"
              namespace: kardinal-system
              name: bundle
            exp_annotations:
              summary: "kardinal bundle work queue depth > 100"
              description: "The bundle work queue has 150 items pending for more than 5 minutes. Controller may be overloaded."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#graph-controller-issues"
  # kardinal's PolicyGate reconciles take 30s on both replicas; another
  # operator's "policygate" controller is as slow: one alert, for kardinal's
  # installation, labelled with its namespace and controller.
  - interval: 1m
    input_series:
      - series: 'kardinal_pr_duration_seconds_count{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '0x20'
      - series: 'kardinal_pr_duration_seconds_count{job="kp",instance="10.0.0.3:8080",namespace="kardinal-system"}'
        values: '0x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="policygate",le="10"}'
        values: '0x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="policygate",le="60"}'
        values: '0+60x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system",controller="policygate",le="+Inf"}'
        values: '0+60x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.3:8080",namespace="kardinal-system",controller="policygate",le="10"}'
        values: '0x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.3:8080",namespace="kardinal-system",controller="policygate",le="60"}'
        values: '0+60x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="kp",instance="10.0.0.3:8080",namespace="kardinal-system",controller="policygate",le="+Inf"}'
        values: '0+60x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="other",instance="10.0.0.9:8080",namespace="other-system",controller="policygate",le="10"}'
        values: '0x20'
      - series: 'controller_runtime_reconcile_time_seconds_bucket{job="other",instance="10.0.0.9:8080",namespace="other-system",controller="policygate",le="+Inf"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: KardinalPolicyGateReconcileSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kardinal-system
              controller: policygate
            exp_annotations:
              summary: "kardinal PolicyGate reconcile P99 latency is above 10s"
              description: "PolicyGate reconciles are taking more than 10s at P99. Gates may be stale and blocking or unblocking promotions late."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#promotion-is-stuck"
  # The agent index at 85% of its bound on the leader (a replica exports 0):
  # NearFull, not Full. Then over it: Full.
  - interval: 1m
    input_series:
      - series: 'kardinal_agent_index_bytes{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '891289x20 1100000x10'
      - series: 'kardinal_agent_index_max_bytes{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '1048576x30'
      - series: 'kardinal_agent_index_bytes{job="kp",instance="10.0.0.2:8080",namespace="kardinal-system"}'
        values: '0x30'
      - series: 'kardinal_agent_index_max_bytes{job="kp",instance="10.0.0.2:8080",namespace="kardinal-system"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: KardinalAgentIndexNearFull
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: kardinal-system
            exp_annotations:
              summary: "the kardinal agent index is 85% full"
              description: "The agent index's entries take 85% of their size bound. Past it, kardinal refuses every write the actor policy checks (Bundles, Approvals, overrides) until AgentIdentities or subjects are removed."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/operate/#scale-and-limits"
      - eval_time: 18m
        alertname: KardinalAgentIndexFull
        exp_alerts: []
      - eval_time: 25m
        alertname: KardinalAgentIndexFull
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: kardinal-system
            exp_annotations:
              summary: "the kardinal agent index is over its size bound"
              description: "The agent index is not Ready (IndexFull): kardinal refuses every write the actor policy checks (Bundles, Approvals, overrides), people's included, until AgentIdentities or subjects are removed."
              runbook_url: "https://pnz1990.github.io/kardinal-promoter/operate/#scale-and-limits"
  # Below 80%: nothing.
  - interval: 1m
    input_series:
      - series: 'kardinal_agent_index_bytes{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '800000x30'
      - series: 'kardinal_agent_index_max_bytes{job="kp",instance="10.0.0.1:8080",namespace="kardinal-system"}'
        values: '1048576x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: KardinalAgentIndexNearFull
        exp_alerts: []
