# The kind cluster for the live e2e suites and the demo (every kind cluster
# the repo creates uses this file, so the node image is set only here).
#
# The node image must be Kubernetes 1.30 or newer: on 1.29 the API server's
# CEL cost estimate rejects kro's graphs.kro.run CRD ("estimated rule cost
# exceeds budget"). The image is the one built for the kind release the
# workflows install (KIND_VERSION in hack/tool-versions.env): KIND_NODE_1_36
# there. The live e2e matrix boots the other KIND_NODE_* images with this
# config and kind's --image flag. KUBECTL_VERSION there has the same minor.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kardinal-e2e
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
