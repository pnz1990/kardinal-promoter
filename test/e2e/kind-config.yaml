# The node image must be Kubernetes 1.30 or newer: on 1.29 the API server's
# CEL cost estimate rejects kro's graphs.kro.run CRD ("estimated rule cost
# exceeds budget"). The image is the one built for the kind release the
# workflows install (v0.29.0), pinned by digest as the kind release notes list it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kardinal-e2e
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1@sha256:050072256b9a903bd914c0b2866828150cb229cea0efe5892e2b644d5dd3b34f
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
