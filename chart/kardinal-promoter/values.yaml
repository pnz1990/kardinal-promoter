# Default values for kardinal-promoter.
# This is a YAML-formatted file.

# -- Number of controller replicas
replicaCount: 1

# -- Pod termination grace period in seconds.
# Keep it above shutdownDelaySeconds plus the controller's 30s shutdown timeout: on SIGTERM the
# controller gives in-flight HTTP requests up to 20s, then cancels in-flight reconciles, and exits
# within 30s. (#574)
terminationGracePeriodSeconds: 60

# -- Seconds a controller Pod being deleted keeps serving before it gets SIGTERM (a preStop
# sleep). Services stop sending it new connections meanwhile, so a rollout or a node drain does
# not refuse or drop UI, webhook and Bundle API requests. It counts against
# terminationGracePeriodSeconds. 0 sends SIGTERM at once.
shutdownDelaySeconds: 5

image:
  # -- Container image repository
  repository: ghcr.io/pnz1990/kardinal-promoter/controller
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion)
  tag: ""
  # -- Image digest (sha256:...); when set the image is repository@digest
  # and the tag is not used.
  digest: ""

# -- Image pull secrets for private registries. The render Jobs get them too
# (--render-image-pull-secrets); they must exist in the Pipeline namespaces.
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Annotations to add to the controller Pod
podAnnotations: {}

# -- Security context for the controller Pod
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Security context for the controller container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Controller log level: debug, info, warn or error. Sets both the
# reconciler logger (--log-level) and controller-runtime's logger
# (--zap-log-level; warn maps to error there, which has no warn level).
logLevel: info

# -- Enable leader election for controller manager
leaderElect: true

controller:
  # TLS for the UI (:8082) and webhook/Bundle API (:8083) servers.
  # When both tlsCertFile and tlsKeyFile are set, both servers use HTTPS; one alone fails the install.
  # Typically used with cert-manager: mount the certificate Secret with
  # extraVolumes/extraVolumeMounts, then set the paths to the mounted files.
  # A path that is not in a secret, projected or csi volume mounted that way fails the install.
  # For certificates that reach the container another way (hostPath, the image, an injected
  # volume), set KARDINAL_TLS_CERT_FILE and KARDINAL_TLS_KEY_FILE with extraEnv instead.
  # See docs/guides/security.md for the recommended cert-manager setup.
  #
  # -- Path to the TLS certificate file (PEM). Set together with tlsKeyFile to enable TLS.
  tlsCertFile: ""
  # -- Path to the TLS private key file (PEM). Set together with tlsCertFile to enable TLS.
  tlsKeyFile: ""
  # -- Namespace-scoped install mode (--watch-namespace). Empty = cluster-wide.
  # When set, the controller caches and reconciles only this namespace, its
  # namespaced permissions are a Role/RoleBinding there, and a small
  # ClusterRole (<fullname>-cluster-scoped) covers ChangeWindows and get on
  # this Namespace. It must equal the release namespace (install the chart
  # into the namespace it watches); org-level PolicyGates are read from this
  # namespace too.
  watchNamespace: ""
  # -- Namespaces holding org-level PolicyGates (--policy-namespaces).
  # Empty keeps the controller default, platform-policies. In namespace
  # mode org gates are read from watchNamespace, and an entry other than
  # watchNamespace fails the install.
  policyNamespaces: []
  # -- Longest a PolicyGate's status goes unwritten while its result does not
  # change (--gate-status-heartbeat, a Go duration). Empty keeps the controller
  # default, 10m. "0s" writes the status on every evaluation; each write makes
  # kro re-check the gate's whole Graph.
  gateStatusHeartbeat: ""
  # -- Extra controller args, e.g. ["--cors-allowed-origins=https://kardinal.example.com"].
  extraArgs: []
  # -- Extra env vars for the controller container (e.g. HTTPS_PROXY).
  extraEnv: []
  # -- Extra volumes for the controller Pod (e.g. a TLS Secret).
  extraVolumes: []
  # -- Extra volume mounts for the controller container.
  extraVolumeMounts: []

# -- Address the metrics endpoint binds to
metricsBindAddress: ":8080"

# -- Address the health probe endpoint binds to
healthProbeBindAddress: ":8081"

# Service <fullname> and the matching container ports.
service:
  # -- Metrics port (Prometheus)
  metricsPort: 8080
  # -- Health/readiness probe port
  healthPort: 8081
  # -- Embedded UI and UI API port (--ui-listen-address)
  uiPort: 8082
  # -- Webhook and Bundle API port (--webhook-bind-address): /webhook/scm
  # and /api/v1/bundles
  webhookPort: 8083

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the controller Pod
nodeSelector: {}

# -- Tolerations for the controller Pod
tolerations: []

# -- Affinity rules for the controller Pod
affinity: {}

# -- SCM token for the provider in scm.provider, for opening PRs and detecting
# merges. Set one of:
#   github.secretRef.name  an existing Secret in the release namespace
#                          (recommended; the token stays out of Helm values)
#   github.token           the chart creates Secret <fullname>-github-token
#                          (the token is kept in the Helm release history)
# Either way the controller reads GITHUB_TOKEN from the Secret and watches it,
# reloading the SCM provider when the token changes (no restart).
#
#   kubectl create secret generic github-token -n kardinal-system \
#     --from-literal=token=$GITHUB_PAT
#   helm install ... --set github.secretRef.name=github-token
github:
  # -- Token value; the chart stores it in a Secret. Prefer secretRef.
  token: ""
  # -- Existing Secret holding the token.
  secretRef:
    name: ""
    # -- Must be empty or the release namespace: GITHUB_TOKEN is read with a
    # secretKeyRef, which only reads the Pod's namespace.
    namespace: ""
    key: "token"

# -- SCM provider (--scm-provider): github (default when empty), gitlab,
# forgejo, gitea, bitbucket or azuredevops, and its API base URL
# (--scm-api-url) for self-hosted instances. See docs/scm-providers.md.
scm:
  provider: ""
  apiURL: ""
  # -- Repositories the controller's SCM token may act on
  # (--scm-allowed-repositories), as host/repository globs: "github.com/acme/*",
  # "gitlab.example.com/platform/**" for every subgroup,
  # "dev.azure.com/<org>/<project>/*" for Azure DevOps. Every SCM call for
  # another repository is refused, and a Pipeline that would need the token
  # for one is Ready=False/RepositoryNotAllowed with its steps failing before
  # git-clone (exempt: its own existing git.secretRef Secret and no pr-review
  # environment). Empty allows every repository the token can write to, and
  # the controller logs a warning at startup. See docs/guides/security.md.
  allowedRepositories: []

# -- Webhook secret for :8083/webhook/scm (KARDINAL_WEBHOOK_SECRET): the HMAC
# key, or for GitLab and Azure DevOps the plain token the SCM sends.
webhook:
  secretRef:
    name: ""
    key: "secret"

# -- Bearer token for the Bundle API, POST :8083/api/v1/bundles
# (KARDINAL_BUNDLE_TOKEN). The Bundle API is off until this is set.
bundleAPI:
  tokenSecretRef:
    name: ""
    key: "token"

# -- Embedded UI (:8082).
ui:
  # -- Origins allowed by CORS on the UI API (--cors-allowed-origins).
  corsAllowedOrigins: []
  # -- Extra host names the UI answers to (--ui-allowed-hosts), for example an
  # Ingress host or a node IP. The Service DNS names (<fullname>,
  # <fullname>.<namespace>, .svc and .svc.cluster.local) and localhost are
  # always allowed. Browser requests to any other Host get no same-origin
  # grant, and while UI auth is off every UI API request to them, reads
  # included, gets 403 (DNS rebinding protection). Static /ui/ assets are not
  # checked. Host names only: no scheme, path or wildcard.
  allowedHosts: []
  # With neither auth mode set, /api/ serves only clients connecting from
  # loopback (kubectl port-forward); Ingress, NodePort, LoadBalancer and pod
  # clients get 403. Set one mode to serve them. A service-mesh sidecar makes
  # mesh clients connect from loopback; they are refused only on a best-effort
  # check of the headers the sidecar adds, so with a mesh, set an auth mode.
  auth:
    # -- Static bearer token for /api/v1/ui/* (KARDINAL_UI_TOKEN).
    tokenSecretRef:
      name: ""
      key: "token"
    # -- Validate UI bearer tokens as Kubernetes ServiceAccount/user tokens
    # (--ui-tokenreview-auth). Adds tokenreviews and subjectaccessreviews
    # create to the controller's ClusterRole.
    tokenReview: false

# -- Optional controller permissions, off by default.
rbac:
  # -- patch on argoproj.io Applications, for the argocd update strategy
  # (update.strategy: argocd).
  argocdApplicationsWrite: false
  # -- Deprecated, no effect, removed in v0.10. The integration-test step was
  # removed; the Job access the chart grants is for hooks (hooks.serviceAccounts),
  # whatever this says. Kept so existing --set rbac.integrationTestJobs=...
  # keeps passing the values schema.
  integrationTestJobs: false

# -- kro Graph integration.
# kardinal renders one kro Graph (kro.run/v1alpha1) per Bundle. kro v0.10.0-rc.0
# or later with the GraphKind feature gate must be installed separately:
#   bash hack/install-kro.sh
# kro applies each Graph's children by impersonating graph.serviceAccountName
# in the Graph's namespace; the controller creates that ServiceAccount and binds
# it to the ClusterRoles below with RoleBindings.
graph:
  # -- ServiceAccount kro impersonates for each Graph.
  serviceAccountName: kardinal-graph
  # -- Namespace kro runs in. Only used for a NetworkPolicy egress rule;
  # "" drops that rule.
  kroNamespace: kro-system
  # -- Namespaces, besides a Graph's own namespace, where the controller may
  # bind the Graph ServiceAccount to the reader ClusterRole so the Graph can
  # read health objects (Argo CD Applications, Flux Kustomizations,
  # Deployments). A health check in any other namespace gets no Graph ref and
  # a warning; the PromotionStep health check itself is unaffected. "*" allows
  # every namespace except kube-system, kube-public and kube-node-lease: use
  # it only when every Pipeline author may read every namespace.
  readerNamespaces:
    - argocd
    - flux-system
  # -- Ship a ClusterRole aggregated into kro's controller role, for kro
  # installed with rbac.mode=aggregation (the hack/install-kro.sh default).
  aggregateToKro: true

# -- Pipeline pre- and post-deploy hooks (spec.environments[].hooks,
# docs/hooks.md). The controller runs each hook as a Job in the Pipeline
# namespace.
hooks:
  # -- ServiceAccount names a hook's Job Pod may run as (--hook-service-accounts),
  # in the Pipeline namespace. A hook whose Pod names another one fails
  # without running. Anyone who can edit a Pipeline can run a Pod as one of
  # these, so list only ServiceAccounts with the rights a hook needs. The
  # Graph ServiceAccount (graph.serviceAccountName) is never allowed.
  serviceAccounts:
    - default
  # -- Allow hook Pods to be privileged: privileged containers, privilege
  # escalation, added capabilities, host namespaces and ports, hostPath
  # volumes, nodeName (--hook-allow-privileged). A hook that uses one fails
  # while this is false.
  allowPrivileged: false

# -- Rendered manifests (layout: branch, docs/rendered-manifests.md). Each
# render runs as a Job in the Pipeline's namespace from this image, never in
# the controller: no Kubernetes credentials (the ServiceAccount below gets no
# role and no token), a read-only root filesystem, no capabilities, and these
# limits. It reads the DRY source and pushes the render with the Pipeline's
# own git Secret (spec.git.secretRef).
render:
  image:
    # -- kardinal-render image repository.
    repository: ghcr.io/pnz1990/kardinal-promoter/render
    # -- Tag (defaults to chart appVersion).
    tag: ""
    # -- Digest (sha256:...); when set the image is repository@digest and
    # the tag is not used.
    digest: ""
    # -- imagePullPolicy of the render Jobs (empty: Kubernetes' default).
    pullPolicy: ""
  # -- ServiceAccount the render Pods run as. The controller creates it in a
  # Pipeline namespace that has none, without a token; bind no role to it.
  serviceAccountName: kardinal-render
  resources:
    limits:
      # -- CPU limit of a render Job.
      cpu: "1"
      # -- Memory limit of a render Job. A render that needs more fails.
      memory: 512Mi
  # -- How long a render Job may run.
  timeout: 5m
  # -- NetworkPolicy for the render Pods: egress only to DNS and the git
  # host. Needs a CNI that enforces NetworkPolicy. It is created in each of
  # namespaces (the Pipeline namespaces that use layout: branch).
  networkPolicy:
    enabled: false
    # -- Namespaces to create the render NetworkPolicy in.
    namespaces: []
    # -- Egress rules (NetworkPolicyPeer lists with ports) for the git host,
    # e.g. [{to: [{ipBlock: {cidr: 140.82.112.0/20}}], ports: [{port: 443, protocol: TCP}]}].
    gitEgress: []

# -- Deprecated, no effect. The chart no longer ships ValidatingAdmissionPolicies;
# the CRD schemas validate these fields instead. Kept so existing
# --set validatingAdmissionPolicy.enabled=... keeps working.
validatingAdmissionPolicy:
  enabled: true

tracing:
  # -- Export OpenTelemetry traces over OTLP/HTTP (--tracing-enabled): spans for
  # reconciles, promotion steps, git clone/push, SCM API calls and
  # NotificationHook deliveries (which carry a traceparent header), and server
  # spans for /webhook/scm and /api/v1/bundles. See docs/guides/monitoring.md.
  enabled: false
  # -- OTLP/HTTP endpoint: a URL (http://otel-collector.observability:4318) or
  # host:port. Empty uses OTEL_EXPORTER_OTLP_ENDPOINT (set it with
  # controller.extraEnv), else localhost:4318.
  endpoint: ""
  # -- Plain HTTP to a host:port endpoint (a URL's scheme decides by itself).
  insecure: false
  # -- Fraction of traces recorded, 0 to 1, decided at each trace's root. An
  # inbound traceparent is linked, not trusted, so it does not force recording.
  samplingRatio: 0.1

egress:
  # -- Destinations NotificationHook, MetricCheck and Subscription requests may
  # reach (--egress-allowlist): host names (hooks.slack.com), wildcards
  # (*.example.com: any name under it) and CIDRs or addresses (10.0.0.0/8).
  # A request is allowed when its host matches a name or every address it
  # connects to is in a CIDR. Empty: any destination except loopback,
  # link-local, cloud metadata, unspecified and multicast addresses, which stay
  # refused whatever this lists. See docs/guides/security.md.
  allowlist: []

# -- NetworkPolicy for the controller Pod. Needs a CNI that enforces
# NetworkPolicy. Egress: DNS, :443/:6443 (API server, SCM, git, registries),
# graph.kroNamespace and extraEgress. Ingress: the four Service ports.
networkPolicy:
  enabled: false
  # -- Peers allowed per ingress port (NetworkPolicyPeer list). Empty admits
  # any source on that port. Example:
  #   metrics: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}]
  ingressFrom:
    metrics: []
    health: []
    ui: []
    webhook: []
  # -- Extra egress rules (NetworkPolicyEgressRule list), e.g. Prometheus on
  # :9090 for MetricChecks or a webhook receiver for NotificationHooks.
  extraEgress: []

# -- MetricCheck providers.
metricCheck:
  cloudWatch:
    # -- Let cloudwatch MetricChecks that name no credential Secret use the
    # controller's own AWS identity (IRSA, EKS Pod Identity, environment).
    # Off by default: anyone who can create a MetricCheck could then read
    # CloudWatch with that identity. Annotate serviceAccount for IRSA.
    ambientCredentials: false
  # -- Outbound MetricCheck query slots. Every provider dials an address the
  # MetricCheck's author chose, so queries are capped: at most `global` run
  # at once in the cluster, at most `perNamespace` per namespace, and the
  # rest wait first come, first served (status reason WaitingForSlot). The
  # sustained throughput is about global / query time: with 12 slots and
  # 0.5 s queries, 24 queries a second, so 1,440 MetricChecks at a 60 s
  # interval. One namespace gets at most perNamespace / query time.
  querySlots:
    global: 12
    perNamespace: 1

# -- ScheduleClock configuration.
# One ScheduleClock is deployed per cluster. Each tick re-evaluates every
# PolicyGate instance, so schedule.* expressions follow the interval; each
# gate's recheckInterval still applies as well.
scheduleClock:
  enabled: true
  interval: "1m"

# -- PodDisruptionBudget for the controller.
# Only created when replicaCount > 1 to ensure at least one replica is
# available during node maintenance or rolling updates.
pdb:
  enabled: true
  # -- Minimum number of pods that must be available during disruption.
  minAvailable: 1

# -- Topology spread constraints for multi-replica deployments.
# When enabled and replicaCount > 1, prefers spreading replicas across zones
# (topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway). It does
# not stop two replicas from sharing a node.
topologySpread:
  enabled: true

# -- Demo mode — pre-installs a ready-to-use Pipeline targeting the
# kardinal-demo reference GitOps repository (pnz1990/kardinal-demo).
# When enabled, a `demo` Pipeline CR is created in the release namespace
# with three environments (test, uat, prod) and kustomize update strategy.
# Use `kardinal create bundle demo --image <image>` to trigger the first promotion.
#
# Time to first promotion with demo.enabled=true: under 10 minutes on a
# fresh kind cluster. It needs a fork of pnz1990/kardinal-demo (set
# demo.git.url) and Argo CD Applications kardinal-test-app-test, -uat and
# -prod; see docs/quickstart.md.
#
# Example:
#   helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter --version 0.9.0 \
#     --namespace kardinal-system --create-namespace \
#     --set demo.enabled=true \
#     --set demo.git.url=https://github.com/<your-user>/kardinal-demo \
#     --set github.secretRef.name=github-token
demo:
  # -- Enable the demo Pipeline. When true, a Pipeline named "demo" is created.
  enabled: false
  # -- Image tag used in the demo pipeline documentation.
  # This is informational only (shown in the demo Pipeline annotations).
  # Run `kardinal create bundle demo --image <real-image>` to start a promotion.
  image: "ghcr.io/pnz1990/kardinal-test-app:sha-DEMO"
  # -- Secret the demo Pipeline uses for git (spec.git.secretRef).
  # Defaults to the chart's SCM token Secret (github.secretRef.name, or
  # <fullname>-github-token when github.token is set), else "github-token".
  secretRef:
    name: ""
  git:
    # -- GitOps repository the demo Pipeline pushes to (spec.git.url).
    # The token needs write access to it, so point this at your fork of
    # pnz1990/kardinal-demo.
    url: "https://github.com/pnz1990/kardinal-demo"

# -- PrometheusRule for Prometheus Operator.
# Creates a PrometheusRule CR with pre-built alerting rules for kardinal-promoter.
# Requires the Prometheus Operator CRD (monitoring.coreos.com/v1/PrometheusRule).
# Disabled by default — enable when using kube-prometheus-stack or similar.
prometheusRule:
  # -- Create the PrometheusRule resource. Requires Prometheus Operator CRD.
  enabled: false
  # -- Additional labels to add to the PrometheusRule (for Prometheus selector matching).
  # Example: { "release": "kube-prometheus-stack" }
  additionalLabels: {}
  # -- Namespace to deploy the PrometheusRule into. Defaults to Release.Namespace.
  namespace: ""

# -- ServiceMonitor for Prometheus Operator.
# Scrapes the controller's metrics port (plain HTTP) through the chart's Service.
# The job label is the Service name, which is what the PrometheusRule alerts match.
# Requires the Prometheus Operator CRD (monitoring.coreos.com/v1/ServiceMonitor).
# Disabled by default — enable when using kube-prometheus-stack or similar.
serviceMonitor:
  # -- Create the ServiceMonitor resource. Requires Prometheus Operator CRD.
  enabled: false
  # -- Scrape interval, for example "30s". Empty uses the Prometheus default.
  interval: ""
  # -- Additional labels on the ServiceMonitor (for Prometheus selector matching).
  # Example: { "release": "kube-prometheus-stack" }
  labels: {}

# -- Grafana dashboard ConfigMap for Grafana sidecar auto-discovery.
# When enabled, creates a ConfigMap containing the kardinal-promoter Grafana dashboard JSON.
# Designed for use with the Grafana sidecar (grafana.sidecar.dashboards.enabled=true in
# kube-prometheus-stack or grafana Helm chart). The sidecar watches ConfigMaps labelled
# with the configured label (default: grafana_dashboard=1) and loads dashboards automatically.
#
# Example (kube-prometheus-stack):
#   helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter --version 0.9.0 \
#     --namespace kardinal-system --create-namespace --set github.secretRef.name=github-token \
#     --set grafanaDashboard.enabled=true \
#     --set 'grafanaDashboard.sidecarLabel.grafana_dashboard=1'
grafanaDashboard:
  # -- Create the Grafana dashboard ConfigMap.
  enabled: false
  # -- Labels to add to the ConfigMap for Grafana sidecar discovery.
  # Set these to match your Grafana sidecar's label selector.
  # kube-prometheus-stack default: grafana_dashboard: "1"
  sidecarLabel:
    grafana_dashboard: "1"
  # -- Namespace for the dashboard ConfigMap. Defaults to Release.Namespace.
  namespace: ""
  # -- Annotations to add to the ConfigMap.
  annotations: {}
