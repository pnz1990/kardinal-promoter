# Default values for kardinal-promoter.
# This is a YAML-formatted file.

# -- Number of controller replicas
replicaCount: 1

# -- Pod termination grace period in seconds.
# Must be at least 2× the controller's GracefulShutdownTimeout (30s) to allow
# in-flight reconcile loops to complete before SIGKILL. (#574)
terminationGracePeriodSeconds: 60

image:
  # -- Container image repository
  repository: ghcr.io/pnz1990/kardinal-promoter/controller
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag (defaults to chart appVersion)
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}
  # -- Override the ServiceAccount name
  name: ""

# -- Annotations to add to the controller Pod
podAnnotations: {}

# -- Security context for the controller Pod
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Security context for the controller container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Controller log level (debug, info, warn, error)
logLevel: info

# -- Enable leader election for controller manager
leaderElect: true

# -- TLS configuration for the UI and webhook HTTP servers.
# When both tlsCertFile and tlsKeyFile are set, both servers use HTTPS.
# Typically used with cert-manager: mount the certificate Secret as a volume,
# then set the paths to the mounted cert and key files.
# See docs/guides/security.md for the recommended cert-manager setup.
controller:
  # -- Path to the TLS certificate file (PEM). Set together with tlsKeyFile to enable TLS.
  tlsCertFile: ""
  # -- Path to the TLS private key file (PEM). Set together with tlsCertFile to enable TLS.
  tlsKeyFile: ""
  # -- Namespace to watch (default: "" = cluster-wide).
  # When set, the controller only reconciles resources in this namespace and
  # a Role/RoleBinding is created instead of a ClusterRole/ClusterRoleBinding.
  # Enables namespace-scoped install mode for multi-tenant clusters.
  # See: docs/design/15-production-readiness.md §Lens 6
  watchNamespace: ""

# -- Address the metrics endpoint binds to
metricsBindAddress: ":8080"

# -- Address the health probe endpoint binds to
healthProbeBindAddress: ":8081"

service:
  # -- Metrics port (Prometheus)
  metricsPort: 8080
  # -- Health/readiness probe port
  healthPort: 8081

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the controller Pod
nodeSelector: {}

# -- Tolerations for the controller Pod
tolerations: []

# -- Affinity rules for the controller Pod
affinity: {}

# -- GitHub token for SCM operations (opening PRs, detecting merges).
# Provide either a direct value (not recommended for production) or a secretRef.
# The secretRef.key defaults to "token".
#
# Zero-downtime credential rotation: when secretRef is set, the controller
# automatically watches the Secret and reloads the SCM provider on token
# change — no restart required. This enables teams that rotate PATs on a
# schedule to do so without a promotion gap.
#
# Example:
#   github:
#     token: "ghp_..."
#   OR (recommended for production, enables zero-downtime rotation)
#   github:
#     secretRef:
#       name: github-token
#       namespace: ""  # defaults to Release.Namespace
#       key: token
github:
  # -- Direct token value (use secretRef in production)
  token: ""
  # -- Reference to an existing Secret containing the GitHub token.
  # When set, the controller watches this Secret and reloads the SCM provider
  # on token change without a restart (zero-downtime credential rotation).
  secretRef:
    name: ""
    namespace: ""
    key: "token"

# -- kro Graph integration.
# kardinal renders one kro Graph (kro.run/v1alpha1) per Bundle. kro >= v0.10.0
# with the GraphKind feature gate must be installed separately:
#   bash hack/install-kro.sh
# kro applies each Graph's children by impersonating graph.serviceAccountName
# in the Graph's namespace; the controller creates that ServiceAccount and binds
# it to the ClusterRoles below with RoleBindings.
graph:
  # -- ServiceAccount kro impersonates for each Graph.
  serviceAccountName: kardinal-graph
  # -- Namespace kro runs in (NetworkPolicy egress).
  kroNamespace: kro-system
  # -- Ship a ClusterRole aggregated into kro's controller role, for kro
  # installed with rbac.mode=aggregation (the hack/install-kro.sh default).
  aggregateToKro: true

# -- ValidatingAdmissionPolicy for PolicyGate validation.
# Requires Kubernetes 1.28+. When enabled, validates PolicyGate spec.expression
# (non-empty) and spec.recheckInterval (Go duration format) at admission time.
# Disable for kind/k8s < 1.28 or when using --validate=false.
validatingAdmissionPolicy:
  enabled: true

# -- NetworkPolicy for the controller namespace.
# When enabled, restricts controller ingress (Kubernetes API server only)
# and egress (Kubernetes API server + HTTPS for SCM providers + DNS).
# Disable if your CNI does not support NetworkPolicy.
networkPolicy:
  enabled: false

# -- ScheduleClock configuration.
# One ScheduleClock is deployed per cluster to generate watch events for
# PolicyGates with schedule.* expressions. This eliminates the per-gate
# RequeueAfter timer loop.
scheduleClock:
  enabled: true
  interval: "1m"

# -- PodDisruptionBudget for the controller.
# Only created when replicaCount > 1 to ensure at least one replica is
# available during node maintenance or rolling updates.
pdb:
  enabled: true
  # -- Minimum number of pods that must be available during disruption.
  minAvailable: 1

# -- Topology spread constraints for multi-replica deployments.
# When enabled and replicaCount > 1, spreads replicas across availability
# zones to prevent both replicas from landing on the same node.
topologySpread:
  enabled: true

# -- Demo mode — pre-installs a ready-to-use Pipeline targeting the
# kardinal-demo reference GitOps repository (pnz1990/kardinal-demo).
# When enabled, a `demo` Pipeline CR is created in the release namespace
# with three environments (test, uat, prod) and kustomize update strategy.
# Use `kardinal create bundle demo --image <image>` to trigger the first promotion.
#
# Time to first promotion with demo.enabled=true: under 10 minutes on a
# fresh kind cluster (no manual GitOps repo setup required).
#
# Example:
#   helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter \
#     --namespace kardinal-system --create-namespace \
#     --set demo.enabled=true \
#     --set github.token=$GITHUB_PAT
demo:
  # -- Enable the demo Pipeline. When true, a Pipeline named "demo" is created.
  enabled: false
  # -- Image tag used in the demo pipeline documentation.
  # This is informational only (shown in the demo Pipeline annotations).
  # Run `kardinal create bundle demo --image <real-image>` to start a promotion.
  image: "ghcr.io/pnz1990/kardinal-test-app:sha-DEMO"
  # -- Reference to the Secret containing the GitHub token.
  # Defaults to the github.secretRef.name value (or "github-token" if both are empty).
  secretRef:
    name: ""

# -- PrometheusRule for Prometheus Operator.
# Creates a PrometheusRule CR with pre-built alerting rules for kardinal-promoter.
# Requires the Prometheus Operator CRD (monitoring.coreos.com/v1/PrometheusRule).
# Disabled by default — enable when using kube-prometheus-stack or similar.
prometheusRule:
  # -- Create the PrometheusRule resource. Requires Prometheus Operator CRD.
  enabled: false
  # -- Additional labels to add to the PrometheusRule (for Prometheus selector matching).
  # Example: { "release": "kube-prometheus-stack" }
  additionalLabels: {}
  # -- Namespace to deploy the PrometheusRule into. Defaults to Release.Namespace.
  namespace: ""

# -- Grafana dashboard ConfigMap for Grafana sidecar auto-discovery.
# When enabled, creates a ConfigMap containing the kardinal-promoter Grafana dashboard JSON.
# Designed for use with the Grafana sidecar (grafana.sidecar.dashboards.enabled=true in
# kube-prometheus-stack or grafana Helm chart). The sidecar watches ConfigMaps labelled
# with the configured label (default: grafana_dashboard=1) and loads dashboards automatically.
#
# Example (kube-prometheus-stack):
#   helm install kardinal-promoter oci://ghcr.io/pnz1990/charts/kardinal-promoter \
#     --set grafanaDashboard.enabled=true \
#     --set 'grafanaDashboard.sidecarLabel.grafana_dashboard=1'
grafanaDashboard:
  # -- Create the Grafana dashboard ConfigMap.
  enabled: false
  # -- Labels to add to the ConfigMap for Grafana sidecar discovery.
  # Set these to match your Grafana sidecar's label selector.
  # kube-prometheus-stack default: grafana_dashboard: "1"
  sidecarLabel:
    grafana_dashboard: "1"
  # -- Namespace for the dashboard ConfigMap. Defaults to Release.Namespace.
  namespace: ""
  # -- Annotations to add to the ConfigMap.
  annotations: {}
