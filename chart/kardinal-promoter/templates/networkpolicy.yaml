{{/*
NetworkPolicy for the kardinal-promoter controller Pod.

Ingress: one rule per port (metrics, health, ui, webhook). A port admits any
source unless networkPolicy.ingressFrom.<port> lists peers. Kubelet probes
are not subject to NetworkPolicy on most CNIs.

Egress:
  - DNS (:53 UDP/TCP)
  - :443 and :6443 to any address: the Kubernetes API server, SCM provider
    APIs, git over HTTPS and OCI registries
  - the kro namespace (graph.kroNamespace), for clusters that deny egress
    by namespace. The controller itself talks to kro only through the API
    server (Graph objects); set graph.kroNamespace to "" to drop this rule.
  - networkPolicy.extraEgress (e.g. Prometheus for MetricChecks, webhook
    receivers for NotificationHooks)

Disabled by default: needs a CNI that enforces NetworkPolicy.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kardinal-promoter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $name, $port := dict "metrics" .Values.service.metricsPort "health" .Values.service.healthPort "ui" .Values.service.uiPort "webhook" .Values.service.webhookPort }}
    - ports:
        - port: {{ $port }}
          protocol: TCP
      {{- with index $.Values.networkPolicy.ingressFrom $name }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.graph.kroNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
