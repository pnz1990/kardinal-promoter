{{- with include "kardinal-promoter.scmToken" . }}
# scm.token (or github.token) is stored here, never in the Deployment. The
# controller reads it through a secretKeyRef and watches this Secret for
# rotation. It is never labelled kardinal.io/referenceable: that label would
# let any kardinal object in this namespace (a Pipeline, a MetricCheck, an
# ScmProvider, a Subscription) send the controller's token to a URL its
# author chooses. The demo Pipeline gets its own Secret (demo-git-secret.yaml).
# Prefer creating the Secret yourself and setting scm.secretRef.name, so the
# token is not in the Helm release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kardinal-promoter.githubSecretName" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ . | quote }}
{{- end }}
