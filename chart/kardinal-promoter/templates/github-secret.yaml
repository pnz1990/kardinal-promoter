{{- if .Values.github.token }}
# github.token is stored here, never in the Deployment. The controller reads it
# through a secretKeyRef and watches this Secret for rotation. Prefer creating
# the Secret yourself and setting github.secretRef.name, so the token is not in
# the Helm release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kardinal-promoter.githubSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.github.token | quote }}
{{- end }}
