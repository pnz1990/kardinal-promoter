{{- with include "kardinal-promoter.scmToken" . }}
# scm.token (or github.token) is stored here, never in the Deployment. The
# controller reads it through a secretKeyRef and watches this Secret for
# rotation; the demo Pipeline uses it as spec.git.secretRef, so it is labelled
# kardinal.io/referenceable. Prefer creating the Secret yourself and setting
# scm.secretRef.name, so the token is not in the Helm release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kardinal-promoter.githubSecretName" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" $ | nindent 4 }}
    kardinal.io/referenceable: "true"
type: Opaque
stringData:
  token: {{ . | quote }}
{{- end }}
