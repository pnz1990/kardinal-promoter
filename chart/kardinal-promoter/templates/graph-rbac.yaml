# RBAC for the kro Graphs kardinal renders.
#
# kro applies a Graph's children by impersonating spec.serviceAccountName
# (graph.serviceAccountName) in the Graph's namespace. The controller creates
# that ServiceAccount and binds it, with RoleBindings only, to:
#   - <fullname>-graph-applier in the Graph namespace
#   - <fullname>-graph-reader in each namespace a health ref reads from
# See docs/design/16-graph-capability-ledger.md (G5).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kardinal-promoter.graphApplierRole" . }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
  # Graph templates; promotionsteps also takes the hook mirror patch.
  - apiGroups: ["kardinal.io"]
    resources: ["promotionsteps", "policygates", "prstatuses", "hookruns", "imageverifications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Graph refs.
  - apiGroups: ["kardinal.io"]
    resources: ["bundles"]
    verbs: ["get", "list", "watch"]
  # Argo Rollouts analysis (spec.verification): AnalysisRun templates, and
  # the refAnalysisRuns read-back.
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kardinal-promoter.graphReaderRole" . }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
  # Health ref nodes (pkg/health/watch_node.go).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flagger.app"]
    resources: ["canaries"]
    verbs: ["get", "list", "watch"]
{{- if .Values.graph.aggregateToKro }}
---
# kro's own identity watches (metadata-only informers) every kind a Graph
# renders or references. With kro rbac.mode=aggregation this ClusterRole is
# aggregated into kro's controller role; with rbac.mode=unrestricted it is a
# no-op.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-kro-watch
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups: ["kardinal.io"]
    resources: ["promotionsteps", "policygates", "prstatuses", "bundles", "hookruns", "imageverifications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "rollouts", "analysisruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["flagger.app"]
    resources: ["canaries"]
    verbs: ["get", "list", "watch"]
{{- end }}
