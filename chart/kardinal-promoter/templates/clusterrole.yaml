{{- /*
Controller ClusterRole. Rules are defined in _rbac.tpl.
  Cluster mode (controller.watchNamespace empty): <fullname>-manager-role
    holds every namespaced rule plus the cluster-scoped rules.
  Namespace mode: the namespaced rules are a Role (role.yaml); this
    ClusterRole, <fullname>-cluster-scoped, holds only the cluster-scoped
    rules (ChangeWindows, and TokenReview when ui.auth.tokenReview).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  {{- if .Values.controller.watchNamespace }}
  name: {{ include "kardinal-promoter.fullname" . }}-cluster-scoped
  {{- else }}
  name: {{ include "kardinal-promoter.fullname" . }}-manager-role
  {{- end }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
  {{- if not .Values.controller.watchNamespace }}
  {{- include "kardinal-promoter.rules.namespaced" . | nindent 2 }}
  {{- end }}
  {{- include "kardinal-promoter.rules.cluster" . | nindent 2 }}
