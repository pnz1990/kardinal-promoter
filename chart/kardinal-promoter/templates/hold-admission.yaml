Admission policy for Pipeline spec.holds (kardinal rollback --hold, #1528;
docs/rollback.md#who-may-hold).
*/}}
{{- $fullname := include "kardinal-promoter.fullname" . }}
{{- $controller := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kardinal-promoter.serviceAccountName" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-hold-writes
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelines"]
  # A hold pins an environment and exempts its rollback from the
  # environment's gates, so changing spec.holds needs more than update on the
  # Pipeline: update on the virtual subresource pipelines/hold. Every new
  # entry names the caller in createdBy and has a createdAt (and expiresAt,
  # if set, after it); an entry is added or removed, never edited in place.
  # The controller is exempt (this release's, and the exact usernames in
  # admission.controllerUsernames: other shards' controllers during a
  # handoff): it removes expired holds, and it writes the holds the UI makes
  # after checking pipelines/hold for the UI user, whom it records in
  # createdBy.
  variables:
    - name: exempt
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
    - name: oldHolds
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.spec.holds) ? oldObject.spec.holds : []
    - name: newHolds
      expression: "has(object.spec.holds) ? object.spec.holds : []"
    - name: changed
      expression: variables.oldHolds != variables.newHolds
    - name: added
      expression: variables.newHolds.filter(h, !(h in variables.oldHolds))
    # spec.lastChange (#1939) names who made a pause, resume or hold release.
    - name: oldChange
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.spec.lastChange) ? oldObject.spec.lastChange : null
    - name: newChange
      expression: "has(object.spec.lastChange) ? object.spec.lastChange : null"
    # The actor stamps this write adds (new holds, a new spec.lastChange):
    # what needs no AgentIndex is checked here, always, so a stamp never
    # names another principal even while the index is missing; the agent
    # and sponsor are checked by <release>-actor-records.
    - name: newStamps
      expression: >-
        variables.added.map(h, has(h.actor) ? h.actor : null) +
        (variables.newChange != null && variables.newChange != variables.oldChange
          ? [has(variables.newChange.actor) ? variables.newChange.actor : null] : [])
    - name: mayHold
      expression: >-
        authorizer.group('kardinal.io').resource('pipelines').subresource('hold')
        .namespace(object.metadata.namespace).name(object.metadata.name).check('update').allowed()
  validations:
    - expression: variables.exempt || !variables.changed || variables.mayHold
      messageExpression: >-
        'changing spec.holds needs update on pipelines/hold (user ' + request.userInfo.username + ')'
      reason: Forbidden
    - expression: >-
        variables.exempt ||
        variables.added.all(h, !variables.oldHolds.exists(o, o.environment == h.environment))
      message: a spec.holds entry may be added or removed, not edited in place
      reason: Forbidden
    - expression: >-
        variables.exempt ||
        variables.added.all(h, has(h.createdBy) && h.createdBy == request.userInfo.username)
      messageExpression: >-
        'every new spec.holds entry must have createdBy "' + request.userInfo.username + '"'
      reason: Forbidden
    - expression: >-
        variables.exempt ||
        variables.added.all(h, has(h.createdAt) &&
          (!has(h.expiresAt) || timestamp(h.expiresAt) > timestamp(h.createdAt)))
      message: every new spec.holds entry needs createdAt, and an expiresAt after it if it has one
      reason: Invalid
    # Who paused, resumed or released is the requester: a new or changed
    # spec.lastChange names the caller (the controller writes the UI's).
    - expression: >-
        variables.exempt || variables.newChange == null || variables.newChange == variables.oldChange ||
        variables.newChange.by == request.userInfo.username
      messageExpression: >-
        'spec.lastChange.by must be your own username "' + request.userInfo.username +
        '"; kardinal pause, resume and unhold set it for you'
      reason: Forbidden
    - expression: >-
        variables.exempt || variables.newStamps.all(s, s == null || (s.principal == request.userInfo.username && !has(s.via) &&
          (request.userInfo.username.startsWith('system:serviceaccount:')
            ? s.kind in ['bot', 'agent'] : s.kind in ['human', 'agent', 'unverified'])))
      messageExpression: >-
        'an actor stamp must name you (principal ' + request.userInfo.username +
        '), with no via, and kind ' +
        (request.userInfo.username.startsWith('system:serviceaccount:') ? 'bot or agent' : 'human, agent or unverified') +
        '; kardinal sets it for you'
      reason: Forbidden
---
{{- /* Bound like the identity policies: the watched namespace, the shard's
namespaces (the default shard also the unlabelled ones), or every namespace
(kardinal-promoter.identityBindings in identity-admission.yaml). */}}
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "hold-writes") }}
