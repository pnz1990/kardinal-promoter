Licensed under the Apache License, Version 2.0

Admission policy for Pipeline fleets (#1835): every spec.pausedFleets entry
(kardinal pause --env <fleet>, docs/pause.md#pause-one-fleet) names an
environment with a fleet, so a paused fleet cannot be renamed, removed or made
a plain environment while it is paused: its pause would no longer name it. It
lives here, not in the CRD: as a CRD rule (100 entries times 500 environments)
it costs more than the schema's CEL budget. The controller refuses such a
Pipeline too (Ready=False), and pauses every fleet while a stale entry is
there.
*/}}
{{- $fullname := include "kardinal-promoter.fullname" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-fleets
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pipelines"]
  variables:
    - name: paused
      expression: "has(object.spec.pausedFleets) ? object.spec.pausedFleets : []"
    - name: notFleets
      expression: >-
        variables.paused.filter(f, !object.spec.environments.exists(e, e.name == f && has(e.fleet)))
  validations:
    - expression: size(variables.notFleets) == 0
      messageExpression: >-
        'spec.pausedFleets names ' + variables.notFleets.join(', ') +
        ', which is not an environment with a fleet: resume it first (kardinal resume ' +
        object.metadata.name + ' --env <name>), then rename or remove the fleet'
      reason: Invalid
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "fleets") }}
