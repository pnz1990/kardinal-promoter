{{- /*
ClusterRoles for people and automation (rbac.userRoles). Bind them with a
RoleBinding in a namespace (namespace-scoped access) or a ClusterRoleBinding.
In TokenReview mode the UI API and the Bundle API authorize each call with a
SubjectAccessReview, so these roles decide what a caller can do there too
(docs/guides/security.md#user-roles).

  <fullname>-viewer    read pipelines, bundles, gates, steps and the other
                       kardinal kinds, and step events
  <fullname>-promoter  viewer + create Bundles (CI, create bundle, promote,
                       rollback) + pause and resume Pipelines (pipelines/pause)
                       + roll back and hold, and release a hold
                       (pipelines/hold) + reject Bundles in the UI
                       (bundles/reject)
  <fullname>-approver  viewer + override (approve) PolicyGates
                       (policygates/override) + reject Bundles in the UI
                       (bundles/reject) + create Approvals and Verdicts
  <fullname>-verifier  read, create and revoke Verdicts only (admission lets a
                       verifier delete only its own): bind it to the agents and
                       CI that verify versions (verify gates; an AgentRun's
                       agent needs it in the Pipeline's namespace)
  <fullname>-admin     every verb on every kardinal kind, and pipelines/edit
                       and policygates/edit; aggregates the other three and
                       <fullname>-admin-extra
  <fullname>-freezer   create, update and delete freezes (cluster-scoped
                       ChangeWindows) and changewindows/freeze; for incident
                       commanders, with a ClusterRoleBinding
  <fullname>-auditor   get and list on the namespaced kinds kardinal audit
                       evidence-pack reads (AuditEvents, Approvals,
                       PolicyGates, Bundles, Pipelines, Verdicts,
                       PromotionReceipts, ChangeRequests). Bind it
                       with a RoleBinding in each namespace an auditor may
                       read, or a ClusterRoleBinding for all. No write
  <fullname>-auditor-cluster  get and list on the cluster-scoped kinds of
                       the pack (ChangeWindows, AgentIdentities) and on the
                       chart's ValidatingAdmissionPolicies and bindings
                       (listed by label, so list as well as get). Always a
                       ClusterRoleBinding; it reads no namespace's records.
                       Neither auditor role is aggregated into admin
                       (docs/compliance.md)

pipelines/pause, pipelines/hold, pipelines/edit, policygates/override,
policygates/edit and bundles/reject are virtual subresources: the API server serves no such
endpoint, RBAC grants them and SubjectAccessReview checks them. The UI API
authorizes pause, resume, the hold of a rollback, release-hold, gate
approval and Bundle rejection on them and writes the change as the controller, recording the
caller. The promoter and approver roles grant no update on Pipelines or
PolicyGates, so they cannot edit a Pipeline or a gate. With
rbac.userRoles.directWrites they also get update and patch, for kardinal
pause, rollback --hold, release-hold and override from a kubeconfig; the
scoped-writes ValidatingAdmissionPolicy in identity-admission.yaml then limits
a caller who has pipelines/pause or pipelines/hold but not pipelines/edit to
spec.paused and spec.pausedFleets (with pipelines/pause) and spec.holds (with pipelines/hold, each
entry checked by the hold-writes policy), and one who has
policygates/override but not policygates/edit to spec.overrides.

With rbac.userRoles.aggregateToDefaultRoles the roles also aggregate into the
built-in view, edit and admin ClusterRoles (viewer into view; promoter and
approver into edit; admin-extra into admin), so existing namespace bindings
to those roles grant kardinal access too.
*/}}
{{- define "kardinal-promoter.userRoles.readRules" }}
- apiGroups: ["kardinal.io"]
  resources: ["pipelines", "bundles", "policygates", "promotionsteps", "prstatuses", "metricchecks", "changerequests", "subscriptions", "notificationhooks", "rollbackpolicies", "scheduleclocks", "changewindows", "auditevents", "approvals", "scmproviders", "clusterscmproviders", "hookruns", "imageverifications", "renderruns", "branchwrites", "agentidentities", "agentindexes", "verdicts", "agentruns", "steptemplates", "promotionreceipts"]
  verbs: ["get", "list", "watch"]
# Step events in the UI.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
{{- end }}
{{- if .Values.rbac.userRoles.enabled }}
{{- $fullname := include "kardinal-promoter.fullname" . }}
{{- $aggregate := .Values.rbac.userRoles.aggregateToDefaultRoles }}
{{- $direct := .Values.rbac.userRoles.directWrites }}

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-viewer
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    kardinal.io/aggregate-to-admin: "true"
    {{- if $aggregate }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    {{- end }}
rules:
{{- include "kardinal-promoter.userRoles.readRules" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-promoter
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    kardinal.io/aggregate-to-admin: "true"
    {{- if $aggregate }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    {{- end }}
rules:
{{- include "kardinal-promoter.userRoles.readRules" . }}
# Create Bundles: the Bundle API, kardinal create bundle, promote, rollback.
- apiGroups: ["kardinal.io"]
  resources: ["bundles"]
  verbs: ["create"]
# Pause and resume in the UI; roll back and hold, and release a hold
# (spec.holds; the hold-writes policy checks the entries). Reject a Bundle
# in the UI (bundles/reject): stopping a bad version is a safety action.
- apiGroups: ["kardinal.io"]
  resources: ["pipelines/pause", "pipelines/hold", "bundles/reject"]
  verbs: ["update"]
{{- if $direct }}
# kardinal pause, rollback --hold and release-hold from a kubeconfig.
# identity-admission.yaml limits the write to spec.paused and spec.holds.
- apiGroups: ["kardinal.io"]
  resources: ["pipelines"]
  verbs: ["update", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-approver
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    kardinal.io/aggregate-to-admin: "true"
    {{- if $aggregate }}
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    {{- end }}
rules:
{{- include "kardinal-promoter.userRoles.readRules" . }}
# Override (approve) a gate, and reject a Bundle, in the UI.
- apiGroups: ["kardinal.io"]
  resources: ["policygates/override", "bundles/reject"]
  verbs: ["update"]
# Record an approval (approval gates), and revoke your own (only the
# approver may delete it: identity-admission.yaml).
- apiGroups: ["kardinal.io"]
  resources: ["approvals"]
  verbs: ["create", "delete"]
# Record a verdict (verify gates, kardinal verify), and revoke your own.
- apiGroups: ["kardinal.io"]
  resources: ["verdicts"]
  verbs: ["create", "delete"]
{{- if $direct }}
# kardinal override from a kubeconfig. identity-admission.yaml limits the
# write to spec.overrides.
- apiGroups: ["kardinal.io"]
  resources: ["policygates"]
  verbs: ["update", "patch"]
{{- end }}
---
# Verifiers: an agent or CI job that verifies versions (kardinal verify, an
# AgentRun's Pod) needs nothing else; it may revoke only its own Verdicts
# (identity-admission.yaml). It is deliberately not part of the
# viewer: an AgentRun's agent must not read Secrets or write workloads, and
# this role grants neither.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-verifier
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    kardinal.io/aggregate-to-admin: "true"
rules:
- apiGroups: ["kardinal.io"]
  resources: ["verdicts"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["kardinal.io"]
  resources: ["bundles", "policygates", "pipelines"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-admin-extra
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    kardinal.io/aggregate-to-admin: "true"
    {{- if $aggregate }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    {{- end }}
rules:
- apiGroups: ["kardinal.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
# "*" does not cover subresources: name the virtual ones.
- apiGroups: ["kardinal.io"]
  resources: ["pipelines/pause", "pipelines/hold", "pipelines/edit", "policygates/override", "policygates/edit", "bundles/reject", "changewindows/freeze"]
  verbs: ["update"]
---
# Freeze agents and stop the line (kardinal freeze, unfreeze, override
# --freeze, and the UI's controls). Freezes are cluster-scoped ChangeWindows:
# bind it with a ClusterRoleBinding to incident commanders. Not bound by the
# chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-freezer
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
- apiGroups: ["kardinal.io"]
  resources: ["changewindows"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["kardinal.io"]
  resources: ["changewindows/freeze"]
  verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-auditor
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
- apiGroups: ["kardinal.io"]
  resources: ["auditevents", "approvals", "policygates", "bundles", "pipelines", "verdicts", "promotionreceipts", "changerequests"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-auditor-cluster
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
- apiGroups: ["kardinal.io"]
  resources: ["changewindows", "agentidentities"]
  verbs: ["get", "list"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-admin
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        kardinal.io/aggregate-to-admin: "true"
        app.kubernetes.io/instance: {{ .Release.Name }}
# No rules: the API server's aggregation controller writes them. A rendered
# "rules: []" differs from the live object after every sync, and a GitOps tool
# shows the role OutOfSync for ever (#1912).
{{- end }}
