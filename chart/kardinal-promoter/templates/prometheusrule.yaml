{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kardinal-promoter
      rules:
        # Controller availability
        - alert: KardinalControllerDown
          # absent() fires when the target is gone entirely; up == 0 alone
          # does not. The job label is the Service name when scraped through
          # a ServiceMonitor on the chart's Service.
          expr: |
            absent(up{job="{{ include "kardinal-promoter.fullname" . }}"}) == 1
              or up{job="{{ include "kardinal-promoter.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kardinal-promoter controller is not scraping"
            description: "The kardinal-promoter controller has been unreachable for more than 5 minutes. Promotions are stalled."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshooting/#start-here-kardinal-doctor"

        # controller_runtime_* and workqueue_* are exported by every
        # controller-runtime operator. Each rule below keeps them to
        # kardinal's own scrape targets with
        # `and on (cluster, job, instance) kardinal_pr_duration_seconds_count`,
        # a series only kardinal exports (a histogram without labels, present
        # from start-up), whatever the scrape job is called: the join the
        # Grafana dashboard uses (#1941, #2037). Aggregations keep cluster and
        # namespace, so each kardinal installation alerts on its own.

        # Reconcile errors — any controller error rate above 0.1/s for 5m
        - alert: KardinalHighReconcileErrors
          expr: |
            sum by (cluster, namespace, controller) (
              rate(controller_runtime_reconcile_errors_total[5m])
                and on (cluster, job, instance) kardinal_pr_duration_seconds_count
            ) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "kardinal {{ "{{" }} $labels.controller {{ "}}" }} reconciler error rate is elevated"
            description: "The {{ "{{" }} $labels.controller {{ "}}" }} reconciler is failing at {{ "{{" }} $value | humanize {{ "}}" }} errors/s. Promotions may be stuck or failing silently."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#promotion-is-stuck"

        # BundleReconciler stalled: Bundles are queued but none were reconciled
        # for 10 minutes. (An idle cluster has an empty queue and does not fire.)
        - alert: KardinalBundleReconcilerStalled
          expr: |
            sum by (cluster, namespace) (
              rate(controller_runtime_reconcile_total{controller="bundle"}[10m])
                and on (cluster, job, instance) kardinal_pr_duration_seconds_count
            ) == 0
              and on (cluster, namespace)
            sum by (cluster, namespace) (
              workqueue_depth{name="bundle"}
                and on (cluster, job, instance) kardinal_pr_duration_seconds_count
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "kardinal BundleReconciler has not run in 10 minutes"
            description: "Bundles are queued but none were reconciled in the last 10 minutes. The controller may be stuck or leader election may be broken."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#bundle-not-promoting"

        # Work queue backlog — controller is falling behind
        - alert: KardinalWorkQueueBacklog
          expr: |
            (
              workqueue_depth{name=~"bundle|promotionstep|policygate"}
                and on (cluster, job, instance) kardinal_pr_duration_seconds_count
            ) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "kardinal {{ "{{" }} $labels.name {{ "}}" }} work queue depth > 100"
            description: "The {{ "{{" }} $labels.name {{ "}}" }} work queue has {{ "{{" }} $value | humanize {{ "}}" }} items pending for more than 5 minutes. Controller may be overloaded."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#graph-controller-issues"

        # PolicyGate reconciler slow — gates may be blocking promotions with stale evaluations
        - alert: KardinalPolicyGateReconcileSlow
          expr: |
            histogram_quantile(0.99,
              sum by (cluster, namespace, controller, le) (
                rate(controller_runtime_reconcile_time_seconds_bucket{controller="policygate"}[5m])
                  and on (cluster, job, instance) kardinal_pr_duration_seconds_count
              )
            ) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "kardinal PolicyGate reconcile P99 latency is above 10s"
            description: "PolicyGate reconciles are taking more than 10s at P99. Gates may be stale and blocking or unblocking promotions late."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/troubleshoot-promotions/#promotion-is-stuck"

        # The agent index's entries near their size bound (#2076): past it
        # the index is not Ready and the actor policy refuses the writes it
        # checks, people's included. Only the leader sets these gauges; the
        # other replicas export 0, so the max is the leader's.
        - alert: KardinalAgentIndexNearFull
          expr: |
            max by (cluster, namespace) (kardinal_agent_index_bytes)
              / max by (cluster, namespace) (kardinal_agent_index_max_bytes) >= 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "the kardinal agent index is {{ "{{" }} $value | humanizePercentage {{ "}}" }} full"
            description: "The agent index's entries take {{ "{{" }} $value | humanizePercentage {{ "}}" }} of their size bound. Past it, kardinal refuses every write the actor policy checks (Bundles, Approvals, overrides) until AgentIdentities or subjects are removed."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/operate/#scale-and-limits"
        - alert: KardinalAgentIndexFull
          expr: |
            max by (cluster, namespace) (kardinal_agent_index_bytes)
              > max by (cluster, namespace) (kardinal_agent_index_max_bytes)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "the kardinal agent index is over its size bound"
            description: "The agent index is not Ready (IndexFull): kardinal refuses every write the actor policy checks (Bundles, Approvals, overrides), people's included, until AgentIdentities or subjects are removed."
            runbook_url: "https://pnz1990.github.io/kardinal-promoter/operate/#scale-and-limits"
{{- end }}
