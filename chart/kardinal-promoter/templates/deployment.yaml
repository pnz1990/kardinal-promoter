{{- include "kardinal-promoter.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kardinal-promoter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kardinal-promoter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kardinal-promoter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /* default treats 0 as unset; 0 is a valid grace period */}}
      terminationGracePeriodSeconds: {{ if kindIs "invalid" .Values.terminationGracePeriodSeconds }}60{{ else }}{{ .Values.terminationGracePeriodSeconds }}{{ end }}
      containers:
        - name: controller
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "kardinal-promoter.controllerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElect }}
            - --log-level={{ .Values.logLevel }}
            - --zap-log-level={{ include "kardinal-promoter.zapLogLevel" . }}
            - --metrics-bind-address={{ .Values.metricsBindAddress }}
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            - --ui-listen-address=:{{ .Values.service.uiPort }}
            - --webhook-bind-address=:{{ .Values.service.webhookPort }}
            - --graph-service-account={{ .Values.graph.serviceAccountName }}
            - --graph-applier-clusterrole={{ include "kardinal-promoter.graphApplierRole" . }}
            - --graph-reader-clusterrole={{ include "kardinal-promoter.graphReaderRole" . }}
            - --graph-reader-namespaces={{ join "," .Values.graph.readerNamespaces }}
            - --hook-service-accounts={{ join "," .Values.hooks.serviceAccounts }}
            - --hook-pod-security-level={{ .Values.hooks.podSecurityLevel }}
            {{- if not (kindIs "invalid" .Values.graph.compactAbove) }}
            - --graph-compact-above={{ .Values.graph.compactAbove }}
            {{- end }}
            - --hook-service-accounts={{ join "," .Values.hooks.serviceAccounts }}
            - --render-image={{ include "kardinal-promoter.renderImage" . }}
            {{- with .Values.render.image.pullPolicy }}
            - --render-image-pull-policy={{ . }}
            {{- end }}
            - --render-service-account={{ .Values.render.serviceAccountName }}
            {{- with .Values.imagePullSecrets }}
            - --render-image-pull-secrets={{ range $i, $s := . }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}
            {{- end }}
            - --render-cpu-limit={{ .Values.render.resources.limits.cpu }}
            - --render-memory-limit={{ .Values.render.resources.limits.memory }}
            - --render-timeout={{ .Values.render.timeout }}
            {{- if .Values.hooks.allowPrivileged }}
            - --hook-allow-privileged=true
            {{- end }}
            {{- with include "kardinal-promoter.policyNamespaces" . }}
            - --policy-namespaces={{ . }}
            {{- end }}
            {{- if .Values.audit.retention.enabled }}
            - --audit-retention=true
            - --audit-retention-max-age={{ .Values.audit.retention.maxAge }}
            - --audit-retention-max-per-pipeline={{ .Values.audit.retention.maxPerPipeline }}
            {{- end }}
            {{- with .Values.controller.workers }}
            {{- with .promotionStep }}
            - --promotionstep-workers={{ . }}
            {{- end }}
            {{- with .prStatus }}
            - --prstatus-workers={{ . }}
            {{- end }}
            {{- with .policyGate }}
            - --policygate-workers={{ . }}
            {{- end }}
            {{- with .bundle }}
            - --bundle-workers={{ . }}
            {{- end }}
            {{- with .pipeline }}
            - --pipeline-workers={{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.controller.gateStatusHeartbeat }}
            - --gate-status-heartbeat={{ . }}
            {{- end }}
            {{- with .Values.controller.accessLog }}
            {{- if .allRequests }}
            - --access-log-all-requests=true
            {{- end }}
            {{- if .sourceIP }}
            - --access-log-source-ip=true
            {{- end }}
            {{- with .trustedProxies }}
            - --access-log-trusted-proxies={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with (.Values.graph.retire).superseded }}
            - --graph-retire-superseded-after={{ . }}
            {{- end }}
            {{- with (.Values.graph.retire).failed }}
            - --graph-retire-failed-after={{ . }}
            {{- end }}
            {{- with (.Values.graph.retire).verified }}
            - --graph-retire-verified-after={{ . }}
            {{- end }}
            - --override-identity-policy={{ include "kardinal-promoter.fullname" . }}-gate-overrides
            {{- with .Values.controller.gateOverrideMaxMinutes }}
            - --gate-override-max-minutes={{ . }}
            {{- end }}
            {{- with .Values.controller.watchNamespace }}
            - --watch-namespace={{ . }}
            {{- end }}
            {{- with .Values.controller.namespaceShard }}
            - --namespace-shard={{ . }}
            {{- end }}
            {{- with .Values.scm.provider }}
            - --scm-provider={{ . }}
            {{- end }}
            {{- with .Values.scm.apiURL }}
            - --scm-api-url={{ . }}
            {{- end }}
            {{- with .Values.scm.instanceSigners }}
            - --scm-instance-signers={{ join "," . }}
            {{- end }}
            {{- with .Values.scm.allowedRepositories }}
            - --scm-allowed-repositories={{ join "," . }}
            {{- end }}
            {{- if .Values.scm.providersAllowInsecureHTTP }}
            - --scm-providers-allow-http=true
            {{- end }}
            {{- with .Values.scm.gatesCommitStatus }}
            {{- if eq (toString .enabled) "false" }}
            - --gates-commit-status=false
            {{- end }}
            {{- if and .context (ne .context "kardinal/gates") }}
            - --gates-status-context={{ .context }}
            {{- end }}
            {{- end }}
            {{- if .Values.ui.auth.tokenReview }}
            - --ui-tokenreview-auth=true
            {{- end }}
            {{- if .Values.metricCheck.cloudWatch.ambientCredentials }}
            - --metriccheck-cloudwatch-ambient-credentials=true
            {{- end }}
            - --metriccheck-global-slots={{ .Values.metricCheck.querySlots.global }}
            - --metriccheck-namespace-slots={{ .Values.metricCheck.querySlots.perNamespace }}
            {{- with .Values.ui.corsAllowedOrigins }}
            - --cors-allowed-origins={{ join "," . }}
            {{- end }}
            - --ui-allowed-hosts={{ include "kardinal-promoter.uiAllowedHosts" . }}
            {{- with .Values.tracing }}
            {{- if .enabled }}
            - --tracing-enabled=true
            {{- with .endpoint }}
            - --tracing-endpoint={{ . }}
            {{- end }}
            {{- if .insecure }}
            - --tracing-insecure=true
            {{- end }}
            - --tracing-sampling-ratio={{ if kindIs "invalid" .samplingRatio }}0.1{{ else }}{{ .samplingRatio }}{{ end }}
            {{- end }}
            {{- end }}
            {{- with (.Values.egress).allowlist }}
            - --egress-allowlist={{ join "," . }}
            {{- end }}
            {{- range .Values.controller.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # Namespace for the leader-election Lease, the kardinal-version
            # ConfigMap and the default SCM token Secret namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The container's memory limit in bytes: the controller sets the
            # Go runtime's soft memory limit (GOMEMLIMIT) to 90% of it. A
            # GOMEMLIMIT in controller.extraEnv takes precedence.
            - name: KARDINAL_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: controller
                  resource: limits.memory
                  divisor: "1"
            {{- with include "kardinal-promoter.githubSecretName" . }}
            {{- if not $.Values.github.app.enabled }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ include "kardinal-promoter.githubSecretKey" $ }}
            {{- end }}
            # The controller watches this Secret and reloads the SCM provider
            # when the token changes (no restart).
            - name: KARDINAL_SCM_TOKEN_SECRET_NAME
              value: {{ . | quote }}
            - name: KARDINAL_SCM_TOKEN_SECRET_NAMESPACE
              value: {{ $.Release.Namespace | quote }}
            - name: KARDINAL_SCM_TOKEN_SECRET_KEY
              value: {{ include "kardinal-promoter.githubSecretKey" $ | quote }}
            {{- end }}
            {{- with .Values.webhook.secretRef.name }}
            - name: KARDINAL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.webhook.secretRef.key | default "secret" }}
            {{- end }}
            {{- with .Values.bundleAPI.tokenSecretRef.name }}
            - name: KARDINAL_BUNDLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.bundleAPI.tokenSecretRef.key | default "token" }}
            {{- end }}
            {{- with .Values.ui.auth.tokenSecretRef.name }}
            - name: KARDINAL_UI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.ui.auth.tokenSecretRef.key | default "token" }}
            {{- end }}
            {{- with .Values.controller.tlsCertFile }}
            - name: KARDINAL_TLS_CERT_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.tlsKeyFile }}
            - name: KARDINAL_TLS_KEY_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $ports := include "kardinal-promoter.containerPorts" . | fromJson }}
          ports:
            {{- range $name := list "metrics" "health" "ui" "webhook" }}
            - name: {{ $name }}
              containerPort: {{ index $ports $name }}
              protocol: TCP
            {{- end }}
          {{- $shutdownDelay := ternary 5 .Values.shutdownDelaySeconds (kindIs "invalid" .Values.shutdownDelaySeconds) }}
          {{- if gt (int $shutdownDelay) 0 }}
          lifecycle:
            preStop:
              exec:
                # The Pod keeps serving while Services stop routing to it.
                command: ["sleep", "{{ int $shutdownDelay }}"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.topologySpread.enabled (gt (int .Values.replicaCount) 1) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "kardinal-promoter.selectorLabels" . | nindent 14 }}
      {{- end }}
