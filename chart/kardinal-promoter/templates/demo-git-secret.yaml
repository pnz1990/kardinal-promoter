{{- if and .Values.demo.enabled (not .Values.demo.secretRef.name) }}
{{- with include "kardinal-promoter.scmToken" . }}
# The demo Pipeline's git Secret: a copy of scm.token, separate from the
# controller's Secret, which no Pipeline may use. Labelled
# kardinal.io/referenceable so the demo Pipeline may name it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kardinal-promoter.demoSecretName" $ }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: demo
    kardinal.io/referenceable: "true"
type: Opaque
stringData:
  token: {{ . | quote }}
{{- end }}
{{- end }}
