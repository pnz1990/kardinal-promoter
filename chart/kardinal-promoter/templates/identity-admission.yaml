{{/*
Copyright 2026 The kardinal-promoter Authors.
Licensed under the Apache License, Version 2.0

Identity admission policies (docs/guides/security.md, Verified identity).
Records that name a person must name the person who wrote them: the API server
admits them only when the name equals request.userInfo.username. They are not
optional: without them anyone with write access could record someone else's
name.
*/}}
{{- /*
identityBindings renders the Deny binding(s) of identity policy .policy.
Each exempts this release's controller, so each is limited to the
namespaces this release manages: the watched namespace (namespace mode), the
namespaces labelled kardinal.io/shard=<shard> (controller.namespaceShard), and
for the "default" shard also the unlabelled ones (a second binding:
selectors cannot OR). Cluster mode binds every namespace. .paramRef, when
set, is the bindings' paramRef.
*/}}
{{- define "kardinal-promoter.identityBindings" -}}
{{- $root := .root }}
{{- $name := printf "%s-%s" (include "kardinal-promoter.fullname" $root) .policy }}
{{- $selectors := list }}
{{- $shard := $root.Values.controller.namespaceShard | default "" }}
{{- if $root.Values.controller.watchNamespace }}
{{- $selectors = list (dict "suffix" "" "selector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $root.Values.controller.watchNamespace))) }}
{{- else if $shard }}
{{- $selectors = list (dict "suffix" "" "selector" (dict "matchLabels" (dict "kardinal.io/shard" $shard))) }}
{{- if eq $shard "default" }}
{{- $selectors = append $selectors (dict "suffix" "-unlabelled" "selector" (dict "matchExpressions" (list (dict "key" "kardinal.io/shard" "operator" "DoesNotExist")))) }}
{{- end }}
{{- else }}
{{- $selectors = list (dict "suffix" "" "selector" nil) }}
{{- end }}
{{- range $i, $sel := $selectors }}
{{- if $i }}
---
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}{{ $sel.suffix }}
  labels:
    {{- include "kardinal-promoter.labels" $root | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: ["Deny"]
  {{- with $.paramRef }}
  paramRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sel.selector }}
  matchResources:
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
  {{- end }}
{{- end }}
{{- end }}
{{- $controller := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kardinal-promoter.serviceAccountName" .) }}
{{- /* PolicyGate spec fields a gate instance copies from its template (all but overrides). */}}
{{- $instanceSpecFields := list "expression" "message" "recheckInterval" "skipPermission" "when" "selector" "approval" "approvals" "verify" "verdicts" "generated" }}
{{- /* Gate instance metadata a caller other than kro and the controller may not change: all of it but
managedFields, resourceVersion and generation, which the API server writes (name and namespace are immutable). */}}
{{- $instanceMetaFields := list "ownerReferences" "finalizers" "generateName" }}
{{- /* The garbage collector and the namespace controller remove owner references and finalizers. */}}
{{- $cleanup := list "system:serviceaccount:kube-system:generic-garbage-collector" "system:serviceaccount:kube-system:namespace-controller" "system:kube-controller-manager" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-rejection
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["bundles"]
  variables:
    # The controller writes rejections for the UI, which authenticates its
    # callers itself and records the verified requester (docs/guides/security.md,
    # UI API Access Control). Other kardinal controllers:
    # admission.controllerUsernames (exact usernames). The same exception as
    # the gate-overrides policy.
    - name: controller
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
  validations:
    # kardinal reject (spec.rejected) records the rejecting user. A new
    # rejection must name the requester; an existing one is immutable (CRD
    # transition rule), so only its first write is checked.
    - expression: >-
        variables.controller || !has(object.spec.rejected) ||
        (oldObject != null && has(oldObject.spec.rejected)) ||
        object.spec.rejected.by == request.userInfo.username
      messageExpression: >-
        'spec.rejected.by must be your own username "' + request.userInfo.username +
        '", not "' + object.spec.rejected.by + '"; kardinal reject sets it for you'
      reason: Forbidden
    # Its actor stamp names the requester (#1939); what needs no AgentIndex is
    # checked here, always (<release>-actor-records checks agent and sponsor).
    - expression: >-
        variables.controller || !has(object.spec.rejected) ||
        (oldObject != null && has(oldObject.spec.rejected)) || !has(object.spec.rejected.actor) ||
        [object.spec.rejected.actor].all(s, s == null || (s.principal == request.userInfo.username && !has(s.via) &&
          (request.userInfo.username.startsWith('system:serviceaccount:')
            ? s.kind in ['bot', 'agent'] : s.kind in ['human', 'agent'])))
      messageExpression: >-
        'an actor stamp must name you (principal ' + request.userInfo.username +
        '), with no via, and kind ' +
        (request.userInfo.username.startsWith('system:serviceaccount:') ? 'bot or agent' : 'human or agent') +
        '; kardinal sets it for you'
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "bundle-rejection") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-gate-overrides
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["policygates"]
  variables:
    # The controller writes overrides for the UI, which authenticates its
    # callers itself (docs/guides/security.md, UI API Access Control). Other
    # kardinal controllers: admission.controllerUsernames (exact usernames).
    - name: controller
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
    # kro applies gate instances as the Graph ServiceAccount of the namespace.
    # kro acts as the Graph ServiceAccount by impersonating it, so its
    # requests carry no credential of their own. The Graph ServiceAccount
    # lives in the tenant's namespace, where anyone with edit can mint its
    # token (kubectl create token) or run a Pod as it: those requests carry
    # authentication.kubernetes.io/credential-id (TokenRequest and bound
    # tokens) or .../pod-name, and are not kro.
    - name: impersonated
      expression: >-
        !has(request.userInfo.extra) ||
        !('authentication.kubernetes.io/credential-id' in request.userInfo.extra ||
          'authentication.kubernetes.io/pod-name' in request.userInfo.extra)
    - name: graph
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + request.namespace +
        ':' + {{ .Values.graph.serviceAccountName | squote }} && variables.impersonated
    # A gate instance is what a Graph made from a gate template: it has, or
    # had, the kardinal.io/bundle label.
    - name: instance
      expression: >-
        (has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels) ||
        (oldObject != null && has(oldObject.metadata.labels) &&
         'kardinal.io/bundle' in oldObject.metadata.labels)
    # The garbage collector and the namespace controller clean up owner
    # references and finalizers.
    - name: cleanup
      expression: request.userInfo.username in {{ $cleanup | toJson }}
    # The annotations are unchanged but kardinal.io/force-recheck, which
    # anyone who may patch the gate sets to have it evaluated at once
    # (docs/policy-gates.md).
    - name: annotationsKept
      expression: >-
        oldObject != null &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations &&
           object.metadata.annotations[k] == oldObject.metadata.annotations[k])) &&
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(object.metadata.annotations) && k in object.metadata.annotations))
    # The labels are unchanged but kardinal.io/override-check, which a write
    # adding an override sets (kardinal override; <release>-override-marker
    # requires it) so <release>-actor-overrides checks its stamp.
    - name: labelsKept
      expression: >-
        oldObject != null &&
        (has(object.metadata.labels) ? object.metadata.labels : {}).all(k,
          k == 'kardinal.io/override-check' ||
          (has(oldObject.metadata.labels) && k in oldObject.metadata.labels &&
           object.metadata.labels[k] == oldObject.metadata.labels[k])) &&
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}).all(k,
          k == 'kardinal.io/override-check' ||
          (has(object.metadata.labels) && k in object.metadata.labels))
    # Everything in spec but overrides, and the metadata but managedFields,
    # resourceVersion, generation, the force-recheck annotation and the
    # override-check label, are unchanged.
    - name: onlyOverrides
      expression: >-
        oldObject != null &&
        {{- range $i, $f := $instanceSpecFields }}
        {{ if $i }}&& {{ end }}has(object.spec.{{ $f }}) == has(oldObject.spec.{{ $f }}) &&
        (!has(object.spec.{{ $f }}) || object.spec.{{ $f }} == oldObject.spec.{{ $f }})
        {{- end }}
        {{- range $f := $instanceMetaFields }}
        && has(object.metadata.{{ $f }}) == has(oldObject.metadata.{{ $f }}) &&
        (!has(object.metadata.{{ $f }}) || object.metadata.{{ $f }} == oldObject.metadata.{{ $f }})
        {{- end }}
        && variables.annotationsKept && variables.labelsKept
  validations:
    # kardinal override (spec.overrides[]) records who overrode the gate.
    # Every entry that is new, or changed, must name the requester.
    - expression: >-
        variables.controller || !has(object.spec.overrides) ||
        object.spec.overrides.all(o,
          (oldObject != null && has(oldObject.spec.overrides) && o in oldObject.spec.overrides) ||
          (has(o.createdBy) && o.createdBy == request.userInfo.username))
      messageExpression: >-
        'every new spec.overrides entry must have createdBy "' + request.userInfo.username +
        '", your own username; kardinal override sets it for you'
      reason: Forbidden
    # Only kro and the controller create gate instances or change anything
    # in them but spec.overrides: an instance decides a promotion, and
    # overriding it is the audited way to pass it.
    - expression: >-
        !variables.instance || variables.graph || variables.controller || variables.onlyOverrides ||
        (variables.cleanup && oldObject != null)
      message: >-
        only kardinal creates a gate instance (label kardinal.io/bundle) or changes its spec
        or metadata; change the gate template, or record an override with kardinal override
      reason: Forbidden
    # kro adopts an object that already has the name it applies (server-side
    # apply, then force), keeping the fields its template does not set. A
    # PolicyGate made ahead of kro under an instance's name, without the
    # kardinal.io/bundle label, would become that instance with whatever
    # else its maker put there. No one, kro included, may turn an existing
    # PolicyGate into an instance: kro's apply is refused (Forbidden, so it
    # retries rather than treat the object as converged) and the promotion
    # waits until the squatter is deleted.
    - expression: >-
        oldObject == null ||
        (has(oldObject.metadata.labels) && 'kardinal.io/bundle' in oldObject.metadata.labels) ||
        !(has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels)
      message: >-
        a PolicyGate made without the kardinal.io/bundle label cannot become a gate instance;
        delete it, and the promotion Graph creates the instance under that name
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "gate-overrides") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-approvals
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["approvals"]
  variables:
    # Deleting an Approval revokes it: only its approver may, besides the
    # garbage collector (an Approval is owned by its Bundle) and the
    # namespace controller (namespace deletion), and kardinal's controller for
    # the Approvals the UI recorded (uiWrite).
    #
    # The UI API records decisions for its TokenReview-authenticated user
    # (POST /api/v1/ui/approvals): the controller writes the Approval with
    # the user's name and groups after a SubjectAccessReview of the user, and
    # marks it kardinal.io/recorded-via: ui. Only such Approvals may the
    # controller create in another name, or delete. A decision made with
    # kardinal approve is revoked with kardinal approve --revoke.
    - name: uiWrite
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }} &&
        ((object != null && has(object.metadata.annotations) &&
          'kardinal.io/recorded-via' in object.metadata.annotations &&
          object.metadata.annotations['kardinal.io/recorded-via'] == 'ui') ||
         (object == null && oldObject != null && has(oldObject.metadata.annotations) &&
          'kardinal.io/recorded-via' in oldObject.metadata.annotations &&
          oldObject.metadata.annotations['kardinal.io/recorded-via'] == 'ui'))
    - name: cleanup
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:kube-system:generic-garbage-collector',
          'system:serviceaccount:kube-system:namespace-controller',
          'system:kube-controller-manager']
    - name: owners
      expression: >-
        object != null && has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []
  validations:
    # kardinal approve records the approver. The spec is immutable (CRD
    # rule), so only the create is checked.
    - expression: >-
        request.operation != 'CREATE' || variables.uiWrite || object.spec.user == request.userInfo.username
      messageExpression: >-
        'spec.user must be your own username "' + request.userInfo.username +
        '"; kardinal approve sets it for you'
      reason: Forbidden
    # Groups are checked when the Approval is created: removing someone from
    # a group later does not revoke the approval they gave.
    - expression: >-
        request.operation != 'CREATE' || variables.uiWrite || !has(object.spec.groups) ||
        object.spec.groups.all(g, g in request.userInfo.groups)
      messageExpression: >-
        'spec.groups may only list your own groups (' +
        request.userInfo.groups.join(', ') + ')'
      reason: Forbidden
    # The promotion Graph selects Approvals by the kardinal.io/bundle label
    # and filters on spec.environment and spec.bundleUID: the labels must say
    # the same as the spec, so an Approval cannot be counted for another
    # Bundle.
    - expression: >-
        request.operation == 'DELETE' || (
        has(object.metadata.labels) &&
        'kardinal.io/bundle' in object.metadata.labels &&
        object.metadata.labels['kardinal.io/bundle'] == object.spec.bundle &&
        'kardinal.io/environment' in object.metadata.labels &&
        object.metadata.labels['kardinal.io/environment'] == object.spec.environment)
      message: >-
        the kardinal.io/bundle and kardinal.io/environment labels must equal spec.bundle
        and spec.environment
      reason: Invalid
    # The garbage collector deletes an Approval with its Bundle: the only
    # owner an Approval may name is the Bundle it approves (spec.bundleUID),
    # so owning it by something else cannot delete it early, and owning it
    # by its Bundle cannot be dropped to keep it past the Bundle.
    - expression: >-
        request.operation != 'CREATE' ||
        variables.owners.all(r, r.kind == 'Bundle' && r.apiVersion.startsWith('kardinal.io/') &&
          r.uid == object.spec.bundleUID && r.name == object.spec.bundle)
      message: an Approval may be owned only by the Bundle it approves (spec.bundle and spec.bundleUID)
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.cleanup ||
        variables.owners == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: the ownerReferences of an Approval cannot change
      reason: Forbidden
    - expression: >-
        request.operation != 'DELETE' || variables.cleanup || variables.uiWrite ||
        oldObject.spec.user == request.userInfo.username
      messageExpression: >-
        'only ' + oldObject.spec.user + ' can revoke this Approval (kardinal approve --revoke)'
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "approvals") }}
---
{{- /*
verdicts (docs/design/19-verdicts.md, section 4): a Verdict names its writer
(spec.by), as an Approval names its approver. A run-bound Verdict (spec.run)
is the one Verdict of an AgentRun: only the run's own ServiceAccount
(kr-<run>, which kardinal creates for the run) may write it, from the run's
Pod, named after the run; and that ServiceAccount may write nothing else.
The spec is immutable (CRD rule), so only CREATE checks the identity fields.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-verdicts
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["verdicts"]
  variables:
    - name: cleanup
      expression: >-
        request.userInfo.username in {{ $cleanup | toJson }}
    - name: owners
      expression: >-
        object != null && has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []
    # A bound ServiceAccount token (every Pod's projected token) names its
    # Pod; a Job's Pods are named <job>-<5 random characters>, and an
    # AgentRun's Job is named after the AgentRun.
    - name: podNames
      expression: >-
        has(request.userInfo.extra) && 'authentication.kubernetes.io/pod-name' in request.userInfo.extra ?
        request.userInfo.extra['authentication.kubernetes.io/pod-name'] : []
    # An AgentRun's own ServiceAccount: kr-<run>.
    - name: runSA
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:' + request.namespace + ':kr-')
  validations:
    - expression: >-
        request.operation != 'CREATE' || object.spec.by == request.userInfo.username
      messageExpression: >-
        'spec.by must be your own username "' + request.userInfo.username +
        '"; kardinal verify sets it for you'
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' || !has(object.spec.groups) ||
        object.spec.groups.all(g, g in request.userInfo.groups)
      messageExpression: >-
        'spec.groups may only list your own groups (' + request.userInfo.groups.join(', ') + ')'
      reason: Forbidden
    # The promotion Graph selects Verdicts by the kardinal.io/bundle label
    # and filters on the spec: the labels must say the same.
    - expression: >-
        request.operation == 'DELETE' || (
        has(object.metadata.labels) &&
        'kardinal.io/bundle' in object.metadata.labels && object.metadata.labels['kardinal.io/bundle'] == object.spec.bundle &&
        'kardinal.io/environment' in object.metadata.labels && object.metadata.labels['kardinal.io/environment'] == object.spec.environment &&
        'kardinal.io/check' in object.metadata.labels && object.metadata.labels['kardinal.io/check'] == object.spec.check)
      message: >-
        the kardinal.io/bundle, kardinal.io/environment and kardinal.io/check labels must equal
        spec.bundle, spec.environment and spec.check
      reason: Invalid
    - expression: >-
        request.operation != 'CREATE' ||
        variables.owners.all(r, r.kind == 'Bundle' && r.apiVersion.startsWith('kardinal.io/') &&
          r.uid == object.spec.bundleUID && r.name == object.spec.bundle)
      message: a Verdict may be owned only by the Bundle it is about (spec.bundle and spec.bundleUID)
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.cleanup ||
        variables.owners == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: the ownerReferences of a Verdict cannot change
      reason: Forbidden
    # A run-bound Verdict is one vote per run: only the run's own
    # ServiceAccount writes it, from the run's own Pod (its exact Job Pod
    # name), named after the run, so the run writes one.
    - expression: >-
        request.operation != 'CREATE' || !has(object.spec.run) || (
        request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':kr-' + object.spec.run.name &&
        object.metadata.name == object.spec.run.name &&
        variables.podNames.exists(p, p.matches('^' + object.spec.run.name + '-[a-z0-9]{5}$')))
      messageExpression: >-
        'spec.run names AgentRun ' + object.spec.run.name + ': only the Pod of that run may write it ' +
        '(ServiceAccount kr-' + object.spec.run.name + '), and the Verdict must be named after the run'
      reason: Forbidden
    # A run's ServiceAccount writes only its run's Verdict.
    - expression: >-
        request.operation != 'CREATE' || !variables.runSA || has(object.spec.run)
      message: >-
        an AgentRun's ServiceAccount writes only its run's Verdict (spec.run); it cannot vote again
      reason: Forbidden
    - expression: >-
        request.operation != 'DELETE' || variables.cleanup || oldObject.spec.by == request.userInfo.username
      messageExpression: >-
        'only ' + oldObject.spec.by + ' can revoke this Verdict (kardinal verify --revoke)'
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "verdicts") }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-creator
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["bundles"]
  variables:
    # The controller creates Bundles for the UI, the Bundle API,
    # Subscriptions and automatic rollbacks and names their creator: this
    # release's controller ServiceAccount, exactly, plus the exact usernames
    # listed in admission.controllerUsernames (another kardinal controller).
    # Never a namespace or a group: in namespace mode that namespace is the
    # tenant's.
    - name: controller
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
    - name: creator
      expression: >-
        has(object.metadata.annotations) && 'kardinal.io/created-by' in object.metadata.annotations ?
        object.metadata.annotations['kardinal.io/created-by'] : ''
  validations:
    # kardinal.io/created-by is who created the Bundle; an approval gate's
    # excludeAuthor compares approvers with it. Optional, but when set it
    # must be the requester.
    - expression: >-
        request.operation != 'CREATE' || variables.controller || variables.creator == '' ||
        variables.creator == request.userInfo.username
      messageExpression: >-
        'the kardinal.io/created-by annotation must be your own username "' + request.userInfo.username +
        '" (kardinal create bundle sets it), or absent'
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.controller ||
        variables.creator == (has(oldObject.metadata.annotations) &&
          'kardinal.io/created-by' in oldObject.metadata.annotations ?
          oldObject.metadata.annotations['kardinal.io/created-by'] : '')
      message: the kardinal.io/created-by annotation cannot be added, changed or removed after the Bundle is created
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "bundle-creator") }}
---
{{- /* The kinds a promotion Graph (or the controller) makes and nobody else
does: every object of them decides a promotion. */}}
{{- $graphKinds := list "promotionsteps" "prstatuses" "hookruns" "renderruns" "imageverifications" "agentruns" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-graph-objects
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # Spec, metadata and status. DELETE is not checked here: deleting one
      # makes the Graph recreate it (deleting a failed PromotionStep is the
      # documented retry), which forges nothing. HookRuns below are.
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources:
          {{- range $graphKinds }}
          - {{ . }}
          - {{ . }}/status
          {{- end }}
      # A HookRun records that a hook ran: only kardinal deletes them (with
      # the garbage collector and the namespace controller). The step's
      # status.hookRecords keeps a recreated HookRun from running its hook
      # again, but deleting the step too (allowed: it is the documented
      # retry) would drop that record, and the Graph's new HookRun would run
      # the hook a second time.
      # An AgentRun the same way: the Graph recreates a deleted one, and
      # only a Verdict it wrote keeps the recreated run from running again.
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["hookruns", "agentruns"]
      # Per-promotion MetricCheck instances (label kardinal.io/bundle); a
      # MetricCheck people write (no such label) is not checked.
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["metricchecks", "metricchecks/status"]
      # Argo Rollouts AnalysisRuns kardinal creates (label kardinal.io/bundle):
      # only their creation, since the Rollouts controller writes them after.
      - apiGroups: ["argoproj.io"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["analysisruns"]
  variables:
    # This release's controller and the other kardinal controllers listed in
    # admission.controllerUsernames (exact usernames).
    - name: controller
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
    # kro applies a Graph's objects as the Graph ServiceAccount of the namespace.
    # kro acts as the Graph ServiceAccount by impersonating it, so its
    # requests carry no credential of their own. The Graph ServiceAccount
    # lives in the tenant's namespace, where anyone with edit can mint its
    # token (kubectl create token) or run a Pod as it: those requests carry
    # authentication.kubernetes.io/credential-id (TokenRequest and bound
    # tokens) or .../pod-name, and are not kro.
    - name: impersonated
      expression: >-
        !has(request.userInfo.extra) ||
        !('authentication.kubernetes.io/credential-id' in request.userInfo.extra ||
          'authentication.kubernetes.io/pod-name' in request.userInfo.extra)
    - name: graph
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + request.namespace +
        ':' + {{ .Values.graph.serviceAccountName | squote }} && variables.impersonated
    # The garbage collector and the namespace controller remove owner
    # references and finalizers.
    - name: cleanup
      expression: request.userInfo.username in {{ $cleanup | toJson }}
    - name: foreignRun
      expression: >-
        request.resource.group == 'argoproj.io' && object != null &&
        !(has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels)
    # A MetricCheck is a Graph's when it has, or had, kardinal.io/bundle.
    - name: userMetricCheck
      expression: >-
        request.resource.resource == 'metricchecks' && object != null &&
        !(has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels) &&
        !(oldObject != null && has(oldObject.metadata.labels) && 'kardinal.io/bundle' in oldObject.metadata.labels)
    # Anyone who may patch the object may set kardinal.io/force-recheck to
    # have it reconciled at once (docs/troubleshoot-promotions.md): an update of the
    # object itself that changes nothing else in spec or metadata.
    - name: recheckOnly
      expression: >-
        object != null && oldObject != null && (!has(request.subResource) || request.subResource == '') &&
        has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec == oldObject.spec)
        {{- range $f := list "labels" "ownerReferences" "finalizers" }}
        && has(object.metadata.{{ $f }}) == has(oldObject.metadata.{{ $f }}) &&
        (!has(object.metadata.{{ $f }}) || object.metadata.{{ $f }} == oldObject.metadata.{{ $f }})
        {{- end }}
        && (has(object.metadata.annotations) ? object.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations &&
           object.metadata.annotations[k] == oldObject.metadata.annotations[k])) &&
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(object.metadata.annotations) && k in object.metadata.annotations))
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        variables.foreignRun || variables.userMetricCheck || variables.graph || variables.controller ||
        (variables.cleanup && oldObject != null) || variables.recheckOnly
      message: >-
        only kardinal (the promotion Graph or the controller) creates or changes this object, its
        status included: it decides a promotion. Delete it and the promotion Graph recreates it;
        the kardinal.io/force-recheck annotation is the one change open to you
      reason: Forbidden
    # DELETE is matched for HookRuns and AgentRuns only (resourceRules above).
    - expression: >-
        request.operation != 'DELETE' || variables.graph || variables.controller || variables.cleanup
      message: >-
        HookRuns record that a hook ran; only kardinal deletes them (with the garbage collector and
        the namespace controller), and AgentRuns that an agent ran. Promote a new Bundle to run it again
      reason: Forbidden
    # As for gate instances: kro adopts an existing object of the name it
    # applies, so no one may turn an existing MetricCheck into a
    # per-promotion instance.
    - expression: >-
        request.resource.resource != 'metricchecks' || oldObject == null ||
        (has(oldObject.metadata.labels) && 'kardinal.io/bundle' in oldObject.metadata.labels) ||
        !(has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels)
      message: >-
        a MetricCheck made without the kardinal.io/bundle label cannot become a per-promotion
        instance; delete it, and the promotion Graph creates the instance under that name
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "graph-objects") }}
---
{{- /*
scoped-writes: what a caller limited to a virtual subresource of
user-roles.yaml may change (docs/guides/security.md#user-roles). Separate
from the identity policies above: those check names on every write, this one
checks scope for some callers. UPDATE only: creating a Pipeline or a gate
needs create, which the limited roles do not have.
*/}}
{{- $fullname := include "kardinal-promoter.fullname" . }}
{{- $maxOverride := int (.Values.controller.gateOverrideMaxMinutes | default 1440) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $fullname }}-scoped-writes
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["pipelines", "policygates"]
  # The virtual subresources of user-roles.yaml: pipelines/pause and
  # pipelines/hold (pipelines) or policygates/override (policygates) let a
  # caller make one kind of change; <resource>/edit lets it change anything
  # its RBAC update allows. A caller with one of the first and not the
  # second (rbac.userRoles.directWrites grants such callers update) is
  # limited:
  #   - metadata stays as it was, except what the API server sets
  #     (managedFields, resourceVersion, generation): no labels,
  #     annotations, finalizers or ownerReferences (an ownerReference to a
  #     deleted object would have the garbage collector delete it);
  #   - of the spec, only spec.paused and spec.pausedFleets (with
  #     pipelines/pause), spec.lastChange (with either: who made the change),
  #     spec.holds
  #     (with pipelines/hold; the hold-writes policy checks the entries) or
  #     spec.overrides (policygates) changes;
  #   - spec.overrides is append-only, and each new entry names the caller
  #     in createdBy and expires at most controller.gateOverrideMaxMinutes
  #     (the override cap) after its createdAt. CEL has no clock here, so
  #     the PolicyGate reconciler ends each override at most the cap after
  #     it first saw it (status.overrides) and does not count one created
  #     more than 5 minutes after that (condition OverrideIgnored).
  # Callers with neither subresource are not limited here: their RBAC decides.
  # messageExpression cannot use the authorizer, so the messages use only
  # the request.
  variables:
    - name: check
      expression: >-
        authorizer.group('kardinal.io').resource(request.resource.resource)
        .namespace(object.metadata.namespace).name(object.metadata.name)
    - name: exempt
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }} ||
        request.userInfo.username == 'system:serviceaccount:' + object.metadata.namespace +
        ':' + {{ .Values.graph.serviceAccountName | squote }}
    - name: pipeline
      expression: "request.resource.resource == 'pipelines'"
    - name: mayPause
      expression: "variables.pipeline && variables.check.subresource('pause').check('update').allowed()"
    - name: mayHold
      expression: "variables.pipeline && variables.check.subresource('hold').check('update').allowed()"
    - name: mayOverride
      expression: "!variables.pipeline && variables.check.subresource('override').check('update').allowed()"
    # The spec fields a limited caller may change.
    - name: fields
      expression: >-
        variables.pipeline ?
          (variables.mayPause ? ['paused', 'pausedFleets'] : []) + (variables.mayHold ? ['holds'] : []) +
          (variables.mayPause || variables.mayHold ? ['lastChange'] : []) :
          ['overrides']
    - name: limited
      expression: >-
        !variables.exempt && (variables.mayPause || variables.mayHold || variables.mayOverride) &&
        !variables.check.subresource('edit').check('update').allowed()
    - name: serverSet
      expression: "['managedFields', 'resourceVersion', 'generation']"
    # A gate's labels are unchanged but kardinal.io/override-check, which a
    # write adding an override sets (<release>-override-marker).
    - name: labelsKept
      expression: >-
        !variables.pipeline &&
        (has(object.metadata.labels) ? object.metadata.labels : {}).all(k,
          k == 'kardinal.io/override-check' ||
          (has(oldObject.metadata.labels) && k in oldObject.metadata.labels &&
           object.metadata.labels[k] == oldObject.metadata.labels[k])) &&
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}).all(k,
          k == 'kardinal.io/override-check' ||
          (has(object.metadata.labels) && k in object.metadata.labels))
    - name: oldOverrides
      expression: "has(oldObject.spec.overrides) ? oldObject.spec.overrides : []"
    - name: newOverrides
      expression: "has(object.spec.overrides) ? object.spec.overrides : []"
  validations:
    - expression: >-
        !variables.limited ||
        (object.metadata.all(k, k in variables.serverSet || (k == 'labels' && variables.labelsKept) ||
           (k in oldObject.metadata && object.metadata[k] == oldObject.metadata[k])) &&
         oldObject.metadata.all(k, k in variables.serverSet || (k == 'labels' && variables.labelsKept) ||
           k in object.metadata))
      messageExpression: >-
        'you may not change the metadata (labels, annotations, finalizers, ownerReferences) of this ' +
        request.resource.resource + ': you have ' +
        (variables.pipeline ? 'pipelines/pause or pipelines/hold' : 'policygates/override') + ' but not ' +
        request.resource.resource + '/edit'
      reason: Forbidden
    - expression: >-
        !variables.limited ||
        (object.spec.all(k, k in variables.fields || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
         oldObject.spec.all(k, k in variables.fields || k in object.spec))
      messageExpression: >-
        (variables.pipeline ?
          'you may change only spec.paused and spec.pausedFleets (with pipelines/pause), spec.holds (with pipelines/hold) and spec.lastChange of this pipelines' :
          'you may change only spec.overrides of this policygates') +
        ' (you do not have ' + request.resource.resource + '/edit)'
      reason: Forbidden
    - expression: >-
        !variables.limited || variables.pipeline ||
        (size(variables.newOverrides) >= size(variables.oldOverrides) &&
         variables.oldOverrides.all(o, o in variables.newOverrides))
      message: spec.overrides is append-only for you; existing entries may not be changed or removed
      reason: Forbidden
    - expression: >-
        !variables.limited || variables.pipeline ||
        variables.newOverrides.all(o, o in variables.oldOverrides ||
          (has(o.createdBy) && o.createdBy == request.userInfo.username))
      messageExpression: >-
        'every new spec.overrides entry must have createdBy "' + request.userInfo.username + '"'
      reason: Forbidden
    - expression: >-
        !variables.limited || variables.pipeline ||
        variables.newOverrides.all(o, o in variables.oldOverrides ||
          (has(o.createdAt) && has(o.expiresAt) &&
           timestamp(o.expiresAt) > timestamp(o.createdAt) &&
           timestamp(o.expiresAt) - timestamp(o.createdAt) <= duration('{{ $maxOverride }}m')))
      message: >-
        every new spec.overrides entry needs createdAt and an expiresAt at most {{ $maxOverride }} minutes later
      reason: Forbidden
---
{{- include "kardinal-promoter.identityBindings" (dict "root" . "policy" "scoped-writes") }}
