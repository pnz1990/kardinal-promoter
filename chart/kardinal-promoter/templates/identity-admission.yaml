{{/*
Copyright 2026 The kardinal-promoter Authors.
Licensed under the Apache License, Version 2.0

Identity admission policies (docs/guides/security.md, Verified identity).
Records that name a person must name the person who wrote them: the API server
admits them only when the name equals request.userInfo.username. They are not
optional: without them anyone with write access could record someone else's
name. Kubernetes 1.30+ serves admissionregistration.k8s.io/v1
ValidatingAdmissionPolicy (the chart's kubeVersion).
*/}}
{{- $controller := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "kardinal-promoter.serviceAccountName" .) }}
{{- /* PolicyGate spec fields a gate instance copies from its template (all but overrides). */}}
{{- $instanceSpecFields := list "expression" "message" "recheckInterval" "skipPermission" "when" "selector" "approval" "approvals" "generated" }}
{{- /* Gate instance metadata a caller other than kro and the controller may not change: all of it but
managedFields, resourceVersion and generation, which the API server writes (name and namespace are immutable). */}}
{{- $instanceMetaFields := list "labels" "ownerReferences" "finalizers" "generateName" }}
{{- /* The garbage collector and the namespace controller remove owner references and finalizers. */}}
{{- $cleanup := list "system:serviceaccount:kube-system:generic-garbage-collector" "system:serviceaccount:kube-system:namespace-controller" "system:kube-controller-manager" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-rejection
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["bundles"]
  validations:
    # kardinal reject (spec.rejected) records the rejecting user. A new
    # rejection must name the requester; an existing one is immutable (CRD
    # transition rule), so only its first write is checked.
    - expression: >-
        !has(object.spec.rejected) ||
        (oldObject != null && has(oldObject.spec.rejected)) ||
        object.spec.rejected.by == request.userInfo.username
      messageExpression: >-
        'spec.rejected.by must be your own username "' + request.userInfo.username +
        '", not "' + object.spec.rejected.by + '"; kardinal reject sets it for you'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-rejection
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kardinal-promoter.fullname" . }}-bundle-rejection
  validationActions: ["Deny"]
  {{- with .Values.controller.watchNamespace }}
  # Namespace mode: this release manages the watched namespace only.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
  {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-gate-overrides
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["policygates"]
  variables:
    # The controller writes overrides for the UI, which authenticates its
    # callers itself (docs/guides/security.md, UI API Access Control).
    - name: controller
      expression: request.userInfo.username == {{ $controller | quote }}
    # kro applies gate instances as the Graph ServiceAccount of the namespace.
    - name: graph
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + object.metadata.namespace +
        ':' + {{ .Values.graph.serviceAccountName | squote }}
    # A gate instance is what a Graph made from a gate template: it has, or
    # had, the kardinal.io/bundle label.
    - name: instance
      expression: >-
        (has(object.metadata.labels) && 'kardinal.io/bundle' in object.metadata.labels) ||
        (oldObject != null && has(oldObject.metadata.labels) &&
         'kardinal.io/bundle' in oldObject.metadata.labels)
    # The garbage collector and the namespace controller clean up owner
    # references and finalizers.
    - name: cleanup
      expression: request.userInfo.username in {{ $cleanup | toJson }}
    # The annotations are unchanged but kardinal.io/force-recheck, which
    # anyone who may patch the gate sets to have it evaluated at once
    # (docs/policy-gates.md).
    - name: annotationsKept
      expression: >-
        oldObject != null &&
        (has(object.metadata.annotations) ? object.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations &&
           object.metadata.annotations[k] == oldObject.metadata.annotations[k])) &&
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k,
          k == 'kardinal.io/force-recheck' ||
          (has(object.metadata.annotations) && k in object.metadata.annotations))
    # Everything in spec but overrides, and the metadata but managedFields,
    # resourceVersion, generation and the force-recheck annotation, are
    # unchanged.
    - name: onlyOverrides
      expression: >-
        oldObject != null &&
        {{- range $i, $f := $instanceSpecFields }}
        {{ if $i }}&& {{ end }}has(object.spec.{{ $f }}) == has(oldObject.spec.{{ $f }}) &&
        (!has(object.spec.{{ $f }}) || object.spec.{{ $f }} == oldObject.spec.{{ $f }})
        {{- end }}
        {{- range $f := $instanceMetaFields }}
        && has(object.metadata.{{ $f }}) == has(oldObject.metadata.{{ $f }}) &&
        (!has(object.metadata.{{ $f }}) || object.metadata.{{ $f }} == oldObject.metadata.{{ $f }})
        {{- end }}
        && variables.annotationsKept
  validations:
    # kardinal override (spec.overrides[]) records who overrode the gate.
    # Every entry that is new, or changed, must name the requester.
    - expression: >-
        variables.controller || !has(object.spec.overrides) ||
        object.spec.overrides.all(o,
          (oldObject != null && has(oldObject.spec.overrides) && o in oldObject.spec.overrides) ||
          (has(o.createdBy) && o.createdBy == request.userInfo.username))
      messageExpression: >-
        'every new spec.overrides entry must have createdBy "' + request.userInfo.username +
        '", your own username; kardinal override sets it for you'
      reason: Forbidden
    # Only kro and the controller create gate instances or change anything
    # in them but spec.overrides: an instance decides a promotion, and
    # overriding it is the audited way to pass it.
    - expression: >-
        !variables.instance || variables.graph || variables.controller || variables.onlyOverrides ||
        (variables.cleanup && oldObject != null)
      message: >-
        only kardinal creates a gate instance (label kardinal.io/bundle) or changes its spec
        or metadata; change the gate template, or record an override with kardinal override
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-gate-overrides
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kardinal-promoter.fullname" . }}-gate-overrides
  validationActions: ["Deny"]
  {{- with .Values.controller.watchNamespace }}
  # Namespace mode: the controller exemption above is this release's, so the
  # policy applies only to the namespace this release's controller manages.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
  {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-approvals
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["approvals"]
  variables:
    # Deleting an Approval revokes it: only its approver may, besides the
    # garbage collector (an Approval is owned by its Bundle) and the
    # namespace controller (namespace deletion), and kardinal's controller for
    # the Approvals the UI recorded (uiWrite).
    #
    # The UI API records decisions for its TokenReview-authenticated user
    # (POST /api/v1/ui/approvals): the controller writes the Approval with
    # the user's name and groups after a SubjectAccessReview of the user, and
    # marks it kardinal.io/recorded-via: ui. Only such Approvals may the
    # controller create in another name, or delete. A decision made with
    # kardinal approve is revoked with kardinal approve --revoke.
    - name: uiWrite
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }} &&
        ((object != null && has(object.metadata.annotations) &&
          'kardinal.io/recorded-via' in object.metadata.annotations &&
          object.metadata.annotations['kardinal.io/recorded-via'] == 'ui') ||
         (object == null && oldObject != null && has(oldObject.metadata.annotations) &&
          'kardinal.io/recorded-via' in oldObject.metadata.annotations &&
          oldObject.metadata.annotations['kardinal.io/recorded-via'] == 'ui'))
    - name: cleanup
      expression: >-
        request.userInfo.username in [
          'system:serviceaccount:kube-system:generic-garbage-collector',
          'system:serviceaccount:kube-system:namespace-controller',
          'system:kube-controller-manager']
    - name: owners
      expression: >-
        object != null && has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []
  validations:
    # kardinal approve records the approver. The spec is immutable (CRD
    # rule), so only the create is checked.
    - expression: >-
        request.operation != 'CREATE' || variables.uiWrite || object.spec.user == request.userInfo.username
      messageExpression: >-
        'spec.user must be your own username "' + request.userInfo.username +
        '"; kardinal approve sets it for you'
      reason: Forbidden
    # Groups are checked when the Approval is created: removing someone from
    # a group later does not revoke the approval they gave.
    - expression: >-
        request.operation != 'CREATE' || variables.uiWrite || !has(object.spec.groups) ||
        object.spec.groups.all(g, g in request.userInfo.groups)
      messageExpression: >-
        'spec.groups may only list your own groups (' +
        request.userInfo.groups.join(', ') + ')'
      reason: Forbidden
    # The promotion Graph selects Approvals by the kardinal.io/bundle label
    # and filters on spec.environment and spec.bundleUID: the labels must say
    # the same as the spec, so an Approval cannot be counted for another
    # Bundle.
    - expression: >-
        request.operation == 'DELETE' || (
        has(object.metadata.labels) &&
        'kardinal.io/bundle' in object.metadata.labels &&
        object.metadata.labels['kardinal.io/bundle'] == object.spec.bundle &&
        'kardinal.io/environment' in object.metadata.labels &&
        object.metadata.labels['kardinal.io/environment'] == object.spec.environment)
      message: >-
        the kardinal.io/bundle and kardinal.io/environment labels must equal spec.bundle
        and spec.environment
      reason: Invalid
    # The garbage collector deletes an Approval with its Bundle: the only
    # owner an Approval may name is the Bundle it approves (spec.bundleUID),
    # so owning it by something else cannot delete it early, and owning it
    # by its Bundle cannot be dropped to keep it past the Bundle.
    - expression: >-
        request.operation != 'CREATE' ||
        variables.owners.all(r, r.kind == 'Bundle' && r.apiVersion.startsWith('kardinal.io/') &&
          r.uid == object.spec.bundleUID && r.name == object.spec.bundle)
      message: an Approval may be owned only by the Bundle it approves (spec.bundle and spec.bundleUID)
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.cleanup ||
        variables.owners == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : [])
      message: the ownerReferences of an Approval cannot change
      reason: Forbidden
    - expression: >-
        request.operation != 'DELETE' || variables.cleanup || variables.uiWrite ||
        oldObject.spec.user == request.userInfo.username
      messageExpression: >-
        'only ' + oldObject.spec.user + ' can revoke this Approval (kardinal approve --revoke)'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-approvals
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kardinal-promoter.fullname" . }}-approvals
  validationActions: ["Deny"]
  {{- with .Values.controller.watchNamespace }}
  # Namespace mode: this release manages the watched namespace only.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
  {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-creator
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["kardinal.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["bundles"]
  variables:
    # The controller creates Bundles for the UI, the Bundle API,
    # Subscriptions and automatic rollbacks and names their creator: this
    # release's controller ServiceAccount, exactly, plus the exact usernames
    # listed in admission.controllerUsernames (another kardinal controller).
    # Never a namespace or a group: in namespace mode that namespace is the
    # tenant's.
    - name: controller
      expression: >-
        request.userInfo.username in {{ prepend (.Values.admission.controllerUsernames | default list) $controller | toJson }}
    - name: creator
      expression: >-
        has(object.metadata.annotations) && 'kardinal.io/created-by' in object.metadata.annotations ?
        object.metadata.annotations['kardinal.io/created-by'] : ''
  validations:
    # kardinal.io/created-by is who created the Bundle; an approval gate's
    # excludeAuthor compares approvers with it. Optional, but when set it
    # must be the requester.
    - expression: >-
        request.operation != 'CREATE' || variables.controller || variables.creator == '' ||
        variables.creator == request.userInfo.username
      messageExpression: >-
        'the kardinal.io/created-by annotation must be your own username "' + request.userInfo.username +
        '" (kardinal create bundle sets it), or absent'
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || variables.controller ||
        variables.creator == (has(oldObject.metadata.annotations) &&
          'kardinal.io/created-by' in oldObject.metadata.annotations ?
          oldObject.metadata.annotations['kardinal.io/created-by'] : '')
      message: the kardinal.io/created-by annotation cannot be added, changed or removed after the Bundle is created
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-bundle-creator
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kardinal-promoter.fullname" . }}-bundle-creator
  validationActions: ["Deny"]
  {{- with .Values.controller.watchNamespace }}
  # Namespace mode: the controller exemption is this release's.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ . | quote }}
  {{- end }}
