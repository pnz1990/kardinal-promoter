{{- /* Rules are defined in _rbac.tpl. */}}
{{- if .Values.controller.watchNamespace }}
# Namespace mode: the controller's namespaced rules, in the watch namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-manager-role
  namespace: {{ .Values.controller.watchNamespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
  {{- include "kardinal-promoter.rules.namespaced" . | nindent 2 }}
---
{{- end }}
# Leader election and the kardinal-version ConfigMap, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
rules:
  {{- include "kardinal-promoter.rules.release" . | nindent 2 }}
