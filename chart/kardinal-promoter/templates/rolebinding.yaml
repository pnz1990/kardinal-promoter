{{- if .Values.controller.watchNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-manager-rolebinding
  namespace: {{ .Values.controller.watchNamespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kardinal-promoter.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kardinal-promoter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kardinal-promoter.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kardinal-promoter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kardinal-promoter.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kardinal-promoter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
