---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: policygates.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal
    - kardinal-all
    kind: PolicyGate
    listKind: PolicyGateList
    plural: policygates
    shortNames:
    - pg
    singular: policygate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.lastEvaluatedAt
      name: Last-Evaluated
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PolicyGate is a CEL-powered policy check represented as a node in the
          promotion Graph. Platform teams define org-level gates; teams add their own.

          A gate's name must be at most 63 characters, because the Graph copies it
          into a label of each instance. Only the PolicyGates kardinal creates may be
          longer: gate instances ("<gate>-<namespace>-<env>--<bundle>", see pkg/graph
          gateNodeK8sName) and pause freeze gates ("freeze-<pipeline>"). Kardinal
          sets spec.generated on them and never uses a gate with spec.generated as a
          template. The exemption does not go by name, because a template can have
          any name; a template that sets spec.generated is no longer a template.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicyGateSpec defines the desired state of a PolicyGate.
            properties:
              approval:
                description: |-
                  Approval makes the gate wait for people: it is ready only when its
                  expression is true and at least approval.required allowed people have
                  approved the Bundle for the environment (kardinal approve), and none of
                  them rejected it. Copied from the template to every gate instance. For
                  a gate that only waits for approvals, use the expression "true".
                properties:
                  allowAgents:
                    description: |-
                      AllowAgents opts the gate in to approvals by agents. An approval whose
                      actor is an agent counts only when this is true and the agent is in
                      allowedAgents, and never on a version of the agent's own party
                      (the agent, its sponsor, or the sponsor's other agents), whatever
                      excludeAuthor says. allowedUsers and allowedGroups do not apply to
                      agents.
                    type: boolean
                  allowedAgents:
                    description: |-
                      AllowedAgents are the AgentIdentity names whose approvals count when
                      allowAgents is true.
                    items:
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 32
                    type: array
                  allowedGroups:
                    description: |-
                      AllowedGroups are Kubernetes groups: an approval counts when one of the
                      approval's groups is listed. With neither allowedUsers nor
                      allowedGroups, every approval counts; who may approve is then decided
                      by RBAC on approvals.
                    items:
                      type: string
                    type: array
                  allowedUsers:
                    description: AllowedUsers are Kubernetes usernames whose approvals
                      count.
                    items:
                      type: string
                    type: array
                  excludeAuthor:
                    description: |-
                      ExcludeAuthor does not count an approval whose user created the Bundle
                      (no self-approval): the kardinal.io/created-by annotation, which the
                      chart's admission policy pins to the creating user (kardinal create
                      bundle, the Bundle API and the UI set it). A Bundle without it blocks
                      the gate: the rule cannot be enforced.
                      It applies the one-party rule: with an actor stamp on the Bundle, an
                      agent's version cannot be approved by the agent, its sponsor or another
                      agent of that sponsor, and a person's version not by the person's own
                      agents.
                    type: boolean
                  required:
                    default: 1
                    description: |-
                      Required is how many distinct allowed parties must approve. A party
                      is a person, or an agent together with its sponsor
                      (docs/design/18-actor-policy.md): alice and her agent count once.
                    maximum: 100
                    minimum: 1
                    type: integer
                  requiredWhen:
                    description: |-
                      RequiredWhen is a CEL expression, in the gate's own context: the policy
                      holds the gate only while it is true. Unset means always. While it is
                      false approvals are still recorded, approvals.met is true and
                      status.approvalRequired is false. An evaluation error blocks the gate.
                      Example: "actor.kind == 'agent'" (people ship on their own, agents need
                      an approval).
                    maxLength: 4096
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'approval.allowAgents needs approval.allowedAgents: name
                    the agents whose approvals count'
                  rule: '!has(self.allowAgents) || !self.allowAgents || (has(self.allowedAgents)
                    && size(self.allowedAgents) > 0)'
                - message: 'approval.allowedAgents needs approval.allowAgents: true
                    (agent approvals are opt-in)'
                  rule: '!has(self.allowedAgents) || size(self.allowedAgents) == 0
                    || (has(self.allowAgents) && self.allowAgents)'
              approvals:
                description: |-
                  Approvals is written by the promotion Graph on gate instances: the
                  Approvals of the instance's Bundle and environment, copied from the
                  Approval objects, at most 101 (more than 100 blocks the gate). Do not
                  set it; on a template it is ignored.
                items:
                  description: |-
                    GateApproval is an Approval's spec as the Graph copies it into a gate
                    instance (the fields of ApprovalSpec).
                  properties:
                    actor:
                      description: Actor is the Approval's verified actor stamp (docs/actors.md).
                      properties:
                        agent:
                          description: Agent is the AgentIdentity name, when kind
                            is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        asserted:
                          description: |-
                            Asserted holds what the client says about itself. It is recorded as
                            written and never used for a security decision.
                          properties:
                            client:
                              description: Client is the tool that wrote the record
                                (for example kardinal/0.12.0).
                              maxLength: 128
                              type: string
                            model:
                              description: Model is the AI model the client says it
                                runs.
                              maxLength: 128
                              type: string
                            session:
                              description: Session is the client's session or run
                                identifier.
                              maxLength: 128
                              type: string
                          type: object
                        kind:
                          description: Kind is human, agent, bot or controller (docs/actors.md).
                          enum:
                          - human
                          - agent
                          - bot
                          - controller
                          maxLength: 16
                          type: string
                        principal:
                          description: Principal is the username the API server authenticated.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sponsor:
                          description: |-
                            Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                            the record was written, when kind is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        via:
                          description: |-
                            Via says how the controller came to write the record: ui and api for a
                            caller it authenticated, subscription and auto-rollback for its own
                            Bundles. Only the controller may set it.
                          enum:
                          - ui
                          - api
                          - subscription
                          - auto-rollback
                          maxLength: 16
                          type: string
                      required:
                      - kind
                      - principal
                      type: object
                      x-kubernetes-validations:
                      - message: actor.agent and actor.sponsor are set exactly when
                          actor.kind is agent
                        rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                          : (!has(self.agent) && !has(self.sponsor))'
                      - message: a controller actor says why it acted (actor.via)
                        rule: self.kind != 'controller' || has(self.via)
                    bundle:
                      description: Bundle is the Bundle the decision is about.
                      type: string
                    bundleUID:
                      description: BundleUID is that Bundle's UID.
                      type: string
                    comment:
                      description: Comment is the approver's note.
                      type: string
                    decision:
                      description: Decision is approve or reject.
                      type: string
                    environment:
                      description: Environment is the environment the decision is
                        for.
                      type: string
                    groups:
                      description: Groups are the approver's groups that count for
                        allowedGroups.
                      items:
                        type: string
                      type: array
                    user:
                      description: User is the approver's Kubernetes username.
                      type: string
                  required:
                  - bundle
                  - bundleUID
                  - decision
                  - environment
                  - user
                  type: object
                maxItems: 101
                type: array
              expression:
                description: |-
                  Expression is the CEL expression evaluated to determine if promotion
                  is allowed. Must evaluate to a boolean.
                minLength: 1
                type: string
              generated:
                description: |-
                  Generated is set by kardinal on the PolicyGates it creates: the gate
                  instances a promotion Graph makes from a template, and the freeze gate
                  of a paused Pipeline. Kardinal never uses a generated PolicyGate as a
                  template, so only a generated PolicyGate may have a name longer than 63
                  characters. Do not set it on a gate you write: a generated gate never
                  applies to an environment.
                type: boolean
              message:
                description: Message is a human-readable explanation shown when the
                  gate blocks.
                type: string
              overrides:
                description: |-
                  Overrides holds time-limited emergency overrides.
                  When any non-expired override exists (matching Stage or with empty Stage),
                  the gate passes immediately. Expired overrides are kept as audit records.
                items:
                  description: |-
                    PolicyGateOverride is a time-limited emergency override record.
                    When any non-expired override exists for a gate, the gate passes immediately
                    without evaluating the CEL expression, and status.reason reads
                    "OVERRIDDEN by <user>: <reason> (expires <time>)". A PR opened while the
                    override is active lists the gate as Pass with that reason. Expired entries
                    are kept as an audit record.
                  properties:
                    actor:
                      description: |-
                        Actor is who created the override (docs/actors.md): the verified
                        kardinal.io/actor stamp. Its principal equals createdBy.
                      properties:
                        agent:
                          description: Agent is the AgentIdentity name, when kind
                            is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        asserted:
                          description: |-
                            Asserted holds what the client says about itself. It is recorded as
                            written and never used for a security decision.
                          properties:
                            client:
                              description: Client is the tool that wrote the record
                                (for example kardinal/0.12.0).
                              maxLength: 128
                              type: string
                            model:
                              description: Model is the AI model the client says it
                                runs.
                              maxLength: 128
                              type: string
                            session:
                              description: Session is the client's session or run
                                identifier.
                              maxLength: 128
                              type: string
                          type: object
                        kind:
                          description: Kind is human, agent, bot or controller (docs/actors.md).
                          enum:
                          - human
                          - agent
                          - bot
                          - controller
                          maxLength: 16
                          type: string
                        principal:
                          description: Principal is the username the API server authenticated.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sponsor:
                          description: |-
                            Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                            the record was written, when kind is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        via:
                          description: |-
                            Via says how the controller came to write the record: ui and api for a
                            caller it authenticated, subscription and auto-rollback for its own
                            Bundles. Only the controller may set it.
                          enum:
                          - ui
                          - api
                          - subscription
                          - auto-rollback
                          maxLength: 16
                          type: string
                      required:
                      - kind
                      - principal
                      type: object
                      x-kubernetes-validations:
                      - message: actor.agent and actor.sponsor are set exactly when
                          actor.kind is agent
                        rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                          : (!has(self.agent) && !has(self.sponsor))'
                      - message: a controller actor says why it acted (actor.via)
                        rule: self.kind != 'controller' || has(self.via)
                    createdAt:
                      description: CreatedAt is when the override was created (set
                        by the CLI).
                      format: date-time
                      type: string
                    createdBy:
                      description: |-
                        CreatedBy is the Kubernetes username of whoever created the override.
                        The chart's ValidatingAdmissionPolicy admits a new override only when
                        createdBy equals the requesting user (kardinal override reads it with a
                        SelfSubjectReview), or when the controller writes it for the UI.
                      type: string
                    expiresAt:
                      description: |-
                        ExpiresAt is when this override stops being effective.
                        After this time the gate evaluates CEL normally.
                      format: date-time
                      type: string
                    reason:
                      description: Reason is the mandatory human-readable justification
                        for the override.
                      maxLength: 1024
                      minLength: 1
                      type: string
                    stage:
                      description: |-
                        Stage is the environment name this override applies to.
                        An empty string applies to all environments.
                      maxLength: 63
                      type: string
                  required:
                  - expiresAt
                  - reason
                  type: object
                type: array
              recheckInterval:
                default: 5m
                description: |-
                  RecheckInterval is how often to re-evaluate time-based gates.
                  Uses Go duration format (e.g. "5m", "1h"). The minimum is 10s: a smaller
                  value is raised to 10s, and "0" or an invalid value means the default.
                pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                type: string
              skipPermission:
                default: false
                description: |-
                  SkipPermission marks a skip-permission gate as granting skips. A Bundle
                  may skip (intent.skipEnvironments) an environment an org gate applies to
                  only when a gate labelled kardinal.io/type=skip-permission, with
                  skipPermission true, in an org policy namespace, applies to that
                  environment. Gates in other namespaces never grant a skip. The permission
                  gate's expression is evaluated like any gate, in front of the next
                  environment the Bundle promotes, so that environment waits until it is true.
                  On any other gate this field has no effect.
                type: boolean
              verdicts:
                description: |-
                  Verdicts is written by the promotion Graph on gate instances: the
                  Verdicts of the instance's Bundle for verify.environment and
                  verify.check from verifiers the gate allows, copied from the Verdict
                  objects, at most 101 (more than 100 blocks the gate). Do not set it; on
                  a template it is ignored.
                items:
                  description: GateVerdict is a Verdict as the Graph copies it into
                    a gate instance.
                  properties:
                    actor:
                      description: Actor is the Verdict's actor stamp.
                      properties:
                        agent:
                          description: Agent is the AgentIdentity name, when kind
                            is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        asserted:
                          description: |-
                            Asserted holds what the client says about itself. It is recorded as
                            written and never used for a security decision.
                          properties:
                            client:
                              description: Client is the tool that wrote the record
                                (for example kardinal/0.12.0).
                              maxLength: 128
                              type: string
                            model:
                              description: Model is the AI model the client says it
                                runs.
                              maxLength: 128
                              type: string
                            session:
                              description: Session is the client's session or run
                                identifier.
                              maxLength: 128
                              type: string
                          type: object
                        kind:
                          description: Kind is human, agent, bot or controller (docs/actors.md).
                          enum:
                          - human
                          - agent
                          - bot
                          - controller
                          maxLength: 16
                          type: string
                        principal:
                          description: Principal is the username the API server authenticated.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sponsor:
                          description: |-
                            Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                            the record was written, when kind is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        via:
                          description: |-
                            Via says how the controller came to write the record: ui and api for a
                            caller it authenticated, subscription and auto-rollback for its own
                            Bundles. Only the controller may set it.
                          enum:
                          - ui
                          - api
                          - subscription
                          - auto-rollback
                          maxLength: 16
                          type: string
                      required:
                      - kind
                      - principal
                      type: object
                      x-kubernetes-validations:
                      - message: actor.agent and actor.sponsor are set exactly when
                          actor.kind is agent
                        rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                          : (!has(self.agent) && !has(self.sponsor))'
                      - message: a controller actor says why it acted (actor.via)
                        rule: self.kind != 'controller' || has(self.via)
                    bundle:
                      description: Bundle is the Bundle verified.
                      type: string
                    bundleUID:
                      description: BundleUID is that Bundle's UID.
                      type: string
                    by:
                      description: By is the writer's username.
                      type: string
                    check:
                      description: Check is the check.
                      type: string
                    createdAt:
                      description: |-
                        CreatedAt is the Verdict's creationTimestamp, written by the API
                        server.
                      format: date-time
                      type: string
                    environment:
                      description: Environment is the environment verified.
                      type: string
                    evidenceURL:
                      description: EvidenceURL is the verifier's evidence link.
                      type: string
                    findings:
                      description: Findings is how many findings the Verdict lists.
                      type: integer
                    groups:
                      description: Groups are the writer's groups.
                      items:
                        type: string
                      type: array
                    highFindings:
                      description: HighFindings is how many of them are high or critical.
                      type: integer
                    name:
                      description: Name is the Verdict's name.
                      type: string
                    result:
                      description: Result is pass, fail or inconclusive.
                      type: string
                    run:
                      description: Run is the AgentRun that wrote it.
                      properties:
                        attempt:
                          description: Attempt is the attempt's number (1-based).
                          maximum: 6
                          minimum: 1
                          type: integer
                        index:
                          description: Index is the run's number among the check's
                            runs (1-based).
                          maximum: 10
                          minimum: 1
                          type: integer
                        name:
                          description: Name is the AgentRun's name.
                          maxLength: 52
                          minLength: 1
                          type: string
                      required:
                      - attempt
                      - index
                      - name
                      type: object
                    summary:
                      description: Summary is the verifier's summary.
                      type: string
                  required:
                  - bundle
                  - bundleUID
                  - by
                  - check
                  - environment
                  - name
                  - result
                  type: object
                maxItems: 101
                type: array
              verify:
                description: |-
                  Verify makes the gate wait for verdicts (docs/design/19-verdicts.md):
                  it is ready only when its expression is true and at least
                  verify.required verifiers found the Bundle to pass verify.check in
                  verify.environment, and no more than verify.maxFailures found it to
                  fail. Copied from the template to every gate instance. For a gate that
                  only waits for verdicts, use the expression "true".
                properties:
                  allowedAgents:
                    description: |-
                      AllowedAgents are the agents (AgentIdentity names) whose verdicts
                      count. An agent's verdict counts only when the agent is listed.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  allowedGroups:
                    description: |-
                      AllowedGroups are groups: a verdict counts when one of its groups is
                      listed.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  allowedUsers:
                    description: |-
                      AllowedUsers are the usernames of people and bots whose verdicts
                      count. With neither allowedUsers nor allowedGroups, every verdict by
                      someone who is not an agent counts.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                  check:
                    description: Check is the verification the gate waits for (Verdict
                      spec.check).
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  environment:
                    description: |-
                      Environment is the environment verified, where the version already
                      runs: an upstream of the environment the gate applies to. Empty: that
                      environment's only direct upstream.
                    maxLength: 63
                    type: string
                  excludeAuthor:
                    default: true
                    description: |-
                      ExcludeAuthor does not count a verdict from the version's author, the
                      author's agent or that agent's sponsor (one party). An agent's verdict
                      on work of its own party never counts, whatever this says.
                    type: boolean
                  maxFailures:
                    description: |-
                      MaxFailures is how many failing votes the gate tolerates; one more
                      blocks it.
                    maximum: 20
                    minimum: 0
                    type: integer
                  onInconclusive:
                    default: hold
                    description: |-
                      OnInconclusive is what an inconclusive verdict does: hold (wait for
                      more), retry (wait, and run the AgentRun again, up to retries), or fail
                      (count it as a failing vote).
                    enum:
                    - hold
                    - retry
                    - fail
                    type: string
                  onTimeout:
                    default: fail
                    description: |-
                      OnTimeout is what the gate does once the timeout passed without a
                      result: fail (stay blocked) or allow (pass, and say so).
                    enum:
                    - fail
                    - allow
                    type: string
                  required:
                    default: 1
                    description: Required is how many votes must pass.
                    maximum: 20
                    minimum: 1
                    type: integer
                  retries:
                    description: |-
                      Retries is how many more attempts each AgentRun gets after an
                      inconclusive verdict, or none, with onInconclusive: retry.
                    maximum: 5
                    minimum: 0
                    type: integer
                  run:
                    description: 'Run runs verifiers in the cluster: AgentRuns of
                      a StepTemplate.'
                    properties:
                      count:
                        description: 'Count is how many AgentRuns run per version.
                          Default: verify.required.'
                        maximum: 10
                        minimum: 1
                        type: integer
                      namespace:
                        description: |-
                          Namespace is the namespace the agent tests. Default: the verified
                          environment's workload namespace.
                        maxLength: 63
                        type: string
                      template:
                        description: Template is the StepTemplate the AgentRuns run.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - template
                    type: object
                  timeout:
                    description: |-
                      Timeout bounds the wait, from the time the version passed its health
                      check in the verified environment. Verdicts written later do not count.
                      Empty or "0": no timeout.
                    pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                    type: string
                required:
                - check
                type: object
                x-kubernetes-validations:
                - message: 'verify.retries needs onInconclusive: retry'
                  rule: '!has(self.retries) || self.retries == 0 || self.onInconclusive
                    == ''retry'''
                - message: verify.run.count must be at least verify.required
                  rule: '!has(self.run) || !has(self.run.count) || self.run.count
                    >= self.required'
              when:
                description: |-
                  When is ignored: every gate on an environment is re-checked right
                  before that environment's PromotionStep starts. It stays in the
                  schema only so that a Graph built by an earlier release, whose gate
                  instances carry it, still compiles while its Bundle finishes; gate
                  instances do not copy it. Leave it unset.
                enum:
                - pre-deploy
                - post-deploy
                type: string
            required:
            - expression
            type: object
          status:
            description: PolicyGateStatus defines the observed state of a PolicyGate.
            properties:
              approvalRequired:
                description: |-
                  ApprovalRequired is whether spec.approval held the gate at the last
                  evaluation: false while approval.requiredWhen is false, true otherwise.
                  Unset on a gate without a policy, and on one not yet evaluated.
                type: boolean
              approvals:
                description: |-
                  Approvals records each decision in spec.approvals and whether the gate
                  counted it (spec.approval), for kardinal explain, the PR evidence and
                  the UI.
                items:
                  description: GateApprovalStatus records how the gate counted one
                    approval.
                  properties:
                    actor:
                      description: 'Actor is who decided: the Approval''s actor stamp
                        (docs/actors.md).'
                      properties:
                        agent:
                          description: Agent is the AgentIdentity name, when kind
                            is agent.
                          maxLength: 253
                          minLength: 1
                          type: string
                        asserted:
                          description: |-
                            Asserted holds what the client says about itself. It is recorded as
                            written and never used for a security decision.
                          properties:
                            client:
                              description: Client is the tool that wrote the record
                                (for example kardinal/0.12.0).
                              maxLength: 128
                              type: string
                            model:
                              description: Model is the AI model the client says it
                                runs.
                              maxLength: 128
                              type: string
                            session:
                              description: Session is the client's session or run
                                identifier.
                              maxLength: 128
                              type: string
                          type: object
                        kind:
                          description: Kind is human, agent, bot or controller (docs/actors.md).
                          enum:
                          - human
                          - agent
                          - bot
                          - controller
                          maxLength: 16
                          type: string
                        principal:
                          description: Principal is the username the API server authenticated.
                          maxLength: 253
                          minLength: 1
                          type: string
                        sponsor:
                          description: |-
                            Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
