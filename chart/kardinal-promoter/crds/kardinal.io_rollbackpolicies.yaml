---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: rollbackpolicies.kardinal.io
spec:
  group: kardinal.io
  names:
    kind: RollbackPolicy
    listKind: RollbackPolicyList
    plural: rollbackpolicies
    shortNames:
    - rbp
    singular: rollbackpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.shouldRollback
      name: ShouldRollback
      type: boolean
    - jsonPath: .status.consecutiveFailures
      name: Failures
      type: integer
    - jsonPath: .spec.failureThreshold
      name: Threshold
      type: integer
    - jsonPath: .status.conditions[?(@.type=="RollbackRefused")].status
      name: Refused
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RollbackPolicy monitors consecutive health-check failures on a PromotionStep
          and triggers an auto-rollback by creating a rollback Bundle when the
          failure threshold is exceeded.

          Architecture: the RollbackPolicyReconciler reads
          PromotionStep.status.consecutiveHealthFailures and writes
          status.shouldRollback (own CRD status). This makes the rollback
          decision observable by the Graph, eliminating PS-6 and PS-7 from
          docs/design/11-graph-purity-tech-debt.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RollbackPolicySpec defines the desired state of a RollbackPolicy.
              Nothing creates RollbackPolicy objects automatically: the controller only
              reconciles the ones that exist. Automatic rollback on health failure is
              configured with Pipeline spec.environments[].onHealthFailure: rollback.
            properties:
              bundleRef:
                description: |-
                  BundleRef is the name of the Bundle being monitored. Only the PromotionSteps
                  of this Bundle in Environment are read: the steps labelled
                  kardinal.io/pipeline and kardinal.io/environment whose spec.bundleName
                  (or, when that is empty, kardinal.io/bundle label) is BundleRef. When the highest
                  ConsecutiveHealthFailures among them (one step per region) reaches
                  FailureThreshold, a rollback Bundle is created.
                minLength: 1
                type: string
              environment:
                description: Environment is the environment this policy monitors.
                minLength: 1
                type: string
              failureThreshold:
                default: 3
                description: |-
                  FailureThreshold is the number of consecutive health-check failures
                  required to trigger a rollback. Defaults to 3; the controller also
                  treats a value <= 0 as 3.
                type: integer
              pipelineName:
                description: PipelineName is the Pipeline this policy monitors.
                minLength: 1
                type: string
            required:
            - bundleRef
            - environment
            - pipelineName
            type: object
          status:
            description: |-
              RollbackPolicyStatus holds the observed state of the rollback policy.
              Written exclusively by the RollbackPolicyReconciler.
            properties:
              conditions:
                description: |-
                  Conditions holds status conditions. RollbackRefused is True when the
                  failure threshold was reached but no rollback Bundle was created because
                  the rollback planner refused (the message says why, for example when no
                  earlier Bundle was Verified in the environment). It is False once a
                  rollback Bundle is created (reason RollbackCreated), or when the
                  failures drop below the threshold (reason BelowThreshold). Roll back
                  by hand with kardinal rollback.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: |-
                  ConsecutiveFailures is the most recent consecutive health failure count
                  observed from the associated PromotionStep.
                type: integer
              lastEvaluatedAt:
                description: LastEvaluatedAt is the timestamp of the most recent reconcile
                  evaluation.
                format: date-time
                type: string
              rollbackBundleName:
                description: |-
                  RollbackBundleName is the name of the rollback Bundle created when
                  ShouldRollback became true. Nil if no rollback has been triggered.
                type: string
              shouldRollback:
                description: |-
                  ShouldRollback is true while the failure threshold is reached, and
                  stays true once the policy has created a rollback Bundle, also when
                  the controller stopped before writing rollbackBundleName (the next
                  evaluation writes it). It is false again when the failures drop below
                  the threshold before a rollback Bundle exists (for example after
                  RollbackRefused).
                  The Graph can read this field via a Watch node expression.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
