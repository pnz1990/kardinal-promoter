---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: imageverifications.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal-all
    kind: ImageVerification
    listKind: ImageVerificationList
    plural: imageverifications
    shortNames:
    - iv
    singular: imageverification
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pipelineName
      name: Pipeline
      type: string
    - jsonPath: .spec.bundleName
      name: Bundle
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageVerification checks the signatures of one Bundle's images (and of
          its config commit) before the Bundle is promoted. Created by the Bundle's
          kro Graph; reconciled by the ImageVerification reconciler.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageVerificationSpec is what one Bundle must prove before its first
              environments are promoted. The Bundle's Graph creates it from the
              Pipeline's spec.imageVerification and the Bundle's images. It is
              immutable: a policy change gives a new ImageVerification (its name carries
              a hash of the spec), so a verdict is never reused for another policy.
            properties:
              bundleName:
                description: BundleName is the Bundle.
                minLength: 1
                type: string
              commit:
                description: Commit is the config commit to verify, when commits.requireSigned.
                properties:
                  repo:
                    description: Repo is the git repository URL.
                    type: string
                  scmProvider:
                    description: |-
                      ScmProvider is the provider of the Pipeline's spec.git.providerRef,
                      as the translator resolved it: the signature is checked with that
                      provider (its token, host and allowedRepositories). Unset, the
                      controller's --scm-provider checks it.
                    properties:
                      kind:
                        description: Kind is ScmProvider or ClusterScmProvider.
                        enum:
                        - ScmProvider
                        - ClusterScmProvider
                        type: string
                      name:
                        description: Name is the provider's name; a ScmProvider is
                          in the step's namespace.
                        type: string
                      uid:
                        description: UID is the provider's metadata.uid when the Graph
                          was built.
                        type: string
                    required:
                    - kind
                    - name
                    - uid
                    type: object
                  sha:
                    description: SHA is the commit.
                    type: string
                required:
                - repo
                - sha
                type: object
              images:
                description: Images are the images to verify, pinned by digest.
                items:
                  description: VerifiedImage is one image an ImageVerification checks.
                  properties:
                    digest:
                      description: Digest is the sha256 digest the Bundle pins.
                      pattern: ^sha256:[a-f0-9]{64}$
                      type: string
                    repository:
                      description: Repository is the image repository, without tag
                        or digest.
                      type: string
                  required:
                  - digest
                  - repository
                  type: object
                type: array
              pipelineName:
                description: PipelineName is the Pipeline.
                minLength: 1
                type: string
              policy:
                description: Policy is the Pipeline's policy (its images selector
                  already applied).
                properties:
                  attestations:
                    description: |-
                      Attestations are the in-toto attestations each verified image must (or
                      may) carry, as Sigstore bundles in its OCI referrers: SLSA provenance,
                      vulnerability scans with VEX, and any other predicate. Each result is
                      recorded in status.attestations; PolicyGate CEL reads it as
                      attestations.<name> (docs/image-verification.md#attestations).
                    items:
                      description: |-
                        AttestationPolicy is one attestation an image carries: its predicate
                        type, who may sign it, and what the ImageVerification decides itself
                        (required, slsa.minLevel). Everything else is a gate's decision.
                      properties:
                        authorities:
                          description: |-
                            Authorities name the spec.imageVerification.authorities that may sign
                            the attestation.
                          items:
                            maxLength: 63
                            type: string
                          maxItems: 10
                          minItems: 1
                          type: array
                        name:
                          description: 'Name names the result: a gate reads attestations.<name>.'
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z][a-z0-9]*$
                          type: string
                        predicateType:
                          description: |-
                            PredicateType is the in-toto predicate type, exactly
                            ("https://slsa.dev/provenance/v1").
                          maxLength: 256
                          minLength: 1
                          type: string
                        required:
                          description: |-
                            Required holds the version until every image carries a verified
                            attestation of this type, and fails it at the timeout. False records
                            the attestation when it is there.
                          type: boolean
                        slsa:
                          description: |-
                            SLSA grants SLSA build levels to provenance builders, and holds a
                            version below MinLevel.
                          properties:
                            builders:
                              description: |-
                                Builders map trusted builder IDs to the level granted to them.
                                Provenance from a builder not listed is level 1.
                              items:
                                description: SLSABuilder is a trusted builder and
                                  the level granted to it.
                                properties:
                                  id:
                                    description: ID is the builder's runDetails.builder.id,
                                      exactly.
                                    maxLength: 512
                                    minLength: 1
                                    type: string
                                  level:
                                    description: Level is the SLSA build level granted
                                      (1 to 3).
                                    maximum: 3
                                    minimum: 1
                                    type: integer
                                required:
                                - id
                                - level
                                type: object
                              maxItems: 20
                              type: array
                            minLevel:
                              description: |-
                                MinLevel holds the version (Failed at the timeout) while an image's
                                level is below it. 0 holds nothing.
                              maximum: 3
                              minimum: 0
                              type: integer
                          type: object
                        vex:
                          description: |-
                            VEX names who may say, with OpenVEX statements, that a finding of the
                            scan does not apply.
                          properties:
                            authorities:
                              description: |-
                                Authorities name the spec.imageVerification.authorities whose OpenVEX
                                attestations count. A scan's own signer does not suppress its
                                findings unless it is listed here.
                              items:
                                maxLength: 63
                                type: string
                              maxItems: 10
                              minItems: 1
                              type: array
                            predicateType:
                              description: |-
                                PredicateType is the predicate type of the VEX attestations. Empty
                                means https://openvex.dev/ns.
                              maxLength: 256
                              type: string
                          required:
                          - authorities
                          type: object
                      required:
                      - authorities
                      - name
                      - predicateType
                      type: object
                      x-kubernetes-validations:
                      - message: vex applies to a vulnerability scan (cosign vuln
                          or in-toto vulns predicate)
                        rule: '!has(self.vex) || self.predicateType in [''https://cosign.sigstore.dev/attestation/vuln/v1'',
                          ''https://in-toto.io/attestation/vulns'']'
                      - message: slsa applies to SLSA provenance or a SLSA VSA
                        rule: '!has(self.slsa) || self.predicateType in [''https://slsa.dev/provenance/v1'',
                          ''https://slsa.dev/verification_summary/v1'']'
                    maxItems: 10
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  authorities:
                    description: |-
                      Authorities are the signers an image may be signed by: an image is
                      verified when one of its signatures verifies against any authority.
                    items:
                      description: |-
                        SignatureAuthority is one accepted signer: a public key, or a keyless
                        (Sigstore Fulcio) identity. Exactly one of key and keyless is set.
                      properties:
                        key:
                          description: |-
                            Key is a PEM public key (cosign.pub) in a Secret of the Pipeline
                            namespace.
                          properties:
                            requireTransparencyLog:
                              description: |-
                                RequireTransparencyLog requires a Rekor entry (and its inclusion
                                proof) in the Sigstore bundle. Default false: a key signature is
                                verified against the key alone, like cosign --insecure-ignore-tlog.
                              type: boolean
                            secretRef:
                              description: SecretRef names the Secret and key holding
                                the PEM public key.
                              properties:
                                key:
                                  description: Key is the data key.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the object name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - secretRef
                          type: object
                        keyless:
                          description: |-
                            Keyless is a Sigstore keyless identity: the OIDC issuer and subject
                            of the Fulcio certificate that signed.
                          properties:
                            issuer:
                              description: |-
                                Issuer is the OIDC issuer, for example
                                https://token.actions.githubusercontent.com.
                              minLength: 1
                              type: string
                            subject:
                              description: |-
                                Subject is the certificate's subject (SAN), for example
                                https://github.com/myorg/app/.github/workflows/release.yml@refs/heads/main.
                              type: string
                            subjectRegExp:
                              description: SubjectRegExp is a regular expression the
                                subject must match.
                              type: string
                            trustedRootRef:
                              description: |-
                                TrustedRootRef names a Secret key in the Pipeline namespace holding a
                                Sigstore trusted_root.json (a private Sigstore). Empty means the
                                Sigstore public-good instance, whose trusted root the controller
                                fetches through TUF.
                              properties:
                                key:
                                  description: Key is the data key.
                                  minLength: 1
                                  type: string
                                name:
                                  description: Name is the object name.
                                  minLength: 1
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                          required:
                          - issuer
                          type: object
                          x-kubernetes-validations:
                          - message: set exactly one of subject and subjectRegExp
                            rule: has(self.subject) != has(self.subjectRegExp)
                        name:
                          description: Name identifies the authority in results.
                          maxLength: 63
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of key and keyless
                        rule: has(self.key) != has(self.keyless)
                    maxItems: 10
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  commits:
                    description: |-
                      Commits, when requireSigned is true, requires the commit of a config or
                      mixed Bundle (spec.configRef.commitSHA) to be signed, as the SCM
                      provider reports it (GitHub, GitLab, Forgejo, Gitea).
                    properties:
                      allowedSigners:
                        description: |-
                          AllowedSigners, when set, also requires the signer to be one of these:
                          an SCM login or an email address, as the SCM reports the verified
                          signer (GitLab: the key owner's verified email, the committer's for
                          SSH; never a key title). Commits the SCM platform signed itself, not a
                          person, are refused unless listed here explicitly: "web-flow" (GitHub
                          web UI edits and merges), "gitlab-system" (GitLab verified_system) and
                          "forgejo-instance" (the Forgejo/Gitea instance key). To accept PRs
                          merged in the web UI, list the platform identity. Empty means any
                          person's signature the SCM verified.
                        items:
                          type: string
                        maxItems: 50
                        type: array
                      authorities:
                        description: |-
                          Authorities, when set, has kardinal verify the commit's gitsign
                          (Sigstore) signature itself instead of asking the SCM: they name
                          keyless spec.imageVerification.authorities, and the commit verifies
                          when its signature verifies against one of them. The signed payload
                          is read from the SCM API (GitHub, Forgejo, Gitea), the commit SHA is
                          recomputed from it, and the Rekor entry embedded in the signature is
                          checked offline against the authority's trusted root. A GPG or SSH
                          signature is then refused, and allowedSigners does not apply. See
                          docs/image-verification.md#commit-signatures-with-gitsign.
                        items:
                          maxLength: 63
                          type: string
                        maxItems: 10
                        type: array
                      requireSigned:
                        description: |-
                          RequireSigned requires the config Bundle's commit to be signed with a
                          signature the SCM provider verified. configRef.commitSHA must then be
                          a full 40- or 64-character SHA, and configRef.gitRepo must be on the
                          controller's SCM host.
                        type: boolean
                    required:
                    - requireSigned
                    type: object
                  images:
                    description: |-
                      Images selects the Bundle images to verify by repository, with "*"
                      matching any characters ("ghcr.io/myorg/*"). Empty means every image.
                      Every selected image must be pinned by digest in the Bundle.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  insecureRegistries:
                    description: |-
                      InsecureRegistries are registry hosts ("registry.local:5000") read over
                      plain HTTP. Every other registry is read over HTTPS.
                    items:
                      type: string
                    maxItems: 10
                    type: array
                  registrySecretRef:
                    description: |-
                      RegistrySecretRef names a kubernetes.io/dockerconfigjson Secret in the
                      Pipeline namespace with credentials for the registries holding the
                      images and their signatures. Without it registries are read
                      anonymously.
                    properties:
                      name:
                        description: Name is the object name.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  signatureRepository:
                    description: |-
                      SignatureRepository is the repository that holds the signatures, when
                      they are not stored next to the images (cosign's COSIGN_REPOSITORY),
                      for example "registry.example.com/signatures". Signatures are looked
                      up there by image digest.
                    type: string
                  timeout:
                    description: |-
                      Timeout bounds how long a missing signature is waited for (CI may sign
                      after it pushes), from the moment the ImageVerification starts. A
                      signature that does not verify fails at once. Empty or "0" means 10m.
                    pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: set authorities, commits.requireSigned, or both
                  rule: (has(self.authorities) && size(self.authorities) > 0) || (has(self.commits)
                    && self.commits.requireSigned)
                - message: commits.authorities must name keyless spec.imageVerification.authorities
                  rule: '!has(self.commits) || !has(self.commits.authorities) || self.commits.authorities.all(n,
                    has(self.authorities) && self.authorities.exists(x, x.name ==
                    n && has(x.keyless)))'
                - message: an attestation's authorities and vex.authorities must name
                    spec.imageVerification.authorities
                  rule: '!has(self.attestations) || self.attestations.all(a, a.authorities.all(n,
                    has(self.authorities) && self.authorities.exists(x, x.name ==
                    n)) && (!has(a.vex) || a.vex.authorities.all(n, has(self.authorities)
                    && self.authorities.exists(x, x.name == n))))'
            required:
            - bundleName
            - pipelineName
            - policy
            type: object
            x-kubernetes-validations:
            - message: an ImageVerification's spec is immutable
              rule: self == oldSelf
          status:
            description: ImageVerificationStatus is the observed state.
            properties:
              attempts:
                description: |-
                  Attempts counts checks that ended without a verdict (registry or SCM
                  unreachable, signature not there yet); it spaces the retries.
                type: integer
              attestations:
                description: Attestations has one result per attestation policy and
                  image.
                items:
                  description: |-
                    AttestationResult is one attestation of one image: whether it verified,
                    who signed it, and its typed summary and predicate.
                  properties:
                    agent:
                      description: |-
                        Agent is the ready AgentIdentity whose spec.signingIdentities match
                        the signing certificate, when exactly one does; empty otherwise.
                      maxLength: 253
                      type: string
                    authority:
                      description: Authority is the authority that verified it.
                      maxLength: 63
                      type: string
                    count:
                      description: Count is how many attestations of the type verified;
                        the newest is used.
                      type: integer
                    digest:
                      description: Digest is the sha256 of the verified DSSE payload.
                      maxLength: 80
                      type: string
                    image:
                      description: Image is "repository@digest".
                      type: string
                    message:
                      description: Message says why it is not verified, or what was
                        dropped.
                      maxLength: 1024
                      type: string
                    name:
                      description: Name is the policy's attestations[].name.
                      type: string
                    predicate:
                      description: |-
                        Predicate is the predicate as canonical JSON (sorted keys), at most
                        64 KiB; empty when omitted (PredicateOmitted).
                      maxLength: 65536
                      type: string
                    predicateOmitted:
                      description: |-
                        PredicateOmitted says why Predicate is empty although the attestation
                        verified: "64 KiB" (over the per-attestation cap) or "256 KiB" (over
                        the status total, the largest dropped first).
                      maxLength: 16
                      type: string
                    predicateType:
                      description: PredicateType is the policy's predicate type.
                      maxLength: 256
                      type: string
                    signer:
                      description: Signer is the key's authority name or the certificate
                        identity.
                      maxLength: 1024
                      type: string
                    slsa:
                      description: SLSA is the provenance summary, for a policy with
                        slsa.
                      properties:
                        buildLevel:
                          description: |-
                            BuildLevel is the SLSA build level (0 to 3): the level the policy
                            grants the builder (1 when it is not listed), or a verified VSA's.
                          type: integer
                        builderID:
                          description: BuilderID is runDetails.builder.id.
                          maxLength: 512
                          type: string
                        levelSource:
                          description: LevelSource is builder or vsa.
                          maxLength: 16
                          type: string
                        sourceCommit:
                          description: |-
                            SourceCommit is the gitCommit digest of the first resolved dependency
                            that has one.
                          maxLength: 64
                          type: string
                        sourceURI:
                          description: SourceURI is that dependency's URI.
                          maxLength: 512
                          type: string
                      required:
                      - buildLevel
                      type: object
                    verified:
                      description: |-
                        Verified is true when an attestation of the type, for the image,
                        verified against one of the policy's authorities.
                      type: boolean
                    vulns:
                      description: Vulns is the scan summary, for a vulnerability
                        scan predicate.
                      properties:
                        before:
                          description: Before counts every finding.
                          properties:
                            critical:
                              type: integer
                            high:
                              type: integer
                            low:
                              type: integer
                            medium:
                              type: integer
                            unknown:
                              type: integer
                          required:
                          - critical
                          - high
                          - low
                          - medium
                          - unknown
                          type: object
                        effective:
                          description: Effective counts the findings no VEX statement
                            covers.
                          properties:
                            critical:
                              type: integer
                            high:
                              type: integer
                            low:
                              type: integer
                            medium:
                              type: integer
                            unknown:
                              type: integer
                          required:
                          - critical
                          - high
                          - low
                          - medium
                          - unknown
                          type: object
                        effectiveIDs:
                          description: |-
                            EffectiveIDs are the IDs of the effective critical and high findings
                            (at most 50).
                          items:
                            maxLength: 128
                            type: string
                          maxItems: 50
                          type: array
                        scannedAt:
                          description: ScannedAt is when the scan finished (RFC 3339).
                          maxLength: 40
                          type: string
                        scanner:
                          description: Scanner is the scanner's name (its URI's last
                            element).
                          maxLength: 256
                          type: string
                        scannerVersion:
                          description: ScannerVersion is the scanner's version.
                          maxLength: 64
                          type: string
                        vexStatements:
                          description: |-
                            VEXStatements counts the statements read from verified VEX
                            attestations.
                          type: integer
                      required:
                      - before
                      - effective
                      type: object
                  required:
                  - image
                  - name
                  - predicateType
                  - verified
                  type: object
                maxItems: 200
                type: array
              commit:
                description: Commit is the commit result.
                properties:
                  agent:
                    description: |-
                      Agent is the ready AgentIdentity whose spec.signingIdentities match
                      the signer, when exactly one does (gitsign); empty otherwise.
                    maxLength: 253
                    type: string
                  authority:
                    description: Authority is the commits.authorities entry that verified
                      it (gitsign).
                    maxLength: 63
                    type: string
                  issuer:
                    description: Issuer is the OIDC issuer of the signing certificate
                      (gitsign).
                    maxLength: 1024
                    type: string
                  message:
                    description: Message is the reason when not verified, or a note.
                    type: string
                  method:
                    description: |-
                      Method is how: "scm" (the SCM verified it) or "gitsign" (kardinal
                      verified a Sigstore signature against commits.authorities).
                    enum:
                    - scm
                    - gitsign
                    type: string
                  signer:
                    description: |-
                      Signer is who signed: as the SCM reports it, or the certificate
                      identity (SAN) for gitsign.
                    type: string
                  verified:
                    description: Verified is true when the commit's signature verified.
                    type: boolean
                required:
                - verified
                type: object
              deadline:
                description: Deadline is StartedAt plus the policy timeout.
                format: date-time
                type: string
              images:
                description: Images has one result per spec.images entry.
                items:
                  description: ImageVerificationResult is the result for one image.
                  properties:
                    authority:
                      description: Authority is the authority that verified it.
                      type: string
                    image:
                      description: Image is "repository@digest".
                      type: string
                    message:
                      description: Message says why the image is not verified yet,
                        or failed.
                      type: string
                    signer:
                      description: Signer is the key's authority name or the certificate
                        identity.
                      type: string
                    verified:
                      description: Verified is true once a signature verified.
                      type: boolean
                  required:
                  - image
                  - verified
                  type: object
                type: array
              lastCheckedAt:
                description: LastCheckedAt is when the registry or SCM was last asked.
                format: date-time
                type: string
              message:
                description: Message summarizes the phase.
                type: string
              phase:
                description: |-
                  Phase is Pending, Verified or Failed. Verified and Failed are terminal:
                  a verified signature is not checked again (revocation after the
                  verification is not seen).
                enum:
                - Pending
                - Verified
                - Failed
                type: string
                x-kubernetes-validations:
                - message: a finished ImageVerification's phase cannot change
                  rule: '!(oldSelf in [''Verified'', ''Failed'']) || self == oldSelf'
              reason:
                description: |-
                  Reason is a machine-readable reason for a Failed or waiting
                  verification: SecretNotReferenceable, SecretNotFound,
                  InvalidPublicKey, InvalidTrustedRoot, InvalidRegistryCredentials,
                  SignatureNotVerified, CommitNotVerified, AttestationNotVerified,
                  SLSALevelTooLow, Timeout.
                type: string
              startedAt:
                description: StartedAt is when the verification started.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
