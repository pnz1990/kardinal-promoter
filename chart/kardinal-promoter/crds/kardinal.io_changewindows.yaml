                  - until
                  type: object
                maxItems: 100
                type: array
              exemptions:
                description: |-
                  Exemptions are the spec.freeze.exemptions in effect now: not past
                  their record's until, and not made by an agent. The PromotionStep
                  reconciler lets a step through a freeze only on an exemption listed
