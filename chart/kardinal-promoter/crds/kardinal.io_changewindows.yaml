            type: object
            x-kubernetes-validations:
            - message: 'a blackout ChangeWindow requires start and end (a freeze may
                omit end: it lasts until it is removed)'
              rule: self.type != 'blackout' || (has(self.start) && (has(self.end)
                || has(self.freeze)))
            - message: 'spec.freeze needs type: blackout'
              rule: '!has(self.freeze) || self.type == ''blackout'''
            - message: a recurring ChangeWindow requires schedule
              rule: self.type != 'recurring' || has(self.schedule)
          status:
            description: ChangeWindowStatus defines the observed state of a ChangeWindow.
            properties:
              active:
                description: |-
                  Active is true when the ChangeWindow is currently blocking promotions.
                  Written by the ChangeWindow reconciler, which requeues at the next window
                  boundary. PolicyGates evaluate the spec at their own evaluation time with
                  the same logic, so they never depend on this field being fresh.
                type: boolean
              conditions:
                description: |-
                  Conditions holds status conditions. Valid is True when the spec can be
                  evaluated. It is False (reason InvalidSpec, the error in the message) when
                  it cannot, for example for an unknown timezone; the window is then active,
                  so every gate that references it blocks until the spec is fixed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
