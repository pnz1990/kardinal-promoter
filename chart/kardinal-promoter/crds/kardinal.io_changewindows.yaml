    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChangeWindow defines a cluster-scoped time window during which promotions are
          blocked. Without spec.freeze, a ChangeWindow blocks nothing by itself: a
          PolicyGate blocks while a window it references is active, for example
          !changewindow.isBlocked("holiday-freeze") or changewindow.isAllowed("business-hours").
          A gate that names a ChangeWindow that does not exist blocks. With
          spec.freeze, the window holds the promotions it selects while it is active.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ChangeWindowSpec defines the desired state of a ChangeWindow.
            properties:
              end:
                description: |-
                  End is when a blackout window ends (required for type: blackout, except
                  with spec.freeze: a freeze without end lasts until it is removed).
                format: date-time
                type: string
              freeze:
                description: |-
                  Freeze makes the window hold promotions by itself while it is active,
                  without a gate naming it (docs/design/18-actor-policy.md): an agent
                  freeze, or a stop-the-line for everyone. kardinal freeze writes it.
                properties:
                  actor:
                    description: |-
                      Actor is CreatedBy's actor stamp (docs/actors.md), checked by the
                      chart's actor admission policy; the FreezeStarted AuditEvent names it.
                    properties:
                      agent:
                        description: Agent is the AgentIdentity name, when kind is
                          agent.
                        maxLength: 253
                        minLength: 1
                        type: string
                      asserted:
                        description: |-
                          Asserted holds what the client says about itself. It is recorded as
                          written and never used for a security decision.
                        properties:
                          client:
                            description: Client is the tool that wrote the record
                              (for example kardinal/0.12.0).
                            maxLength: 128
                            type: string
                          model:
                            description: Model is the AI model the client says it
                              runs.
                            maxLength: 128
                            type: string
                          session:
                            description: Session is the client's session or run identifier.
                            maxLength: 128
                            type: string
                        type: object
                      kind:
                        description: Kind is human, agent, bot or controller (docs/actors.md).
                        enum:
                        - human
                        - agent
                        - bot
                        - controller
                        maxLength: 16
                        type: string
                      principal:
                        description: Principal is the username the API server authenticated.
                        maxLength: 253
                        minLength: 1
                        type: string
                      sponsor:
                        description: |-
                          Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                          the record was written, when kind is agent.
                        maxLength: 253
                        minLength: 1
                        type: string
                      via:
                        description: |-
                          Via says how the controller came to write the record: ui and api for a
                          caller it authenticated, subscription and auto-rollback for its own
                          Bundles. Only the controller may set it.
                        enum:
                        - ui
                        - api
                        - subscription
                        - auto-rollback
                        maxLength: 16
                        type: string
                    required:
                    - kind
                    - principal
                    type: object
                    x-kubernetes-validations:
                    - message: actor.agent and actor.sponsor are set exactly when
                        actor.kind is agent
                      rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                        : (!has(self.agent) && !has(self.sponsor))'
                    - message: a controller actor says why it acted (actor.via)
                      rule: self.kind != 'controller' || has(self.via)
                  actors:
                    description: |-
                      Actors is whose versions are held: agents (versions whose actor stamp
                      says kind agent) or everyone (stop-the-line).
                    enum:
                    - agents
                    - everyone
                    maxLength: 16
                    type: string
                  createdBy:
                    description: |-
                      CreatedBy is who froze: the chart's freezes admission policy admits it
                      only as the requester's username, and it never changes.
                    maxLength: 253
                    type: string
                  exemptionRecords:
                    description: |-
                      ExemptionRecords has one record per spec.freeze.exemptions entry: when
                      the controller first saw it and until when it counts. Records of
                      entries removed from the spec go.
                    items:
                      description: |-
                        FreezeExemptionRecord is when the ChangeWindow reconciler first saw one
                        spec.freeze.exemptions entry, and so until when it counts: the earlier of
                        its expiresAt and firstSeen plus the controller's cap
