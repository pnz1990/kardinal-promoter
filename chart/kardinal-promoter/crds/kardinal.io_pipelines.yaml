---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: pipelines.kardinal.io
spec:
  group: kardinal.io
  names:
    kind: Pipeline
    listKind: PipelineList
    plural: pipelines
    shortNames:
    - pipe
    singular: pipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Pipeline defines a promotion pipeline for one application.
          It specifies the ordered environments an artifact Bundle travels through.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PipelineSpec defines the desired state of a Pipeline.
            properties:
              environments:
                description: |-
                  Environments lists the promotion path.
                  Sequential ordering (GB-1): when an environment does not specify dependsOn,
                  it implicitly depends on the previous entry in this list. The first environment
                  has no upstream dependency. This sequential default means a list of N environments
                  without dependsOn fields produces a linear chain. Override with dependsOn to
                  express parallel fan-out or explicit DAG structure.
                  Environment names must be unique; at most 500 environments (a bound
                  the API server needs to cost the CEL rules on each entry).
                items:
                  description: EnvironmentSpec defines one environment in a Pipeline.
                  properties:
                    approval:
                      default: auto
                      description: Approval controls whether promotion into this environment
                        requires a PR review.
                      enum:
                      - auto
                      - pr-review
                      type: string
                    autoRollback:
                      description: |-
                        AutoRollback is reserved and rejected by the API server: consecutive-failure
                        auto-rollback is not implemented. See OnHealthFailure.
                      properties:
                        failureThreshold:
                          default: 3
                          description: |-
                            FailureThreshold is the number of consecutive health-check failures
                            that trigger an automatic rollback Bundle creation. Default: 3.
                          type: integer
                      type: object
                    bake:
                      description: |-
                        Bake configures a contiguous-healthy soak window for this environment (K-01).
                        When set, the health check must pass continuously for Bake.Minutes before
                        the step transitions to Verified. A health failure resets the timer if
                        policy is "reset-on-alarm" (default), or fails the step if "fail-on-alarm".
                      properties:
                        maxDuration:
                          description: |-
                            MaxDuration bounds the time from the first bake window's start
                            (status.bakeFirstStartedAt) to a complete window. A step that has not
                            completed one full window by then applies onHealthFailure when its
                            window stops, also on a Waiting check, so a release that keeps
                            flapping under reset-on-alarm ends. Go duration format (e.g. "36h").
                            Default: minutes + health.timeout. A value shorter than minutes counts
                            as minutes.
                          pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                          type: string
                        minutes:
                          description: |-
                            Minutes is the required contiguous healthy duration in minutes.
                            The window restarts at the next healthy check after a check that is not
                            healthy (see Policy).
                          minimum: 1
                          type: integer
                        policy:
                          default: reset-on-alarm
                          description: |-
                            Policy controls what an unhealthy check during the bake window does.
                            "reset-on-alarm" (default): the window stops, status.bakeResets increments
                            and the step stays in HealthChecking.
                            "fail-on-alarm": onHealthFailure applies at the first unhealthy check.
                            A waiting check (the workload is changing, such as a canary paused at a
                            step) stops the window under either policy but is not an alarm. A
                            stopped window restarts at the next healthy check, and health.timeout
                            bounds the wait for it.
                          enum:
                          - reset-on-alarm
                          - fail-on-alarm
                          type: string
                      required:
                      - minutes
                      type: object
                    delivery:
                      description: Delivery holds in-cluster progressive delivery
                        delegation configuration.
                      properties:
                        delegate:
                          description: |-
                            Delegate offloads in-cluster progressive delivery to an external controller.
                            Supported values: none, argoRollouts, flagger.
                          enum:
                          - none
                          - argoRollouts
                          - flagger
                          type: string
                      type: object
                    dependsOn:
                      description: |-
                        DependsOn lists names of other environments in this pipeline that must
                        reach Verified state before this environment can start.
                      items:
                        type: string
                      type: array
                    health:
                      description: Health holds the health check configuration for
                        this environment.
                      properties:
                        argoRollouts:
                          description: |-
                            ArgoRollouts overrides the Rollout checked by health.type=argoRollouts
                            (or delivery.delegate=argoRollouts).
                            Defaults: name "<pipeline>", namespace "<environment>".
                          properties:
                            name:
                              description: Name is the object name.
                              type: string
                            namespace:
                              description: Namespace is the object namespace.
                              type: string
                          type: object
                        argocd:
                          description: |-
                            ArgoCD overrides the Argo CD Application checked by health.type=argocd.
                            Defaults: name "<pipeline>-<environment>", namespace "argocd".
                          properties:
                            name:
                              description: Name is the object name.
                              type: string
                            namespace:
                              description: Namespace is the object namespace.
                              type: string
                          type: object
                        cluster:
                          description: |-
                            Cluster is not supported: kardinal checks health only in the cluster it
                            runs in. A non-empty value sets the Pipeline Ready=False (reason
                            NotImplemented) and fails the PromotionStep with "health.cluster is not
                            supported" instead of silently checking the local cluster.

                            Deprecated: remove cluster. To verify a workload in another cluster,
                            set kubeconfigSecretRef, or check its Argo CD Application
                            (health.type: argocd) or Flux Kustomization (health.type: flux) in the
                            hub cluster kardinal runs in; see docs/health-adapters.md#remote-clusters.
                          type: string
                        flagger:
                          description: |-
                            Flagger overrides the Canary checked by health.type=flagger
                            (or delivery.delegate=flagger).
                            Defaults: name "<pipeline>", namespace "<environment>".
                          properties:
                            name:
                              description: Name is the object name.
                              type: string
                            namespace:
                              description: Namespace is the object namespace.
                              type: string
                          type: object
                        flux:
                          description: |-
                            Flux overrides the Flux Kustomization checked by health.type=flux.
                            Defaults: name "<pipeline>-<environment>", namespace "flux-system".
                          properties:
                            name:
                              description: Name is the object name.
                              type: string
                            namespace:
                              description: Namespace is the object namespace.
                              type: string
                          type: object
                        kubeconfigSecretRef:
                          description: |-
                            KubeconfigSecretRef runs the health check against another cluster: the
                            one the kubeconfig in this Secret key selects (its current context).
                            The Secret must be in the Pipeline's namespace. Every health type reads
                            its object (Deployment, Application, Kustomization, Rollout, Canary)
                            in that cluster instead of the controller's.

                            Only inline credentials are accepted: a bearer token, a client
                            certificate and key (-data fields), or a username and password. A
                            kubeconfig with exec, auth-provider, tokenFile or any file path is
                            refused and the step fails: it would run a command, or read a file, in
                            the controller. The API server address goes through the controller's
                            egress guard (no loopback, link-local or metadata addresses) and is
                            dialled directly, not through HTTP(S)_PROXY.

                            A cluster that cannot be reached is not unhealthy: the step reports
                            ClusterUnreachable and keeps checking until health.timeout. Remote
                            health is polled, not watched.
                          properties:
                            key:
                              description: Key is the key holding the kubeconfig.
                                Defaults to "kubeconfig".
                              type: string
                            name:
                              description: Name is the Secret name.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        labelSelector:
                          additionalProperties:
                            type: string
                          description: |-
                            LabelSelector enables WatchKind mode for health.type=resource.
                            When set, the health node watches ALL Deployments in the environment namespace
                            that match the given labels (a kro Graph collection ref node).
                            When unset, a single named Deployment is watched (a kro Graph ref node).

                            Example: {"app": "my-service", "kardinal.io/pipeline": "nginx-demo"}

                            Only applies to health.type=resource. Ignored for argocd, flux, argoRollouts, flagger
                            (those resource types are always single-named).
                          type: object
                        resource:
                          description: |-
                            Resource specifies the exact Kubernetes resource to watch for health.type=resource.
                            When set, overrides the default behavior (which watches a Deployment named after
                            the pipeline in the environment namespace). Use this when the health target is
                            in a different namespace or has a different name than the pipeline.

                            Only applies to health.type=resource. Ignored for argocd, flux, argoRollouts, flagger.
                          properties:
                            condition:
                              description: |-
                                Condition is the Deployment condition type that must be True.
                                Defaults to "Available".
                              type: string
                            kind:
                              description: |-
                                Kind is the Kubernetes resource kind. Only "Deployment" is supported;
                                any other value fails the PromotionStep with a clear message.
                                Defaults to "Deployment" when unset.
                              type: string
                            name:
                              description: Name is the resource name. Defaults to
                                the pipeline name when unset.
                              type: string
                            namespace:
                              description: Namespace is the resource namespace. Defaults
                                to the environment name when unset.
                              type: string
                          type: object
                        timeout:
                          description: |-
                            Timeout is the maximum time to wait for a healthy check: from the start
                            of health checking, and again whenever a bake window stops. When it
                            expires, onHealthFailure applies. It does not cut a running bake window
                            short. Uses Go duration format (e.g. "30m", "1h"). Defaults to "10m".
                          pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                          type: string
                        type:
                          description: |-
                            Type selects the health check backend.
                            Supported values: resource, argocd, flux, argoRollouts, flagger.
                            When empty the PromotionStep reconciler uses "resource" (a Deployment named
                            after the Pipeline in the environment namespace, unless health.resource
                            overrides it). delivery.delegate, when set, takes precedence.
                          enum:
                          - resource
                          - argocd
                          - flux
                          - argoRollouts
                          - flagger
                          type: string
                      type: object
                    hooks:
                      description: |-
                        Hooks are Jobs that run for each Bundle in this environment: "pre"
                        hooks before the promotion starts (database migrations), "post" hooks
                        after the health check passed and before the environment is Verified
                        (integration tests). Each runs once per Bundle, as a HookRun the
                        Bundle's Graph creates. See docs/hooks.md.
                      items:
                        description: |-
                          HookSpec is one pre- or post-deploy hook of a Pipeline environment: a
                          Kubernetes Job the controller runs once per Bundle and environment.
                        properties:
                          job:
                            description: |-
                              Job is a batch/v1 JobSpec. The controller creates the Job in the
                              Pipeline namespace with the HookRun as its owner. The Pod's
                              serviceAccountName (default "default") must be in the controller's
                              --hook-service-accounts list. restartPolicy defaults to Never, and
                              activeDeadlineSeconds to the timeout.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          name:
                            description: |-
                              Name identifies the hook within its environment and phase. It is part of
                              the HookRun and Job names.
                            maxLength: 40
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                            type: string
                          phase:
                            description: |-
                              Phase is when the hook runs. "pre": after the environment's upstreams
                              are Verified and its gates are ready, before the promotion starts; the
                              promotion starts only when every pre hook succeeded. "post": after the
                              health check passed; the environment is Verified only when every post
                              hook succeeded, and a failed post hook applies onHealthFailure. Hooks of
                              one phase run one after another, in list order.
                            enum:
                            - pre
                            - post
                            type: string
                          timeout:
                            description: |-
                              Timeout bounds the hook from the moment its HookRun starts: a hook that
                              has not finished by then fails and its Job is deleted. Empty or "0" means 30m.
                            pattern: ^$|^(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
                            type: string
                        required:
                        - job
                        - name
                        - phase
                        type: object
                      maxItems: 10
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    layout:
                      default: directory
                      description: |-
                        Layout configures how the promotion interacts with the Git repo layout.
                        "directory" (default): env manifests are in a subdirectory of the main branch.
                        "branch": the environment's path on spec.git.branch (the DRY source) is
                          rendered (kustomize build, or helm template for a chart) and the plain
                          manifests are committed to the environment's rendered branch (render.branch,
                          default env/<name>), which Argo CD or Flux sync. See docs/rendered-manifests.md.
                      enum:
                      - directory
                      - branch
                      type: string
                    name:
                      description: |-
                        Name is the environment identifier (e.g. "test", "uat", "prod").
                        It must be a DNS label (lower-case letters, digits and '-', at most 63
                        characters): it names a Graph node, derived objects and, for the
                        resource, argoRollouts and flagger health checks, a namespace.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    onHealthFailure:
                      default: none
                      description: |-
                        OnHealthFailure controls what the reconciler does when health fails during
                        bake or health checking (K-03).
                        "rollback": create a rollback Bundle at the previous version; step → RollingBack.
                        "abort": freeze the step; state → AbortedByAlarm; requires human intervention.
                        "none" (default): step → Failed; downstream stops.
                      enum:
                      - rollback
                      - abort
                      - none
                      type: string
                    path:
                      description: |-
                        Path is the subdirectory within the GitOps repository for this environment.
                        Used when spec.git.layout is "directory". Defaults to "environments/<name>".
                      type: string
                    promotionTemplate:
                      description: |-
                        PromotionTemplate is not supported, and the PromotionTemplate CRD was
                        removed. The API server rejects a Pipeline that sets it, and so do Graph
                        translation and "kardinal validate".

                        Deprecated: remove it; every environment runs the default step sequence.
                        See docs/pipeline-reference.md#promotion-steps.
                      properties:
                        name:
                          description: Name is the name of a PromotionTemplate (the
                            CRD was removed).
                          minLength: 1
                          type: string
                        namespace:
                          description: Namespace is the namespace of the PromotionTemplate
                            (the CRD was removed).
                          type: string
                      required:
                      - name
                      type: object
                    regions:
                      description: |-
                        Regions is not supported: every region would edit the same path and push
                        the same branch. With two or more regions the Pipeline is Ready=False
                        (reason NotImplemented) and every Bundle fails when its Graph is built
                        with "regions is not supported". One region has no effect.

                        Deprecated: declare one environment per region (prod-us, prod-eu) and
                        use wave.
                      items:
                        type: string
                      type: array
                    render:
                      description: 'Render configures layout: branch.'
                      properties:
                        allowNondeterministic:
                          description: |-
                            AllowNondeterministic lets Helm templates call functions whose result
                            changes from one render to the next (randAlphaNum, uuidv4, now, genCA
                            and the like). Off by default: such a chart renders different
                            manifests for the same DRY commit, so every promotion commits a change
                            and a rollback does not restore what ran.
                          type: boolean
                        branch:
                          description: |-
                            Branch is the rendered branch the manifests are committed to. Defaults
                            to env/<environment name>. It must differ from spec.git.branch and from
                            every other environment's rendered branch.
                          maxLength: 200
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
                          type: string
                        helm:
                          description: |-
                            Helm configures the render of a Helm chart (an environment path holding
                            a Chart.yaml).
                          properties:
                            namespace:
                              description: Namespace is .Release.Namespace. Defaults
                                to the environment name.
                              type: string
                            releaseName:
                              description: ReleaseName is .Release.Name. Defaults
                                to the Pipeline name.
                              type: string
                            valuesFiles:
                              description: |-
                                ValuesFiles are values files, relative to the chart directory, applied
                                in order over the chart's values.yaml. Defaults to
                                update.helm.valuesFile when that is set and is not values.yaml.
                              items:
                                type: string
                              maxItems: 16
                              type: array
                          type: object
                        onDrift:
                          description: |-
                            OnDrift is what a promotion does when the rendered branch was changed
                            outside kardinal since the last render (a file kardinal wrote was edited
                            or deleted, or a file in its way was added): fail (default) fails the
                            step and changes nothing; overwrite renders over the change.
                          enum:
                          - fail
                          - overwrite
                          type: string
                      type: object
                    shard:
                      description: |-
                        Shard was the agent shard of distributed mode, which was removed. A
                        non-empty value sets the Pipeline Ready=False (reason NotImplemented)
                        and fails the environment's PromotionSteps with "shard is not
                        supported".

                        Deprecated: remove shard; the controller reconciles every environment.
                        For workloads in other clusters, use the Argo CD or Flux hub (see
                        docs/distributed-mode.md).
                      type: string
                    stepTimeoutSeconds:
                      description: |-
                        StepTimeoutSeconds is the maximum number of seconds a single promotion
                        step (git-clone, kustomize-set-image, open-pr, etc.) may run. The
                        reconciler cancels a step that runs longer via context.WithTimeout and
                        handles the timeout like any other step error: the step is retried with
                        backoff (10s, 20s, 40s, 80s, then 2m), and the PromotionStep is marked
                        Failed when the 5 retries are used up. When not set or 0 (default), no
                        per-step timeout is applied.
                        Useful for restricting execution in restricted-egress environments where
                        git-clone against a slow SCM host can block the reconciler indefinitely.
                      minimum: 1
                      type: integer
                    steps:
                      description: |-
                        Steps is not supported. kardinal has no custom step engine: every
                        environment runs the default step sequence (see DefaultSequenceForBundle).
                        The API server rejects a Pipeline that sets it, and so do Graph
                        translation and "kardinal validate".

                        Deprecated: remove it; the step sequence follows the Bundle type,
                        update.strategy, approval and layout. See docs/pipeline-reference.md#promotion-steps.
                      items:
                        description: |-
                          StepSpec is the shape of the deprecated spec.environments[].steps field. A
                          Pipeline that sets steps is rejected; see EnvironmentSpec.Steps.
                        properties:
                          uses:
                            description: Uses names a step.
                            minLength: 1
                            type: string
                          webhook:
                            description: Webhook was the endpoint of a custom webhook
                              step, which was removed.
                            properties:
                              secretRef:
                                description: |-
                                  SecretRef references a Kubernetes Secret whose "Authorization" key is
                                  sent as the Authorization header.
                                properties:
                                  name:
                                    description: Name is the Secret name.
                                    minLength: 1
                                    type: string
                                  namespace:
                                    description: |-
                                      Namespace is the Secret namespace. If empty, the Pipeline's namespace is used.
                                      For spec.git.secretRef it must be empty or equal to the Pipeline's namespace:
                                      the controller refuses to read a Secret from another namespace and fails the
                                      PromotionStep with a clear message, so a Pipeline author cannot borrow another
                                      team's credentials.
                                    type: string
                                required:
                                - name
                                type: object
                              timeoutSeconds:
                                default: 300
                                description: TimeoutSeconds is the per-call timeout.
                                  Defaults to 300.
                                type: integer
                              url:
                                description: URL is the HTTP(S) endpoint to POST to.
                                minLength: 1
                                type: string
                            required:
                            - url
                            type: object
                        required:
                        - uses
                        type: object
                      type: array
                    update:
                      description: Update holds the manifest update configuration
                        for this environment.
                      properties:
                        argocd:
                          description: |-
                            ArgoCD holds ArgoCD-native update configuration.
                            Used when Strategy is "argocd". Patches the ArgoCD Application's
                            spec.source.helm.valuesObject directly without a git commit.
                          properties:
                            application:
                              description: Application is the name of the ArgoCD Application
                                resource to patch.
                              minLength: 1
                              type: string
                            imageKey:
                              description: |-
                                ImageKey is the dot-separated key path within spec.source.helm.valuesObject
                                where the image tag should be written.
                                Example: "image.tag" writes to spec.source.helm.valuesObject.image.tag.
                                Defaults to "image.tag" if empty.
                              type: string
                            namespace:
                              description: |-
                                Namespace is the Kubernetes namespace where the ArgoCD Application lives.
                                Defaults to "argocd" if empty.
                              type: string
                          required:
                          - application
                          type: object
                        helm:
                          description: |-
                            Helm holds Helm-specific update configuration.
                            Used when Strategy is "helm".
                          properties:
                            chartVersionFile:
                              description: |-
                                ChartVersionFile is the file a chart Bundle's version is written to,
                                relative to the environment path: an umbrella Chart.yaml, an Argo CD
                                Application, a Flux HelmRelease or a kustomization.yaml with
                                helmCharts. Defaults to "Chart.yaml".
                              type: string
                            chartVersionPath:
                              description: |-
                                ChartVersionPath is the YAML path of the chart version in
                                chartVersionFile, in the grammar of update.yaml.updates[].path: keys
                                separated by ".", "[N]" (or a digits-only key) to index a list, and
                                "[field=value]" for the list element whose field has that value. Defaults to
                                ".dependencies[name=<chart>].version": the umbrella chart's dependency
                                named after the Bundle's chart (an error when there is none). For
                                example ".spec.source.targetRevision" (Argo CD Application),
                                ".spec.chart.spec.version" (Flux HelmRelease) or
                                ".helmCharts[name=podinfo].version" (kustomize).
                              maxLength: 512
                              pattern: ^\.?[A-Za-z0-9_-]+(\[(0|[1-9][0-9]{0,8}|[A-Za-z0-9_-]+=[A-Za-z0-9_./:@-]+)\])*(\.[A-Za-z0-9_-]+(\[(0|[1-9][0-9]{0,8}|[A-Za-z0-9_-]+=[A-Za-z0-9_./:@-]+)\])*)*$
                              type: string
                            imagePathTemplate:
                              description: |-
                                ImagePathTemplate is the YAML dot-path to the image tag in values.yaml.
                                Example: ".image.tag" updates the `image.tag` key.
                                If empty, defaults to ".image.tag".
                              type: string
                            valuesFile:
                              description: |-
                                ValuesFile is the name of the values file to update (relative to the
                                environment path). Defaults to "values.yaml".
                              type: string
                          type: object
                        strategy:
                          default: kustomize
                          description: |-
                            Strategy selects the manifest update strategy: kustomize (default,
                            kustomization.yaml images), helm (one values key), argocd (patch the
                            Application, no git), or yaml (any YAML paths in any files of the
                            environment directory).
                          enum:
                          - kustomize
                          - helm
                          - argocd
                          - yaml
                          type: string
                        yaml:
                          description: |-
                            YAML holds the edits of the yaml strategy.
                            Used when Strategy is "yaml".
                          properties:
                            updates:
                              description: Updates are the values to set.
                              items:
                                description: |-
                                  YAMLUpdate sets one scalar in one YAML file to a value taken from a Bundle
                                  image. The file must be a regular file of at most 4 MiB holding one YAML
                                  document; symbolic links and anchors or aliases on the path are refused.
                                properties:
                                  file:
                                    description: |-
                                      File is the YAML file, relative to the environment path, for example
                                      "values.yaml" or "deploy/deployment.yaml". It must stay inside the
                                      repository. A file with several documents (---) is not supported.
                                      Each path segment starts with a letter, digit or "_" and has single
                                      dots only, so the file can neither be absolute nor leave the
                                      environment path.
                                    maxLength: 512
                                    pattern: ^[A-Za-z0-9_][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+)*(/[A-Za-z0-9_][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+)*)*$
                                    type: string
                                  image:
                                    description: |-
                                      Image is the repository of the Bundle image whose value is written,
                                      for example "ghcr.io/org/app". It may be empty when the Bundle has
                                      exactly one image.
                                    type: string
                                  path:
                                    description: |-
