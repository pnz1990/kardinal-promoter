---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: prstatuses.kardinal.io
spec:
  group: kardinal.io
  names:
    kind: PRStatus
    listKind: PRStatusList
    plural: prstatuses
    shortNames:
    - prs
    singular: prstatus
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.merged
      name: Merged
      type: boolean
    - jsonPath: .status.open
      name: Open
      type: boolean
    - jsonPath: .status.approved
      name: Approved
      type: boolean
    - jsonPath: .status.approvalCount
      name: Approvals
      type: integer
    - jsonPath: .spec.prNumber
      name: PR
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PRStatus is a controller-internal CRD that tracks the merge state of a GitHub
          pull request, making it observable by the kro Graph.

          Architecture: PromotionStep open-pr step creates a PRStatus CR. The
          PRStatusReconciler polls GitHub (or receives webhook events) and writes
          status.merged. The PromotionStep watches status.merged, replacing the
          previous polling loop in handleWaitingForMerge.

          Graph-purity: eliminates PS-4, SCM-2, ST-10, ST-11, BU-3, WH-1 from
          docs/design/11-graph-purity-tech-debt.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PRStatusSpec defines the desired state of a PRStatus object.
              PRStatus objects are created by the PromotionStep reconciler's open-pr step,
              and updated by the PRStatus reconciler via polling or webhook events.
            properties:
              prNumber:
                description: |-
                  PRNumber is the pull request number (numeric ID within the repo).
                  Set by the open-pr step after the PR is created. Zero in the placeholder.
                  The PromotionStep sets it again when it opened another PR (a recreated
                  step whose PR was closed): the spec always names the step's PR.
                type: integer
              prURL:
                description: |-
                  PRURL is the full GitHub pull request URL.
                  Example: https://github.com/owner/repo/pull/42
                  Set by the open-pr step after the PR is created. Empty in the placeholder.
                type: string
              repo:
                description: |-
                  Repo is the repository as the SCM API names it: "owner/repo" (GitHub,
                  Forgejo, Gitea, Bitbucket), the project path with subgroups (GitLab), or
                  "organization/project/repo" (Azure DevOps, whose project and repository
                  names may hold single spaces). Each segment is letters, digits, ".", "_" and "-": no
                  percent escapes, backslashes, "?", "#" or control characters, which the
                  SCM API would read as another path.
                  Example: acme/my-service
                  Set by the open-pr step after the PR is created. Empty in the placeholder.
                maxLength: 512
                pattern: ^([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+( [A-Za-z0-9._-]+)*)*)?$
                type: string
            type: object
          status:
            description: |-
              PRStatusStatus holds the observed state of the pull request.
              Written exclusively by the PRStatusReconciler.
            properties:
              approvalCount:
                description: |-
                  ApprovalCount is the number of distinct approved reviews on this PR.
                  Written by PRStatusReconciler. CEL: bundle.pr["staging"].approvalCount >= 2
                type: integer
              approved:
                description: |-
                  Approved is true when the pull request has at least one approved review
                  and no outstanding change-request reviews. Written by PRStatusReconciler.
                  CEL: bundle.pr["staging"].isApproved
                type: boolean
              closedAt:
                description: |-
                  ClosedAt is when the PRStatus reconciler first saw the PR closed without
                  merging. The PR is still polled for 5 minutes after this time: a poll
                  that sees it open again clears closedAt, and the PromotionStep keeps
                  waiting for the merge.
                format: date-time
                type: string
              closedFinal:
                description: |-
                  ClosedFinal is true once the PR was still closed 5 minutes after
                  closedAt. The reconciler then stops polling it and, once this is saved,
                  comments on the PR (best-effort, not retried); the PromotionStep waiting
                  for it fails. A closed PRStatus
                  (open=false with lastCheckedAt set) that has no closedAt was written by
                  an older release and counts as final too.
                type: boolean
              lastCheckedAt:
                description: |-
                  LastCheckedAt records when the status was last written from an SCM API
                  poll. Polls that change nothing refresh it at most every 5 minutes, so it
                  can lag the most recent poll by up to that much: every status write
                  queues the PRStatus again, so writing on each unchanged poll would make
                  it poll in a loop.
                format: date-time
                type: string
              mergeCommitSHA:
                description: |-
                  MergeCommitSHA is the commit the PR was merged as (the merge, squash or
                  rebase commit on the base branch). Written once the PR is merged, when the
                  SCM provider reports it. Health adapters use it to confirm that the GitOps
                  tool deployed this exact revision.
                type: string
              mergeCommitUnavailable:
                description: |-
                  MergeCommitUnavailable is true once the PR is merged and the
                  PRStatusReconciler stopped trying to learn mergeCommitSHA: the SCM
                  provider cannot report merge commits, reported none for this PR,
                  failed with an error a retry cannot fix (401, 403 that is not a rate
                  limit, 404, 410), or still failed 5 minutes after the merge was
                  recorded. Until then an
                  argocd health check of the PromotionStep waits for the merge commit
                  instead of checking the Bundle images only.
                type: boolean
              merged:
                description: |-
                  Merged is true when the pull request has been merged.
                  A PromotionStep in WaitingForMerge watches this field.
                type: boolean
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation of the spec this status
                  describes. The PromotionStep points the spec at another PR when a
                  recreated step opened a new one; the PRStatus reconciler then clears
                  the status of the old PR and polls the new one, and the PromotionStep
                  does not act on a status whose observedGeneration is older than the
                  spec. Zero on a status written by an older release: it is taken to
                  describe the current spec.
                format: int64
                type: integer
              open:
                description: |-
                  Open is true when the pull request is still open (not merged, not closed).
                  Set to false when the PR is closed or merged. A closed PR is still polled
                  for 5 minutes (see closedAt), so open can turn true again when it is
                  reopened.
                type: boolean
              pollError:
                description: |-
                  PollError is the SCM API error of the last poll when a retry cannot fix
                  it: HTTP 401, 403 (not a rate limit), 404 or 410. The PromotionStep
                  waiting for this PR fails with it. Cleared by the next successful poll.
                  Transient errors (429, 5xx, network) are only logged and retried.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
