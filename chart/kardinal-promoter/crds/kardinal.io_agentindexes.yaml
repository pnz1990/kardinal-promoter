---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: agentindexes.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal-all
    kind: AgentIndex
    listKind: AgentIndexList
    plural: agentindexes
    shortNames:
    - agentidx
    singular: agentindex
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.observedIdentities
      name: Identities
      type: integer
    - jsonPath: .status.bytes
      name: Bytes
      type: integer
    - jsonPath: .status.maxBytes
      name: Max
      type: integer
    - jsonPath: .status.conditions[?(@.type=="NearFull")].status
      name: NearFull
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentIndex is the registry of agents in the shape admission reads: the
          <release>-actor ValidatingAdmissionPolicy binds it as params. The
          controller writes its status from the AgentIdentities; one per release,
          named after the release.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: AgentIndexStatus maps every registered subject to its agent.
            properties:
              bytes:
                description: |-
                  Bytes is the size of the index's entries as its bound counts them
                  (each entry and its key as stored in JSON, a colon and a comma, blocked
                  entries included), also when it is over the bound and written empty.
                format: int64
                type: integer
              compactGroups:
                additionalProperties:
                  type: string
                description: CompactGroups is Groups in the compact format.
                type: object
              compactUsers:
                additionalProperties:
                  type: string
                description: |-
                  CompactUsers is Users in the compact format (#2071): each entry one
                  string, the actor policies read with split, which the API server
                  converts for every request at a fraction of an object's cost. The
                  controller writes it instead of Users and Groups once the chart's actor
                  policies read it; Ready is then False with reason CompactFormat (so the
                  policies, controllers and CLIs of older releases, which read Users,
                  fail closed) and CompactReady says whether it is built.
                type: object
              conditions:
                description: |-
                  Conditions: Ready (False, reason IndexFull, when the entries are over
                  MaxBytes; False, reason CompactFormat, when the index is in the compact
                  format); CompactReady (in the compact format: False, reason IndexFull,
                  when over MaxBytes); NearFull (True from 80% of MaxBytes).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              groups:
                additionalProperties:
                  description: AgentIndexEntry is what admission needs to know about
                    one subject.
                  properties:
                    agent:
                      description: Agent is the AgentIdentity name.
                      type: string
                    autonomy:
                      description: Autonomy is its ceiling.
                      type: string
                    blocked:
                      description: |-
                        Blocked, when set, says why the subject may not act: the
                        AgentIdentity is suspended or not ready.
                      type: string
                    environments:
                      items:
                        type: string
                      type: array
                    namespaces:
                      description: Namespaces, Pipelines and Environments are its
                        scope.
                      items:
                        type: string
                      type: array
                    pipelines:
                      items:
                        type: string
                      type: array
                    sponsor:
                      description: Sponsor is its sponsor's username.
                      type: string
                  required:
                  - agent
                  - sponsor
                  type: object
                description: Groups maps a group to its agent.
                type: object
              maxBytes:
                description: |-
                  MaxBytes is the bound on Bytes: past it the index is not Ready
                  (IndexFull) and the writes the actor policy checks are refused.
                format: int64
                type: integer
              observedIdentities:
                description: ObservedIdentities is how many AgentIdentities the index
                  was built from.
                type: integer
              users:
                additionalProperties:
                  description: AgentIndexEntry is what admission needs to know about
                    one subject.
                  properties:
                    agent:
                      description: Agent is the AgentIdentity name.
                      type: string
                    autonomy:
                      description: Autonomy is its ceiling.
                      type: string
                    blocked:
                      description: |-
                        Blocked, when set, says why the subject may not act: the
                        AgentIdentity is suspended or not ready.
                      type: string
                    environments:
                      items:
                        type: string
                      type: array
                    namespaces:
                      description: Namespaces, Pipelines and Environments are its
                        scope.
                      items:
                        type: string
                      type: array
                    pipelines:
                      items:
                        type: string
                      type: array
                    sponsor:
                      description: Sponsor is its sponsor's username.
                      type: string
                  required:
                  - agent
                  - sponsor
                  type: object
                description: |-
                  Users maps a username (ServiceAccount subjects as
                  system:serviceaccount:<namespace>:<name>) to its agent.
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
