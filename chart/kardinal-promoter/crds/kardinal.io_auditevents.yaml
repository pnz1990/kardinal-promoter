---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: auditevents.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal-all
    kind: AuditEvent
    listKind: AuditEventList
    plural: auditevents
    shortNames:
    - ae
    - audit
    singular: auditevent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pipelineName
      name: Pipeline
      type: string
    - jsonPath: .spec.bundleName
      name: Bundle
      type: string
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.outcome
      name: Outcome
      type: string
    - jsonPath: .spec.timestamp
      name: Timestamp
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AuditEvent is an immutable record of a single promotion event.
          It is written once by the PromotionStep reconciler and never updated.
          AuditEvents form an append-only log of all promotion activity across
          all pipelines.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AuditEventSpec defines the immutable record of a single promotion event.
              AuditEvents are created by the PromotionStep and PolicyGate reconcilers at
              key lifecycle transitions (started, succeeded, failed). The spec is set at
              creation; the CRD rejects any later change to it (the rule is on
              AuditEvent.Spec, so the outbox entries that embed the type,
              PendingAuditEvent, can be stored in a list).
            properties:
              action:
                description: |-
                  Action is a short verb describing what happened.
                  Valid values: "PromotionStarted", "PromotionSucceeded", "PromotionFailed",
                                "PromotionSuperseded", "PromotionRejected", "RollbackStarted", "RollbackSucceeded",
                                "HealthCheckFailed", "GateBlocked", "GateEvaluated", "GateOverridden",
                                "ApprovalRecorded", "ApprovalRevoked", "HoldCreated", "HoldReleased",
                                "HoldBundleMissing", "BundleRejected", "APIWrite", "VerdictRecorded",
                                "VerdictRevoked", "FreezeExempted", "PipelinePaused", "PipelineResumed",
                                "FreezeStarted", "FreezeLifted", "PRMerged", "ReceiptFailed",
                                "ChangeRequestOpened", "ChangeRequestLinked", "ChangeRequestApproved",
                                "ChangeRequestRejected", "GateChanged".
                  The ChangeRequest actions are written by a per-promotion ChangeRequest
                  when it opens or links its ticket, and when the ticket is first read
                  approved or rejected (docs/design/23-change-requests.md section 9).
                  ReceiptFailed is written by a promotion step that reached Verified
                  without a PromotionReceipt, because its receipt could not be built
                  (status.receiptError).
                  PRMerged is written by a promotion step when its pull request is merged,
                  naming who merged it as the SCM API reports it.
                  ApprovalRecorded and ApprovalRevoked are written by an approval gate
                  when a decision (kardinal approve) appears in or leaves its
                  spec.approvals.
                  BundleRejected is written once when a Bundle's spec.rejected is set
                  (kardinal reject or the UI), naming who rejected it and why; its
                  environment is "*" (the whole Bundle).
                  GateOverridden is written once per spec.overrides entry of a gate
                  instance, naming who created it (kardinal override or the UI).
                  APIWrite is written for each write through the UI API or the Bundle
                  API (controller.accessLog.auditEvents), naming the caller in actor and
                  the route in request.
                  FreezeExempted is written once per exemption when a PromotionStep goes
                  on through an active freeze under it (kardinal override --freeze),
                  naming who made the exemption and why.
                  GateChanged is written by the BundleReconciler when a PolicyGate
                  template that applies to a Promoting version was created, edited or
                  deleted and the version's Graph got the change; gates lists the
                  templates of that rebuild with their old and new digest, one event per
                  version and rebuild (#2144).
                  HealthCheckFailed and GateBlocked are accepted but never written: a
                  failed health check records PromotionFailed (RollbackStarted when
                  onHealthFailure is rollback), and a blocked gate records GateEvaluated
                  with outcome Failure.
                enum:
                - PromotionStarted
                - PromotionSucceeded
                - PromotionFailed
                - PromotionSuperseded
                - PromotionRejected
                - RollbackStarted
                - RollbackSucceeded
                - HealthCheckFailed
                - GateBlocked
                - GateEvaluated
                - GateOverridden
                - ApprovalRecorded
                - ApprovalRevoked
                - HoldCreated
                - HoldReleased
                - HoldBundleMissing
                - BundleRejected
                - APIWrite
                - VerdictRecorded
                - VerdictRevoked
                - FreezeExempted
                - PipelinePaused
                - PipelineResumed
                - FreezeStarted
                - FreezeLifted
                - PRMerged
                - ReceiptFailed
                - ChangeRequestOpened
                - ChangeRequestLinked
                - ChangeRequestApproved
                - ChangeRequestRejected
                - GateChanged
                type: string
              actor:
                description: |-
                  Actor is who caused the event (docs/actors.md). Absent on records
                  written before v0.12.
                properties:
                  agent:
                    description: Agent is the AgentIdentity name, when kind is agent.
                    maxLength: 253
                    minLength: 1
                    type: string
                  asserted:
                    description: |-
                      Asserted holds what the client says about itself. It is recorded as
                      written and never used for a security decision.
                    properties:
                      client:
                        description: Client is the tool that wrote the record (for
                          example kardinal/0.12.0).
                        maxLength: 128
                        type: string
                      model:
                        description: Model is the AI model the client says it runs.
                        maxLength: 128
                        type: string
                      session:
                        description: Session is the client's session or run identifier.
                        maxLength: 128
                        type: string
                    type: object
                  kind:
                    description: Kind is human, agent, bot or controller (docs/actors.md).
                    enum:
                    - human
                    - agent
                    - bot
                    - controller
                    maxLength: 16
                    type: string
                  principal:
                    description: Principal is the username the API server authenticated.
                    maxLength: 253
                    minLength: 1
                    type: string
                  sponsor:
                    description: |-
                      Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                      the record was written, when kind is agent.
                    maxLength: 253
                    minLength: 1
                    type: string
                  via:
                    description: |-
                      Via says how the controller came to write the record: ui and api for a
                      caller it authenticated, subscription and auto-rollback for its own
                      Bundles. Only the controller may set it.
                    enum:
                    - ui
                    - api
                    - subscription
                    - auto-rollback
                    maxLength: 16
                    type: string
                required:
                - kind
                - principal
                type: object
                x-kubernetes-validations:
                - message: actor.agent and actor.sponsor are set exactly when actor.kind
                    is agent
                  rule: 'self.kind == ''agent'' ? (has(self.agent) && has(self.sponsor))
                    : (!has(self.agent) && !has(self.sponsor))'
                - message: a controller actor says why it acted (actor.via)
                  rule: self.kind != 'controller' || has(self.via)
              bundleName:
                description: BundleName is the name of the Bundle being promoted.
                minLength: 1
                type: string
              environment:
                description: Environment is the environment name where the event occurred.
                minLength: 1
                type: string
              fields:
                additionalProperties:
                  type: string
                description: |-
                  Fields are an ApprovalRecorded or ApprovalRevoked decision's
                  structured values (Approval spec.fields) the gate declares, whole.
                maxProperties: 16
                type: object
              gates:
                description: |-
                  Gates are the PolicyGate template changes a GateChanged event records:
                  one event per version and rebuild, listing at most
                  MaxAuditGateChanges changes in template order.
                items:
                  description: |-
                    AuditGateChange is a PolicyGate template's change under a version in
                    flight: the template, and what the version's gate instances copied from
                    it before and after (kardinal.io/gate-template-digest and -generation).
                    An empty digest is a template that did not apply before (created) or no
                    longer does (deleted).
                  properties:
                    environmentsAdded:
                      description: |-
                        EnvironmentsAdded are environments of the version the template's gate
                        copies now apply to and did not before (a kardinal.io/applies-to edit
                        moves a gate without changing its rule): the first 5 in name order. A
                        record merged from several gives the net move: an environment in
                        environmentsAdded only ends on, one in environmentsRemoved only ends
                        off, and one in both moved and ended where it started.
                      items:
                        maxLength: 63
                        type: string
                      maxItems: 5
                      type: array
                    environmentsOmitted:
                      description: |-
                        EnvironmentsOmitted is one count, for environmentsAdded and
                        environmentsRemoved together, of the environments past the first 5 of
                        each. In a record merged from several it is an upper bound.
                      format: int32
                      minimum: 0
                      type: integer
                    environmentsRemoved:
                      description: |-
                        EnvironmentsRemoved are environments of the version the template's
                        gate copies applied to and no longer do: the first 5 in name order.
                      items:
                        maxLength: 63
                        type: string
                      maxItems: 5
                      type: array
                    manager:
                      description: |-
                        Manager is the field manager of the template's newest managedFields
                        entry, as the writing client declared it (kubectl --field-manager sets
                        any name). It is not verified and does not say who wrote the
                        template: the API server's audit log does.
                      maxLength: 128
                      type: string
                    namespace:
                      description: Namespace is the template's namespace.
                      maxLength: 63
                      type: string
                    newDigest:
                      description: NewDigest is the digest the instances have now.
                      maxLength: 80
                      type: string
                    newGeneration:
                      description: NewGeneration is the template generation the instances
                        have now.
                      format: int64
                      type: integer
                    oldDigest:
                      description: OldDigest is the digest the instances had.
                      maxLength: 80
                      type: string
                    oldGeneration:
                      description: OldGeneration is the template generation the instances
                        had.
                      format: int64
                      type: integer
                    template:
                      description: Template is the PolicyGate template's name.
                      maxLength: 253
                      type: string
                  required:
                  - namespace
                  - template
                  type: object
                maxItems: 20
                type: array
              gatesOmitted:
                description: |-
                  GatesOmitted counts the changes of the same rebuild that Gates leaves
                  out, past its first MaxAuditGateChanges.
                format: int32
                minimum: 0
                type: integer
              mergedRecords:
                description: |-
                  MergedRecords is how many unwritten records this one replaces: a full
                  audit outbox merges records of the same kind (GateChanged) before it
                  drops any, during an AuditEvent write outage. Absent for a record
                  written as it was recorded.
                format: int32
                minimum: 0
                type: integer
              message:
                description: Message is a human-readable description of the event.
                type: string
              outcome:
                description: |-
                  Outcome describes the result of the action.
                  Valid values: "Success", "Failure", "Pending".
                enum:
                - Success
                - Failure
                - Pending
                type: string
              pipelineName:
                description: PipelineName is the name of the Pipeline the Bundle is
                  promoting through.
                minLength: 1
                type: string
              request:
                description: |-
                  Request is the API request of an APIWrite event. It records no body
                  and no token.
                properties:
                  method:
                    description: Method is the HTTP method.
                    maxLength: 16
                    type: string
                  route:
                    description: |-
                      Route is the API route pattern, for example
                      /api/v1/ui/pipelines/{name}/pause.
                    maxLength: 256
                    type: string
                required:
                - method
                - route
                type: object
              timestamp:
                description: Timestamp is when the event occurred (RFC 3339 format).
                format: date-time
                type: string
            required:
            - action
            - outcome
            - timestamp
            type: object
            x-kubernetes-validations:
            - message: AuditEvent spec is immutable
              rule: self == oldSelf
            - message: an AuditEvent names at least one of bundleName, pipelineName
                and environment
              rule: has(self.bundleName) || has(self.pipelineName) || has(self.environment)
        type: object
    served: true
    storage: true
    subresources: {}
