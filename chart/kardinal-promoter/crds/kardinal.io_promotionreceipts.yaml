---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: promotionreceipts.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal-all
    kind: PromotionReceipt
    listKind: PromotionReceiptList
    plural: promotionreceipts
    shortNames:
    - receipt
    - receipts
    singular: promotionreceipt
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels.kardinal\.io/pipeline
      name: Pipeline
      type: string
    - jsonPath: .metadata.labels.kardinal\.io/environment
      name: Env
      type: string
    - jsonPath: .metadata.labels.kardinal\.io/bundle
      name: Bundle
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionReceipt is the signed record of one promotion (docs/receipts.md).
          It has no owner: it outlives the Bundle, the Graph and the step.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PromotionReceiptSpec is the record of one promotion that reached
              Verified. The PromotionStep reconciler creates it once, at the Verified
              transition; it never changes.
            properties:
              pullRequest:
                description: |-
                  PullRequest is the promotion's PR, which the receipt reconciler
                  comments on once the receipt is signed. Empty for a promotion without
                  a PR (approval: auto).
                properties:
                  number:
                    description: Number is the PR number.
                    minimum: 1
                    type: integer
                  repo:
                    description: Repo is the repository, owner/name.
                    minLength: 1
                    type: string
                  scmProvider:
                    description: |-
                      ScmProvider is the ScmProvider the PR was opened on; nil is the
                      controller's own SCM.
                    properties:
                      kind:
                        description: Kind is ScmProvider or ClusterScmProvider.
                        enum:
                        - ScmProvider
                        - ClusterScmProvider
                        type: string
                      name:
                        description: Name is the provider's name; a ScmProvider is
                          in the step's namespace.
                        type: string
                      uid:
                        description: UID is the provider's metadata.uid when the Graph
                          was built.
                        type: string
                    required:
                    - kind
                    - name
                    - uid
                    type: object
                  url:
                    description: URL is the PR's web address.
                    type: string
                required:
                - number
                - repo
                type: object
              statement:
                description: |-
                  Statement is the in-toto statement (JSON): a SLSA verification summary
                  (https://slsa.dev/verification_summary/v1) whose kardinalPromotion
                  extension holds the record: the version, the actor, the gates as they
                  were when the step started, the approvals, the checks and the change.
                maxLength: 262144
                minLength: 2
                type: string
              statementDigest:
                description: |-
                  StatementDigest is sha256:<hex> of Statement. A receipt whose
                  statement does not match it is never signed (phase Failed).
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
            required:
            - statement
            - statementDigest
            type: object
            x-kubernetes-validations:
            - message: a PromotionReceipt's spec is immutable
              rule: self == oldSelf
          status:
            description: PromotionReceiptStatus is written by the receipt reconciler
              only.
            properties:
              attempts:
                description: |-
                  Attempts counts the failed sign or store attempts since the last
                  progress.
                type: integer
              bundle:
                description: |-
                  Bundle is the Sigstore bundle (JSON, media type
                  application/vnd.dev.sigstore.bundle.v0.3+json) of the signed
                  statement: a DSSE envelope with the certificate or key hint, and the
                  transparency log entry or timestamp when there is one. Set once.
                maxLength: 786432
                type: string
              bytes:
                description: |-
                  Bytes is the size of spec.statement and status.bundle, written with
                  the signature: they leave the controller's cache once the receipt is
                  done, and the Pipeline's status.environments[].receipts sums it.
                format: int64
                type: integer
              conditions:
                description: Conditions are Signed and Stored, with reasons naming
                  a failing sink.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nextRetryAt:
                description: NextRetryAt is when a failed sign or sink is tried again.
                format: date-time
                type: string
              phase:
                description: Phase is Pending, Signed, Stored or Failed.
                enum:
                - Pending
                - Signed
                - Stored
                - Failed
                type: string
              prComment:
                description: |-
                  PRComment is true once the receipt reconciler commented on the
                  promotion's PR, so a retry does not comment twice.
                type: boolean
              signedBy:
                description: SignedBy says who signed the receipt.
                properties:
                  identity:
                    description: |-
                      Identity is the certificate's subject alternative name (keyless), or
                      the key reference (kms) or the Secret (key).
                    type: string
                  issuer:
                    description: Issuer is the OIDC issuer the certificate names (keyless).
                    type: string
                  keyHint:
                    description: KeyHint is the base64 sha256 of the public key (key
                      and kms).
                    type: string
                  mode:
                    description: Mode is keyless, key or kms.
                    type: string
                required:
                - mode
                type: object
              stored:
                description: Stored lists the sinks holding the signed receipt.
                items:
                  description: ReceiptStorage records one sink that holds the signed
                    receipt.
                  properties:
                    at:
                      description: At is when the sink was written.
                      format: date-time
                      type: string
                    logIndex:
                      description: LogIndex is the transparency log index, for sink
                        rekor.
                      format: int64
                      type: integer
                    ref:
                      description: Ref is the OCI referrer (repository@sha256:...),
                        for sink oci.
                      type: string
                    sink:
                      description: Sink is crd, oci or rekor.
                      type: string
                    subject:
                      description: Subject is the image the OCI referrer refers to,
                        for sink oci.
                      type: string
                    url:
                      description: URL is the transparency log, for sink rekor.
                      type: string
                  required:
                  - at
                  - sink
                  type: object
                maxItems: 16
                type: array
            type: object
            x-kubernetes-validations:
            - message: status.bundle cannot change once set
              rule: '!has(oldSelf.bundle) || (has(self.bundle) && self.bundle == oldSelf.bundle)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
