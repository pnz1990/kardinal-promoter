---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: promotionsteps.kardinal.io
spec:
  group: kardinal.io
  names:
    categories:
    - kardinal-all
    kind: PromotionStep
    listKind: PromotionStepList
    plural: promotionsteps
    shortNames:
    - ps
    singular: promotionstep
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pipelineName
      name: Pipeline
      type: string
    - jsonPath: .spec.environment
      name: Env
      type: string
    - jsonPath: .spec.bundleName
      name: Bundle
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromotionStep is a controller-internal CRD representing one step in a
          promotion sequence. Created by the Graph controller; reconciled by the
          PromotionStep reconciler.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PromotionStepSpec defines the desired state of a PromotionStep.
              PromotionStep objects are created by the Graph controller — not by users.
            properties:
              admitted:
                description: |-
                  Admitted is written by a compact Graph with fleets: false while the
                  Graph has not yet read the step back (its StepsObserved), true once it
                  has. Only then is the step's admission final: until it is, a pacing
                  change can make kro delete the step, so a Pending step does no work
                  while Admitted is false. Unset (other Graphs) does not wait.
                  Do not set it.
                type: boolean
              analyses:
                description: |-
                  Analyses names the AnalysisTemplates of the environment's
                  verification. A step with analyses goes from HealthChecking to
                  Verifying and is Verified only when, for every template, the newest
                  AnalysisRun in spec.live.analyses is Successful: a run that a later
                  translation replaced (the template changed) is not waited for, and the
                  timeout keeps counting from status.verificationStartedAt.
                items:
                  type: string
                type: array
              analysisPolicy:
                description: |-
                  AnalysisPolicy is the verification's verdict policy, copied from the
                  Pipeline when the Graph was built, so a Pipeline edit does not change
                  the verdict of a step in flight.
                properties:
                  inconclusive:
                    description: Inconclusive is "fail" (default) or "pass".
                    type: string
                  timeout:
                    description: Timeout is the verification timeout (default 30m).
                    type: string
                type: object
              bundleName:
                description: BundleName is the Bundle being promoted.
                minLength: 1
                type: string
              environment:
                description: Environment is the environment this step promotes into.
                minLength: 1
                type: string
              imageVerification:
                description: |-
                  ImageVerification names the Bundle's ImageVerification when this step
                  must wait for it: a step with no upstream in the Graph stays Pending
                  until spec.live.imageVerification.phase is Verified, and fails when it
                  is Failed.
                type: string
              live:
                description: |-
                  Live holds results the Graph mirrors onto the step while it runs, each
                  part with its own patch node (its own field manager), not the step's
                  template, so they keep updating after the step's own template stopped
                  resolving: the environment's hook and analysis runs, the current
                  results of its gates, and the Bundle's image verification. The
                  reconciler reads only this copy, never the source objects; while the
                  step's PR waits for its merge it mirrors the gates to the PR's head
                  commit as the kardinal/gates commit status. Do not set it.
                properties:
                  analyses:
                    description: Analyses are the environment's AnalysisRuns for this
                      Bundle.
                    items:
                      description: LiveAnalysisRun is the result of one Argo Rollouts
                        AnalysisRun.
                      properties:
                        created:
                          description: |-
                            Created is the AnalysisRun's creationTimestamp (RFC 3339). The newest
                            run of a template is the one the step waits for.
                          type: string
                        message:
                          description: Message is the AnalysisRun's status.message.
                          type: string
                        name:
                          description: Name is the AnalysisRun name.
                          type: string
                        phase:
                          description: |-
                            Phase is the AnalysisRun's status.phase (Pending when it has none
                            yet): Pending, Running, Successful, Failed, Error or Inconclusive.
                          type: string
                        template:
                          description: Template is the AnalysisTemplate or ClusterAnalysisTemplate
                            it runs.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  gates:
                    description: |-
                      Gates are the gate instances of the step's environment for its Bundle,
                      with their current result.
                    items:
                      description: LiveGate is one gate instance's current result.
                      properties:
                        name:
                          description: Name is the gate instance name.
                          type: string
                        ready:
                          description: Ready is the instance's status.ready.
                          type: boolean
                        reason:
                          description: Reason is the instance's status.reason.
                          type: string
                      required:
                      - name
                      - ready
                      type: object
                    type: array
                  hooks:
                    description: Hooks are the environment's HookRuns for this Bundle.
                    items:
                      description: LiveHookRun is the result of one HookRun.
                      properties:
                        hook:
                          description: Hook is the hook's name in the Pipeline.
                          type: string
                        message:
                          description: Message is the HookRun's status.message.
                          type: string
                        name:
                          description: Name is the HookRun name.
                          type: string
                        phase:
                          description: 'Phase is the hook phase: pre or post.'
                          type: string
                        result:
                          description: Result is the HookRun's status.phase (Pending
                            when it has none yet).
                          type: string
                        specHash:
                          description: 'SpecHash is the HookRun''s status.specHash:
                            which job and timeout ran.'
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  imageVerification:
                    description: ImageVerification is the Bundle's ImageVerification
                      result.
                    properties:
                      images:
                        description: |-
                          Images are the images it verifies, "repository@digest" (repository
                          normalized). The step refuses to promote a Bundle whose images differ.
                        items:
                          type: string
                        type: array
                      message:
                        description: Message is its status.message.
                        type: string
                      name:
                        description: Name is the ImageVerification's name.
                        type: string
                      phase:
                        description: Phase is its status.phase (Pending when it has
                          none yet).
                        type: string
                    type: object
                  renders:
                    description: |-
                      Renders is the environment's RenderRun for this Bundle (layout:
                      branch), at most one.
                    items:
                      description: |-
                        LiveRenderRun is the result of the RenderRun of a layout: branch
                        environment.
                      properties:
                        knownMarkerDigests:
                          description: |-
                            KnownMarkerDigests is the RenderRun's status.knownMarkerDigests: a
                            result that pushed nothing (noChanges) must name one of them.
                          items:
                            type: string
                          type: array
                        message:
                          description: Message is the RenderRun's status.message.
                          type: string
                        name:
                          description: Name is the RenderRun name.
                          type: string
                        phase:
                          description: Phase is the RenderRun's status.phase (Pending
                            when it has none yet).
                          type: string
                        result:
                          description: Result is the RenderRun's status.result.
                          properties:
                            branch:
                              description: Branch is the branch it was pushed to.
                              type: string
                            commitSHA:
                              description: CommitSHA is the rendered commit pushed
                                (empty when nothing changed).
                              type: string
                            driftOverwritten:
                              description: |-
                                DriftOverwritten lists the changes made outside kardinal that this
                                render overwrote (render.onDrift: overwrite).
                              type: string
                            dryCommit:
                              description: DryCommit is the DRY commit that was rendered.
                              type: string
                            markerDigest:
                              description: |-
                                MarkerDigest is the sha256 of the render marker
                                (.kardinal/rendered.yaml) this render wrote: the list of files and
                                their sha256. The next render of the environment accepts the rendered
                                branch only when its marker has the digest of a render kardinal made.
                              type: string
                            noChanges:
                              description: |-
                                NoChanges is true when the render matched the rendered branch and
                                nothing was pushed.
                              type: boolean
                            objects:
                              description: Objects is how many objects were rendered.
                              type: integer
                            renderer:
                              description: Renderer is kustomize or helm.
                              type: string
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                type: object
              pipelineName:
                description: PipelineName is the Pipeline this step belongs to.
                minLength: 1
                type: string
              postHooks:
                description: |-
                  PostHooks names the HookRuns of the environment's post-deploy hooks, in
                  order. A step with post hooks goes from HealthChecking to Verifying,
                  and is Verified only when every one of them Succeeded in
                  spec.live.hooks; a Failed one applies onHealthFailure.
                items:
                  type: string
                type: array
              prStatusRef:
                description: |-
                  PRStatusRef is the name of the companion PRStatus CRD in the same namespace.
                  Set by the Graph controller from the PRStatus Watch node's metadata.name CEL reference.
                  The PromotionStep reconciler reads the PRStatus CRD instead of polling GitHub
                  directly, so the reconcile hot path makes no SCM call.
                type: string
              preHooks:
                description: |-
                  PreHooks names the HookRuns of the environment's pre-deploy hooks, in
                  order. The step stays Pending until every one of them Succeeded in
                  spec.live.hooks, and fails when one Failed. Set by the Graph: the first
                  entry references the first HookRun node, so the step is created only
                  after it.
                items:
                  type: string
                type: array
              requiredGates:
                description: |-
                  RequiredGates holds the names of PolicyGate instances that must be ready
                  before this PromotionStep can be promoted. Set by the Graph controller via CEL.
                items:
                  type: string
                type: array
              scmProvider:
                description: |-
                  ScmProvider is the provider of the Pipeline's spec.git.providerRef,
                  as the translator resolved it when it built the Graph. Unset uses the
                  controller's --scm-provider.
                properties:
                  kind:
                    description: Kind is ScmProvider or ClusterScmProvider.
                    enum:
                    - ScmProvider
                    - ClusterScmProvider
                    type: string
                  name:
                    description: Name is the provider's name; a ScmProvider is in
                      the step's namespace.
                    type: string
                  uid:
                    description: UID is the provider's metadata.uid when the Graph
                      was built.
                    type: string
                required:
                - kind
                - name
                - uid
                type: object
              stepType:
                description: |-
                  StepType names the built-in step that writes this promotion's change,
                  as the environment's update strategy and layout select it:
                  kustomize-set-image, yaml-update, helm-set-image, argocd-set-image or
                  render. It is informational; no step is executed from it.
                minLength: 1
                type: string
              upstreamStates:
                description: |-
                  UpstreamStates holds the resolved state of all upstream PromotionSteps.
                  Each entry is a string like "Verified", set by the kro Graph controller via CEL
                  expression substitution. Replaces the N-field upstreamVerified/upstreamVerified2
                  pattern (issue 625) -- a single list scales to any number of upstream environments.
                  kro scans list items for CEL references, so each entry creates a DAG edge.
                items:
                  type: string
                type: array
            required:
            - bundleName
            - environment
            - pipelineName
            - stepType
            type: object
          status:
            description: PromotionStepStatus defines the observed state of a PromotionStep.
            properties:
              bakeElapsedMinutes:
                description: |-
                  BakeElapsedMinutes is the number of contiguous healthy minutes accumulated
                  so far in the current bake window. Resets to 0 on health failure
                  when policy=reset-on-alarm. When this reaches env.bake.minutes, the step
                  transitions to Verified.
                format: int64
                type: integer
              bakeFirstStartedAt:
                description: |-
                  BakeFirstStartedAt is when the first bake window of this step began:
                  the first healthy check with env.bake configured. It is never reset.
                  With bake.policy reset-on-alarm, the step must complete one full
                  window by BakeFirstStartedAt + bake.minutes + health.timeout, so a
                  release that keeps flapping ends.
                format: date-time
                type: string
              bakeResets:
                description: |-
                  BakeResets is the number of times the bake timer was reset due to a
                  health alarm during the current bake window.
                type: integer
              bakeStartedAt:
                description: |-
                  BakeStartedAt is when the contiguous-healthy soak window began.
                  Set on the first successful health check when env.bake is configured.
                  Reset when BakeElapsedMinutes resets (health failure with reset-on-alarm).
                format: date-time
                type: string
              budget:
                description: |-
                  Budget is the step's place against its agent's budgets
                  (AgentIdentity spec.budgets): Waiting while the ledger has no room,
                  then Granted. Absent for a step no budget applies to.
                properties:
                  agent:
                    description: Agent is the AgentIdentity whose budgets hold the
                      step.
                    maxLength: 253
                    type: string
                  exemption:
                    description: Exemption is the exemption the grant used, if any.
                    maxLength: 63
                    type: string
                  rules:
                    description: Rules are the budget rules that match the step.
                    items:
                      maxLength: 63
                      type: string
                    maxItems: 16
                    type: array
                  since:
                    description: 'Since is when the step started waiting: its place
                      in the queue.'
                    format: date-time
                    type: string
                  state:
                    description: State is Waiting (held for room) or Granted.
                    enum:
                    - Waiting
                    - Granted
                    type: string
                required:
                - agent
                - state
                type: object
              conditions:
                description: Conditions holds status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              consecutiveHealthFailures:
                description: |-
                  ConsecutiveHealthFailures tracks the number of consecutive health-check
                  failures for this step. Reset to 0 on a successful health check.
                  Used by the auto-rollback policy in the pipeline environment spec.
                type: integer
              contendedRetries:
                description: |-
                  ContendedRetries is the number of consecutive retries of a git-push that
                  lost to other writers of the base branch every time within one reconcile
                  (the base branch kept moving). They have no limit, since contention is
                  not a fault of the step, and do not use up the retries of retryCount;
                  they only back off. Reset with retryCount.
                type: integer
              currentStepIndex:
                description: |-
                  CurrentStepIndex is the index into the step sequence that the reconciler
                  is currently executing. Persisted to etcd for idempotent crash recovery.
                type: integer
              decision:
                description: |-
                  Decision is what the step started on: its required gates as it read
                  them when it left Pending, and the policy versions. Written in the
                  same patch as the move to Promoting when receipts are enabled, and
                  cleared once the step's PromotionReceipt exists.
                properties:
                  changeRequests:
                    description: |-
                      ChangeRequests are the step's ChangeRequest instances (the tickets
                      of its Bundle and environment, docs/change-requests.md) as the step
                      read them when it left Pending: the inputs its gates read as
                      changeRequests.<name>.
                    items:
                      description: DecisionChangeRequest is one ChangeRequest instance
                        as a step read it.
                      properties:
                        approvers:
                          description: Approvers are the ticket's approvers, as the
                            provider reported them.
                          items:
                            description: |-
                              ChangeRequestApprover is one approver's decision, when the provider
                              exposes it.
                            properties:
                              at:
                                format: date-time
                                type: string
                              decision:
                                description: Decision is the provider's (approved,
                                  rejected, requested).
                                type: string
                              name:
                                type: string
                            required:
                            - name
                            type: object
                          maxItems: 32
                          type: array
                        approversOmitted:
                          description: ApproversOmitted counts the approvers the snapshot
                            cut.
                          type: integer
                        instance:
                          description: Instance is the ChangeRequest instance.
                          type: string
                        name:
                          description: |-
                            Name is the ChangeRequest template the instance was made from: the
                            name a gate reads as changeRequests.<name>.
                          type: string
                        observedAt:
                          description: ObservedAt is when the ticket was last read.
                          format: date-time
                          type: string
                        provider:
                          description: Provider is servicenow or jira.
                          type: string
                        providerState:
                          description: ProviderState is the instance's status.providerState.
                          type: string
                        state:
                          description: State is the instance's status.state.
                          type: string
                        ticket:
                          description: Ticket is the ticket the instance tracks; nil
                            when it has none yet.
                          properties:
                            id:
                              description: ID is the ServiceNow sys_id or the Jira
                                issue id.
                              type: string
                            key:
                              description: Key is the ServiceNow number (CHG0031337)
                                or the Jira issue key (CHG-42).
                              type: string
                            url:
                              description: URL is the ticket's page.
                              type: string
                          required:
                          - key
                          type: object
                        timedOut:
                          description: TimedOut is the instance's status.timedOut.
                          type: boolean
                        validUntil:
                          description: |-
                            ValidUntil is until when that reading counts: a gate evaluated later
                            reads the ticket's state as unknown.
                          format: date-time
                          type: string
                        verified:
                          description: |-
                            Verified reports whether the ticket is this promotion's: one kardinal
                            opened, or a linked one the reconciler verified
                            (ChangeRequestStatus.TicketVerified).
                          type: boolean
                        verifiedReason:
                          description: VerifiedReason is the instance's status.verifiedReason.
                          type: string
                      required:
                      - instance
                      - name
                      - verified
                      type: object
                    maxItems: 32
                    type: array
                  facts:
                    description: |-
                      Facts are what every required gate showed, decided before any cut:
                      the receipt's levels come from them, so a gate left out of the
                      snapshot still counts (an override on it is still OVERRIDDEN).
                    properties:
                      approved:
                        type: boolean
                      gates:
                        description: Gates is how many required gates the step read.
                        type: integer
                      overridden:
                        type: boolean
                      passed:
                        description: |-
                          Passed: every one was ready. Approved: one counted an approval.
                          Overridden: one passed by an override. VerifiedByAgent: a verify gate
                          counted a passing Verdict.
                        type: boolean
                      verifiedByAgent:
                        type: boolean
                    required:
                    - approved
                    - gates
                    - overridden
                    - passed
                    - verifiedByAgent
                    type: object
                  gates:
                    description: Gates are the required gates, in spec.requiredGates
                      order.
                    items:
                      description: DecisionGate is one required gate as the step read
                        it.
                      properties:
                        approvalRequired:
                          description: ApprovalRequired is true for a gate with spec.approval.
                          type: boolean
                        approvals:
                          description: Approvals are the gate's status.approvals.
                          items:
                            description: GateApprovalStatus records how the gate counted
                              one approval.
                            properties:
                              actor:
                                description: 'Actor is who decided: the Approval''s
                                  actor stamp (docs/actors.md).'
                                properties:
                                  agent:
                                    description: Agent is the AgentIdentity name,
                                      when kind is agent.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  asserted:
                                    description: |-
                                      Asserted holds what the client says about itself. It is recorded as
                                      written and never used for a security decision.
                                    properties:
                                      client:
                                        description: Client is the tool that wrote
                                          the record (for example kardinal/0.12.0).
                                        maxLength: 128
                                        type: string
                                      model:
                                        description: Model is the AI model the client
                                          says it runs.
                                        maxLength: 128
                                        type: string
                                      session:
                                        description: Session is the client's session
                                          or run identifier.
                                        maxLength: 128
                                        type: string
                                    type: object
                                  kind:
                                    description: Kind is human, agent, bot or controller
                                      (docs/actors.md).
                                    enum:
                                    - human
                                    - agent
                                    - bot
                                    - controller
                                    maxLength: 16
                                    type: string
                                  principal:
                                    description: Principal is the username the API
                                      server authenticated.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  sponsor:
                                    description: |-
                                      Sponsor is the agent's sponsor (AgentIdentity spec.sponsor.user) when
                                      the record was written, when kind is agent.
                                    maxLength: 253
                                    minLength: 1
                                    type: string
                                  via:
                                    description: |-
                                      Via says how the controller came to write the record: ui and api for a
                                      caller it authenticated, subscription and auto-rollback for its own
                                      Bundles. Only the controller may set it.
                                    enum:
                                    - ui
                                    - api
                                    - subscription
                                    - auto-rollback
                                    maxLength: 16
                                    type: string
                                required:
                                - kind
                                - principal
                                type: object
                                x-kubernetes-validations:
                                - message: actor.agent and actor.sponsor are set exactly
                                    when actor.kind is agent
                                  rule: 'self.kind == ''agent'' ? (has(self.agent)
                                    && has(self.sponsor)) : (!has(self.agent) && !has(self.sponsor))'
                                - message: a controller actor says why it acted (actor.via)
                                  rule: self.kind != 'controller' || has(self.via)
                              comment:
                                description: Comment is the approver's comment.
                                type: string
                              counted:
                                description: Counted reports whether the decision
                                  counts for the gate.
                                type: boolean
                              decision:
                                description: Decision is approve or reject.
                                type: string
                              fields:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Fields are the decision's values of the fields the gate declares,
                                  each cut to 256 bytes (the Approval holds them whole).
                                type: object
                              firstSeenAt:
                                description: FirstSeenAt is when the gate first saw
                                  the decision.
                                format: date-time
                                type: string
                              reason:
                                description: Reason says why a decision does not count.
                                type: string
                              user:
                                description: User is the approver.
                                type: string
                            required:
                            - counted
                            - decision
                            - user
                            type: object
                          maxItems: 101
                          type: array
                        evaluatedAt:
                          description: EvaluatedAt is the gate's status.lastEvaluatedAt.
                          format: date-time
                          type: string
                        expression:
                          description: Expression is the gate's CEL expression.
                          type: string
                        message:
                          description: Message is the gate's message.
                          type: string
                        name:
                          description: Name is the gate instance.
                          type: string
                        override:
                          description: Override is the override the gate passed by,
                            when it did.
                          properties:
                            actor:
                              description: Actor is its actor stamp.
                              properties:
                                agent:
                                  description: Agent is the AgentIdentity name, when
                                    kind is agent.
                                  maxLength: 253
                                  minLength: 1
                                  type: string
                                asserted:
                                  description: |-
                                    Asserted holds what the client says about itself. It is recorded as
                                    written and never used for a security decision.
                                  properties:
                                    client:
                                      description: Client is the tool that wrote the
