apiVersion: v2
name: kardinal-promoter
description: |
  A Kubernetes-native promotion controller with DAG pipelines and policy gates.
  Built on the kro Graph (kro.run/v1alpha1); requires kro v0.10.0-rc.0 or
  later with the GraphKind feature gate.
type: application
# The oldest Kubernetes kardinal supports: the e2e suites (hack/e2e/matrix.txt)
# and the CRD and admission policy install check (make envtest) run on it. The
# -0 lets pre-release builds such as v1.35.2-eks-ce1d5eb match.
kubeVersion: ">=1.35.0-0"
version: 0.12.3
appVersion: "v0.12.3"
keywords:
  - kubernetes
  - promotion
  - gitops
  - policy
  - dag
  - cicd
home: https://github.com/pnz1990/kardinal-promoter
sources:
  - https://github.com/pnz1990/kardinal-promoter
  - https://github.com/kubernetes-sigs/kro
maintainers:
  - name: kardinal-promoter authors
    url: https://github.com/pnz1990/kardinal-promoter
annotations:
  # Minimum kro version (Graph kind, GraphKind feature gate).
  kro.version: "0.10.0-rc.0"
