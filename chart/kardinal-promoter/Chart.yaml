apiVersion: v2
name: kardinal-promoter
description: |
  A Kubernetes-native promotion controller with DAG pipelines and policy gates.
  Built on the kro Graph (kro.run/v1alpha1); requires kro >= v0.10.0 with the
  GraphKind feature gate.
type: application
version: 0.8.1
appVersion: "v0.8.1"
keywords:
  - kubernetes
  - promotion
  - gitops
  - policy
  - dag
  - cicd
home: https://github.com/pnz1990/kardinal-promoter
sources:
  - https://github.com/pnz1990/kardinal-promoter
  - https://github.com/kubernetes-sigs/kro
maintainers:
  - name: kardinal-promoter authors
    url: https://github.com/pnz1990/kardinal-promoter
annotations:
  # Minimum kro version (Graph kind, GraphKind feature gate).
  kro.version: "0.10.0-rc.0"
