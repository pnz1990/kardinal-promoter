apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kardinal-demo
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/pnz1990/kardinal-demo
  ref:
    branch: main
  # kardinal-demo is public, so no secretRef. For a private repo, reference a
  # Secret with username/password (or bearerToken) keys; Flux ignores `token`.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kardinal-test-app-flux-test
  namespace: flux-system
spec:
  interval: 30s
  path: ./environments/test
  # The overlays hardcode namespace default; move each env into its own.
  targetNamespace: kardinal-test-app-test
  prune: true
  sourceRef:
    kind: GitRepository
    name: kardinal-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kardinal-test-app
      namespace: kardinal-test-app-test
  timeout: 3m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kardinal-test-app-flux-uat
  namespace: flux-system
spec:
  interval: 30s
  path: ./environments/uat
  # The overlays hardcode namespace default; move each env into its own.
  targetNamespace: kardinal-test-app-uat
  prune: true
  sourceRef:
    kind: GitRepository
    name: kardinal-demo
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: kardinal-test-app
      namespace: kardinal-test-app-uat
  timeout: 3m
