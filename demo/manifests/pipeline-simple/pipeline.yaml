# demo/manifests/pipeline-simple/pipeline.yaml
#
# The demo Pipeline: kardinal-test-app. Argo CD syncs each environment into
# namespace kardinal-test-app-<env> of the demo cluster.
#
# Topology:
#   test (auto)
#    └→ uat (auto)
#        └→ prod (PR review)
#               ↑ guarded by the org gates: no-weekend-deploys, business-hours-only,
#                 require-uat-soak (30m in uat), no-bot-deploys
#
# Features exercised:
#   ✓ Auto-promote (test, uat)
#   ✓ PR-review gate (prod)
#   ✓ Org-level PolicyGates (injected from platform-policies namespace)
#   ✓ ArgoCD health adapter
#   ✓ historyLimit
#
# Copyright 2026 The kardinal-promoter Authors.
# Licensed under the Apache License, Version 2.0
apiVersion: kardinal.io/v1alpha1
kind: Pipeline
metadata:
  name: kardinal-test-app
  namespace: default
  labels:
    demo: "true"
    demo.kardinal.io/complexity: simple
spec:
  git:
    url: https://github.com/pnz1990/kardinal-demo
    branch: main
    layout: directory
    secretRef:
      name: github-token

  environments:
    - name: test
      path: environments/test
      update:
        strategy: kustomize
      approval: auto
      health:
        type: argocd
        timeout: 5m

    - name: uat
      dependsOn: [test]
      path: environments/uat
      update:
        strategy: kustomize
      approval: auto
      health:
        type: argocd
        timeout: 5m

    - name: prod
      dependsOn: [uat]
      path: environments/prod
      update:
        strategy: kustomize
      approval: pr-review
      health:
        type: argocd
        timeout: 15m

  historyLimit: 20
